<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  padding:16px;

  background:#f5f5f5;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

  text-align:center;

}

#app{

  width:100%;

  max-width:720px;

  margin:0 auto;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:22px;

  margin:12px 0;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

}

h1{

  margin:4px 0 20px;

  font-size:27px;

}

h2{

  margin:4px 0 18px;

}

button{

  width:100%;

  padding:14px;

  margin:6px 0;

  border:0;

  border-radius:12px;

  background:#222;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

button.gray{

  background:#777;

}

button.red{

  background:#9d0000;

}

button:disabled{

  opacity:.4;

}

input,

select{

  width:100%;

  padding:13px;

  border:1px solid #ccc;

  border-radius:10px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  text-align:left;

  margin:12px 0 6px;

  font-weight:bold;

}

.notice{

  padding:14px;

  margin:12px 0;

  border-radius:12px;

  background:#f0f0f0;

  line-height:1.7;

}

.big{

  font-size:34px;

  font-weight:bold;

  margin:18px 0;

}

.small{

  font-size:13px;

  color:#666;

}

.roleGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

}

.roleBox{

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  background:#fff;

}

.roleName{

  font-weight:bold;

  margin-bottom:5px;

}

.counter{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin-top:9px;

}

.counter button{

  width:46px;

  height:46px;

  padding:0;

  margin:0;

  font-size:25px;

}

.counterValue{

  min-width:38px;

  font-size:23px;

  font-weight:bold;

}

.roleTotal{

  font-size:34px;

  font-weight:bold;

  margin:12px 0 18px;

}

.targetGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.timer{

  font-size:48px;

  font-weight:bold;

  margin:10px 0 20px;

}

.confirmNumber{

  font-size:18px;

  font-weight:bold;

  margin-bottom:10px;

}

.result{

  font-size:27px;

  font-weight:bold;

  margin:18px 0;

}

.cross{

  text-decoration:line-through;

  opacity:.35;

}

@media(max-width:520px){

  .roleGrid,

  .targetGrid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const ROLE_INFO={

  werewolf:{

    name:"🐺 人狼",

    max:6,

    team:"werewolf"

  },

  citizen:{

    name:"👤 市民",

    max:28,

    team:"citizen"

  },

  seer:{

    name:"🔮 予言者",

    max:1,

    team:"citizen"

  },

  medium:{

    name:"👻 霊媒師",

    max:1,

    team:"citizen"

  },

  bodyguard:{

    name:"🛡️ ボディーガード",

    max:1,

    team:"citizen"

  },

  traitor:{

    name:"🃏 裏切り者",

    max:3,

    team:"werewolf"

  },

  informant:{

    name:"📡 内通者",

    max:2,

    team:"werewolf"

  },

  fox:{

    name:"🦊 妖狐",

    max:3,

    team:"fox"

  },

  hunter:{

    name:"🔫 ハンター",

    max:2,

    team:"citizen"

  },

  shared:{

    name:"🤝 共有者",

    max:2,

    team:"citizen"

  },

  lover:{

    name:"❤️ 恋人",

    max:6,

    team:"citizen"

  },

  dictator:{

    name:"👑 独裁者",

    max:1,

    team:"citizen"

  }

};

const state={

  screen:"start",

  mode:"",

  playerCount:0,

  names:[],

  loverCompatible:false,

  roleCounts:{

    werewolf:0,

    citizen:0,

    seer:0,

    medium:0,

    bodyguard:0,

    traitor:0,

    informant:0,

    fox:0,

    hunter:0,

    shared:0,

    lover:0,

    dictator:0

  },

  roles:{},

  alive:{},

  lovers:[],

  loverPairs:[],

  confirmIndex:0,

  firstSeerDone:false,

  day:0,

  night:0,

  discussionMinutes:5,

  seconds:0,

  timer:null,

  lastExecuted:null,

  wolfTarget:null,

  guardTarget:null,

  previousGuardTarget:null,

  seerTarget:null,

  nightDeaths:[],

  voteVoters:[],

  voteIndex:0,

  votes:{},

  runoffCandidates:[],

  runoffVotes:{},

  dictatorUsed:false,

  hunterIndex:null,

  hunterReason:"",

  gameOver:false,

  winner:null

};

const app=document.getElementById("app");

function speak(text){

  try{

    speechSynthesis.cancel();

    const utterance=

      new SpeechSynthesisUtterance(text);

    utterance.lang="ja-JP";

    utterance.rate=.95;

    speechSynthesis.speak(utterance);

  }catch(e){}

}

function esc(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function shuffle(array){

  const result=[...array];

  for(let i=result.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [result[i],result[j]]=

      [result[j],result[i]];

  }

  return result;

}

function isAlive(index){

  return state.alive[index]===true;

}

function alivePlayers(){

  return state.names

    .map((_,index)=>index)

    .filter(isAlive);

}

function playersWithRole(role,aliveOnly=false){

  return state.names

    .map((_,index)=>index)

    .filter(index=>{

      if(state.roles[index]!==role){

        return false;

      }

      if(aliveOnly&&!isAlive(index)){

        return false;

      }

      return true;

    });

}

function hasRole(role){

  return playersWithRole(role).length>0;

}

function loverPairOf(index){

  return state.loverPairs.find(

    pair=>pair.includes(index)

  );

}

function getPrimaryRoleTotal(){

  let total=0;

  Object.keys(state.roleCounts)

    .forEach(role=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      total+=

        Number(state.roleCounts[role])||0;

    });

  return total;

}

function render(){

  app.innerHTML="";

  switch(state.screen){

    case"start":

      renderStart();

      break;

    case"count":

      renderCount();

      break;

    case"names":

      renderNames();

      break;

    case"loverMode":

      renderLoverMode();

      break;

    case"roles":

      renderRoles();

      break;

    case"cardInput":

      renderCardInput();

      break;

    case"confirm":

      renderConfirm();

      break;

    case"firstSeerTarget":

      renderFirstSeerTarget();

      break;

    case"daySettings":

      renderDaySettings();

      break;

    case"day":

      renderDay();

      break;

    case"vote":

      renderVote();

      break;

    case"runoff":

      renderRunoff();

      break;

    case"nightIntro":

      renderNightIntro();

      break;

    case"nightAction":

      renderNightAction();

      break;

    case"morning":

      renderMorning();

      break;

    case"hunter":

      renderHunter();

      break;

    case"win":

      renderWin();

      break;

  }

}

function showCard(title,content){

  app.innerHTML=`

    <div class="card">

      <h1>${title}</h1>

      ${content}

    </div>

  `;

}

function renderStart(){

  showCard("🐺 人狼コンプリートGM",`

    <div class="notice">

      ゲーム方式を選んでください。

    </div>

    <button onclick="chooseMode('random')">

      📱 カードなし

    </button>

    <button onclick="chooseMode('card')">

      🃏 カードあり

    </button>

  `);

}

function chooseMode(mode){

  state.mode=mode;

  state.screen="count";

  render();

}

function renderCount(){

  let options="";

  for(let i=4;i<=28;i++){

    options+=`

      <option value="${i}">

        ${i}人

      </option>

    `;

  }

  showCard("人数設定",`

    <label>プレイヤー人数</label>

    <select id="playerCount">

      ${options}

    </select>

    <button onclick="savePlayerCount()">

      次へ

    </button>

  `);

}

function savePlayerCount(){

  state.playerCount=

    Number(

      document.getElementById("playerCount").value

    );

  state.names=

    Array(state.playerCount).fill("");

  const saved=

    localStorage.getItem("jinro_names");

  if(saved){

    try{

      const previous=JSON.parse(saved);

      if(Array.isArray(previous)){

        for(

          let i=0;

          i<Math.min(previous.length,state.playerCount);

          i++

        ){

          state.names[i]=previous[i]||"";

        }

      }

    }catch(e){}

  }

  state.screen="names";

  render();

}

function renderNames(){

  let html="";

  for(let i=0;i<state.playerCount;i++){

    html+=`

      <label>${i+1}人目</label>

      <input

        id="name${i}"

        value="${esc(state.names[i])}"

        placeholder="名前"

      >

    `;

  }

  html+=`

    <button onclick="saveNames()">

      次へ

    </button>

  `;

  showCard("プレイヤー名",html);

}

function saveNames(){

  const names=[];

  for(let i=0;i<state.playerCount;i++){

    const value=

      document

        .getElementById("name"+i)

        .value

        .trim();

    if(!value){

      alert("全員の名前を入力してください。");

      return;

    }

    names.push(value);

  }

  if(new Set(names).size!==names.length){

    alert("同じ名前は使用できません。");

    return;

  }

  state.names=names;

  localStorage.setItem(

    "jinro_names",

    JSON.stringify(names)

  );

  state.screen="loverMode";

  render();

}

function renderLoverMode(){

  showCard("❤️ 恋人設定",`

    <div class="notice">

      恋人を他の役職と兼用できるようにするか、

      先に決めてください。

      <br><br>

      恋人を選ばない場合は0枚で進められます。

    </div>

    <button onclick="setLoverCompatible(true)">

      ❤️ 兼用する

    </button>

    <button class="gray" onclick="setLoverCompatible(false)">

      ❤️ 兼用しない

    </button>

  `);

}

function setLoverCompatible(value){

  state.loverCompatible=value;

  state.screen="roles";

  render();

}

function renderRoles(){

  const total=

    getPrimaryRoleTotal();

  let html=`

    <div class="roleTotal">

      ${total}/${state.playerCount}

    </div>

    <div class="notice">

      役職の枚数を選んでください。

      <br>

      ➖ 0 ＋ で変更できます。

      <br>

      ❤️ 恋人を選ぶ場合は2枚1組です。

      <br>

      🤝 共有者を選ぶ場合は2枚1セットです。

    </div>

    <div class="roleGrid">

  `;

  Object.entries(ROLE_INFO)

    .forEach(([id,info])=>{

      const count=

        Number(state.roleCounts[id])||0;

      const isOverlayLover=

        state.loverCompatible &&

        id==="lover";

      html+=`

        <div class="roleBox">

          <div class="roleName">

            ${info.name}

          </div>

          ${

            isOverlayLover

              ?`

                <div class="small">

                  兼用役職

                </div>

              `

              :`

                <div class="small">

                  最大${info.max}枚

                </div>

              `

          }

          <div class="counter">

            <button

              class="gray"

              onclick="changeRole('${id}',-1)"

              ${count<=0?"disabled":""}

            >

              −

            </button>

            <div class="counterValue">

              ${count}

            </div>

            <button

              onclick="changeRole('${id}',1)"

              ${

                count>=info.max||

                (!isOverlayLover&&

                total>=state.playerCount)

                  ?"disabled":""

              }

            >

              ＋

            </button>

          </div>

        </div>

      `;

    });

  html+=`

    </div>

    <button onclick="finishRoleSelection()">

      次へ

    </button>

  `;

  showCard("役職選択",html);

}

function changeRole(id,change){

  const current=

    Number(state.roleCounts[id])||0;

  const next=current+change;

  if(next<0){

    return;

  }

  if(next>ROLE_INFO[id].max){

    return;

  }

  const overlayLover=

    state.loverCompatible &&

    id==="lover";

  if(

    change>0 &&

    !overlayLover &&

    getPrimaryRoleTotal()>=state.playerCount

  ){

    return;

  }

  if(

    id==="lover" &&

    next%2!==0

  ){

    alert(

      "恋人は2枚1組なので、2枚ずつ選んでください。"

    );

    return;

  }

  if(

    id==="shared" &&

    next!==0 &&

    next!==2

  ){

    alert(

      "共有者は2枚1セットです。"

    );

    return;

  }

  state.roleCounts[id]=next;

  render();

}

function finishRoleSelection(){

  const total=

    getPrimaryRoleTotal();

  if(total!==state.playerCount){

    alert(

      `役職の合計を${state.playerCount}枚にしてください。`

    );

    return;

  }

  if(

    state.roleCounts.lover%2!==0

  ){

    alert(

      "恋人は2枚1組です。"

    );

    return;

  }

  if(

    state.roleCounts.shared!==0 &&

    state.roleCounts.shared!==2

  ){

    alert(

      "共有者は2枚1セットです。"

    );

    return;

  }

  if(state.mode==="card"){

    state.screen="cardInput";

    render();

    return;

  }

  assignRandomRoles();

}

function createPrimaryRolePool(){

  const pool=[];

  Object.entries(state.roleCounts)

    .forEach(([role,count])=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      for(let i=0;i<count;i++){

        pool.push(role);

      }

    });

  return pool;

}

function assignRandomRoles(){

  const pool=

    shuffle(createPrimaryRolePool());

  state.roles={};

  pool.forEach((role,index)=>{

    state.roles[index]=role;

  });

  setupLovers();

  startRoleConfirmation();

}

function renderCardInput(){

  let html=`

    <div class="notice">

      配られたカードを1人ずつ入力してください。

      <br>

      残り枚数は表示されません。

    </div>

  `;

  for(let i=0;i<state.playerCount;i++){

    let options=`

      <option value="">

        カードを選択

      </option>

    `;

    Object.entries(ROLE_INFO)

      .forEach(([id,info])=>{

        options+=`

          <option value="${id}">

            ${info.name}

          </option>

        `;

      });

    html+=`

      <label>

        ${i+1}人目：${esc(state.names[i])}

      </label>

      <select id="card${i}">

        ${options}

      </select>

    `;

  }

  html+=`

    <button onclick="saveCards()">

      カードを確認する

    </button>

  `;

  showCard("🃏 カード入力",html);

}

function saveCards(){

  const selected=[];

  for(let i=0;i<state.playerCount;i++){

    const value=

      document

        .getElementById("card"+i)

        .value;

    if(!value){

      alert("全員のカードを入力してください。");

      return;

    }

    selected.push(value);

  }

  const actual={};

  selected.forEach(role=>{

    actual[role]=(actual[role]||0)+1;

  });

  for(const role of Object.keys(ROLE_INFO)){

    if(

      state.loverCompatible &&

      role==="lover"

    ){

      continue;

    }

    const expected=

      Number(state.roleCounts[role])||0;

    const got=

      Number(actual[role])||0;

    if(expected!==got){

      alert(

        `${ROLE_INFO[role].name}の枚数が設定と一致していません。`

      );

      return;

    }

  }

  state.roles={};

  selected.forEach((role,index)=>{

    state.roles[index]=role;

  });

  setupLovers();

  startRoleConfirmation();

}

function setupLovers(){

  state.lovers=[];

  state.loverPairs=[];

  const count=

    Number(state.roleCounts.lover)||0;

  if(count===0){

    return;

  }

  let candidates=[];

  if(state.loverCompatible){

    candidates=

      shuffle(

        Array.from(

          {length:state.playerCount},

          (_,i)=>i

        )

      ).slice(0,count);

  }else{

    candidates=

      playersWithRole("lover");

  }

  state.lovers=candidates;

  const shuffled=

    shuffle(candidates);

  for(let i=0;i<shuffled.length;i+=2){

    if(shuffled[i+1]!==undefined){

      state.loverPairs.push([

        shuffled[i],

        shuffled[i+1]

      ]);

    }

  }

}

function startRoleConfirmation(){

  state.alive={};

  for(let i=0;i<state.playerCount;i++){

    state.alive[i]=true;

  }

  state.confirmIndex=0;

  state.day=0;

  state.night=0;

  state.lastExecuted=null;

  state.firstSeerDone=false;

  state.dictatorUsed=false;

  state.gameOver=false;

  state.screen="confirm";

  render();

}

function getRoleDisplay(index){

  let text=

    ROLE_INFO[state.roles[index]].name;

  if(

    state.loverCompatible &&

    state.lovers.includes(index)

  ){

    text+=" + ❤️ 恋人";

  }

  return text;

}

function getConfirmationDetails(index){

  const lines=[];

  const role=

    state.roles[index];

  if(role==="werewolf"){

    const wolves=

      playersWithRole("werewolf")

        .filter(i=>i!==index)

        .map(i=>state.names[i]);

    if(wolves.length){

      lines.push(

        "仲間の人狼："+wolves.join("、")

      );

    }

  }

  if(role==="informant"){

    const wolves=

      playersWithRole("werewolf")

        .map(i=>state.names[i]);

    if(wolves.length){

      lines.push(

        "人狼："+wolves.join("、")

      );

    }

  }

  if(role==="shared"){

    const partners=

      playersWithRole("shared")

        .filter(i=>i!==index)

        .map(i=>state.names[i]);

    if(partners.length){

      lines.push(

        "もう1人の共有者："+partners.join("、")

      );

    }

  }

  const pair=

    loverPairOf(index);

  if(pair){

    const partner=

      pair.find(i=>i!==index);

    if(partner!==undefined){

      lines.push(

        "恋人："+state.names[partner]

      );

    }

  }

  return lines.join("\n");

}

function renderConfirm(){

  if(

    state.confirmIndex>=state.playerCount

  ){

    state.screen="daySettings";

    render();

    return;

  }

  const index=

    state.confirmIndex;

  showCard("👤 役職確認",`

    <div class="confirmNumber">

      ${index+1}/${state.playerCount}

    </div>

    <div class="notice">

      ${esc(state.names[index])}さんだけが

      画面を見てください。

    </div>

    <button onclick="revealRole()">

      ？？？<br>

      役職を確認

    </button>

  `);

}

function revealRole(){

  const index=

    state.confirmIndex;

  const role=

    state.roles[index];

  if(

    role==="seer" &&

    state.day===0 &&

    !state.firstSeerDone

  ){

    showCard("👤 役職確認",`

      <div class="notice">

        ${esc(state.names[index])}さんの役職

      </div>

      <div class="big">

        ${esc(getRoleDisplay(index))}

      </div>

      ${

        getConfirmationDetails(index)

          ?`

            <div

              class="notice"

              style="white-space:pre-line"

            >

              ${esc(

                getConfirmationDetails(index)

              )}

            </div>

          `

          :""

      }

      <div class="notice">

        初日の占いをしますか？

      </div>

      <button onclick="firstSeerStart()">

        🔮 占う

      </button>

      <button

        class="gray"

        onclick="firstSeerSkip()"

      >

        占わない

      </button>

    `);

    return;

  }

  showCard("👤 役職確認",`

    <div class="notice">

      ${esc(state.names[index])}さんの役職

    </div>

    <div class="big">

      ${esc(getRoleDisplay(index))}

    </div>

    ${

      getConfirmationDetails(index)

        ?`

          <div

            class="notice"

            style="white-space:pre-line"

          >

            ${esc(

              getConfirmationDetails(index)

            )}

          </div>

        `

        :""

    }

    <button onclick="finishConfirmation()">

      確認しました

    </button>

  `);

}

function firstSeerStart(){

  state.firstSeerDone=true;

  state.screen="firstSeerTarget";

  render();

}

function firstSeerSkip(){

  state.firstSeerDone=true;

  finishConfirmation();

}

function renderFirstSeerTarget(){

  const seer=

    state.confirmIndex;

  let html=`

    <div class="notice">

function formatTime(seconds){

  const min=

    Math.floor(seconds/60);

  const sec=

    seconds%60;

  return(

    String(min).padStart(2,"0")+

    ":"+

    String(sec).padStart(2,"0")

  );

}

function submitVote(){

  const voter=

    state.voteVoters[state.voteIndex];

  const value=

    document

      .getElementById("voteTarget")

      .value;

  if(value===""){

    alert("投票先を選んでください。");

    return;

  state.votes[voter]=Number(value);

  state.voteIndex++;

  render();

}

function countVotes(votes){

  const counts={};

  Object.values(votes)

    .forEach(target=>{

      counts[target]=

        (counts[target]||0)+1;

    });

  return counts;

}

function getTopCandidates(counts){

  const values=

    Object.values(counts);

  if(!values.length){

    return [];

  }

  const max=

    Math.max(...values);

  return Object.keys(counts)

    .filter(key=>counts[key]===max)

    .map(Number);

}

function finishVote(){

  const counts=

    countVotes(state.votes);

  const top=

    getTopCandidates(counts);

  if(top.length>1){

    state.runoffCandidates=top;

    state.runoffVotes={};

    state.voteVoters=

      alivePlayers();

    state.voteIndex=0;

    state.screen="runoff";

    render();

    return;

  }

  if(top.length===0){

    beginNight();

    return;

  }

  executeVoteTarget(top[0]);

}

function renderRunoff(){

  if(

    state.voteIndex>=state.voteVoters.length

  ){

    finishRunoff();

    return;

  }

  let options=`

      投票先を選択

    </option>

    .filter(

        isAlive(index)

    )

      options+=`

          ${esc(state.names[index])}

    <div class="notice">

      決選投票です。

      ${state.runoffCandidates

        .map(index=>esc(state.names[index]))

        .join("、")}

      ${state.voteIndex+1}/${state.voteVoters.length}

    </div>

    <div class="notice">

      ${esc(state.names[voter])}さんだけが

      画面を見てください。

    </div>

    <select id="runoffTarget">

    </select>

function submitRunoffVote(){

}

function finishRunoff(){

  const counts=

    countVotes(state.runoffVotes);

  const top=

    getTopCandidates(counts);

  if(top.length>1){

    alert(

      "決選投票でも同票のため、追放者はいません。"

    );

    state.lastExecuted=null;

    beginNight();

    return;

  }

  if(top.length===0){

    beginNight();

    return;

  }

  executeVoteTarget(top[0]);

}

function executeVoteTarget(index){

  executePlayer(index);

  if(state.gameOver){

    return;

  }

  if(state.roles[index]==="hunter"){

    startHunter(index,"day");

    return;

  }

  beginNight();

}

function executePlayer(index){

  if(!isAlive(index)){

    return;

  }

  state.alive[index]=false;

  state.lastExecuted=index;

  killLoverPartner(index);

  checkVictory();

}

function killPlayer(index){

  if(!isAlive(index)){

    return;

  }

  state.alive[index]=false;

  killLoverPartner(index);

}

function killLoverPartner(index){

  const pair=

    loverPairOf(index);

  if(!pair){

    return;

  }

  const partner=

    pair.find(i=>i!==index);

  if(

    partner!==undefined &&

    isAlive(partner)

  ){

    state.alive[partner]=false;

    if(state.night>0){

      state.nightDeaths.push(partner);

    }

  }

}

function beginNight(){

  if(checkVictory()){

    return;

  }

  state.night++;

  state.wolfTarget=null;

  state.guardTarget=null;

  state.seerTarget=null;

  state.nightDeaths=[];

  state.screen="nightIntro";

  render();

}

function runNightStep(step){

  if(step==="werewolf"){

    if(

      !hasRole("werewolf")||

      playersWithRole("werewolf",true).length===0

    ){

      runNightStep("bodyguard");

      return;

    }

    state.currentNightStep="werewolf";

    state.screen="nightAction";

    render();

    speak(

      "人狼の方、目を覚ましてください。"+

      "今夜襲撃する人を選んでください。"

    );

    return;

  }

  if(step==="bodyguard"){

    if(

      !hasRole("bodyguard")||

      playersWithRole("bodyguard",true).length===0

    ){

      runNightStep("seer");

      return;

    }

    state.currentNightStep="bodyguard";

    state.screen="nightAction";

    render();

    speak(

      "ボディーガードの方、目を覚ましてください。"+

      "今夜守る人を選んでください。"

    );

    return;

  }

  if(step==="seer"){

    if(

      !hasRole("seer")||

      playersWithRole("seer",true).length===0

    ){

      runNightStep("medium");

      return;

    }

    state.currentNightStep="seer";

    state.screen="nightAction";

    render();

    speak(

      "予言者の方、目を覚ましてください。"+

      "今夜占う人を選んでください。"

    );

    return;

  }

  if(step==="medium"){

    if(

      !hasRole("medium")||

      playersWithRole("medium",true).length===0||

      state.lastExecuted===null

    ){

      finishNight();

      return;

    }

    state.currentNightStep="medium";

    state.screen="nightAction";

    render();

    speak(

      "霊媒師の方、目を覚ましてください。"

    );

    return;

  }

  finishNight();

}

function renderNightAction(){

  switch(state.currentNightStep){

      break;

function finishNight(){

  if(

    state.wolfTarget!==null &&

    isAlive(state.wolfTarget)

  ){

    const target=

      state.wolfTarget;

      state.roles[target];

      if(state.guardTarget===target){

        state.nightDeaths=[];

        killPlayer(target);

  state.nightDeaths=[

  if(

    return;

  startDiscussion();

}

function getCitizenTeamAlive(){

  return alivePlayers()

    .filter(index=>{

      const role=

        state.roles[index];

      return(

        ROLE_INFO[role].team==="citizen"

      );

    });

}

function getWerewolfTeamAlive(){

  return alivePlayers()

    .filter(index=>{

      const role=

        state.roles[index];

      return(

        ROLE_INFO[role].team==="werewolf" &&

        role!=="traitor" &&

        role!=="informant"

      );

    });

}

function normalVictory(){

  const wolves=

    getWerewolfTeamAlive().length;

  const citizens=

    getCitizenTeamAlive().length;

  if(wolves===0){

    return "citizen";

  }

  if(wolves>=citizens){

    return "werewolf";

  }

  return null;

}

function foxVictory(){

  const foxes=

    playersWithRole("fox",true);

  if(foxes.length===0){

    return false;

  }

  return normalVictory()!==null;

}

function loverVictory(){

  if(state.loverPairs.length===0){

    return false;

  }

  return state.loverPairs.some(pair=>{

    return(

      isAlive(pair[0]) &&

      isAlive(pair[1])

    );

  });

}

function checkVictory(){

  if(state.gameOver){

    return true;

  }

  const normal=

    normalVictory();

  const lovers=

    loverVictory();

  const fox=

    foxVictory();

  if(

    !normal &&

    !lovers &&

    !fox

  ){

    return false;

  }

  state.winner={

    normal:normal,

    lovers:lovers,

    fox:fox

  };

  state.gameOver=true;

  state.screen="win";

  render();

  return true;

}

function renderWin(){

  const results=[];

  if(state.winner.normal){

    results.push(

      state.winner.normal==="werewolf"

        ?"🐺 人狼の勝利です！"

        :"👤 市民の勝利です！"

    );

  }

  if(state.winner.lovers){

    results.push(

      "❤️ 恋人の勝利です！"

    );

  }

  if(state.winner.fox){

    results.push(

      "🦊 妖狐の勝利です！"

    );

  }

  let html="";

  results.forEach((text,index)=>{

    html+=`

      <div class="result ${

        index<results.length-1

          ?"cross"

          :""

      }">

        ${text}

      </div>

    `;

  });

  html+=`

    <div class="notice">

      勝利の優先順位

      <br>

      妖狐 ＞ 恋人 ＞ 人狼・市民

      <br><br>

      最終勝利

      <br>

      <strong>

        ${results[results.length-1]}

      </strong>

    </div>

    <button onclick="location.reload()">

      もう一度遊ぶ

    </button>

  `;

  showCard("🏆 ゲーム終了",html);

  speak(

    results[results.length-1]

  );

}

render();

</script>

</body>

</html>
