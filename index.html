<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  padding:16px;

  background:#f5f5f5;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

  text-align:center;

}

#app{

  width:100%;

  max-width:720px;

  margin:0 auto;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:22px;

  margin:12px 0;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

}

h1{

  margin:4px 0 20px;

  font-size:27px;

}

h2{

  margin:4px 0 18px;

}

button{

  width:100%;

  padding:14px;

  margin:6px 0;

  border:0;

  border-radius:12px;

  background:#222;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

button.gray{

  background:#777;

}

button.red{

  background:#9d0000;

}

button:disabled{

  opacity:.4;

}

input,

select{

  width:100%;

  padding:13px;

  border:1px solid #ccc;

  border-radius:10px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  text-align:left;

  margin:12px 0 6px;

  font-weight:bold;

}

.notice{

  padding:14px;

  margin:12px 0;

  border-radius:12px;

  background:#f0f0f0;

  line-height:1.7;

}

.big{

  font-size:34px;

  font-weight:bold;

  margin:18px 0;

}

.small{

  font-size:13px;

  color:#666;

}

.roleGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

}

.roleBox{

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  background:#fff;

}

.roleName{

  font-weight:bold;

  margin-bottom:5px;

}

.counter{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin-top:9px;

}

.counter button{

  width:46px;

  height:46px;

  padding:0;

  margin:0;

  font-size:25px;

}

.counterValue{

  min-width:38px;

  font-size:23px;

  font-weight:bold;

}

.roleTotal{

  font-size:34px;

  font-weight:bold;

  margin:12px 0 18px;

}

.targetGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.timer{

  font-size:48px;

  font-weight:bold;

  margin:10px 0 20px;

}

.confirmNumber{

  font-size:18px;

  font-weight:bold;

  margin-bottom:10px;

}

.result{

  font-size:27px;

  font-weight:bold;

  margin:18px 0;

}

.cross{

  text-decoration:line-through;

  opacity:.35;

}

.selected{

  border:3px solid #222;

}

@media(max-width:520px){

  .roleGrid,

  .targetGrid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const ROLE_INFO={

  werewolf:{

    name:"🐺 人狼",

    voice:"人狼",

    max:6,

    team:"werewolf"

  },

  citizen:{

    name:"👤 市民",

    voice:"市民",

    max:28,

    team:"citizen"

  },

  seer:{

    name:"🔮 予言者",

    voice:"予言者",

    max:1,

    team:"citizen"

  },

  medium:{

    name:"👻 霊媒師",

    voice:"霊媒師",

    max:1,

    team:"citizen"

  },

  bodyguard:{

    name:"🛡️ ボディーガード",

    voice:"ボディーガード",

    max:1,

    team:"citizen"

  },

  traitor:{

    name:"🃏 裏切り者",

    voice:"裏切り者",

    max:3,

    team:"werewolf"

  },

  informant:{

    name:"📡 内通者",

    voice:"内通者",

    max:2,

    team:"werewolf"

  },

  fox:{

    name:"🦊 妖狐",

    voice:"ようこ",

    max:3,

    team:"fox"

  },

  hunter:{

    name:"🔫 ハンター",

    voice:"ハンター",

    max:2,

    team:"citizen"

  },

  shared:{

    name:"🤝 共有者",

    voice:"共有者",

    max:2,

    team:"citizen"

  },

  lover:{

    name:"❤️ 恋人",

    voice:"恋人",

    max:6,

    team:"citizen"

  },

  dictator:{

    name:"👑 独裁者",

    voice:"独裁者",

    max:1,

    team:"citizen"

  }

};

const state={

  screen:"start",

  mode:"",

  playerCount:0,

  names:[],

  loverCompatible:false,

  roleCounts:{

    werewolf:0,

    citizen:0,

    seer:0,

    medium:0,

    bodyguard:0,

    traitor:0,

    informant:0,

    fox:0,

    hunter:0,

    shared:0,

    lover:0,

    dictator:0

  },

  roles:{},

  alive:{},

  lovers:[],

  loverPairs:[],

  confirmIndex:0,

  firstSeerDone:false,

  day:0,

  night:0,

  discussionMinutes:5,

  seconds:0,

  timer:null,

  lastExecuted:null,

  wolfTarget:null,

  guardTarget:null,

  previousGuardTarget:null,

  seerTarget:null,

  nightDeaths:[],

  voteVoters:[],

  voteIndex:0,

  votes:{},

  runoffCandidates:[],

  runoffVotes:{},

  dictatorUsed:false,

  hunterIndex:null,

  hunterReason:"",

  gameOver:false,

  winner:null,

  currentNightStep:"",

  cardIndex:0,

  cardSelections:[]

};

const app=document.getElementById("app");

/* =========================

   基本関数

========================= */

function speak(text){

  try{

    speechSynthesis.cancel();

    let clean=String(text);

    clean=clean

      .replace(/[\u{1F000}-\u{1FAFF}]/gu,"")

      .replace(/[\u{2600}-\u{27BF}]/gu,"")

      .replace(/[\u{FE00}-\u{FE0F}]/gu,"")

      .replace(/[\u{200D}]/gu,"");

    const utterance=

      new SpeechSynthesisUtterance(clean);

    utterance.lang="ja-JP";

    utterance.rate=.95;

    speechSynthesis.speak(utterance);

  }catch(e){}

}

function esc(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function shuffle(array){

  const result=[...array];

  for(let i=result.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [result[i],result[j]]=

      [result[j],result[i]];

  }

  return result;

}

function isAlive(index){

  return state.alive[index]===true;

}

function alivePlayers(){

  return state.names

    .map((_,index)=>index)

    .filter(isAlive);

}

function playersWithRole(role,aliveOnly=false){

  return state.names

    .map((_,index)=>index)

    .filter(index=>{

      if(state.roles[index]!==role){

        return false;

      }

      if(aliveOnly&&!isAlive(index)){

        return false;

      }

      return true;

    });

}

function hasRole(role){

  return playersWithRole(role).length>0;

}

function loverPairOf(index){

  return state.loverPairs.find(

    pair=>pair.includes(index)

  );

}

/* =========================

   役職合計

========================= */

function getPrimaryRoleTotal(){

  let total=0;

  Object.entries(state.roleCounts)

    .forEach(([role,count])=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      total+=Number(count)||0;

    });

  return total;

}

/* =========================

   描画

========================= */

function render(){

  app.innerHTML="";

  switch(state.screen){

    case"start":

      renderStart();

      break;

    case"count":

      renderCount();

      break;

    case"names":

      renderNames();

      break;

    case"loverMode":

      renderLoverMode();

      break;

    case"roles":

      renderRoles();

      break;

    case"cardInput":

      renderCardInput();

      break;

    case"confirm":

      renderConfirm();

      break;

    case"firstSeerTarget":

      renderFirstSeerTarget();

      break;

    case"daySettings":

      renderDaySettings();

      break;

    case"day":

      renderDay();

      break;

    case"vote":

      renderVote();

      break;

    case"runoff":

      renderRunoff();

      break;

    case"nightIntro":

      renderNightIntro();

      break;

    case"nightAction":

      renderNightAction();

      break;

    case"morning":

      renderMorning();

      break;

    case"hunter":

      renderHunter();

      break;

    case"win":

      renderWin();

      break;

  }

}

function showCard(title,content){

  app.innerHTML=`

    <div class="card">

      <h1>${title}</h1>

      ${content}

    </div>

  `;

}

/* =========================

   スタート

========================= */

function renderStart(){

  showCard("🐺 人狼コンプリートGM",`

    <div class="notice">

      ゲーム方式を選んでください。

    </div>

    <button onclick="chooseMode('random')">

      📱 カードなし

    </button>

    <button onclick="chooseMode('card')">

      🃏 カードあり

    </button>

  `);

}

function chooseMode(mode){

  state.mode=mode;

  state.screen="count";

  render();

}

/* =========================

   人数

========================= */

function renderCount(){

  let options="";

  for(let i=4;i<=28;i++){

    options+=`

      <option value="${i}">

        ${i}人

      </option>

    `;

  }

  showCard("人数設定",`

    <label>プレイヤー人数</label>

    <select id="playerCount">

      ${options}

    </select>

    <button onclick="savePlayerCount()">

      次へ

    </button>

  `);

}

function savePlayerCount(){

  state.playerCount=

    Number(

      document.getElementById("playerCount").value

    );

  state.names=

    Array(state.playerCount).fill("");

  const saved=

    localStorage.getItem("jinro_names");

  if(saved){

    try{

      const previous=JSON.parse(saved);

      if(Array.isArray(previous)){

        for(

          let i=0;

          i<Math.min(

            previous.length,

            state.playerCount

          );

          i++

        ){

          state.names[i]=previous[i]||"";

        }

      }

    }catch(e){}

  }

  state.screen="names";

  render();

}

/* =========================

   名前

========================= */

function renderNames(){

  let html="";

  for(let i=0;i<state.playerCount;i++){

    html+=`

      <label>${i+1}人目</label>

      <input

        id="name${i}"

        value="${esc(state.names[i])}"

        placeholder="名前"

      >

    `;

  }

  html+=`

    <button onclick="saveNames()">

      次へ

    </button>

  `;

  showCard("プレイヤー名",html);

}

function saveNames(){

  const names=[];

  for(let i=0;i<state.playerCount;i++){

    const value=

      document

        .getElementById("name"+i)

        .value

        .trim();

    if(!value){

      alert("全員の名前を入力してください。");

      return;

    }

    names.push(value);

  }

  if(new Set(names).size!==names.length){

    alert("同じ名前は使用できません。");

    return;

  }

  state.names=names;

  localStorage.setItem(

    "jinro_names",

    JSON.stringify(names)

  );

  state.screen="loverMode";

  render();

}

/* =========================

   恋人兼用設定

========================= */

function renderLoverMode(){

  showCard("❤️ 恋人設定",`

    <div class="notice">

      恋人を他の役職と兼用できるようにするか、

      <br>

      先に決めてください。

      <br><br>

      恋人を選ばない場合は

      <strong>0枚</strong>

      で進められます。

    </div>

    <button onclick="setLoverCompatible(true)">

      ❤️ 兼用する

    </button>

    <button class="gray" onclick="setLoverCompatible(false)">

      ❤️ 兼用しない

    </button>

  `);

}

function setLoverCompatible(value){

  state.loverCompatible=value;

  state.screen="roles";

  render();

}

/* =========================

   役職選択

========================= */

function renderRoles(){

  const total=getPrimaryRoleTotal();

  let html=`

    <div class="roleTotal">

      ${total}/${state.playerCount}

    </div>

    <div class="notice">

      役職の枚数を選んでください。

      <br>

      「− 0 ＋」で変更できます。

      <br>

      ❤️ 恋人を選ぶ場合は2枚1組です。

      <br>

      🤝 共有者を選ぶ場合は2枚1セットです。

      <br><br>

      恋人を選ばなくても大丈夫です。

      <br>

      共有者を選ばなくても大丈夫です。

    </div>

    <div class="roleGrid">

  `;

  Object.entries(ROLE_INFO)

    .forEach(([id,info])=>{

      const count=

        Number(state.roleCounts[id])||0;

      const overlayLover=

        state.loverCompatible &&

        id==="lover";

      html+=`

        <div class="roleBox">

          <div class="roleName">

            ${info.name}

          </div>

          <div class="small">

            ${

              overlayLover

                ?"他の役職との兼用"

                :"最大"+info.max+"枚"

            }

          </div>

          <div class="counter">

            <button

              class="gray"

              onclick="changeRole('${id}',-1)"

              ${count<=0?"disabled":""}

            >

              −

            </button>

            <div class="counterValue">

              ${count}

            </div>

            <button

              onclick="changeRole('${id}',1)"

              ${

                count>=info.max ||

                (

                  !overlayLover &&

                  total>=state.playerCount

                )

                  ?"disabled":""

              }

            >

              ＋

            </button>

          </div>

        </div>

      `;

    });

  html+=`

    </div>

    <button onclick="finishRoleSelection()">

      次へ

    </button>

  `;

  showCard("役職選択",html);

}

function changeRole(id,change){

  const current=

    Number(state.roleCounts[id])||0;

  const next=current+change;

  if(next<0){

    return;

  }

  if(next>ROLE_INFO[id].max){

    return;

  }

  const overlayLover=

    state.loverCompatible &&

    id==="lover";

  if(

    change>0 &&

    !overlayLover &&

    getPrimaryRoleTotal()>=state.playerCount

  ){

    return;

  }

  if(

    id==="lover" &&

    next%2!==0

  ){

    alert(

      "恋人は2枚1組なので、2枚ずつ選んでください。"

    );

    return;

  }

  if(

    id==="shared" &&

    next!==0 &&

    next!==2

  ){

    alert(

      "共有者は2枚1セットです。"

    );

    return;

  }

  state.roleCounts[id]=next;

  render();

}

function finishRoleSelection(){

  const total=getPrimaryRoleTotal();

  if(total!==state.playerCount){

    alert(

      `役職の合計を${state.playerCount}枚にしてください。`

    );

    return;

  }

  if(

    state.roleCounts.lover%2!==0

  ){

    alert("恋人は2枚1組です。");

    return;

  }

  if(

    state.roleCounts.shared!==0 &&

    state.roleCounts.shared!==2

  ){

    alert("共有者は2枚1セットです。");

    return;

  }

  if(state.mode==="card"){

    state.cardIndex=0;

    state.cardSelections=[];

    state.screen="cardInput";

    render();

    return;

  }

  assignRandomRoles();

}

/* =========================

   ランダム役職

========================= */

function createPrimaryRolePool(){

  const pool=[];

  Object.entries(state.roleCounts)

    .forEach(([role,count])=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      for(let i=0;i<count;i++){

        pool.push(role);

      }

    });

  return pool;

}

function assignRandomRoles(){

  const pool=

    shuffle(createPrimaryRolePool());

  state.roles={};

  pool.forEach((role,index)=>{

    state.roles[index]=role;

  });

  setupLovers();

  startRoleConfirmation();

}

/* =========================

   カードあり

   1人ずつ入力

========================= */

function renderCardInput(){

  const index=state.cardIndex;

  if(index>=state.playerCount){

    finishCardInput();

    return;

  }

  let options=`

    <option value="">

      カードを選択

    </option>

  `;

  Object.entries(ROLE_INFO)

    .forEach(([id,info])=>{

      options+=`

        <option value="${id}">

          ${info.name}

        </option>

      `;

    });

  showCard("🃏 カード入力",`

    <div class="confirmNumber">

      ${index+1}/${state.playerCount}

    </div>

    <div class="notice">

      ${esc(state.names[index])}さんだけが

      <br>

      画面を見てください。

      <br><br>

      配られたカードを入力してください。

      <br>

      他の人には見せないでください。

    </div>

    <select id="cardSelect">

      ${options}

    </select>

    <button onclick="saveOneCard()">

      このカードを確認

    </button>

  `);

}

function saveOneCard(){

  const value=

    document

      .getElementById("cardSelect")

      .value;

  if(!value){

    alert("カードを選択してください。");

    return;

  }

  state.cardSelections[state.cardIndex]=value;

  state.cardIndex++;

  render();

}

function finishCardInput(){

  const selected=

    state.cardSelections;

  const actual={};

  selected.forEach(role=>{

    actual[role]=(actual[role]||0)+1;

  });

  for(

    const role of Object.keys(ROLE_INFO)

  ){

    if(

      state.loverCompatible &&

      role==="lover"

    ){

      continue;

    }

    const expected=

      Number(state.roleCounts[role])||0;

    const got=

      Number(actual[role])||0;

    if(expected!==got){

      alert(

        `${ROLE_INFO[role].name}の枚数が設定と一致していません。`

      );

      state.cardIndex=0;

      state.cardSelections=[];

      render();

      return;

    }

  }

  state.roles={};

  selected.forEach((role,index)=>{

    state.roles[index]=role;

  });

  setupLovers();

  startRoleConfirmation();

}

/* =========================

   恋人設定

========================= */

function setupLovers(){

  state.lovers=[];

  state.loverPairs=[];

  const count=

    Number(state.roleCounts.lover)||0;

  if(count===0){

    return;

  }

  let candidates=[];

  if(state.loverCompatible){

    candidates=

      shuffle(

        Array.from(

          {length:state.playerCount},

          (_,i)=>i

        )

      ).slice(0,count);

  }else{

    candidates=

      playersWithRole("lover");

  }

  state.lovers=candidates;

  const shuffled=

    shuffle(candidates);

  for(

    let i=0;

    i<shuffled.length;

    i+=2

  ){

    if(shuffled[i+1]!==undefined){

      state.loverPairs.push([

        shuffled[i],

        shuffled[i+1]

      ]);

    }

  }

}

/* =========================

   役職確認開始

========================= */

function startRoleConfirmation(){

  state.alive={};

  for(

    let i=0;

    i<state.playerCount;

    i++

  ){

    state.alive[i]=true;

  }

  state.confirmIndex=0;

  state.day=0;

  state.night=0;

  state.lastExecuted=null;

  state.firstSeerDone=false;

  state.dictatorUsed=false;

  state.gameOver=false;

  state.winner=null;

  state.screen="confirm";

  render();

}

function getRoleDisplay(index){

  let text=

    ROLE_INFO[state.roles[index]].name;

  if(

    state.loverCompatible &&

    state.lovers.includes(index)

  ){

    text+=" + ❤️ 恋人";

  }

  return text;

}

function getConfirmationDetails(index){

  const lines=[];

  const role=state.roles[index];

  if(role==="werewolf"){

    const wolves=

      playersWithRole("werewolf")

        .filter(i=>i!==index)

        .map(i=>state.names[i]);

    if(wolves.length){

      lines.push(

        "仲間の人狼："+wolves.join("、")

      );

    }

  }

  if(role==="informant"){

    const wolves=

      playersWithRole("werewolf")

        .map(i=>state.names[i]);

    if(wolves.length){

      lines.push(

        "人狼："+wolves.join("、")

      );

    }

  }

  if(role==="shared"){

    const partners=

      playersWithRole("shared")

        .filter(i=>i!==index)

        .map(i=>state.names[i]);

    if(partners.length){

      lines.push(

        "もう1人の共有者："+partners.join("、")

      );

    }

  }

  const pair=

    loverPairOf(index);

  if(pair){

    const partner=

      pair.find(i=>i!==index);

    if(partner!==undefined){

      lines.push(

        "恋人："+state.names[partner]

      );

    }

  }

  return lines.join("\n");

}

/* =========================

   役職確認

========================= */

function renderConfirm(){

  if(

    state.confirmIndex>=state.playerCount

  ){

    state.screen="daySettings";

    render();

    return;

  }

  const index=

    state.confirmIndex;

  showCard("👤 役職確認",`

    <div class="confirmNumber">

      ${index+1}/${state.playerCount}

    </div>

    <div class="notice">

      ${esc(state.names[index])}さんだけが

      <br>

      画面を見てください。

    </div>

    <button onclick="revealRole()">

      ？？？<br>

      役職を確認

    </button>

  `);

}

function revealRole(){

  const index=

    state.confirmIndex;

  const role=

    state.roles[index];

  if(

    role==="seer" &&

    state.day===0 &&

    !state.firstSeerDone

  ){

    showFirstSeerConfirmation(index);

    return;

  }

  showNormalRoleConfirmation(index);

}

    getDivinationResult(index);

function finishConfirmation(){

  state.confirmIndex++;

  if(

    state.confirmIndex>=state.playerCount

  ){

    state.screen="daySettings";

  }else{

    state.screen="confirm";

  }

  render();

}

function startDiscussion(){

  state.screen="day";

  state.seconds=

    state.discussionMinutes*60;

  clearInterval(state.timer);

  render();

  speak(

    "お昼です。みなさん目を覚ましてください。議論スタートです。"

  );

  if(state.discussionMinutes>0){

    state.timer=setInterval(()=>{

      state.seconds--;

      updateTimer();

      if(state.seconds<=0){

        clearInterval(state.timer);

        openVote();

      }

    },1000);

  }

}

function updateTimer(){

  const timer=

    document.getElementById("timer");

  if(timer){

    timer.textContent=

      formatTime(state.seconds);

  }

}

function formatTime(seconds){

  const min=

    Math.floor(seconds/60);

  const sec=

    seconds%60;

  return(

    String(min).padStart(2,"0")+

    ":"+

    String(sec).padStart(2,"0")

  );

}
