  font-size:20px;

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<div id="app"></div>

</div>

<script>

/* =====================================================

   役職一覧

===================================================== */

const ROLES=[

  "人狼",

  "人狼の子ども",

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者",

  "スパイ",

  "市民",

  "予言者",

  "ボディーガード",

  "霊媒師",

  "ハンター",

  "共有者",

  "独裁者",

  "タフガイ",

  "カウンセラー",

  "奇術師",

  "罠師",

  "騎士団",

  "影武者",

  "王様",

  "妖狐",

  "神様",

  "恋人",

  "一匹狼",

  "アンドロイド",

  "案山子",

  "呪われた者"

];

/* =====================================================

   人狼として扱う役職

===================================================== */

const WOLF_ROLES=[

  "人狼",

  "人狼の子ども",

  "一匹狼"

];

const NORMAL_WOLF_ROLES=[

  "人狼",

  "人狼の子ども"

];

const BETRAYER_ROLES=[

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者"

];

/* =====================================================

   夜の13段階

===================================================== */

const NIGHT_ORDER=[

  "呪われた者",

  "スパイ",

  "アンドロイド",

  "罠師",

  "ボディーガード",

  "騎士団",

  "人狼",

  "裏切りの襲撃者",

  "カウンセラー",

  "裏切り者確認",

  "奇術師",

  "予言者",

  "霊媒師"

];

/* =====================================================

   ゲームデータ

===================================================== */

let game={

  players:[],

  roleCount:{},

  night:0,

  day:0,

  confirmIndex:0,

  confirmRevealed:false,

  nightIndex:0,

  wolfTarget:null,

  wolfTargets:[],

  raiderTarget:null,

  guardTarget:null,

  knightTarget:null,

  trapTarget:null,

  magicTarget:null,

  counselTarget:null,

  lastGuard:null,

  lastTrap:null,

  magicUsed:false,

  dictatorUsed:false,

  shadowUsed:false,

  firstSeer:true,

  firstDay:true,

  discussionTime:300,

  discussionTimer:null,

  discussionEnded:false,

  lastExiled:null,

  toughPending:[],

  lovers:[],

  loverPairs:[],

  android:{},

  voteRound:0,

  currentVotes:{},

  blockedRoles:{},

  convertedThisNight:[],

  childRage:false,

  trapActive:false,

  trapOwner:null,

  nightDeaths:[],

  morningDeaths:[],

  gameOver:false

};

const app=document.getElementById("app");

/* =====================================================

   基本関数

===================================================== */

function escapeHTML(text){

  return String(text).replace(

    /[&<>"']/g,

    function(c){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[c];

    }

  );

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=

      new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    u.rate=1;

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(

    p=>p.alive

  );

}

function rolePlayers(role){

  return game.players.filter(

    p=>p.role===role

  );

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function getPlayer(id){

  return game.players.find(

    p=>p.id===Number(id)

  );

}

function isWolfRole(role){

  return WOLF_ROLES.includes(role);

}

function isNormalWolf(role){

  return NORMAL_WOLF_ROLES.includes(role);

}

function isBetrayer(role){

  return BETRAYER_ROLES.includes(role);

}

function formatTime(sec){

  const m=

    Math.floor(sec/60);

  const s=

    sec%60;

  return(

    m+

    ":"+

    String(s).padStart(2,"0")

  );

}

/* =====================================================

   人狼表示

===================================================== */

function wolfDisplayName(player){

  return(

    `${escapeHTML(player.name)}（人狼）`

  );

}

/* =====================================================

   占い結果

===================================================== */

function seerResult(player){

  if(player.role==="妖狐"){

    return "人間";

  }

  if(isWolfRole(player.role)){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   霊媒結果

===================================================== */

function mediumResult(player){

  if(

    player.role==="人狼" ||

    player.role==="人狼の子ども" ||

    player.role==="一匹狼" ||

    player.role==="案山子"

  ){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   アンドロイド

===================================================== */

function androidCurrentAlignment(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "human";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "human";

  }

  if(isWolfRole(target.role)){

    return "wolf";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "wolf";

  }

  return "human";

}

function androidRoleText(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "まだコピーしていません";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "不明";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "人狼";

  }

  if(isWolfRole(target.role)){

    return "人狼";

  }

  return target.role;

}

/* =====================================================

   生存役職

===================================================== */

function hasLivingRole(role){

  return living().some(

    p=>p.role===role

  );

}

/* =====================================================

   ゲーム開始画面

===================================================== */

function startScreen(){

  render(`

  <div class="card">

    <h2>🎮 ゲーム設定</h2>

    <p>

      👥 人数

      <select id="playerCount">

        ${Array.from(

          {length:17},

          (_,i)=>

            `<option value="${i+4}">

              ${i+4}人

            </option>`

        ).join("")}

      </select>

    </p>

    <p>

      ⏱️ 議論時間

      <select id="discussion">

        <option value="180">

          3分

        </option>

        <option value="300" selected>

          5分

        </option>

        <option value="600">

          10分

        </option>

      </select>

    </p>

  </div>

  <div class="card">

    <h2>🃏 役職選択</h2>

    <div

      id="roleTotal"

      class="total-count"

    >

      0 / 4

    </div>

    <p class="small">

      プレイヤー人数と役職カード枚数を

      合わせてください。

    </p>

    <div id="roleList">

      ${ROLES.map(

        (role,index)=>`

        <div class="role-row">

          <span>

            ${escapeHTML(role)}

          </span>

          <span>

            <button

              onclick="changeRole('${role}',-1)"

            >

              −

            </button>

            <span

              class="count"

              id="count${index}"

            >

              0

            </span>

            <button

              onclick="changeRole('${role}',1)"

            >

              ＋

            </button>

          </span>

        </div>

      `

      ).join("")}

    </div>

  </div>

  <button

    class="green"

    onclick="nameScreen()"

  >

    👤 プレイヤー名入力へ

  </button>

  `);

  updateRoleTotal();

}

/* =====================================================

   役職合計表示

===================================================== */

function updateRoleTotal(){

  const playerCountElement=

    document.getElementById(

      "playerCount"

    );

  const totalElement=

    document.getElementById(

      "roleTotal"

    );

  if(

    !playerCountElement ||

    !totalElement

  ){

    return;

  }

  const playerCount=

    Number(

      playerCountElement.value

    );

  const total=

    Object.values(

      game.roleCount

    ).reduce(

      (sum,value)=>sum+Number(value||0),

      0

    );

  totalElement.textContent=

    `${total} / ${playerCount}`;

}

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  if(

    role==="騎士団" &&

    value>3

  ){

    value=3;

  }

  if(

    role==="案山子" &&

    value>3

  ){

    value=3;

  }

  if(

    role==="恋人" &&

    value>2

  ){

    value=2;

  }

  if(

    role==="共有者" &&

    value>2

  ){

    value=2;

  }

  if(

    role==="裏切りの共有者" &&

    value>2

  ){

    value=2;

  }

  game.roleCount[role]=value;

  const index=

    ROLES.indexOf(role);

  const el=

    document.getElementById(

      "count"+index

    );

  if(el){

    el.textContent=value;

  }

  updateRoleTotal();

}

/* =====================================================

   人数変更時にも合計表示を更新

===================================================== */

document.addEventListener(

  "change",

  function(e){

    if(

      e.target &&

      e.target.id==="playerCount"

    ){

      updateRoleTotal();

    }

  }

);

/* =====================================================

   名前入力

===================================================== */

function nameScreen(){

  const playerCountElement=

    document.getElementById(

      "playerCount"

    );

  if(!playerCountElement){

    return;

  }

  const n=

    Number(

      playerCountElement.value

    );

  const total=

    Object.values(

      game.roleCount

    ).reduce(

      (sum,value)=>sum+Number(value||0),

      0

    );

  if(total!==n){

    alert(

      `役職カードが${total}枚です。\n\n`+

      `プレイヤーは${n}人です。\n\n`+

      `役職カードの合計を${n}枚にしてください。`

    );

    return;

  }

  const saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      )||"[]"

    );

  game.players=[];

  for(

    let i=0;

    i<n;

    i++

  ){

    game.players.push({

      id:i,

      name:

        saved[i]||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      androidCopied:false,

      androidSource:null,

      converted:false,

      lover:false

    });

  }

  game.discussionTime=

    Number(

      document.getElementById(

        "discussion"

      ).value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small">

      前回の名前がある場合は

      自動で表示されます。

    </p>

    ${game.players.map(

      (p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="

          width:90%;

          margin:6px;

        "

      >

    `

    ).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🃏 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach(

    (p,i)=>{

      const el=

        document.getElementById(

          "playerName"+i

        );

      const name=

        el

          ? el.value.trim()

          : "";

      p.name=

        name||

        `プレイヤー${i+1}`;

    }

  );

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  if(

    deck.length!==

    game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。`

    );

    return;

  }

  if(

    (game.roleCount["恋人"]||0)%2!==0

  ){

    alert(

      "恋人は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["共有者"]||0)!==0 &&

    (game.roleCount["共有者"]||0)!==2

  ){

    alert(

      "共有者は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["裏切りの共有者"]||0)!==0 &&

    (game.roleCount["裏切りの共有者"]||0)!==2

  ){

    alert(

      "裏切りの共有者は2枚ワンセットです。"

    );

    return;

  }

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach(

    (p,i)=>{

      p.role=deck[i];

      p.alive=true;

      p.cursedWolf=false;

      p.toughHit=false;

      p.blocked=false;

      p.androidCopied=false;

      p.androidSource=null;

      p.converted=false;

      p.lover=false;

    }

  );

  game.confirmIndex=0;

  game.confirmRevealed=false;

  game.night=0;

  game.day=0;

  game.firstDay=true;

  game.lastExiled=null;

  game.childRage=false;

  game.magicUsed=false;

  game.lastGuard=null;

  game.lastTrap=null;

  preparePairs();

  roleConfirmation();

}

/* =====================================================

   ペア設定

===================================================== */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(lovers[i+1]){

      const pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(

        pair

      );

      game.lovers.push(

        ...pair

      );

      lovers[i].lover=true;

      lovers[i+1].lover=true;

    }

  }

}

/* =====================================================

   起動

===================================================== */

startScreen();

/* =====================================================

   役職選択

===================================================== */

function roleSelectScreen(){

  const total=

    Object.values(game.roleCount)

      .reduce((a,b)=>a+b,0);

  const playerCount=

    Number(

      document.getElementById("playerCount")?.value ||

      game.players.length ||

      0

    );

  render(`

  <div class="card">

    <h2>🃏 役職選択</h2>

    <div class="progress">

      ${total} / ${playerCount}

    </div>

    <p class="small">

      役職カードの合計枚数を

      プレイヤー人数と合わせてください。

    </p>

  </div>

  <div class="card">

    ${ROLES.map((role,index)=>`

      <div class="role-row">

        <span>

          ${escapeHTML(role)}

        </span>

        <span>

          <button

            onclick="changeRole('${role}',-1)"

          >

            −

          </button>

          <span

            class="count"

            id="count${index}"

          >

            ${game.roleCount[role]||0}

          </span>

          <button

            onclick="changeRole('${role}',1)"

          >

            ＋

          </button>

        </span>

      </div>

    `).join("")}

  </div>

  <button

    class="blue"

    onclick="nameScreen()"

    ${total!==playerCount ? "disabled" : ""}

  >

    👤 プレイヤー名を入力

  </button>

  `);

}

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  /* 騎士団 */

  if(

    role==="騎士団" &&

    value>3

  ){

    value=3;

  }

  /* 案山子 */

  if(

    role==="案山子" &&

    value>3

  ){

    value=3;

  }

  /* 恋人 */

  if(

    role==="恋人" &&

    value>2

  ){

    value=2;

  }

  /* 共有者 */

  if(

    role==="共有者" &&

    value>2

  ){

    value=2;

  }

  /* 裏切りの共有者 */

  if(

    role==="裏切りの共有者" &&

    value>2

  ){

    value=2;

  }

  game.roleCount[role]=value;

  updateRoleCountDisplay();

}

/* =====================================================

   役職枚数表示更新

===================================================== */

function updateRoleCountDisplay(){

  const total=

    Object.values(game.roleCount)

      .reduce((a,b)=>a+b,0);

  const playerCount=

    Number(

      document.getElementById("playerCount")?.value ||

      game.players.length ||

      0

    );

  const progress=

    document.querySelector(".progress");

  if(progress){

    progress.textContent=

      `${total} / ${playerCount}`;

  }

  ROLES.forEach((role,index)=>{

    const el=

      document.getElementById(

        "count"+index

      );

    if(el){

      el.textContent=

        game.roleCount[role]||0;

    }

  });

  const button=

    document.querySelector(

      "button[onclick=\"nameScreen()\"]"

    );

  if(button){

    button.disabled=

      total!==playerCount;

  }

}

/* =====================================================

   プレイヤー名入力

===================================================== */

function nameScreen(){

  const select=

    document.getElementById("playerCount");

  const n=

    Number(

      select?.value ||

      game.players.length ||

      0

    );

  if(!n){

    alert(

      "プレイヤー人数を選択してください。"

    );

    return;

  }

  const saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      )||"[]"

    );

  game.players=[];

  for(let i=0;i<n;i++){

    game.players.push({

      id:i,

      name:

        saved[i] ||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      androidCopied:false

    });

  }

  const firstSeer=

    document.getElementById(

      "firstSeer"

    );

  const discussion=

    document.getElementById(

      "discussion"

    );

  game.firstSeer=

    firstSeer

      ? firstSeer.value==="yes"

      : true;

  game.discussionTime=

    discussion

      ? Number(discussion.value)

      : 300;

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small">

      前回の名前があれば

      自動で表示されます。

    </p>

    ${game.players.map((p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="width:90%;margin:6px"

      >

    `).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🃏 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach((p,i)=>{

    const input=

      document.getElementById(

        "playerName"+i

      );

    const name=

      input

        ? input.value.trim()

        : "";

    p.name=

      name ||

      `プレイヤー${i+1}`;

  });

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  if(

    deck.length!==game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `人数と役職枚数を合わせてください。`

    );

    return;

  }

  if(

    (game.roleCount["恋人"]||0)%2!==0

  ){

    alert(

      "恋人は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["共有者"]||0)!==0 &&

    (game.roleCount["共有者"]||0)!==2

  ){

    alert(

      "共有者は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["裏切りの共有者"]||0)!==0 &&

    (game.roleCount["裏切りの共有者"]||0)!==2

  ){

    alert(

      "裏切りの共有者は2枚ワンセットです。"

    );

    return;

  }

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach((p,i)=>{

    p.role=deck[i];

    p.alive=true;

    p.cursedWolf=false;

    p.toughHit=false;

    p.blocked=false;

    p.androidCopied=false;

  });

  game.confirmIndex=0;

  game.confirmRevealed=false;

  game.lastExiled=null;

  game.night=0;

  game.day=0;

  game.firstDay=true;

  game.nightIndex=0;

  game.voteRound=0;

  game.gameOver=false;

  game.toughPending=[];

  game.nightDeaths=[];

  game.morningDeaths=[];

  game.android={};

  game.loverPairs=[];

  game.lovers=[];

  game.magicUsed=false;

  game.lastGuard=null;

  game.lastTrap=null;

  preparePairs();

  roleConfirmation();

}

/* =====================================================

   ペア設定

===================================================== */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(!lovers[i+1]){

      continue;

    }

    const pair=[

      lovers[i].id,

      lovers[i+1].id

    ];

    game.loverPairs.push(pair);

    game.lovers.push(

      ...pair

    );

  }

}

/* =====================================================

   役職確認

===================================================== */

function roleConfirmation(){

  if(

    game.confirmIndex>=

    game.players.length

  ){

    game.confirmRevealed=false;

    startFirstDay();

    return;

  }

  const p=

    game.players[

      game.confirmIndex

    ];

  const number=

    game.confirmIndex+1;

  const total=

    game.players.length;

  if(!game.confirmRevealed){

    render(`

    <div class="card">

      <div class="progress">

        ${number} / ${total}

      </div>

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <p style="text-align:center">

        あなたの役職を確認してください。

      </p>

      <button

        class="blue"

        onclick="revealRole()"

      >

        👀 役職を見る

      </button>

    </div>

    `);

    return;

  }

  render(`

  <div class="card private">

    <div class="progress">

      ${number} / ${total}

    </div>

    <h2>

      ${escapeHTML(p.name)}さん

    </h2>

    <div class="big">

      ${escapeHTML(p.role)}

    </div>

    ${roleInfoFor(p)}

    <p class="small">

    </p>

    class="green"

  >

    ✅ 確認しました

  </button>

  `);

}

/* =====================================================

   役職を表示

===================================================== */

function revealRole(){

  game.confirmRevealed=true;

  roleConfirmation();

}

/* =====================================================

   役職確認終了

===================================================== */

function finishRoleConfirmation(){

  game.confirmRevealed=false;

}
  /* =====================================================
   役職確認用情報
===================================================== */

function roleInfoFor(player){

  let info="";

  /* ===================================================
     人狼系の仲間確認
  =================================================== */

  if(isWolfRole(player.role)){

    const wolves=
      game.players.filter(
        x=>
          isWolfRole(x.role) &&
          x.id!==player.id
      );

    if(wolves.length){

      info+=`

      <div class="success">

        <strong>
          🐺 あなたが知っている人狼
        </strong>

        <p>

          ${wolves
            .map(wolfDisplayName)
            .join("・")}

        </p>

      </div>

      `;

    }

  }


  /* ===================================================
     内通者
  =================================================== */

  if(player.role==="内通者"){

    const wolves=
      game.players.filter(
        x=>isWolfRole(x.role)
      );

    info+=`

    <div class="success">

      <strong>📨 人狼</strong>

      <p>

        ${
          wolves.length
          ? wolves.map(wolfDisplayName).join("・")
          : "なし"
        }

      </p>

      <p class="small">

        人狼の子ども・一匹狼も

        「人狼」として表示されます。

      </p>

    </div>

    `;

  }


  /* ===================================================
     裏切りの共有者
  =================================================== */

  if(
    player.role==="裏切りの共有者"
  ){

    const mates=
      game.players.filter(
        x=>
          x.role==="裏切りの共有者" &&
          x.id!==player.id
      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>
          🤝 裏切りの共有者
        </strong>

        <p>

          ${mates
            .map(
              x=>escapeHTML(x.name)
            )
            .join("・")}

        </p>

      </div>

      `;

    }

  }


  /* ===================================================
     共有者
  =================================================== */

  if(player.role==="共有者"){

    const mates=
      game.players.filter(
        x=>
          x.role==="共有者" &&
          x.id!==player.id
      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>
          🤝 共有者
        </strong>

        <p>

          ${mates
            .map(
              x=>escapeHTML(x.name)
            )
            .join("・")}

        </p>

      </div>

      `;

    }

  }


  /* ===================================================
     恋人
  =================================================== */

  if(player.role==="恋人"){

    const pair=
      game.loverPairs.find(
        pair=>pair.includes(player.id)
      );

    if(pair){

      const mate=
        game.players.find(
          x=>
            x.id===
            pair.find(
              id=>id!==player.id
            )
        );

      if(mate){

        info+=`

        <div class="success">

          <strong>
            ❤️ 恋人
          </strong>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        </div>

        `;

      }

    }

  }


  /* ===================================================
     神様
  =================================================== */

  if(player.role==="神様"){

    info+=`

    <div class="success">

      <strong>
        ✨ 全員の役職
      </strong>

      <p>

        ${game.players.map(
          x=>
            `${escapeHTML(x.name)}：
             ${escapeHTML(x.role)}`
        ).join("<br>")}

      </p>

    </div>

    `;

  }


  /* ===================================================
     予言者
     初日の占いは「ここ」で確認する
  =================================================== */

  if(player.role==="予言者"){

    info+=`

    <div class="warning">

      🔮 初日の予言

      <br>

      <strong>

        ${
          game.firstSeer
          ? "このゲームでは初日の占いをします。"
          : "このゲームでは初日の占いをしません。"
        }

      </strong>

    </div>

    `;

  }


  return info;

}

   最初の昼
===================================================== */

function startFirstDay(){

  clearInterval(game.timer);

  game.day=1;

  game.night=0;

  game.firstDay=true;

  game.discussionEnded=false;

  speak(
    "役職の確認が終わりました。みなさん目を覚ましてください。お昼です。議論スタート。"
  );

    ()=>{

    },

  );

}


/* =====================================================
   議論開始
===================================================== */

function startDiscussion(firstDay=false){

  clearInterval(
    game.discussionTimer
  );

  game.discussionEnded=false;

  let remain=
    game.discussionTime;

  render(`

  <div class="card">

    <h2>

      ☀️ ${game.day}日目・昼

    </h2>

    <div
      class="timer"
      id="discussionTimer"
    >

      ${formatTime(remain)}

    </div>

    <div class="big">

      💬 議論スタート

    </div>

    <p style="text-align:center">

      生存者で話し合ってください。

    </p>

    <hr>

    <p class="small">

      議論を途中で終了する場合は

      下のボタンを押してください。

    </p>

    <button
      class="orange"
      onclick="endDiscussion()"
    >

      🛑 議論を終了する

    </button>

  </div>

  `);


  game.discussionTimer=
    setInterval(
      ()=>{

        remain--;

        const el=
          document.getElementById(
            "discussionTimer"
          );

        if(el){

          el.textContent=
            formatTime(
              Math.max(0,remain)
            );

        }

        if(remain<=0){

          clearInterval(
            game.discussionTimer
          );

          game.discussionEnded=true;

          speak(
            "議論時間が終了しました。投票を開始します。"
          );

          startVote();

        }

      },
      1000
    );

}


/* =====================================================
   議論途中終了
===================================================== */

function endDiscussion(){

  if(game.discussionEnded){

    return;

  }

  game.discussionEnded=true;

  clearInterval(
    game.discussionTimer
  );

  speak(
    "議論を終了します。投票を開始します。"
  );

  startVote();

}


/* =====================================================
   投票開始
===================================================== */

function startVote(){

  clearInterval(
    game.discussionTimer
  );

  game.voteRound=
    game.voteRound||0;

  const voters=
    living();

  if(voters.length<=1){

    game.voteRound=0;

    checkVictory();

    return;

  }

  let index=0;

  const votes={};


  function nextVoter(){

    if(index>=voters.length){

      finishVote(votes);

      return;

    }

    const voter=
      voters[index++];

    const targets=
      voters.filter(
        p=>p.id!==voter.id
      );


    render(`

    <div class="card">

      <div class="progress">

        投票 ${index} / ${voters.length}

      </div>

      <h2>

        🗳️

        ${escapeHTML(voter.name)}さん

      </h2>

      <p>

        投票する人を1人選んでください。

      </p>

      <p class="small">

        投票先は他の人には表示されません。

      </p>

      ${targets.map(
        target=>`

        <button
          class="name-button"
          onclick="castCurrentVote(${target.id})"
        >

          ${escapeHTML(target.name)}

        </button>

      `
      ).join("")}

    </div>

    `);


    window.castCurrentVote=
      function(id){

        const target=
          getPlayer(id);

        if(!target){

          return;

        }

        const value=
          voter.role==="王様"
          ? 2
          : 1;

        votes[id]=
          (votes[id]||0)+value;

        nextVoter();

      };

  }

  nextVoter();

}


/* =====================================================
   投票結果
===================================================== */

function finishVote(votes){

  const ids=
    Object.keys(votes);

  if(!ids.length){

    game.voteRound=0;

    afterNoVote();

    return;

  }

  const max=
    Math.max(
      ...Object.values(votes)
    );

  const winners=
    ids.filter(
      id=>votes[id]===max
    );


  /* ===================================================
     同票 → 決選投票
  =================================================== */

  if(winners.length>1){

    if(game.voteRound===0){

      game.voteRound=1;

      const names=
        winners.map(
          id=>
            escapeHTML(
              getPlayer(id).name
            )
        );


      speak(
        `同票です。${names.join("、")}さんで決選投票を行います。`
      );


      render(`

      <div class="card">

        <div class="vote-result">

          ⚖️ 同票です

        </div>

        <p style="text-align:center">

          ${names.join("、")}さんで

          決選投票を行います。

        </p>

      </div>

      <button
        class="orange"
        onclick='startDecisionVote(${JSON.stringify(winners)})'
      >

        ⚖️ 決選投票へ

      </button>

      `);

      return;

    }


    /* =================================================
       決選投票も同票
    ================================================= */

    game.voteRound=0;

    speak(
      "決選投票も同票でした。今回は追放なしです。"
    );

    render(`

    <div class="card">

      <div class="vote-result">

        ⚖️ 決選投票も同票

      </div>

      <p style="text-align:center">

        今回は追放なしです。

      </p>

    </div>

    <button
      class="blue"
      onclick="afterNoVote()"
    >

      次へ

    </button>

    `);

    return;

  }


  game.voteRound=0;

  const target=
    getPlayer(winners[0]);

  if(!target){

    afterNoVote();

    return;

  }

  target.alive=false;

  game.lastExiled=
    target.id;

  showExileResult(target);

}

/* =====================================================
   決選投票
===================================================== */

function startDecisionVote(candidateIds){

  const candidates=
    candidateIds
      .map(id=>getPlayer(id))
      .filter(Boolean);

  const voters=
    living();

  let index=0;

  const votes={};


  function nextVoter(){

    if(index>=voters.length){

      finishDecisionVote(
        votes,
        candidates
      );

      return;

    }

    const voter=
      voters[index++];

    render(`

    <div class="card">

      <div class="progress">

        ⚖️ 決選投票

        ${index} / ${voters.length}

      </div>

      <h2>

        ${escapeHTML(voter.name)}さん

      </h2>

      <p>

        この中から1人を選んでください。

      </p>

      <p class="small">

        投票先は他の人には見せないでください。

      </p>

      ${candidates.map(
        p=>`

        <button
          class="name-button"
          onclick="castDecisionVote(${p.id})"
        >

          ${escapeHTML(p.name)}

        </button>

      `
      ).join("")}

    </div>

    `);


    window.castDecisionVote=
      function(id){

        const value=
          voter.role==="王様"
          ? 2
          : 1;

        votes[id]=
          (votes[id]||0)+value;

        nextVoter();

      };

  }

  nextVoter();

}


/* =====================================================
   決選投票結果
===================================================== */

function finishDecisionVote(
  votes,
  candidates
){

  const values=
    Object.values(votes);

  if(!values.length){

    game.voteRound=0;

    afterNoVote();

    return;

  }

  const max=
    Math.max(...values);

  const winners=
    candidates.filter(
      p=>votes[p.id]===max
    );


  if(winners.length>1){

    game.voteRound=0;

    speak(
      "決選投票も同票でした。今回は追放なしです。"
    );

    render(`

    <div class="card">

      <div class="vote-result">

        ⚖️ 決選投票も同票

      </div>

      <p style="text-align:center">

        今回は追放なしです。

      </p>

    </div>

    <button
      class="blue"
      onclick="afterNoVote()"
    >

      次へ

    </button>

    `);

    return;

  }


  game.voteRound=0;

  const target=
    winners[0];

  if(!target){

    afterNoVote();

    return;

  }

  target.alive=false;

  game.lastExiled=
    target.id;

  showExileResult(target);

}

/* =====================================================
   ハンター
===================================================== */

function hunterAction(hunter){

  speak(
    "ハンターの方、道連れにする人を選んでください。"
  );

  const targets=
    living();

  render(`

  <div class="card">

    <h2>🏹 ハンター</h2>

    <div class="wake">

      🚨 能力発動

    </div>

    <p style="text-align:center">

      道連れにする人を1人選んでください。

    </p>

    ${targets.map(
      p=>`

      <button
        class="name-button"
        onclick="hunterPick(${p.id})"
      >

        ${escapeHTML(p.name)}

      </button>

    `
    ).join("")}

  </div>

  `);


  window.hunterPick=
    function(id){

      const target=
        getPlayer(id);

      if(
        !target ||
        !target.alive
      ){

        return;

      }

      target.alive=false;


      /* =================================================
         恋人の道連れ
      ================================================= */

      const pairs=
        game.loverPairs.filter(
          pair=>
            pair.includes(target.id)
        );


      pairs.forEach(
        pair=>{

          pair.forEach(
            pid=>{

              if(
                pid!==target.id
              ){

                const p=
                  getPlayer(pid);

                if(
                  p &&
                  p.alive
                ){

                  p.alive=false;

                }

              }

            }
          );

        }
      );


      render(`

      <div class="card">

        <div class="vote-result">

          🏹

          ${escapeHTML(target.name)}さんが

          道連れになりました。

        </div>

      </div>

      `);


      setTimeout(
        ()=>{

          if(checkVictory()){

            return;

          }

          goToNightAfterVote();

        },
        1000
      );

    };

}


/* =====================================================
   夜開始
===================================================== */

function nextNight(){

  if(checkVictory()){

    return;

  }

  game.night++;

  game.firstDay=false;

  startNight();

}


/* =====================================================
   夜初期化
===================================================== */

function startNight(){

  game.nightIndex=0;

  resetNightActions();


  game.players.forEach(
    p=>{
      p.blocked=false;
    }
  );


  game.blockedRoles={};

  game.convertedThisNight=[];

  game.nightDeaths=[];

  game.trapActive=false;

  game.trapOwner=null;

  game.trapTarget=null;

  nightStep();

}


/* =====================================================
   夜の行動リセット
===================================================== */

function resetNightActions(){

  game.wolfTarget=null;

  game.raiderTarget=null;

  game.guardTarget=null;

  game.knightTarget=null;

  game.trapTarget=null;

  game.magicTarget=null;

  game.counselTarget=null;

}
  /* =====================================================

   死亡処理

===================================================== */

function killPlayer(player){

  if(

    !player ||

    !player.alive

  ){

    return false;

  }

  /*

    タフガイは最初の襲撃では

    その夜に死亡しない。

  */

  if(

    player.role==="タフガイ" &&

    !player.toughHit

  ){

    player.toughHit=true;

    if(

      !game.toughPending.includes(

        player.id

      )

    ){

      game.toughPending.push(

        player.id

      );

    }

    return false;

  }

  player.alive=false;

  return true;

}

/* =====================================================

   タフガイ翌日死亡処理

===================================================== */

function processToughPending(){

  if(

    !game.toughPending ||

    !game.toughPending.length

  ){

    return;

  }

  game.toughPending.forEach(

    id=>{

      const p=

        getPlayer(id);

      if(

        p &&

        p.alive &&

        p.toughHit

      ){

        p.alive=false;

      }

    }

  );

  game.toughPending=[];

}

/* =====================================================

   夜の襲撃処理

===================================================== */

function resolveNightDeaths(){

  /*

    人狼の襲撃先。

    奇術師が使用されていれば

    襲撃先を変更する。

  */

  let wolfTarget=

    game.wolfTarget;

  if(

    game.magicUsed &&

    game.magicTarget!==null

  ){

    wolfTarget=

      game.magicTarget;

  }

  const deaths=[];

  /*

    人狼の襲撃

  */

  if(

    wolfTarget!==null &&

    wolfTarget!==undefined

  ){

    const target=

      getPlayer(wolfTarget);

    if(

      target &&

      target.alive

    ){

      /*

        ボディーガードが守っている。

      */

      if(

        game.guardTarget===target.id

      ){

        /* 守られる */

      }

      /*

        騎士団が守っている。

      */

      else if(

        game.knightTarget===target.id

      ){

        /* 守られる */

      }

      /*

        罠師の罠。

      */

      else if(

        game.trapActive &&

        game.trapTarget===target.id

      ){

        /*

          ボディーガードには罠が効かない。

          それ以外の場合、

          人狼側からランダムに1人死亡。

        */

        if(

          target.role==="ボディーガード"

        ){

          if(

            killPlayer(target)

          ){

            deaths.push(target);

          }

        }

        else{

          const wolves=

            living().filter(

              p=>isWolfRole(p.role)

            );

          if(wolves.length){

            const deadWolf=

              wolves[

                Math.floor(

                  Math.random()*

                  wolves.length

                )

              ];

            if(

              killPlayer(deadWolf)

            ){

              deaths.push(deadWolf);

            }

          }

        }

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    裏切りの襲撃者による襲撃。

  */

  if(

    game.raiderTarget!==null &&

    game.raiderTarget!==undefined

  ){

    const target=

      getPlayer(game.raiderTarget);

    if(

      target &&

      target.alive

    ){

      if(

        game.guardTarget===target.id ||

        game.knightTarget===target.id

      ){

        /* 守られる */

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    重複死亡を整理。

  */

  const uniqueDeaths=[];

  deaths.forEach(

    p=>{

      if(

        !uniqueDeaths.some(

          x=>x.id===p.id

        )

      ){

        uniqueDeaths.push(p);

      }

    }

  );

  return uniqueDeaths;

}

/* =====================================================

   恋人の道連れ

===================================================== */

function resolveLoverDeaths(deaths){

  const result=[

    ...deaths

  ];

  deaths.forEach(

    dead=>{

      const pair=

        game.loverPairs.find(

          pair=>pair.includes(dead.id)

        );

      if(!pair){

        return;

      }

      pair.forEach(

        id=>{

          if(id===dead.id){

            return;

          }

          const lover=

            getPlayer(id);

          if(

            lover &&

            lover.alive

          ){

            lover.alive=false;

            if(

              !result.some(

                p=>p.id===lover.id

              )

            ){

              result.push(lover);

            }

          }

        }

      );

    }

  );

  return result;

}
  /* =====================================================
   朝
===================================================== */

function morning(){

  /*
    タフガイの翌日死亡を処理。
  */

  processToughPending();

  /*
    夜の死亡者を処理。
  */

  let deaths=
    resolveNightDeaths();

  /*
    恋人の道連れ。
  */

  deaths=
    resolveLoverDeaths(deaths);

  /*
    朝の結果表示。

    死亡理由は公開しない。
  */

  showMorning(deaths);

}

/* =====================================================
   朝の表示
===================================================== */

function showMorning(deaths){

  const names=
    deaths.map(
      p=>escapeHTML(p.name)
    );

  let text=
    "朝になりました。みなさん目を覚ましてください。";

  if(names.length){

    text+=
      `残念ながら${names.join("、")}さんが亡くなってしまいました。`;

  }
  else{

    text+=
      "昨夜は誰も亡くなりませんでした。";

  }

  text+=
    "お昼です。議論スタート。";

  speak(text);

  render(`

  <div class="card">

    <div class="big">

      ☀️ 朝になりました

    </div>

    <p style="text-align:center">

      みなさん目を覚ましてください。

    </p>

    ${
      names.length
      ? `

        <div class="vote-result">

          残念ながら<br>

          ${names.join("、")}さんが

          亡くなってしまいました。

        </div>

      `
      : `

        <div class="success">

          昨夜は誰も亡くなりませんでした。

        </div>

      `
    }

    <p class="small">

      ※死亡した理由は公開しません。

    </p>

  </div>

  <button
    class="blue"
    onclick="beginDayAfterMorning()"
  >

    ☀️ お昼の議論へ

  </button>

  `);

}

/* =====================================================
   朝 → 昼
===================================================== */

function beginDayAfterMorning(){

  if(checkVictory()){

    return;

  }

  game.day++;

  startDiscussion(false);

}

/* =====================================================
   勝敗判定
===================================================== */

function checkVictory(){

  const alive=
    living();

  const wolves=
    alive.filter(
      p=>isWolfRole(p.role)
    );

  const humans=
    alive.filter(
      p=>!isWolfRole(p.role)
    );

  /*
    人狼が0人
  */

  if(wolves.length===0){

    return showVictory(

      "市民陣営の勝利！",

      "人狼が全員いなくなりました。"

    );

  }

  /*
    人狼の人数が
    人狼以外と同数以上になった場合。
  */

  if(
    wolves.length>=humans.length
  ){

    return showVictory(

      "人狼陣営の勝利！",

      "人狼が生存者を上回りました。"

    );

  }

  return false;

}

/* =====================================================
   勝利画面
===================================================== */

function showVictory(title,message){

  clearInterval(
    game.discussionTimer
  );

  if(game.timer){

    clearInterval(game.timer);

  }

  speak(
    `${title}${message}`
  );

  render(`

  <div class="card">

    <div class="big">

      🏆 ${title}

    </div>

    <p style="text-align:center">

      ${message}

    </p>

  </div>

  <button
    class="green"
    onclick="showFinalRoles()"
  >

    📋 最終役職を見る

  </button>

  `);

  return true;

}

/* =====================================================
   最終役職一覧
===================================================== */

function showFinalRoles(){

  render(`

  <div class="card">

    <h2>📋 最終結果</h2>

    ${game.players.map(
      p=>`

      <div class="role-row">

        <span>

          ${escapeHTML(p.name)}

        </span>

        <span>

          ${escapeHTML(p.role)}

          ${
            p.alive
            ? " 🟢"
            : " ⚫"
          }

        </span>

      </div>

    `).join("")}

  </div>

  <button
    class="blue"
    onclick="location.reload()"
  >

    🔄 新しいゲーム

  </button>

  `);

}

/* =====================================================
   補助関数
===================================================== */

/* =====================================================
   最初の画面を表示
===================================================== */

startScreen();

</script>
