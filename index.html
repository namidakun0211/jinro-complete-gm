body {

  font-family: sans-serif;

  background: #f5f5f5;

  margin: 0;

  padding: 20px;

  text-align: center;

}

.container {

  max-width: 650px;

  margin: auto;

  background: white;

  padding: 25px;

  border-radius: 20px;

  box-shadow: 0 4px 15px rgba(0,0,0,0.15);

}

h1 {

  margin-top: 0;

}

h2 {

  margin-top: 25px;

}

input, select, button {

  font-size: 18px;

  padding: 12px;

  margin: 8px;

  border-radius: 10px;

  border: 1px solid #ccc;

}

input {

  width: 80%;

  box-sizing: border-box;

}

button {

  cursor: pointer;

  background: #333;

  color: white;

  border: none;

}

button:hover {

  opacity: 0.85;

}

.hidden {

  display: none;

}

.role {

  font-size: 30px;

  font-weight: bold;

  margin: 25px 0;

}

.info {

  font-size: 18px;

  line-height: 1.7;

}

.role-list {

  text-align: left;

  max-height: 400px;

  overflow-y: auto;

  border: 1px solid #ddd;

  padding: 10px;

  border-radius: 10px;

}

.role-item {

  padding: 8px;

  border-bottom: 1px solid #eee;

}

.role-item label {

  display: flex;

  align-items: center;

  gap: 8px;

}

.role-item input {

  width: auto;

  margin: 0;

}

.player-box {

  margin: 15px 0;

}

.small {

  font-size: 14px;

  color: #666;

}

.danger {

  color: #c00;

  font-weight: bold;

}

.success {

  color: #080;

  font-weight: bold;

}

</style>

<div id="roleList" class="role-list"></div>

<br>

<button onclick="preparePlayers()">

<!-- ==================== -->

<!-- ==================== -->

<button onclick="startGame()">

<!-- ==================== -->

<!-- ==================== -->

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

役職を見るボタンを押してください。

<button id="mainButton" onclick="showRole()">

役職を見る

<!-- ==================== -->

<button onclick="startNight()">

/* ==================================================

   ゲーム状態

================================================== */

let players = [];

let selectedRoles = [];

let currentPlayer = 0;

let loverMode = false;

/* ==================================================

   役職一覧を表示

================================================== */

function renderRoleList() {

  const list = document.getElementById("roleList");

  list.innerHTML = "";

  ROLES.forEach(role => {

    const div = document.createElement("div");

    div.className = "role-item";

    div.innerHTML = `

      <label>

        <input

          type="checkbox"

          value="${role.id}"

          onchange="updateSelectedRoles()"

        >

        ${role.name}

      </label>

    `;

    list.appendChild(div);

  });

}

/* ==================================================

   選択された役職を取得

================================================== */

function updateSelectedRoles() {

  selectedRoles = Array.from(

    document.querySelectorAll(

      '#roleList input[type="checkbox"]:checked'

    )

  ).map(input => input.value);

}

/* ==================================================

   プレイヤー名入力画面

================================================== */

function preparePlayers() {

  const count =

    Number(document.getElementById("playerCount").value);

  updateSelectedRoles();

  if (count < 4 || count > 20) {

    alert("4人〜20人で入力してください");

    return;

  }

  if (selectedRoles.length !== count) {

    alert(

      `参加人数は${count}人です。\n` +

      `役職も${count}個選択してください。`

    );

    return;

  }

  loverMode =

    document.querySelector(

      'input[name="loverMode"]:checked'

    ).value === "true";

  const area =

    document.getElementById("playerInputs");

  area.innerHTML = "";

  for (let i = 0; i < count; i++) {

    const oldName =

      localStorage.getItem("jinroPlayer" + i) || "";

    area.innerHTML += `

      <div class="player-box">

        <label>

          プレイヤー${i + 1}

        </label>

        <br>

        <input

          id="playerName${i}"

          type="text"

          maxlength="20"

          placeholder="名前を入力"

          value="${escapeHtml(oldName)}"

        >

      </div>

    `;

  }

  document.getElementById("setup")

    .classList.add("hidden");

  document.getElementById("playerSetup")

    .classList.remove("hidden");

}

/* ==================================================

   HTMLエスケープ

================================================== */

function escapeHtml(text) {

  return text

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

/* ==================================================

   ゲーム開始

================================================== */

function startGame() {

  const count = selectedRoles.length;

  const names = [];

  for (let i = 0; i < count; i++) {

    const input =

      document.getElementById("playerName" + i);

    const name =

      input.value.trim();

    if (!name) {

      alert(

        `プレイヤー${i + 1}の名前を入力してください。`

      );

      input.focus();

      return;

    }

    names.push(name);

    localStorage.setItem(

      "jinroPlayer" + i,

      name

    );

  }

  /*

   * 役職をシャッフル

   */

  const shuffledRoles =

    [...selectedRoles]

      .sort(() => Math.random() - 0.5);

  players = names.map((name, index) => {

    const roleId = shuffledRoles[index];

    const role =

      ROLES.find(r => r.id === roleId);

    return {

      id: index,

      name: name,

      roleId: roleId,

      role: role,

      alive: true,

      revealed: false,

      lover: null,

      copiedRole: null,

      cursedAwakened: false,

      abilitiesUsed: {},

      lastTrapTarget: null

    };

  });

  currentPlayer = 0;

  document.getElementById("playerSetup")

    .classList.add("hidden");

  document.getElementById("game")

    .classList.remove("hidden");

  showPlayer();

}

/* ==================================================

   プレイヤーごとの役職確認

================================================== */

function showPlayer() {

  const player =

    players[currentPlayer];

  document.getElementById("playerTitle")

    .textContent =

    player.name + " さん";

  document.getElementById("roleArea")

    .textContent = "？？？";

  document.getElementById("info")

    .textContent =

    "役職を見るボタンを押してください。";

  const button =

    document.getElementById("mainButton");

  button.textContent =

    "役職を見る";

  button.onclick =

    showRole;

}

/* ==================================================

   役職を見る

================================================== */

function showRole() {

  const player =

    players[currentPlayer];

  document.getElementById("roleArea")

    .textContent =

    player.role.name;

  document.getElementById("info")

    .textContent =

    getRoleDescription(player);

  const button =

    document.getElementById("mainButton");

  button.textContent =

    "次の人";

  button.onclick =

    nextPlayer;

}

/* ==================================================

   次のプレイヤー

================================================== */

function nextPlayer() {

  currentPlayer++;

  if (currentPlayer >= players.length) {

    document.getElementById("game")

      .classList.add("hidden");

    document.getElementById("gameReady")

      .classList.remove("hidden");

    return;

  }

  showPlayer();

}

/* ==================================================

   夜開始

================================================== */

function startNight() {

  alert(

    "🌙 夜の処理システムは次の段階で実装します。\n\n" +

    "今回決めた13段階の順番に沿って追加していきます。"

  );

}
