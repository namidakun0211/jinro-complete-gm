<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<div id="app"></div>

</div>

<script>

/* =====================================================

   役職

===================================================== */

const ROLES=[

"人狼",

"人狼の子ども",

"裏切り者",

"裏切りの共有者",

"内通者",

"裏切りの襲撃者",

"スパイ",

"市民",

"予言者",

"ボディーガード",

"霊媒師",

"ハンター",

"共有者",

"独裁者",

"タフガイ",

"カウンセラー",

"奇術師",

"罠師",

"騎士団",

"影武者",

"王様",

"妖狐",

"神様",

"恋人",

"一匹狼",

"アンドロイド",

"案山子",

"呪われた者"

];

/* 人狼として扱う役職 */

const WOLF_ROLES=[

"人狼",

"人狼の子ども",

"一匹狼"

];

/* 裏切り者系 */

const BETRAYER_ROLES=[

"裏切り者",

"裏切りの共有者",

"内通者",

"裏切りの襲撃者"

];

/* 夜の順番 */

const NIGHT_ORDER=[

"呪われた者",

"スパイ",

"アンドロイド",

"罠師",

"ボディーガード",

"騎士団",

"人狼",

"裏切りの襲撃者",

"カウンセラー",

"裏切り者確認",

"奇術師",

"予言者",

"霊媒師"

];

/* =====================================================

   ゲームデータ

===================================================== */

let game={

  players:[],

  roleCount:{},

  night:1,

  day:1,

  confirmIndex:0,

  nightIndex:0,

  firstSeer:true,

  discussionTime:300,

  discussionTimer:null,

  discussionEnded:false,

  lastExiled:null,

  lastGuard:null,

  lastTrap:null,

  wolfTarget:null,

  raiderTarget:null,

  guardTarget:null,

  knightTarget:null,

  trapTarget:null,

  magicTarget:null,

  magicUsed:false,

  counselTarget:null,

  android:{},

  dictatorUsed:false,

  shadowUsed:false,

  voteRound:0,

  toughPending:[],

  loverPairs:[],

  loverIds:[],

  currentVotes:{}

};

const app=document.getElementById("app");

/* =====================================================

   共通

===================================================== */

function escapeHTML(text){

  return String(text).replace(/[&<>"']/g,function(c){

    return {

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[c];

  });

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=

      new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(p=>p.alive);

}

function rolePlayers(role){

  return game.players.filter(p=>

    p.role===role

  );

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function formatTime(sec){

  let m=Math.floor(sec/60);

  let s=sec%60;

  return m+":"+String(s).padStart(2,"0");

}

/* =====================================================

   ゲーム開始画面

===================================================== */

function startScreen(){

  render(`

  <div class="card">

    <h2>🎮 ゲーム設定</h2>

    <p>

      人数　

      <select id="playerCount">

        ${Array.from(

          {length:17},

          (_,i)=>

          `<option value="${i+4}">

            ${i+4}人

          </option>`

        ).join("")}

      </select>

    </p>

    <p>

      🔮 初日の予言　

      <select id="firstSeer">

        <option value="yes">

          する

        </option>

        <option value="no">

          しない

        </option>

      </select>

    </p>

    <p>

      ⏱️ 議論時間　

      <select id="discussion">

        <option value="180">

          3分

        </option>

        <option value="300" selected>

          5分

        </option>

        <option value="600">

          10分

        </option>

      </select>

    </p>

  </div>

  <div class="card">

    <h2>🎴 役職選択</h2>

    <p class="small">

      プレイヤー人数と役職カード枚数を合わせてください。

    </p>

    <div id="roleList">

      ${ROLES.map((role,index)=>`

        <div class="role-row">

          <span>

            ${role}

          </span>

          <span>

            <button

              onclick="changeRole('${role}',-1)"

            >

              −

            </button>

            <span

              class="count"

              id="count${index}"

            >

              0

            </span>

            <button

              onclick="changeRole('${role}',1)"

            >

              ＋

            </button>

          </span>

        </div>

      `).join("")}

    </div>

  </div>

  <button

    class="green"

    onclick="nameScreen()"

  >

    👤 プレイヤー名入力へ

  </button>

  `);

}

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  /* 騎士団 2～3枚 */

  if(role==="騎士団" && value>3){

    value=3;

  }

  /* 案山子 1～3枚 */

  if(role==="案山子" && value>3){

    value=3;

  }

  /* 恋人 2枚単位 */

  if(role==="恋人" && value>2){

    value=2;

  }

  /* 共有者 2枚 */

  if(role==="共有者" && value>2){

    value=2;

  }

  /* 裏切りの共有者 2枚 */

  if(role==="裏切りの共有者" && value>2){

    value=2;

  }

  game.roleCount[role]=value;

  let index=

    ROLES.indexOf(role);

  let el=

    document.getElementById(

      "count"+index

    );

  if(el){

    el.textContent=value;

  }

}

/* =====================================================

   名前入力

===================================================== */

function nameScreen(){

  let n=

    Number(

      document.getElementById(

        "playerCount"

      ).value

    );

  let saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      )||"[]"

    );

  game.players=[];

  for(let i=0;i<n;i++){

    game.players.push({

      id:i,

      name:

        saved[i]||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      blocked:false,

      cursedWolf:false,

      toughHit:false,

      androidSource:null

    });

  }

  game.firstSeer=

    document.getElementById(

      "firstSeer"

    ).value==="yes";

  game.discussionTime=

    Number(

      document.getElementById(

        "discussion"

      ).value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small">

      前回の名前があれば自動で入ります。

    </p>

    ${game.players.map((p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="

          width:90%;

          margin:6px;

        "

      >

    `).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🎴 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach((p,i)=>{

    let name=

      document

      .getElementById(

        "playerName"+i

      )

      .value

      .trim();

    p.name=

      name||

      `プレイヤー${i+1}`;

  });

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  if(

    deck.length!==game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `人数と役職枚数を合わせてください。`

    );

    return;

  }

  /* 役職をシャッフル */

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach(

    (p,i)=>{

      p.role=deck[i];

      p.alive=true;

      p.blocked=false;

      p.cursedWolf=false;

      p.toughHit=false;

      p.androidSource=null;

    }

  );

  preparePairs();

  game.confirmIndex=0;

  roleConfirmation();

}

/* =====================================================

   恋人ペア作成

===================================================== */

function preparePairs(){

  game.loverPairs=[];

  game.loverIds=[];

  let lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(lovers[i+1]){

      let pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(pair);

      game.loverIds.push(

        ...pair

      );

    }

  }

}

/* =====================================================

   起動

===================================================== */

startScreen();

/* =====================================================

   役職確認

===================================================== */

function roleConfirmation(){

  if(game.confirmIndex>=game.players.length){

    /* 全員の役職確認終了

       → 夜ではなく最初の昼へ */

    startFirstDay();

    return;

  }

  let p=

    game.players[game.confirmIndex];

  let number=

    game.confirmIndex+1;

  let total=

    game.players.length;

  let info="";

  /* =================================================

     人狼の仲間表示

     人狼

     人狼の子ども

     一匹狼

     は、すべて「人狼」として表示

  ================================================= */

  if(WOLF_ROLES.includes(p.role)){

    let wolves=

      game.players.filter(x=>

        WOLF_ROLES.includes(x.role) &&

        x.id!==p.id

      );

    if(wolves.length){

      info+=`

        <hr>

        <p>

          🐺 あなたの仲間の人狼

        </p>

        <p>

          ${wolves.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* =================================================

     裏切りの共有者

     2枚セットでお互いを知る

  ================================================= */

  if(p.role==="裏切りの共有者"){

    let mates=

      game.players.filter(x=>

        x.role==="裏切りの共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <hr>

        <p>

          😈 裏切りの共有者

        </p>

        <p>

          ${mates.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* =================================================

     内通者

     人狼が誰かを知る

     一匹狼・人狼の子どもも

     「人狼」として表示

  ================================================= */

  if(p.role==="内通者"){

    let wolves=

      game.players.filter(x=>

        WOLF_ROLES.includes(x.role)

      );

    info+=`

      <hr>

      <p>

        🐺 人狼

      </p>

      <p>

        ${

          wolves.length

          ?

          wolves.map(x=>

            escapeHTML(x.name)

          ).join("・")

          :

          "なし"

        }

      </p>

    `;

  }

  /* =================================================

     共有者

  ================================================= */

  if(p.role==="共有者"){

    let mates=

      game.players.filter(x=>

        x.role==="共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <hr>

        <p>

          🤝 共有者

        </p>

        <p>

          ${mates.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* =================================================

     恋人

     同じペアだけがお互いを知る

  ================================================= */

  if(p.role==="恋人"){

    let pair=

      game.loverPairs.find(pair=>

        pair.includes(p.id)

      );

    if(pair){

      let mateId=

        pair.find(id=>id!==p.id);

      let mate=

        game.players.find(x=>

          x.id===mateId

        );

      if(mate){

        info+=`

          <hr>

          <p>

            ❤️ あなたの恋人

          </p>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        `;

      }

    }

  }

  /* =================================================

     神様

     全員の役職を確認できる

  ================================================= */

  if(p.role==="神様"){

    info+=`

      <hr>

      <p>

        ✨ 全員の役職

      </p>

      <p>

        ${game.players.map(x=>`

          ${escapeHTML(x.name)}

          ：

          ${escapeHTML(x.role)}

          <br>

        `).join("")}

      </p>

    `;

  }

  /* =================================================

     初日の予言設定

     予言者本人にだけ表示

  ================================================= */

  if(p.role==="予言者"){

    info+=`

      <hr>

      <p>

        🔮 初日の占い

      </p>

      <p>

        ${

          game.firstSeer

          ?

          "初日の占いを行います。"

          :

          "初日の占いは行いません。"

        }

      </p>

    `;

  }

  /* =================================================

     アンドロイド

     役職確認時にコピー対象を選ぶ

  ================================================= */

  if(p.role==="アンドロイド"){

    render(`

      <div class="progress">

        役職確認 ${number}/${total}

      </div>

      <div class="card private">

        <h2>

          🤖 ${escapeHTML(p.name)}さん

        </h2>

        <p>

          他の人には見せないでください。

        </p>

        <div

          class="big"

          style="cursor:pointer"

          onclick="showAndroidRole()"

        >

          ？？？

        </div>

        <div id="roleArea"></div>

      </div>

    `);

    return;

  }

  /* =================================================

     通常の役職確認

  ================================================= */

  render(`

    <div class="progress">

      役職確認 ${number}/${total}

    </div>

    <div class="card private">

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <p>

        他の人には見せないでください。

      </p>

      <div

        class="big"

        style="

          cursor:pointer;

          margin:25px 0;

        "

        onclick="showRole()"

      >

        ？？？

      </div>

      <div id="roleArea"></div>

    </div>

    <button

      id="nextRoleButton"

      class="green"

      style="display:none"

      onclick="nextRoleConfirmation()"

    >

      次へ

    </button>

  `);

}

/* =====================================================

   ？？？をタップ

===================================================== */

  /* 人狼 */

  if(WOLF_ROLES.includes(p.role)){

    let wolves=

      game.players.filter(x=>

        WOLF_ROLES.includes(x.role) &&

        x.id!==p.id

      );

    if(wolves.length){

      info+=`

        <hr>

        <p>

          🐺 仲間の人狼

        </p>

        <p>

          ${wolves.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* 裏切りの共有者 */

  if(p.role==="裏切りの共有者"){

    let mates=

      game.players.filter(x=>

        x.role==="裏切りの共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <hr>

        <p>

          😈 裏切りの共有者

        </p>

        <p>

          ${mates.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* 内通者 */

  if(p.role==="内通者"){

    let wolves=

      game.players.filter(x=>

        WOLF_ROLES.includes(x.role)

      );

    info+=`

      <hr>

      <p>

        🐺 人狼

      </p>

      <p>

        ${

          wolves.length

          ?

          wolves.map(x=>

            escapeHTML(x.name)

          ).join("・")

          :

          "なし"

        }

      </p>

    `;

  }

  /* 共有者 */

  if(p.role==="共有者"){

    let mates=

      game.players.filter(x=>

        x.role==="共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <hr>

        <p>

          🤝 共有者

        </p>

        <p>

          ${mates.map(x=>

            escapeHTML(x.name)

          ).join("・")}

        </p>

      `;

    }

  }

  /* 恋人 */

  if(p.role==="恋人"){

    let pair=

      game.loverPairs.find(pair=>

        pair.includes(p.id)

      );

    if(pair){

      let mateId=

        pair.find(id=>id!==p.id);

      let mate=

        game.players.find(x=>

          x.id===mateId

        );

      if(mate){

        info+=`

          <hr>

          <p>

            ❤️ 恋人

          </p>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        `;

    }

  }

  if(p.role==="神様"){

    info+=`

      <hr>

      <p>

        ✨ 全員の役職

      </p>

      <p>

        ${game.players.map(x=>`

          ${escapeHTML(x.name)}

          ：

          ${escapeHTML(x.role)}

          <br>

        `).join("")}

      </p>

    `;

  }

  /* 役職表示 */

  document.getElementById(

    "roleArea"

  ).innerHTML=`

    <div class="big">

      ${escapeHTML(p.role)}

    </div>

    ${info}

  `;

    "nextRoleButton"

/* =====================================================

   アンドロイドの役職確認

===================================================== */

function showAndroidRole(){

  let p=

    game.players[game.confirmIndex];

  let area=

    document.getElementById(

      "roleArea"

    );

  if(!area)return;

  if(game.android[p.id]===undefined){

    area.innerHTML=`

      <div class="big">

        🤖 アンドロイド

      </div>

      <p>

        コピーする人を1人選んでください。

      </p>

      <p class="small">

        選ばれた人にはコピーされたことは

        知らされません。

      </p>

      ${living()

        .filter(x=>x.id!==p.id)

        .map(x=>`

          <button

            onclick="androidConfirmPick(${x.id})"

          >

            ${escapeHTML(x.name)}

          </button>

        `).join("")

      }

    `;

    return;

  }

  let source=

    game.players[

      game.android[p.id]

    ];

  if(!source)return;

  area.innerHTML=`

    <div class="big">

      🤖 ${escapeHTML(source.role)}

    </div>

    <p>

/* =====================================================

   議論タイマー

===================================================== */

function startDiscussionTimer(){

  clearInterval(

    game.discussionTimer

  );

  let remain=

    game.discussionTime;

  game.discussionEnded=false;

  game.discussionTimer=

    setInterval(()=>{

      if(game.discussionEnded){

        clearInterval(

          game.discussionTimer

        );

        return;

      }

      remain--;

      let timer=

        document.getElementById(

          "timer"

        );

      if(timer){

        timer.textContent=

          formatTime(

            Math.max(0,remain)

          );

      }

      if(remain<=0){

        clearInterval(

          game.discussionTimer

        );

        endDiscussion();

      }

    },1000);

}

function resetNightActions(){

/* =====================================================

   夜の13段階

===================================================== */

function nightStep(){

  if(

    game.nightIndex>=NIGHT_ORDER.length

  ){

    morning();

    return;

  }

  let role=

    NIGHT_ORDER[game.nightIndex];

  game.nightIndex++;

  /* -----------------------------------------------

     「裏切り者確認」は実際の役職ではない

  ------------------------------------------------ */

  if(role==="裏切り者確認"){

    betrayerCheck();

    return;

  }

  let actors=

    rolePlayers(role)

    .filter(p=>p.alive);

  /*

    ゲームに採用されていない役職、

    または死亡している役職者は

    そのまま次へ。

  */

  if(actors.length===0){

    nightStep();

    return;

  }

  let actor=actors[0];

  /* -----------------------------------------------

     各役職の呼び出し

  ------------------------------------------------ */

  if(role==="呪われた者"){

    cursedCheck(actor);

    return;

  }

  if(role==="スパイ"){

    speak(

      "スパイの方、目を覚ましてください。"

    );

    spyAction(actor);

    return;

  }

  if(role==="アンドロイド"){

    speak(

      "アンドロイドの方、目を覚ましてください。"

    );

    androidNightAction(actor);

    return;

  }

  if(role==="罠師"){

    speak(

      "罠師の方、目を覚ましてください。"

    );

    trapAction(actor);

    return;

  }

  if(role==="ボディーガード"){

    speak(

      "ボディーガードの方、目を覚ましてください。"

    );

    bodyguardAction(actor);

    return;

  }

  if(role==="騎士団"){

    speak(

      "騎士団の方、目を覚ましてください。今夜守る人を選んでください。"

    );

    knightAction(actor);

    return;

  }

  if(role==="人狼"){

    speak(

      "人狼の方、目を覚ましてください。今夜の襲撃先を選んでください。"

    );

    wolfAction();

    return;

  }

  if(role==="裏切りの襲撃者"){

    speak(

      "裏切りの襲撃者の方、目を覚ましてください。"

    );

    raiderAction(actor);

    return;

  }

  if(role==="カウンセラー"){

    speak(

      "カウンセラーの方、目を覚ましてください。"

    );

    counselorAction(actor);

    return;

  }

  if(role==="奇術師"){

    speak(

      "奇術師の方、目を覚ましてください。"

    );

    magicAction(actor);

    return;

  }

  if(role==="予言者"){

    /*

      初日の占いをしない設定なら

      初日のみスキップ

    */

    if(

      game.night===1 &&

      !game.firstSeer

    ){

      nightStep();

      return;

    }

    speak(

      "予言者の方、目を覚ましてください。今夜占う人を選んでください。"

    );

    seerAction(actor);

    return;

  }

  if(role==="霊媒師"){

    /*

      追放者がいない夜は

      霊媒結果がないのでスキップ

    */

    if(game.lastExiled===null){

      nightStep();

      return;

    }

    speak(

      "霊媒師の方、目を覚ましてください。"

    );

    mediumAction(actor);

    return;

  }

  nightStep();

}

/* =====================================================

   夜の結果 → 朝

===================================================== */

function morning(){

  let deaths=[];

  /* =================================================

     人狼の襲撃

  ================================================= */

  let wolfTargetId=

    game.magicTarget!==null

    ?

    game.magicTarget

    :

    game.wolfTarget;

  if(wolfTargetId!==null){

    let target=

      game.players[wolfTargetId];

    if(

      target &&

      target.alive

    ){

      /*

        奇術師で変更された場合

        護衛・罠をすべて無視

      */

      let magicForced=

        game.magicTarget!==null;

      let protectedByGuard=

        game.guardTarget===wolfTargetId;

      let protectedByKnight=

        game.knightTarget===wolfTargetId;

      let trapped=

        game.trapTarget===wolfTargetId;

      /* ---------------------------------------------

         奇術師

      --------------------------------------------- */

      if(magicForced){

        if(

          killPlayer(target)

        ){

          deaths.push(

            target.id

          );

        }

      }

      /* ---------------------------------------------

         ボディーガード・騎士団

      --------------------------------------------- */

      else if(

        protectedByGuard ||

        protectedByKnight

      ){

        /*

          襲撃失敗

        */

      }

      /* ---------------------------------------------

         罠

      --------------------------------------------- */

      else if(trapped){

        /*

          ボディーガードには罠が効かない

        */

        if(

          target.role==="ボディーガード"

        ){

          let wolves=

            living().filter(p=>

              p.role==="人狼" ||

              p.role==="人狼の子ども" ||

              p.role==="一匹狼"

            );

          if(wolves.length){

            let deadWolf=

              wolves[

                Math.floor(

                  Math.random()*wolves.length

                )

              ];

            deadWolf.alive=false;

            deaths.push(

              deadWolf.id

            );

          }

        }

        else{

          if(

            killPlayer(target)

          ){

            deaths.push(

              target.id

            );

          }

        }

      }

      /* ---------------------------------------------

         呪われた者

      --------------------------------------------- */

      else if(

        target.role==="呪われた者"

      ){

        /*

          今夜は死なない。

          翌夜から人狼になる。

          その夜の朝には

          「犠牲者なし」。

        */

        target.cursedWolf=true;

        target.cursedChangeNight=

          game.night+1;

      }

      /* ---------------------------------------------

         通常襲撃

      --------------------------------------------- */

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(

            target.id

          );

        }

      }

    }

  }

  /* =================================================

     呪われた者の人狼化

  ================================================= */

  game.players.forEach(p=>{

    if(

      p.alive &&

      p.role==="呪われた者" &&

      p.cursedWolf

    ){

      /*

        人狼化した瞬間から

        人狼陣営。

        ここで役職名も人狼に変更。

      */

      p.role="人狼";

    }

  });

  /* =================================================

     裏切りの襲撃者

  ================================================= */

  if(

    game.raiderTarget!==null

  ){

    let target=

      game.players[

        game.raiderTarget

      ];

    if(

      target &&

      target.alive

    ){

      /*

        罠にかかった場合は死亡。

        ボディーガードでも

        裏切りの襲撃者自身は

        通常の襲撃なので死亡処理。

      */

      if(

        killPlayer(target)

      ){

        deaths.push(

          target.id

        );

      }

    }

  }

  /* =================================================

     カウンセラー

  ================================================= */

  if(

    game.counselTarget!==null

  ){

    let target=

      game.players[

        game.counselTarget

      ];

    if(

      target &&

      target.alive

    ){

      /*

        裏切り者系

        → 市民に更生

      */

      if(

        BETRAYER_ROLES.includes(

          target.role

        )

      ){

        target.role="市民";

      }

      /*

        人狼系

        → カウンセラー死亡

      */

      else if(

        WOLF_ROLES.includes(

          target.role

        )

      ){

        let counselor=

          rolePlayers("カウンセラー")

          .find(p=>p.alive);

        if(counselor){

          counselor.alive=false;

          deaths.push(

            counselor.id

          );

        }

      }

    }

  }

  /* =================================================

     アンドロイド

     コピー対象死亡 → 道連れ

  ================================================= */

  game.players.forEach(p=>{

    if(

      p.alive &&

      p.androidSource!==null

    ){

      let source=

        game.players[

          p.androidSource

        ];

      if(

        source &&

        !source.alive

      ){

        p.alive=false;

        deaths.push(

          p.id

        );

      }

    }

  });

  /* =================================================

     恋人の道連れ

  ================================================= */

  let loverDeaths=[];

  deaths.forEach(id=>{

    game.loverPairs

      .filter(pair=>

        pair.includes(id)

      )

      .forEach(pair=>{

        pair.forEach(pid=>{

          if(pid!==id){

            let p=

              game.players[pid];

            if(p.alive){

              p.alive=false;

              loverDeaths.push(

                pid

              );

            }

          }

        });

      });

  });

  deaths.push(

    ...loverDeaths

  );

  /* =================================================

     タフガイ

     

     襲撃を受けた夜は死なず、

     次の日の夜に死亡。

     

     ただし昼に追放されていた場合は

     次の朝に死亡させない。

  ================================================= */

  if(

    game.toughPending.length

  ){

    game.toughPending

      .forEach(id=>{

        let p=

          game.players[id];

        if(

          p &&

          p.alive

        ){

          /*

            前日の昼に追放されていた場合は

            ここでは死亡させない。

          */

          if(

            game.lastExiled!==id

          ){

            p.alive=false;

            deaths.push(id);

          }

        }

      });

    game.toughPending=[];

  }

  /* =================================================

     重複死亡を整理

  ================================================= */

  deaths=[

    ...new Set(deaths)

  ];

  /* =================================================

     朝のアナウンス

     

     死亡理由は公開しない。

  ================================================= */

  let names=

    deaths.map(id=>

      escapeHTML(

        game.players[id].name

      )

    );

  let message=

    names.length

    ?

    `朝になりました。みなさん目を覚ましてください。残念ながら${names.join("、")}さんが亡くなってしまいました。お昼です。議論スタート。`

    :

    "朝になりました。みなさん目を覚ましてください。昨夜の犠牲者はいませんでした。お昼です。議論スタート。";

  speak(message);

  /*

    死亡者の表示だけ。

    死亡理由は表示しない。

  */

  render(`

    <div class="card">

      <div class="big">

        ☀️ 朝になりました

      </div>

      <p>

        みなさん目を覚ましてください。

      </p>

      ${

        names.length

        ?

        `

          <p class="big">

            昨夜の犠牲者

          </p>

          <p>

            ${names.join("、")}さん

          </p>

        `

        :

        `

          <p class="big">

            昨夜の犠牲者はいませんでした

          </p>

        `

      }

      <div class="big">

        お昼です。

      </div>

      <div class="big">

        💬 議論スタート

      </div>

      <div

        class="timer"

        id="timer"

      >

        ${formatTime(game.discussionTime)}

      </div>

    </div>

    <button

      class="danger"

      onclick="endDiscussionEarly()"

    >

      🛑 議論終了

    </button>

  `);

  /*

    朝になったので

    前日の追放者情報は

    霊媒師が確認できるように残す。

    ここでは消さない。

  */

  startDiscussionTimer();

}

/* =====================================================

   プレイヤー死亡処理

===================================================== */

function killPlayer(player){

  if(

    !player ||

    !player.alive

  ){

    return false;

  }

  /*

    タフガイは

    襲撃を受けてもその日は死なない。

    「襲撃された」という状態だけ保存。

  */

  if(

    player.role==="タフガイ" &&

    !player.toughHit

  ){

    player.toughHit=true;

    if(

      !game.toughPending.includes(

        player.id

      )

    ){

      game.toughPending.push(

        player.id

      );

    }

    return false;

  }

  player.alive=false;

  return true;

}

    game.players[voterId];

  );

function morning(){

  let deaths=[];

  /* 人狼の襲撃 */

  let wolfTarget =

    game.magicTarget !== null

      ? game.magicTarget

      : game.wolfTarget;

  if(wolfTarget !== null){

    let target=game.players[wolfTarget];

    let protectedBy =

      game.guardTarget===wolfTarget ||

      game.knightTarget===wolfTarget;

    /* 奇術師で変更された襲撃は

       護衛・罠を無視して必ず死亡 */

    if(game.magicTarget!==null){

      if(target.alive){

        if(target.role==="呪われた者"){

          target.cursedWolf=true;

          target.role="人狼";

        }else if(killPlayer(target)){

          deaths.push(target.id);

        }

      }

    }else if(protectedBy){

      /* 護衛成功 */

    }else if(

      game.trapTarget===wolfTarget &&

      target.role==="ボディーガード"

    ){

      /* ボディーガードには罠が効かない。

         襲撃した人狼側が1人死亡 */

      let wolves=living().filter(p=>

        WOLF_ROLES.includes(p.role)

      );

      if(wolves.length){

        let deadWolf=

          wolves[Math.floor(Math.random()*wolves.length)];

        deadWolf.alive=false;

        deaths.push(deadWolf.id);

      }

    }else if(

      game.trapTarget===wolfTarget

    ){

      /* 普通の人に罠がある場合は

         襲撃者側の処理 */

      let wolves=living().filter(p=>

        p.role==="人狼" ||

        p.role==="人狼の子ども" ||

        p.role==="一匹狼"

      );

      if(wolves.length){

        let deadWolf=

          wolves[Math.floor(Math.random()*wolves.length)];

        deadWolf.alive=false;

        deaths.push(deadWolf.id);

      }

    }else if(target.role==="呪われた者"){

      /* 襲撃された夜は死亡せず、

         翌夜から人狼になる */

      target.cursedWolf=true;

      target.role="人狼";

    }else{

      if(killPlayer(target)){

        deaths.push(target.id);

      }

    }

  }

  /* 裏切りの襲撃者 */

  if(game.raiderTarget!==null){

    let target=game.players[game.raiderTarget];

    if(target && target.alive){

      if(game.trapTarget===game.raiderTarget){

        if(killPlayer(target)){

          deaths.push(target.id);

        }

      }else{

        if(killPlayer(target)){

          deaths.push(target.id);

        }

      }

    }

  }

  /* カウンセラー */

  if(game.counselTarget!==undefined &&

     game.counselTarget!==null){

    let target=game.players[game.counselTarget];

    if(target && target.alive){

      if(BETRAYER_ROLES.includes(target.role)){

        /* 改心 */

        target.role="市民";

      }else if(WOLF_ROLES.includes(target.role)){

        let counselor=

          rolePlayers("カウンセラー")

          .find(p=>p.alive);

        if(counselor){

          counselor.alive=false;

          deaths.push(counselor.id);

        }

      }

    }

  }

  /* 恋人の道連れ */

  let extraDeaths=[];

  deaths.forEach(id=>{

    game.loverPairs.forEach(pair=>{

      if(pair.includes(id)){

        pair.forEach(pid=>{

          if(pid!==id){

            let lover=game.players[pid];

            if(lover.alive){

              lover.alive=false;

              extraDeaths.push(pid);

            }

          }

        });

      }

    });

  });

  deaths.push(...extraDeaths);

  /* タフガイ */

  if(game.toughPending.length){

    game.toughPending.forEach(id=>{

      let p=game.players[id];

      if(p && p.alive){

        p.alive=false;

        deaths.push(id);

      }

    });

    game.toughPending=[];

  }

  /* 重複死亡を整理 */

  deaths=[...new Set(deaths)];

  /* 追放者情報をリセット */

  game.lastExiled=null;

  game.firstSeer=false;

  /* 朝のアナウンス */

  let names=deaths.map(id=>

    escapeHTML(game.players[id].name)

  );

  let message;

  if(names.length){

    message=

      `朝になりました。みなさん目を覚ましてください。`+

      `残念ながら${names.join("、")}さんが亡くなってしまいました。`+

      `お昼です。議論スタート`;

  }else{

    message=

      "朝になりました。みなさん目を覚ましてください。" +

      "昨夜の犠牲者はいませんでした。" +

      "お昼です。議論スタート";

  }

  speak(message);

  render(`

    <div class="card">

      <div class="big">

        ☀️ 朝になりました

      </div>

      <p>

        ${

          names.length

          ? names.map(n=>n+"さんが亡くなりました").join("<br>")

          : "昨夜の犠牲者はいませんでした"

        }

      </p>

      <div class="big">

        お昼です。議論スタート

      </div>

      <div class="timer" id="timer">

        ${formatTime(game.discussionTime)}

      </div>

      <button onclick="endDiscussion()">

        🛑 議論を終了

      </button>

    </div>

  `);

  startTimer();

}

/* =========================

   タイマー

========================= */

function formatTime(sec){

  let m=Math.floor(sec/60);

  let s=sec%60;

  return m+":"+String(s).padStart(2,"0");

}

function startTimer(){

  clearInterval(game.timer);

  let remain=game.discussionTime;

  game.timer=setInterval(()=>{

    remain--;

    let el=document.getElementById("timer");

    if(el){

      el.textContent=

        formatTime(Math.max(0,remain));

    }

    if(remain<=0){

      clearInterval(game.timer);

      startVote();

    }

  },1000);

}

/* =========================

   議論終了

========================= */

function endDiscussion(){

  clearInterval(game.timer);

  startVote();

}

/* =========================

   投票

========================= */

function startVote(){

  clearInterval(game.timer);

  let voters=living();

  let index=0;

  let votes={};

  function nextVoter(){

    if(index>=voters.length){

      finishVote(votes);

      return;

    }

    let voter=voters[index++];

    let targets=

      voters.filter(p=>p.id!==voter.id);

    render(`

      <div class="card">

        <h2>

          ${escapeHTML(voter.name)}さん

        </h2>

        <p>

          投票先を選んでください。

        </p>

        <p class="small">

          他の人には見せないでください。

        </p>

        ${

          targets.map(target=>`

            <button onclick="castVote(${target.id})">

              ${escapeHTML(target.name)}

            </button>

          `).join("")

        }

      </div>

    `);

    window.castVote=function(id){

      let value=

        voter.role==="王様" ? 2 : 1;

      votes[id]=(votes[id]||0)+value;

      nextVoter();

    };

  }

  nextVoter();

}

/* =========================

   投票結果

========================= */

function finishVote(votes){

  let max=Math.max(...Object.values(votes));

  let winners=

    Object.keys(votes).filter(id=>

      votes[id]===max

    );

  /* 同票 → 決戦投票 */

  if(winners.length>1){

    if(game.voteRound===0){

      game.voteRound=1;

      render(`

        <div class="card">

          <div class="big">

            ⚖️ 同票です

          </div>

          <p>

            決戦投票を行います。

          </p>

        </div>

        <button onclick="startVote()">

          決戦投票

        </button>

      `);

      return;

    }

    /* 決戦投票も同票 */

    game.voteRound=0;

    render(`

      <div class="card">

        <div class="big">

          ⚖️ 決戦投票も同票です

        </div>

        <p>

          今回は追放なしです。

        </p>

      </div>

      <button onclick="showExileResult(null)">

        次へ

      </button>

    `);

    return;

  }

  game.voteRound=0;

  let target=

    game.players[Number(winners[0])];

  target.alive=false;

  game.lastExiled=target.id;

  /* 追放者を先に表示 */

  showExileResult(target);

}

/* =========================

   追放者表示

========================= */

function showExileResult(target){

  if(!target){

    game.lastExiled=null;

    render(`

      <div class="card">

        <div class="big">

          ⚖️ 今回は追放なし

        </div>

      </div>

      <button onclick="nextNight()">

        🌙 夜へ

      </button>

    `);

    return;

  }

  speak(

    `${target.name}さんが追放されました。`

  );

  render(`

    <div class="card">

      <div class="big">

        🗳️ 投票結果

      </div>

      <h2>

        ${escapeHTML(target.name)}さんが

        追放されました

      </h2>

    </div>

    <button onclick="afterExile()">

      次へ

    </button>

  `);

}

/* =========================

   追放後処理

========================= */

function afterExile(){

  let target=

    game.players[game.lastExiled];

  /* ハンター */

  if(target.role==="ハンター"){

    hunterAction(target);

    return;

  }

  checkVictory();

}

/* =========================

   ハンター

========================= */

function hunterAction(hunter){

  speak(

    "ハンターの方、目を覚ましてください。"+

    "道連れにする人を選んでください。"

  );

  let targets=living();

  render(`

    <div class="card">

      <h2>🏹 ハンター</h2>

      <p>

        道連れにする人を選んでください。

      </p>

      ${

        targets.map(p=>`

          <button onclick="hunterPick(${p.id})">

            ${escapeHTML(p.name)}

          </button>

        `).join("")

      }

    </div>

  `);

  window.hunterPick=function(id){

    let target=

      game.players[id];

    target.alive=false;

    /* 恋人 */

    game.loverPairs.forEach(pair=>{

      if(pair.includes(id)){

        pair.forEach(pid=>{

          if(pid!==id){

            game.players[pid].alive=false;

          }

        });

      }

    });

    checkVictory();

  };

}

/* =========================

   次の夜

========================= */

function nextNight(){

  game.night++;

  startNight();

}

/* =========================

   勝利判定

========================= */

function checkVictory(){

  let alive=living();

  /* 神様 */

  let gods=

    alive.filter(p=>p.role==="神様");

  if(gods.length){

    endGame("神様");

    return;

  }

  /* 妖狐 */

  let fox=

    alive.filter(p=>p.role==="妖狐");

  if(fox.length){

    let wolves=

      alive.filter(p=>

        p.role==="人狼" ||

        p.role==="人狼の子ども"

      );

    let others=

      alive.filter(p=>

        !WOLF_ROLES.includes(p.role) &&

        p.role!=="妖狐"

      );

    if(

      wolves.length===0 ||

      wolves.length>=others.length

    ){

      endGame("妖狐");

      return;

    }

  }

  /* 一匹狼 */

  let lone=

    alive.filter(p=>p.role==="一匹狼");

  let normalWolves=

    alive.filter(p=>

      p.role==="人狼" ||

      p.role==="人狼の子ども"

    );

  if(

    lone.length &&

    normalWolves.length===0

  ){

    endGame("一匹狼");

    return;

  }

  /* 恋人 */

  for(let pair of game.loverPairs){

    let a=game.players[pair[0]];

    let b=game.players[pair[1]];

    if(a.alive && b.alive){

      let others=

        alive.filter(p=>

          p.id!==a.id &&

          p.id!==b.id

        );

      if(others.length===0){

        endGame("恋人");

        return;

      }

    }

  }

  /* 案山子 */

  if(alive.length===0){

    if(hasRole("案山子")){

      endGame("案山子");

      return;

    }

  }

  /* 人狼 */

  let wolves=

    alive.filter(p=>

      p.role==="人狼" ||

      p.role==="人狼の子ども"

    );

  let nonWolves=

    alive.filter(p=>

      p.role!=="人狼" &&

      p.role!=="人狼の子ども" &&

      p.role!=="一匹狼"

    );

  if(wolves.length===0){

    endGame("市民");

    return;

  }

  if(wolves.length>=nonWolves.length){

    endGame("人狼");

    return;

  }

  /* 継続 */

  nextNight();

}

/* =========================

   ゲーム終了

========================= */

function endGame(winner){

  clearInterval(game.timer);

  speak(

    `${winner}の勝利です。`

  );

  render(`

    <div class="card">

      <div class="result">

        🏆 ${winner}勝利！

      </div>

      <h2>

        最終結果

      </h2>

      ${

        game.players.map(p=>`

          <p>

            ${escapeHTML(p.name)}

            ：

            ${escapeHTML(p.role)}

            ${p.alive ? "（生存）" : "（死亡）"}

          </p>

        `).join("")

      }

    </div>

    <button onclick="location.reload()">

      もう一度ゲームする

    </button>

  `);

}

/* =========================

   起動

========================= */

startScreen();

</script>
