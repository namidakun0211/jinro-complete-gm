<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:20px;

  text-align:center;

}

.container{

  max-width:650px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{margin-top:0;}

input,button{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{display:none;}

.info{

  font-size:18px;

  line-height:1.7;

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{color:green;}

.ng{color:red;}

.player-box{

  margin:15px 0;

}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:22px;

  font-weight:bold;

  margin-top:15px;

}

.lover-partner{

  font-size:20px;

  margin-top:8px;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- ==================== 設定 ==================== -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>🎭 役職と人数</h3>

<div id="totalDisplay" class="total ng">

配役：0 / 6人

</div>

<div id="roleList" class="role-list"></div>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- ==================== 名前入力 ==================== -->

<div id="playerSetup" class="hidden">

<h2>👥 プレイヤー名</h2>

<p>

ゲームで使用する名前を入力してください。

</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- ==================== 役職確認 ==================== -->

<div id="game" class="hidden">

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

</div>

<div id="loverArea"></div>

<p id="info" class="info">

役職を見るボタンを押してください。

</p>

<button

 id="mainButton"

 onclick="showRole()"

>

役職を見る

</button>

</div>

<!-- ==================== ゲーム準備完了 ==================== -->

<div id="gameReady" class="hidden">

<h2>🎮 ゲームスタート！</h2>

<p class="info">

全員の役職確認が完了しました。

</p>

<button onclick="startNight()">

🌙 夜を開始

</button>

</div>

</div>

<script>

/* =========================================

   役職一覧

========================================= */

const ROLES = [

 ["werewolf","🐺 人狼"],

 ["wolfChild","👶 人狼の子ども"],

 ["betrayer","😈 裏切り者"],

 ["betrayShared","🤝 裏切りの共有者"],

 ["informant","👁️ 内通者"],

 ["betrayAttacker","⚔️ 裏切りの襲撃者"],

 ["spy","🕵️ スパイ"],

 ["villager","👤 市民"],

 ["seer","🔮 予言者"],

 ["bodyguard","🛡️ ボディーガード"],

 ["medium","👻 霊媒師"],

 ["hunter","🔫 ハンター"],

 ["shared","🤝 共有者"],

 ["dictator","👑 独裁者"],

 ["tough","💪 タフガイ"],

 ["counselor","🩺 カウンセラー"],

 ["magician","🎩 奇術師"],

 ["trapper","🪤 罠師"],

 ["knights","🛡️ 騎士団"],

 ["shadow","🪞 影武者"],

 ["king","👑 王様"],

 ["cursed","🧟 呪われた者"],

 ["fox","🦊 妖狐"],

 ["god","🙏 神様"],

 ["lover","❤️ 恋人"],

 ["loneWolf","🐺 一匹狼"],

 ["android","🤖 アンドロイド"],

 ["scarecrow","🌾 案山子"]

];

/* =========================================

   変数

========================================= */

let roleCounts = {};

let players = [];

let selectedRoles = [];

let currentPlayer = 0;

let loverMode = false;

/* =========================================

   恋人兼用モード変更

========================================= */

function updateLoverMode(){

 loverMode =

   document.querySelector(

     'input[name="loverMode"]:checked'

   ).value === "true";

 renderRoleList();

}

/* =========================================

   初期化

========================================= */

function resetRoleCounts(){

 roleCounts = {};

 ROLES.forEach(role=>{

   roleCounts[role[0]] = 0;

 });

 renderRoleList();

}

/* =========================================

   役職一覧表示

========================================= */

function renderRoleList(){

 const list =

   document.getElementById("roleList");

 list.innerHTML = "";

 ROLES.forEach(role=>{

   const id = role[0];

   const name = role[1];

   /*

     恋人兼用ありの場合、

     恋人は通常の人数枠から外す

   */

   if(id === "lover" && loverMode){

     return;

   }

   const item =

     document.createElement("div");

   item.className = "role-item";

   item.innerHTML = `

    <div class="role-name">

      ${name}

    </div>

    <div class="counter">

      <button

       onclick="changeRoleCount('${id}',-1)"

      >

       −

      </button>

      <div

       class="count"

       id="count-${id}"

      >

       ${roleCounts[id] || 0}

      </div>

      <button

       onclick="changeRoleCount('${id}',1)"

      >

       ＋

      </button>

    </div>

   `;

   list.appendChild(item);

 });

 updateTotal();

}

/* =========================================

   人数変更

========================================= */

function changeRoleCount(id,change){

 const playerCount =

   Number(

     document.getElementById("playerCount").value

   );

 const current =

   roleCounts[id] || 0;

 const next =

   current + change;

 if(next < 0){

   return;

 }

 if(next > playerCount){

   return;

 }

 roleCounts[id] = next;

 const element =

   document.getElementById(

     "count-"+id

   );

 if(element){

   element.textContent = next;

 }

 updateTotal();

}

/* =========================================

   合計表示

========================================= */

function updateTotal(){

 const playerCount =

   Number(

     document.getElementById("playerCount").value

   );

 let total = 0;

 Object.entries(roleCounts)

   .forEach(([id,count])=>{

     /*

       恋人兼用ありの場合、

       恋人は人数にカウントしない

     */

     if(id === "lover" && loverMode){

       return;

     }

     total += count;

   });

 const display =

   document.getElementById("totalDisplay");

 const button =

   document.getElementById("nextButton");

 display.textContent =

   `配役：${total} / ${playerCount}人`;

 if(total === playerCount){

   display.className =

     "total ok";

   button.disabled = false;

 }else{

   display.className =

     "total ng";

   button.disabled = true;

 }

}

/* =========================================

   名前入力

========================================= */

function preparePlayers(){

 const count =

   Number(

     document.getElementById("playerCount").value

   );

 if(count < 4 || count > 20){

   alert(

     "4人〜20人で入力してください"

   );

   return;

 }

 let total = 0;

 Object.entries(roleCounts)

   .forEach(([id,c])=>{

     if(id === "lover" && loverMode){

       return;

     }

     total += c;

   });

 if(total !== count){

   alert(

     "参加人数と配役人数を同じにしてください。"

   );

   return;

 }

 /*

   選択された役職を配列化

 */

 selectedRoles = [];

 ROLES.forEach(role=>{

   const id = role[0];

   /*

     兼用ありの恋人はここでは配らない

   */

   if(id === "lover" && loverMode){

     return;

   }

   const count =

     roleCounts[id] || 0;

   for(let i=0;i<count;i++){

     selectedRoles.push(id);

   }

 });

 const area =

   document.getElementById(

     "playerInputs"

   );

 area.innerHTML = "";

 for(let i=0;i<count;i++){

   const oldName =

     localStorage.getItem(

       "jinroPlayer"+i

     ) || "";

   area.innerHTML += `

    <div class="player-box">

     <label>

      プレイヤー${i+1}

     </label>

     <br>

     <input

      id="playerName${i}"

      type="text"

      maxlength="20"

      placeholder="名前を入力"

      value="${escapeHtml(oldName)}"

     >

    </div>

   `;

 }

 document

   .getElementById("setup")

   .classList.add("hidden");

 document

   .getElementById("playerSetup")

   .classList.remove("hidden");

}

/* =========================================

   HTMLエスケープ

========================================= */

function escapeHtml(text){

 return text

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

/* =========================================

   ゲーム開始

========================================= */

function startGame(){

 const names = [];

 for(

   let i=0;

   i<selectedRoles.length;

   i++

 ){

   const input =

     document.getElementById(

       "playerName"+i

     );

   const name =

     input.value.trim();

   if(!name){

     alert(

       `プレイヤー${i+1}の名前を入力してください。`

     );

     input.focus();

     return;

   }

   names.push(name);

   localStorage.setItem(

     "jinroPlayer"+i,

     name

   );

 }

 /*

   役職をシャッフル

 */

 const shuffledRoles =

   [...selectedRoles]

    .sort(

      ()=>Math.random()-0.5

    );

 players =

   names.map((name,index)=>{

     return {

       id:index,

       name:name,

       roleId:

         shuffledRoles[index],

       alive:true,

       lover:false,

       loverPartner:null,

       abilitiesUsed:{},

       lastTrapTarget:null,

       copiedRole:null,

       cursedAwakened:false

     };

   });

 /*

   ❤️ 兼用ありなら、

   配役決定後にランダムで2人を恋人にする

 */

 if(loverMode){

   assignRandomLovers();

 }

 currentPlayer = 0;

 document

  .getElementById("playerSetup")

  .classList.add("hidden");

 document

  .getElementById("game")

  .classList.remove("hidden");

 showPlayer();

}

/* =========================================

   ❤️ 恋人をランダム決定

========================================= */

function assignRandomLovers(){

 if(players.length < 2){

   return;

 }

 const indexes =

   players.map(

     (_,index)=>index

   );

 indexes.sort(

   ()=>Math.random()-0.5

 );

 const a =

   indexes[0];

 const b =

   indexes[1];

 players[a].lover = true;

 players[b].lover = true;

 players[a].loverPartner =

   players[b].name;

 players[b].loverPartner =

   players[a].name;

}

/* =========================================

   プレイヤー表示

========================================= */

function showPlayer(){

 const player =

   players[currentPlayer];

 document

  .getElementById("playerTitle")

  .textContent =

    player.name+" さん";

 document

  .getElementById("roleArea")

  .textContent =

    "？？？";

 document

  .getElementById("loverArea")

  .innerHTML =

    "";

 document

  .getElementById("info")

  .textContent =

    "役職を見るボタンを押してください。";

 const button =

   document.getElementById(

     "mainButton"

   );

 button.textContent =

   "役職を見る";

 button.onclick =

   showRole;

}

/* =========================================

   役職表示

========================================= */

function showRole(){

 const player =

   players[currentPlayer];

 /*

   本来の役職

 */

 document

  .getElementById("roleArea")

  .textContent =

    getRoleName(

      player.roleId

    );

 /*

   ❤️ 恋人なら追加表示

 */

 if(player.lover){

   document

    .getElementById("loverArea")

    .innerHTML = `

      <div class="lover">

       ❤️ 恋人

      </div>

      <div class="lover-partner">

       恋人：${escapeHtml(

         player.loverPartner

       )}

      </div>

   `;

 }else{

   document

    .getElementById("loverArea")

    .innerHTML =

      "";

 }

 document

  .getElementById("info")

  .textContent =

    getRoleDescription(

      player.roleId

    );

 const button =

   document.getElementById(

     "mainButton"

   );

 button.textContent =

   "次の人";

 button.onclick =

   nextPlayer;

}

/* =========================================

   次のプレイヤー

========================================= */

function nextPlayer(){

 currentPlayer++;

 if(

   currentPlayer >=

   players.length

 ){

   document

    .getElementById("game")

    .classList.add("hidden");

   document

    .getElementById("gameReady")

    .classList.remove("hidden");

   return;

 }

 showPlayer();

}

/* =========================================

   役職名

========================================= */

function getRoleName(id){

 const role =

   ROLES.find(

     r=>r[0]===id

   );

 return role

   ? role[1]

   : "不明";

}

/* =========================================

   役職説明

========================================= */

function getRoleDescription(id){

 const descriptions = {

   werewolf:

    "🐺 毎夜1人を襲撃します。",

   wolfChild:

    "👶 人狼と共に襲撃します。",

   betrayer:

    "😈 能力はありません。人狼陣営です。",

   betrayShared:

    "🤝 相方を知っている人狼陣営です。",

   informant:

    "👁️ 人狼を知っています。",

   betrayAttacker:

    "⚔️ 人狼とは別に毎夜1人を襲撃します。",

   spy:

    "🕵️ 市民側の役職能力を妨害します。1役職につき1回までです。",

   villager:

    "👤 特別な能力はありません。",

   seer:

    "🔮 毎夜1人を占います。",

   bodyguard:

    "🛡️ 人狼の襲撃から1人を守ります。",

   medium:

    "👻 前日に追放された人を確認できます。",

   hunter:

    "🔫 死亡時に1人を道連れにできます。",

   shared:

    "🤝 相方を知っています。",

   dictator:

    "👑 1回だけ昼の議論を強制終了し、追放者を独断で決定できます。",

   tough:

    "💪 襲撃を受けても翌日の議論に参加できます。その後死亡します。",

   counselor:

    "🩺 裏切り者系を改心させられます。人狼を選ぶと自分が犠牲になります。",

   magician:

    "🎩 2日目以降に1回だけ、人狼の襲撃先を変更できます。",

   trapper:

    "🪤 毎晩1人に罠を仕掛けます。同じ人には2夜連続で仕掛けられません。",

   knights:

    "🛡️ 2〜3人で守ります。自分たちも守れます。",

   shadow:

    "🪞 1回だけ議論を強制終了し、自分自身が追放されます。",

   king:

    "👑 投票を2票分として数えます。",

   cursed:

    "🧟 襲撃された夜は死亡せず、翌夜に人狼になります。",

   fox:

    "🦊 人狼の襲撃では死亡せず、占われると死亡します。",

   god:

    "🙏 全員の役職を知っています。ゲーム終了時まで生き残ると勝利です。",

   lover:

    "❤️ 恋人同士はお互いを知っています。片方が死亡するともう片方も後追い死亡します。",

   loneWolf:

    "🐺 人狼と共に行動し、他の人狼がいなくなった状態で生き残ることを目指します。",

   android:

    "🤖 ゲーム開始時に誰か1人の役職をコピーします。",

   scarecrow:

    "🌾 案山子同士を知っています。案山子全員がいなくなると勝利します。"

 };

 return descriptions[id]

  || "役職の説明はありません。";

}

/* =========================================

   夜開始

========================================= */

function startNight(){

 alert(

   "🌙 夜の行動システムは次の段階で追加します。"

 );

}

/* =========================================

   初期表示

========================================= */

resetRoleCounts();

</script>

</body>

</html>
