<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐺 人狼コンプリートGM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#333;color:#fff;cursor:pointer;margin:5px}button.success{background:#16834b}button.warn{background:#b36b00}button.danger{background:#a92727}.wrap{max-width:760px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #0001}.title{text-align:center;font-size:26px;font-weight:800}.muted{color:#666}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{width:100%;margin:0}.rolegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.role{border:1px solid #ddd;border-radius:12px;padding:10px;text-align:left;background:#fafafa}.role.selected{outline:3px solid #333}.role small{display:block;color:#777;margin-top:3px}.listrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:2px}.night-card{text-align:center}.night-title{font-size:23px;font-weight:800;margin-bottom:14px}.target-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.target-grid button{margin:0;background:#222}.result-card{padding:18px;border-radius:14px;background:#f0f0f0;font-size:18px;margin:12px 0}.timer{font-size:38px;font-weight:800;text-align:center}.vote-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.vote-grid button{margin:0}.hidden{display:none!important}.center{text-align:center}.dangerText{color:#a92727;font-weight:700}.ok{color:#16834b;font-weight:700}.rolecard{background:#fafafa;border:1px solid #ddd;border-radius:14px;padding:14px;margin:8px 0}.small{font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<div id="screen-setup" class="screen active"><div class="card"><div class="title">🐺 人狼コンプリートGM</div><p class="center muted">完全仕様版・GM進行アプリ</p><label>参加人数<br><select id="playerCount"></select></label><h3>プレイヤー名</h3><div id="nameInputs"></div><h3>採用役職</h3><p class="small muted">役職を選んだあと、ゲーム開始時に人数に合わせて確認します。</p><div id="roleGrid" class="rolegrid"></div><div class="card"><label>💬 昼の議論時間：<select id="discussionMinutes"><option value="0">タイマーなし</option><option value="3">3分</option><option value="5" selected>5分</option><option value="7">7分</option><option value="10">10分</option></select></label><br><label><input type="checkbox" id="firstSeer" checked> 初日の予言をする</label></div><button class="success" onclick="startGame()">🎴 ゲーム開始</button></div></div>

<div id="screen-role-confirm" class="screen"><div class="card"><div class="title">🎴 役職確認</div><div id="confirmContent"></div></div></div>
<div id="screen-role-confirm-start" class="screen"><div class="card center"><div id="confirmModeText"></div></div></div>
<div id="screen-night" class="screen"><div class="card"><div class="title">🌙 夜</div><div id="nightContent"></div></div></div>
<div id="screen-day" class="screen"><div class="card"><div class="title">☀️ 昼</div><div id="morningText"></div><div id="dayContent"></div></div></div>
<div id="screen-vote" class="screen"><div class="card"><div class="title">🗳️ 投票</div><div id="voteContent"></div></div></div>
<div id="screen-end" class="screen"><div class="card center"><div class="title">🏆 ゲーム終了</div><div id="endContent"></div><button onclick="location.reload()">もう一度遊ぶ</button></div></div>
</div>
<div id="modal" class="modal"><div class="card"><div id="modalContent"></div></div></div>
<script>
/* =========================================================
🐺 人狼コンプリートGM 完全仕様版
仕様書 2026/8/20 を基準。役職・能力・勝利条件を追加変更しない。
========================================================= */
const ROLES=[
{id:'citizen',name:'市民',icon:'👤',team:'citizen'},
{id:'seer',name:'予言者',icon:'🔮',team:'citizen'},
{id:'bodyguard',name:'ボディーガード',icon:'🛡️',team:'citizen'},
{id:'trap',name:'罠師',icon:'🪤',team:'citizen'},
{id:'medium',name:'霊媒師',icon:'👻',team:'citizen'},
{id:'hunter',name:'ハンター',icon:'🏹',team:'citizen'},
{id:'shared',name:'共有者',icon:'🤝',team:'citizen',pair:true},
{id:'dictator',name:'独裁者',icon:'👑',team:'citizen'},
{id:'tough',name:'タフガイ',icon:'💪',team:'citizen'},
{id:'counselor',name:'カウンセラー',icon:'💭',team:'citizen'},
{id:'knight_group',name:'騎士団',icon:'⚔️',team:'citizen'},
{id:'shadow',name:'影武者',icon:'🥷',team:'citizen'},
{id:'king',name:'王様',icon:'🎩',team:'citizen'},
{id:'magician',name:'奇術師',icon:'🎩',team:'citizen'},
{id:'werewolf',name:'人狼',icon:'🐺',team:'wolf'},
{id:'wolf_child',name:'人狼の子ども',icon:'🐺',team:'wolf'},
{id:'traitor',name:'裏切り者',icon:'😈',team:'wolf'},
{id:'shared_traitor',name:'裏切りの共有者',icon:'🤝',team:'wolf',pair:true},
{id:'informant',name:'内通者',icon:'📨',team:'wolf'},
{id:'attacker_traitor',name:'裏切りの襲撃者',icon:'🐺',team:'wolf'},
{id:'spy',name:'スパイ',icon:'🕵️',team:'wolf'},
{id:'fox',name:'妖狐',icon:'🦊',team:'fox'},
{id:'god',name:'神様',icon:'✨',team:'god'},
{id:'lone_wolf',name:'一匹狼',icon:'🐺',team:'lone'},
{id:'android',name:'アンドロイド',icon:'🤖',team:'android'},
{id:'scarecrow',name:'案山子',icon:'🪵',team:'scarecrow'},
{id:'cursed',name:'呪われた者',icon:'💀',team:'citizen'},
{id:'lover',name:'恋人',icon:'❤️',team:'lover',pair:true}
];
const WIN_PRIORITY=['scarecrow','android_god','fox','lover','wolf_citizen'];
let game={players:[],roleAssignments:[],nightNumber:0,currentNightActionIndex:0,nightState:null,lastNightDeaths:[],previousBodyguardTarget:null,previousTrapTarget:null,previousAttackerTarget:null,usedMagician:false,dictatorUsed:false,shadowUsed:false,androidTarget:null,androidRole:null,firstSeer:true,lastExecuted:null,discussionMinutes:5};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1;speechSynthesis.speak(u)}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function role(id){return ROLES.find(r=>r.id===id)}
function assignment(name){return game.roleAssignments.find(a=>a.player===name)}
function alive(){return game.roleAssignments.filter(a=>a.alive)}
function aliveRole(id){return game.roleAssignments.filter(a=>a.alive&&a.role.id===id)}
function has(id){return game.roleAssignments.some(a=>a.role.id===id)}
function pairPartners(id,idx){return game.roleAssignments.filter(a=>a.role.id===id).map(a=>a.player).filter(n=>n!==idx)}
function initSetup(){for(let i=5;i<=20;i++)$('playerCount').innerHTML+=`<option>${i}</option>`;$('playerCount').onchange=renderNames;renderNames();ROLES.forEach(r=>{let b=document.createElement('button');b.className='role';b.dataset.id=r.id;b.innerHTML=`${r.icon} ${r.name}<small>${r.team==='citizen'?'市民陣営':r.team==='wolf'?'人狼陣営':r.team==='fox'?'単独陣営':'特殊陣営'}</small>`;b.onclick=()=>{b.classList.toggle('selected')};$('roleGrid').appendChild(b)});}
function renderNames(){let n=+$('playerCount').value||5;let old=[...document.querySelectorAll('#nameInputs input')].map(x=>x.value);$('nameInputs').innerHTML='';for(let i=0;i<n;i++){let inp=document.createElement('input');inp.style.width='100%';inp.style.padding='10px';inp.style.margin='3px 0';inp.placeholder=`プレイヤー${i+1}`;inp.value=old[i]||`プレイヤー${i+1}`;$('nameInputs').appendChild(inp)}}
function startGame(){let names=[...document.querySelectorAll('#nameInputs input')].map(x=>x.value.trim()).filter(Boolean);let ids=[...document.querySelectorAll('#roleGrid .selected')].map(x=>x.dataset.id);if(names.length!==+$('playerCount').value)return alert('全員の名前を入力してください。');if(ids.length!==names.length)return alert(`人数と役職枚数を同じにしてください。\n人数：${names.length}人\n役職：${ids.length}枚`);if(ids.filter(id=>role(id).pair).some(id=>ids.filter(x=>x===id).length!==2)&&ids.some(id=>role(id).pair))return alert('共有者・裏切りの共有者・恋人などのセット役職は2枚単位で選択してください。');game.players=names;game.discussionMinutes=+$('discussionMinutes').value;game.firstSeer=$('firstSeer').checked;let shuffled=[...ids].sort(()=>Math.random()-.5);game.roleAssignments=names.map((p,i)=>({player:p,role:role(shuffled[i]),alive:true,cursedConverted:false,deathNight:null,traitorConverted:false}));prepareRoleConfirmation();}
function prepareRoleConfirmation(){let i=0;function next(){if(i>=game.players.length){finishRoleConfirmation();return}let p=game.players[i],a=assignment(p);$('confirmContent').innerHTML=`<div class="center"><h2>${esc(p)}さん</h2><p>他の人は画面を見ないでください。</p><div class="rolecard"><div style="font-size:30px">${a.role.icon} ${a.role.name}</div><p>${roleDescription(a.role.id)}</p>${partnerText(p,a.role.id)}</div><button class="success" onclick="nextConfirm()">確認しました ▶</button></div>`;show('screen-role-confirm');window.nextConfirm=()=>{i++;next()}}window.nextConfirm=()=>{i++;next()};next()}
function partnerText(p,id){let a=assignment(p);if(id==='shared'){let ps=game.roleAssignments.filter(x=>x.role.id==='shared'&&x.player!==p);return ps.length?`<p>共有者の相手：<strong>${esc(ps[0].player)}</strong></p>`:''}if(id==='shared_traitor'){let ps=game.roleAssignments.filter(x=>x.role.id==='shared_traitor'&&x.player!==p);return ps.length?`<p>裏切りの共有者の相手：<strong>${esc(ps[0].player)}</strong></p>`:''}if(id==='lover'){let ps=game.roleAssignments.filter(x=>x.role.id==='lover'&&x.player!==p);return ps.length?`<p>恋人の相手：<strong>${esc(ps[0].player)}</strong></p>`:''}if(id==='knight_group'){let ps=game.roleAssignments.filter(x=>x.role.id==='knight_group'&&x.player!==p).map(x=>x.player);return ps.length?`<p>騎士団：${ps.map(esc).join('、')}</p>`:''}if(['werewolf','wolf_child','informant','lone_wolf'].includes(id)){let ps=game.roleAssignments.filter(x=>['werewolf','wolf_child','lone_wolf'].includes(x.role.id)&&x.player!==p).map(x=>x.player);if(ps.length&&id!=='informant')return `<p>人狼仲間：${ps.map(esc).join('、')}</p>`;if(id==='informant'){let ws=game.roleAssignments.filter(x=>['werewolf','wolf_child','lone_wolf'].includes(x.role.id)).map(x=>x.player);return `<p>人狼：${ws.map(esc).join('、')||'なし'}</p>`}}if(id==='god')return `<p>全員の役職を知っています。</p>`;return ''}
function roleDescription(id){const d={citizen:'能力なし。夜の行動なし。',seer:'夜に1人を占います。妖狐は人間と出ますが占われた妖狐は死亡します。',bodyguard:'自分自身は守れず、同じ人を2夜連続で守れません。',trap:'夜に1人へ罠を仕掛けます。',medium:'前日に追放された人を判定します。',hunter:'死亡時、生存者1人を道連れにします。',shared:'2枚セット。お互いを知ります。',dictator:'1ゲーム1回、昼の議論を強制終了し自分だけで追放者を選びます。',tough:'襲撃されてもその夜は死なず、翌日の夜に死亡します。',counselor:'毎晩1人をカウンセリングします。対象が人狼なら自分が死亡します。',knight_group:'騎士団同士を知り、自分自身も守れます。',shadow:'1ゲーム1回、議論を強制終了し自分自身が追放されます。',king:'毎回の投票が2票分です。本人の投票先は公開しません。',magician:'1ゲーム1回、人狼の襲撃先を変更できます。',werewolf:'夜に襲撃します。',wolf_child:'人狼陣営。昼に追放されるとその夜の人狼側襲撃が2回になります。',traitor:'人狼を知らず、人狼からも分かりません。',shared_traitor:'2枚セット。互いを知りますが人狼は知りません。',informant:'人狼を知っています。',attacker_traitor:'人狼とは別に夜に1人を襲撃します。',spy:'毎晩1人の市民陣営役職者を1回妨害します。',fox:'通常の人狼襲撃では死亡せず、占われると死亡します。',god:'全員の役職を知る単独陣営です。',lone_wolf:'他の人狼を知り、人狼側の襲撃を共有します。',android:'役職確認時に1人をコピーします。コピー先が死亡すると道連れです。',scarecrow:'案山子が全員死亡した場合に勝利します。',cursed:'最初は市民。人狼系に襲撃されると翌夜から人狼になります。',lover:'2枚セット。同じペアが最後まで生存すると勝利します。'};return d[id]||''}
function finishRoleConfirmation(){$('confirmModeText').innerHTML='🎴 全員の役職確認が終了しました。<br><br>準備ができたら夜を開始してください。<br><button class="success" onclick="startNight()">🌙 夜を開始する</button>';show('screen-role-confirm-start')}
const NIGHT_ACTIONS=[['cursed','💀 呪われた者'],['spy','🕵️ スパイ'],['android','🤖 アンドロイド'],['trap','🪤 罠師'],['bodyguard','🛡️ ボディーガード'],['knight','⚔️ 騎士団'],['wolves','🐺 人狼・人狼の子ども・一匹狼'],['attacker','🐺 裏切りの襲撃者'],['counselor','💭 カウンセラー'],['traitor_check','😈 裏切り者系確認'],['magician','🎩 奇術師'],['seer','🔮 予言者'],['medium','👻 霊媒師']];
function startNight(){game.nightNumber++;game.currentNightActionIndex=0;game.nightState={wolfTarget:null,wolfSecondTarget:null,attackerTargets:[],counselorTarget:null,bodyguardTarget:null,knightTarget:null,trapTarget:null,magicianTarget:null,seerTarget:null,seerKilledFox:null,androidTarget:null,spyTargets:[],deathReasons:{},hunterDeaths:[]};show('screen-night');speak('夜になりました。みなさん目を閉じてください。');setTimeout(processNight,1200)}
function needed(id){if(id==='cursed')return has('cursed');if(id==='spy')return aliveRole('spy').length>0;if(id==='android')return aliveRole('android').length>0&&game.androidTarget===null;if(id==='trap')return aliveRole('trap').length>0;if(id==='bodyguard')return aliveRole('bodyguard').length>0;if(id==='knight')return aliveRole('knight_group').length>0;if(id==='wolves')return aliveRole('werewolf').length>0||aliveRole('wolf_child').length>0||aliveRole('lone_wolf').length>0||game.roleAssignments.some(a=>a.alive&&a.role.id==='cursed'&&a.cursedConverted);if(id==='attacker')return aliveRole('attacker_traitor').length>0;if(id==='counselor')return aliveRole('counselor').length>0;if(id==='traitor_check')return has('counselor')&&(has('traitor')||has('shared_traitor')||has('informant')||has('attacker_traitor'));if(id==='magician')return aliveRole('magician').length>0&&!game.usedMagician;if(id==='seer')return aliveRole('seer').length>0&&(game.nightNumber>1||game.firstSeer);if(id==='medium')return aliveRole('medium').length>0;return false}
function processNight(){if(game.currentNightActionIndex>=NIGHT_ACTIONS.length){resolveNight();return}let [id,title]=NIGHT_ACTIONS[game.currentNightActionIndex];if(!needed(id)){game.currentNightActionIndex++;processNight();return}renderNight(id,title)}
function renderNight(id,title){let html=`<div class="night-card"><div class="night-title">${title}</div>`;if(id==='cursed')html+=`<p>💀 呪われた者の確認です。採用されている場合は毎晩呼び出されます。生存していれば確認後に進みます。</p><button class="success" onclick="nextNight()">確認しました ▶</button>`;else if(id==='spy')html+=`<p>妨害する市民陣営の役職者を1人選んでください。</p>${targets(alive().filter(a=>a.role.team==='citizen'),'spy')}`;else if(id==='android')html+=`<p>コピーする人を1人選んでください。</p>${targets(alive().filter(a=>a.role.id!=='android'),'android')}`;else if(id==='trap')html+=`<p>今夜罠を仕掛ける人を1人選んでください。前夜と同じ人は不可。</p>${targets(alive().filter(a=>a.player!==game.previousTrapTarget),'trap')}`;else if(id==='bodyguard'){let g=aliveRole('bodyguard')[0];html+=`<p>自分自身と前夜と同じ人は守れません。</p>${targets(alive().filter(a=>a.player!==g.player&&a.player!==game.previousBodyguardTarget),'bodyguard')}`;else if(id==='knight')html+=`<p>騎士団同士で目配せして1人を選んでください。自分自身も可。</p>${targets(alive(),'knight')}`;else if(id==='wolves')html+=`<p>人狼・人狼の子ども・一匹狼の方、襲撃先を1人選んでください。</p>${targets(alive().filter(a=>!['werewolf','wolf_child','lone_wolf'].includes(a.role.id)&&!(a.role.id==='cursed'&&a.cursedConverted)),'wolf')}`;else if(id==='attacker')html+=`<p>裏切りの襲撃者の方、襲撃する人を1人選んでください。</p>${targets(alive(),'attacker')}`;else if(id==='counselor')html+=`<p>カウンセリングする人を1人選んでください。</p>${targets(alive(),'counselor')}`;else if(id==='traitor_check'){let list=game.roleAssignments.filter(a=>['traitor','shared_traitor','informant','attacker_traitor'].includes(a.role.id));html+=`<p>カウンセラーがいるため、採用されている裏切り者系を1人ずつ確認します。</p>${list.map(a=>`<div class="rolecard">😈 ${esc(a.player)}さん<br><span class="small">${a.alive?'生存中':'死亡済み'}。死亡していても毎晩呼び出し対象です。</span></div>`).join('')}<button class="success" onclick="nextNight()">全員確認しました ▶</button>`}else if(id==='magician'){if(!game.nightState.wolfTarget)html+=`<p>まだ人狼の襲撃先が決まっていません。今夜は変更できません。</p><button class="success" onclick="nextNight()">スキップ ▶</button>`;else html+=`<p>人狼の襲撃先を変更できます。変更先は必ず死亡します。</p>${targets(alive(),'magician')}`}else if(id==='seer')html+=`<p>占う人を1人選んでください。結果は画面だけで確認します。</p>${targets(alive(),'seer')}`;else if(id==='medium'){let x=game.lastExecuted;html+=x?`<div class="result-card">霊媒結果：<strong>${esc(x.player)}</strong>さんは<strong>${mediumResult(x)}</strong>です。</div>`:`<div class="result-card">昨日の追放者はいません。</div>`;html+=`<button class="success" onclick="nextNight()">確認しました ▶</button>`}html+='</div>';$('nightContent').innerHTML=html}
function targets(arr,type){return `<div class="target-grid">${arr.map(a=>`<button onclick="nightTarget('${type}','${encodeURIComponent(a.player)}')">${esc(a.player)}</button>`).join('')}</div>`}
function nightTarget(type,enc){let t=decodeURIComponent(enc);if(type==='spy')game.nightState.spyTargets.push(t);if(type==='android'){game.androidTarget=t;game.androidRole={...assignment(t).role};showAndroidCopy(t);return}if(type==='trap'){game.nightState.trapTarget=t;game.previousTrapTarget=t}if(type==='bodyguard'){game.nightState.bodyguardTarget=t;game.previousBodyguardTarget=t}if(type==='knight')game.nightState.knightTarget=t;if(type==='wolf')game.nightState.wolfTarget=t;if(type==='attacker')game.nightState.attackerTargets.push({target:t,attacker:aliveRole('attacker_traitor')[0]?.player});if(type==='counselor')game.nightState.counselorTarget=t;if(type==='magician'){game.nightState.magicianTarget=t;game.usedMagician=true}if(type==='seer'){game.nightState.seerTarget=t;showSeer(t);return}nextNight()}
function showAndroidCopy(t){$('nightContent').innerHTML=`<div class="night-card"><div class="night-title">🤖 コピー完了</div><div class="result-card">${esc(t)}さんの役職をコピーしました。<br>本人には知らされません。</div><button class="success" onclick="nextNight()">確認しました ▶</button></div>`}
function showSeer(t){let a=assignment(t),res='人間';if(['werewolf','wolf_child','lone_wolf'].includes(a.role.id)||(a.role.id==='cursed'&&a.cursedConverted))res='人狼';$('nightContent').innerHTML=`<div class="night-card"><div class="night-title">🔮 占い結果</div><div class="result-card"><strong>${esc(t)}</strong>さんは<br><strong>${res}</strong>です。</div><button class="success" onclick="seerDone('${encodeURIComponent(t)}')">確認しました ▶</button></div>`}
function seerDone(enc){let t=decodeURIComponent(enc);if(assignment(t).role.id==='fox')game.nightState.seerKilledFox=t;nextNight()}
function nextNight(){game.currentNightActionIndex++;processNight()}
function mediumResult(a){let r=a.role.id;return ['werewolf','wolf_child','lone_wolf','scarecrow'].includes(r)||(r==='cursed'&&a.cursedConverted)?'人狼':'市民'}
function resolveNight(){let deaths=[];const dead=(a,reason)=>{if(!a||!a.alive)return false;a.alive=false;a.deathNight=game.nightNumber;game.nightState.deathReasons[a.player]=reason;deaths.push(a.player);if(a.role.id==='hunter')game.nightState.hunterDeaths.push(a.player);return true};
let attacks=[];if(game.nightState.wolfTarget)attacks.push({target:game.nightState.wolfTarget,source:'wolf'});if(game.nightState.attackerTargets)game.nightState.attackerTargets.forEach(x=>attacks.push({target:x.target,source:'attacker',attacker:x.attacker}));
let coun=game.nightState.counselorTarget;
for(let at of attacks){let t=assignment(at.target);if(!t||!t.alive)continue;if(coun&&coun===t.player){if(t.role.id==='attacker_traitor')t.traitorConverted=true;continue}
if(at.source==='wolf'&&t.role.id==='cursed'&&!t.cursedConverted){if(game.nightState.bodyguardTarget===t.player||game.nightState.knightTarget===t.player)continue;t.cursedConverted=true;t.role=role('cursed');continue}
if(game.nightState.magicianTarget===t.player){dead(t,'magician');continue}
if(game.nightState.bodyguardTarget===t.player||game.nightState.knightTarget===t.player)continue;
if(game.nightState.trapTarget===t.player){if(t.role.id==='bodyguard'){/* trap has no effect */}else if(at.source==='attacker'){dead(assignment(at.attacker),'trap')}else{let wolves=game.roleAssignments.filter(a=>a.alive&&['werewolf','wolf_child','lone_wolf'].includes(a.role.id));if(wolves.length)dead(wolves[Math.floor(Math.random()*wolves.length)],'trap')}continue}
if(t.role.id==='fox')dead(t,'attack');else if(t.role.id==='tough'){t.toughPending=true}else dead(t,at.source)}
if(game.nightState.seerKilledFox)dead(assignment(game.nightState.seerKilledFox),'seer');
if(game.androidTarget){let ad=aliveRole('android');let cp=assignment(game.androidTarget);if(cp&&!cp.alive)ad.forEach(a=>dead(a,'android'))}
// タフガイ：襲撃された夜は生存、翌夜に死亡。昼追放なら解除される。
game.roleAssignments.filter(a=>a.alive&&a.toughPending).forEach(a=>{a.toughPending=true});
// 恋人道連れは死亡確定後に処理
let changed=true;while(changed){changed=false;for(let a of game.roleAssignments.filter(x=>!x.alive&&x.role.id==='lover')){let mate=game.roleAssignments.find(x=>x.role.id==='lover'&&x.player!==a.player);if(mate&&mate.alive){dead(mate,'lover');changed=true}}}
// ハンターは朝に道連れを選ぶ
for(let h of game.nightState.hunterDeaths){let hp=assignment(h);if(!hp)continue;setTimeout(()=>hunterPrompt(h),0)}
game.lastNightDeaths=[...new Set(deaths)];if(game.lastNightDeaths.length) speak('朝になりました。みなさん目を覚ましてください。残念ながら、犠牲者がいます。');else speak('朝になりました。みなさん目を覚ましてください。昨夜は誰も亡くなっていません。');
if(checkGameEnd())return;setTimeout(renderDay,500)}
function hunterPrompt(name){if(!assignment(name)||assignment(name).alive)return;let arr=alive();if(!arr.length)return;openModal(`<h2>🏹 ${esc(name)}さんのハンター能力</h2><p>道連れにする人を1人選んでください。</p>${targets(arr,'hunter:'+encodeURIComponent(name))}`)}
function closeModal(){ $('modal').classList.remove('show') }
function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('show')}
function renderDay(){show('screen-day');let deaths=game.lastNightDeaths;let txt=deaths.length?deaths.map(n=>`${esc(n)}さんが亡くなってしまいました。`).join('<br>'):'昨夜は誰も亡くなっていません。';$('morningText').innerHTML=`<div class="result-card">${txt}<br><br>お昼です。議論スタート。</div>`;let aliveNames=alive().map(a=>a.player);$('dayContent').innerHTML=`<div class="timer" id="timer">${game.discussionMinutes?game.discussionMinutes+':00':'∞'}</div><div class="center"><button onclick="startVote()">🗳️ 投票へ</button>${aliveRole('dictator').length&&!game.dictatorUsed?'<button class="warn" onclick="dictatorMode()">👑 独裁者</button>':''}${aliveRole('shadow').length&&!game.shadowUsed?'<button class="warn" onclick="shadowMode()">🥷 影武者</button>':''}</div>`;if(game.discussionMinutes)startTimer()}
let timerId=null;function startTimer(){clearInterval(timerId);let s=game.discussionMinutes*60;timerId=setInterval(()=>{let m=Math.floor(s/60),q=String(s%60).padStart(2,'0');if($('timer'))$('timer').textContent=`${m}:${q}`;if(--s<0){clearInterval(timerId);speak('議論終了です。投票を開始してください。');startVote()}},1000)}
function dictatorMode(){let d=aliveRole('dictator')[0];openModal(`<h2>👑 独裁者</h2><p>追放する人を選んでください。</p>${targets(alive().filter(a=>a.player!==d.player),'dictator')}`)}
function shadowMode(){game.shadowUsed=true;let s=aliveRole('shadow')[0];s.alive=false;game.lastExecuted=s;renderDay();speak('影武者の効果により議論を終了します。影武者が追放されました。');setTimeout(()=>startNight(),1000)}
function startVote(){clearInterval(timerId);show('screen-vote');let voters=alive();let i=0;let votes=[];function next(){if(i>=voters.length){resolveVotes(votes);return}let v=voters[i];$('voteContent').innerHTML=`<h3>${esc(v.player)}さんの投票</h3><p>他の人は画面を見ないでください。</p><div class="vote-grid">${alive().filter(a=>a.player!==v.player).map(a=>`<button onclick="cast('${encodeURIComponent(v.player)}','${encodeURIComponent(a.player)}')">${esc(a.player)}</button>`).join('')}</div>`;window.cast=(vp,tp)=>{votes.push({voter:decodeURIComponent(vp),target:decodeURIComponent(tp),weight:assignment(decodeURIComponent(vp)).role.id==='king'?2:1});i++;next()}}next()}
function resolveVotes(votes){let counts={};votes.forEach(v=>counts[v.target]=(counts[v.target]||0)+v.weight);let max=Math.max(...Object.values(counts),0),top=Object.keys(counts).filter(k=>counts[k]===max);if(top.length>1){$('voteContent').innerHTML=`<div class="result-card">同票です。決戦投票を行います。</div><button onclick="runRunoff(${JSON.stringify(top).replace(/</g,'\\u003c')})">決戦投票へ</button>`;return}execute(top[0])}
function runRunoff(top){let voters=alive(),i=0,votes=[];function next(){if(i>=voters.length){let c={};votes.forEach(v=>c[v.target]=(c[v.target]||0)+1);let m=Math.max(...Object.values(c),0),w=Object.keys(c).filter(k=>c[k]===m);if(w.length!==1){$('voteContent').innerHTML='<div class="result-card">決戦投票も同票のため、追放なし。</div><button onclick="afterDay()">夜へ</button>'}else execute(w[0]);return}let v=voters[i];$('voteContent').innerHTML=`<h3>決戦投票：${esc(v.player)}さん</h3><div class="vote-grid">${top.filter(n=>n!==v.player).map(n=>`<button onclick="runCast('${encodeURIComponent(n)}')">${esc(n)}</button>`).join('')}</div>`;window.runCast=t=>{votes.push({voter:v.player,target:decodeURIComponent(t)});i++;next()}}next()}
function execute(name){if(!name){afterDay();return}let a=assignment(name);if(!a){afterDay();return}a.alive=false;a.deathDay=game.nightNumber;game.lastExecuted=a;renderVoteResult(`${esc(name)}さんが追放されました。`);if(a.role.id==='hunter')setTimeout(()=>hunterPrompt(name),400);if(a.role.id==='tough'&&a.toughPending)a.toughPending=false;if(checkGameEnd())return;setTimeout(afterDay,1000)}
function renderVoteResult(t){$('voteContent').innerHTML=`<div class="result-card">${t}</div>`}
function afterDay(){if(checkGameEnd())return;startNight()}
function checkGameEnd(){let allSc=game.roleAssignments.filter(a=>a.role.id==='scarecrow');if(allSc.length&&allSc.every(a=>!a.alive))return endGame('🪵 案山子陣営の勝利！',allSc.map(a=>a.player));let gods=game.roleAssignments.filter(a=>['android','god'].includes(a.role.id)&&a.alive);if(gods.length&&gods.some(a=>androidWin(a)||a.role.id==='god'))return endGame('🤖✨ アンドロイド・神様の勝利！',gods.filter(a=>androidWin(a)||a.role.id==='god').map(a=>a.player));let fox=game.roleAssignments.filter(a=>a.role.id==='fox'&&a.alive);if(fox.length&&baseEnd())return endGame('🦊 妖狐の勝利！',fox.map(a=>a.player));let lovers=game.roleAssignments.filter(a=>a.role.id==='lover');if(lovers.length&&lovers.length%2===0){let pairs=[];for(let i=0;i<lovers.length;i+=2){if(lovers[i].alive&&lovers[i+1].alive)pairs.push([lovers[i],lovers[i+1]])}if(pairs.length&&baseEnd())return endGame('❤️ 恋人の勝利！',pairs.flat().map(a=>a.player))}if(baseEnd()){let wolves=game.roleAssignments.filter(a=>['werewolf','wolf_child','lone_wolf'].includes(a.role.id)&&a.alive);let nonW=game.roleAssignments.filter(a=>!['werewolf','wolf_child','lone_wolf'].includes(a.role.id)&&a.alive);return endGame(wolves.length?'🐺 人狼陣営の勝利！':'👤 市民陣営の勝利！',wolves.length?wolves.map(a=>a.player):nonW.map(a=>a.player))}return false}
function androidWin(a){if(!a.alive||!game.androidTarget)return false;let cp=assignment(game.androidTarget);return cp&&cp.alive&&baseEndForTeam(cp.role.team)}
function baseEndForTeam(team){let aliveA=alive();if(team==='wolf'||team==='lone')return aliveA.filter(a=>['werewolf','wolf_child','lone_wolf'].includes(a.role.id)).length>=aliveA.filter(a=>!['werewolf','wolf_child','lone_wolf'].includes(a.role.id)).length;return false}
function baseEnd(){let a=alive();let wolves=a.filter(x=>['werewolf','wolf_child','lone_wolf'].includes(x.role.id)).length;let others=a.length-wolves;return wolves===0||wolves>=others}
function endGame(title,winners){show('screen-end');$('endContent').innerHTML=`<h2>${title}</h2><p>${winners.map(esc).join('、')}</p><hr><h3>役職一覧</h3>${game.roleAssignments.map(a=>`<div class="listrow"><span>${esc(a.player)}</span><span>${a.role.icon} ${a.role.name}</span></div>`).join('')}`;speak(title)}
initSetup();
</script>
</body>
</html>
