<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:20px;

  text-align:center;

}

.container{

  max-width:680px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{

  margin-top:0;

}

input,button,select{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{

  display:none;

}

.info{

  font-size:18px;

  line-height:1.7;

}

.mode-box{

  display:flex;

  justify-content:center;

  gap:15px;

  margin:15px 0;

  flex-wrap:wrap;

}

.mode-option{

  border:2px solid #ddd;

  border-radius:15px;

  padding:15px;

  min-width:130px;

  cursor:pointer;

}

.mode-option.selected{

  border-color:#333;

  background:#f0f0f0;

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{

  color:green;

}

.ng{

  color:red;

}

.player-box{

  margin:15px 0;

}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:23px;

  font-weight:bold;

  margin-top:15px;

}

.wolf-info{

  color:#555;

  font-size:20px;

  font-weight:bold;

  margin-top:15px;

}

.lover-partner{

  font-size:20px;

  margin-top:8px;

}

.card-box,

.action-box{

  margin:20px 0;

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

}

.card-select{

  width:90%;

  max-width:450px;

}

.status{

  font-size:18px;

  font-weight:bold;

  margin:15px;

}

.warning{

  color:#c00;

  font-weight:bold;

}

.success{

  color:green;

  font-weight:bold;

}

.error-box{

  background:#fff0f0;

  border:2px solid #d33;

  border-radius:15px;

  padding:15px;

  margin:20px 0;

}

.choice{

  display:block;

  width:90%;

  max-width:500px;

  margin:10px auto;

}

.result{

  font-size:24px;

  font-weight:bold;

  margin:20px;

}

.vote-player{

  padding:15px;

  margin:10px 0;

  border:2px solid #ddd;

  border-radius:12px;

}

.vote-player select{

  width:90%;

  max-width:400px;

}

.small{

  font-size:14px;

  color:#666;

}

hr{

  border:none;

  border-top:1px solid #ddd;

  margin:25px 0;

}

/* タイマー */

.timer-box{

  margin:20px 0;

  padding:20px;

  border:3px solid #333;

  border-radius:18px;

  background:#fafafa;

}

.timer{

  font-size:60px;

  font-weight:bold;

  margin:10px;

  letter-spacing:3px;

}

.timer.warning-time{

  color:#c00;

}

.timer-buttons button{

  min-width:150px;

}

.debate-finished{

  font-size:20px;

  font-weight:bold;

  margin:15px;

}

.voice-box{

  margin:15px 0;

  padding:12px;

  background:#f0f0f0;

  border-radius:12px;

  font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- =========================

     ゲーム設定

========================= -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>🎮 ゲームモード</h3>

<div class="mode-box">

<label

 class="mode-option selected"

 id="modeNoCard"

>

<input

 type="radio"

 name="gameMode"

 value="noCard"

 checked

 onchange="changeGameMode()"

>

📱 カードなし

</label>

<label

 class="mode-option"

 id="modeCard"

>

<input

 type="radio"

 name="gameMode"

 value="card"

 onchange="changeGameMode()"

>

🃏 カードあり

</label>

</div>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>⏱️ 昼の議論時間</h3>

<select id="discussionTime">

<option value="60">1分</option>

<option value="180">3分</option>

<option value="300" selected>5分</option>

<option value="600">10分</option>

<option value="900">15分</option>

</select>

<h3>🎭 今回使う役職</h3>

<div

 id="totalDisplay"

 class="total ng"

>

配役：0 / 6人

</div>

<div

 id="roleList"

 class="role-list"

></div>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- =========================

     プレイヤー名

========================= -->

<div

 id="playerSetup"

 class="hidden"

>

<h2>👥 プレイヤー名</h2>

<p>

プレイヤーの名前を入力してください。

</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- =========================

     カード入力

========================= -->

<div

 id="cardSetup"

 class="hidden"

>

<h2>🃏 カード登録</h2>

<div id="cardPlayerTitle"></div>

<div class="card-box">

<p class="info">

このプレイヤーに実際に配ったカードを選んでください。

</p>

<select

 id="cardSelect"

 class="card-select"

 onchange="cardSelectionChanged()"

>

<option value="">

配られたカードを選択してください

</option>

</select>

<div

 id="cardStatus"

 class="status"

></div>

</div>

<button

 id="cardNextButton"

 onclick="confirmCard()"

 disabled

>

このカードで登録

</button>

</div>

<!-- =========================

     カード確認

========================= -->

<div

 id="cardCheck"

 class="hidden"

>

<h2>🔍 カードを確認しています</h2>

<div id="cardCheckResult"></div>

<button

 id="retryCardButton"

 onclick="retryCardInput()"

 class="hidden"

>

最初の人からもう一度入力

</button>

<button

 id="cardCheckNextButton"

 onclick="finishCardCheck()"

 class="hidden"

>

役職確認へ

</button>

</div>

<!-- =========================

     役職確認

========================= -->

<div

 id="game"

 class="hidden"

>

<h2 id="playerTitle"></h2>

<div

 id="roleArea"

 class="role"

>

？？？

</div>

<div id="loverArea"></div>

<p

 id="info"

 class="info"

>

役職を見るボタンを押してください。

</p>

<div id="privateAction"></div>

<button

 id="mainButton"

 onclick="showRole()"

>

役職を見る

</button>

</div>

<!-- =========================

     昼

========================= -->

<div

 id="day"

 class="hidden"

>

<h2>☀️ 昼の時間</h2>

<div

 id="dayInfo"

 class="info"

></div>

<hr>

<div id="morningAction"></div>

<div

 id="discussionArea"

 class="hidden"

>

<div class="timer-box">

<h3>⏱️ 議論タイマー</h3>

<div

 id="timerDisplay"

 class="timer"

>

05:00

</div>

<div class="timer-buttons">

<button

 onclick="startDiscussionTimer()"

 id="timerStartButton"

>

▶️ 議論スタート

</button>

<button

 onclick="finishDiscussionEarly()"

>

議論を終えて投票へ

</button>

</div>

<div

 id="timerStatus"

 class="small"

>

「議論スタート」を押してください。

</div>

</div>

</div>

</div>

<!-- =========================

     投票

========================= -->

<div

 id="vote"

 class="hidden"

>

<h2>🗳️ 投票</h2>

<p

 id="voteInstruction"

 class="info"

></p>

<div id="votePlayers"></div>

<button onclick="finishVoting()">

⚖️ 投票を集計する

</button>

</div>

<!-- =========================

     投票結果

========================= -->

<div

 id="voteResult"

 class="hidden"

>

<h2>⚖️ 投票結果</h2>

<div

 id="voteResultText"

 class="info"

></div>

<button onclick="afterVote()">

次へ

</button>

</div>

<!-- =========================

     夜開始

========================= -->

<div

 id="gameReady"

 class="hidden"

>

<h2>🌙 夜の時間</h2>

<p class="info">

昼の議論と投票が終了しました。

</p>

<button onclick="startNight()">

🌙 夜を開始

</button>

</div>

<!-- =========================

     夜

========================= -->

<div

 id="night"

 class="hidden"

>

<h2 id="nightTitle">

🌙 夜

</h2>

<div

 id="nightInfo"

 class="info"

></div>

<div

 id="nightAction"

 class="action-box"

></div>

</div>

<!-- =========================

     ゲーム終了

========================= -->

<div

 id="gameOver"

 class="hidden"

>

<h2>🏆 ゲーム終了</h2>

<div

 id="winner"

 class="result"

></div>

</div>

</div>

<script>

/* ==================================================

   役職一覧

================================================== */

const ROLES = [

 ["werewolf","🐺 人狼"],

 ["wolfChild","👶 人狼の子ども"],

 ["betrayer","😈 裏切り者"],

 ["betrayShared","🤝 裏切りの共有者"],

 ["informant","👁️ 内通者"],

 ["betrayAttacker","⚔️ 裏切りの襲撃者"],

 ["spy","🕵️ スパイ"],

 ["villager","👤 市民"],

 ["seer","🔮 預言者"],

 ["bodyguard","🛡️ ボディーガード"],

 ["medium","👻 霊媒師"],

 ["hunter","🔫 ハンター"],

 ["shared","🤝 共有者"],

 ["dictator","👑 独裁者"],

 ["tough","💪 タフガイ"],

 ["counselor","🩺 カウンセラー"],

 ["magician","🎩 奇術師"],

 ["trapper","🪤 罠師"],

 ["knights","🛡️ 騎士団"],

 ["shadow","🪞 影武者"],

 ["king","👑 王様"],

 ["cursed","🧟 呪われた者"],

 ["fox","🦊 妖狐"],

 ["god","🙏 神様"],

 ["lover","❤️ 恋人"],

 ["loneWolf","🐺 一匹狼"],

 ["android","🤖 アンドロイド"],

 ["scarecrow","🌾 案山子"]

];

/* ==================================================

   変数

================================================== */

let roleCounts={};

let players=[];

let selectedRoles=[];

let currentPlayer=0;

let currentCardPlayer=0;

let loverMode=false;

let gameMode="noCard";

let day=1;

let nightStep=0;

let nightData={};

let voteData={};

let discussionSeconds=300;

let discussionTimer=null;

let lastNightDeaths=[];

let lastNightDeathIds=[];

/* ==================================================

   人狼

================================================== */

const WOLF_ROLES=[

 "werewolf",

 "wolfChild",

 "loneWolf"

];

/* ==================================================

   裏切り者系

================================================== */

const BETRAYER_ROLES=[

 "betrayer",

 "betrayShared",

 "informant",

 "betrayAttacker"

];

/* ==================================================

   共通

================================================== */

function $(id){

 return document.getElementById(id);

}

function escapeHtml(text){

 return String(text)

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}

function getRoleName(id){

 const role=ROLES.find(

   r=>r[0]===id

 );

 return role

   ? role[1]

   : "不明";

}

function isWolf(player){

 return WOLF_ROLES.includes(

   player.roleId

 );

}

function isBetrayer(player){

 return BETRAYER_ROLES.includes(

   player.roleId

 );

}

function alivePlayers(){

 return players.filter(

   p=>p.alive

 );

}

function getTargets(excludeId=null){

 return alivePlayers().filter(

   p=>p.id!==excludeId

 );

}

/* ==================================================

   GM音声

================================================== */

function speak(text){

 if(!("speechSynthesis" in window)){

   return;

 }

 window.speechSynthesis.cancel();

 const utterance=

 new SpeechSynthesisUtterance(text);

 utterance.lang="ja-JP";

 utterance.rate=0.9;

 utterance.pitch=1;

 window.speechSynthesis.speak(

   utterance

 );

}

function stopVoice(){

 if("speechSynthesis" in window){

   window.speechSynthesis.cancel();

 }

}

/* ==================================================

   ゲームモード

================================================== */

function changeGameMode(){

 gameMode=

 document.querySelector(

   'input[name="gameMode"]:checked'

 ).value;

 $("modeNoCard")

 .classList.toggle(

   "selected",

   gameMode==="noCard"

 );

 $("modeCard")

 .classList.toggle(

   "selected",

   gameMode==="card"

 );

}

/* ==================================================

   恋人モード

================================================== */

function updateLoverMode(){

 loverMode=

 document.querySelector(

   'input[name="loverMode"]:checked'

 ).value==="true";

 renderRoleList();

}

/* ==================================================

   役職人数初期化

================================================== */

function resetRoleCounts(){

 roleCounts={};

 ROLES.forEach(

   role=>{

     roleCounts[role[0]]=0;

   }

 );

 renderRoleList();

}

/* ==================================================

   役職一覧

================================================== */

function renderRoleList(){

 const list=$("roleList");

 list.innerHTML="";

 ROLES.forEach(role=>{

   const id=role[0];

   if(

     id==="lover" &&

     loverMode

   ){

     return;

   }

   list.innerHTML+=`

   <div class="role-item">

    <div class="role-name">

      ${role[1]}

    </div>

    <div class="counter">

      <button

       onclick="changeRoleCount('${id}',-1)"

      >

       −

      </button>

      <div class="count">

       ${roleCounts[id]||0}

      </div>

      <button

       onclick="changeRoleCount('${id}',1)"

      >

       ＋

      </button>

    </div>

   </div>

   `;

 });

 updateTotal();

}

/* ==================================================

   役職人数変更

================================================== */

function changeRoleCount(id,change){

 const playerCount=

 Number($("playerCount").value);

 const next=

 (roleCounts[id]||0)+change;

 if(next<0)return;

 if(next>playerCount)return;

 roleCounts[id]=next;

 renderRoleList();

}

/* ==================================================

   合計

================================================== */

function updateTotal(){

 const playerCount=

 Number($("playerCount").value);

 let total=0;

 Object.entries(roleCounts)

 .forEach(

   ([id,count])=>{

     if(

       id==="lover" &&

       loverMode

     ){

       return;

     }

     total+=count;

   }

 );

 $("totalDisplay")

 .textContent=

 `配役：${total} / ${playerCount}人`;

 $("totalDisplay")

 .className=

 "total "+

 (

   total===playerCount

   ?"ok"

   :"ng"

 );

 $("nextButton")

 .disabled=

 total!==playerCount;

}

/* ==================================================

   プレイヤー準備

================================================== */

function preparePlayers(){

 const count=

 Number($("playerCount").value);

 if(count<4 || count>20){

   alert(

    "4人〜20人で入力してください。"

   );

   return;

 }

 selectedRoles=[];

 ROLES.forEach(role=>{

   const id=role[0];

   if(

     id==="lover" &&

     loverMode

   ){

     return;

   }

   const count=

   roleCounts[id]||0;

   for(

     let i=0;

     i<count;

     i++

   ){

     selectedRoles.push(id);

   }

 });

 const area=$("playerInputs");

 area.innerHTML="";

 for(

   let i=0;

   i<count;

   i++

 ){

   const oldName=

   localStorage.getItem(

     "jinroPlayer"+i

   )||"";

   area.innerHTML+=`

   <div class="player-box">

    <label>

     プレイヤー${i+1}

    </label>

    <br>

    <input

     id="playerName${i}"

     type="text"

     maxlength="20"

     placeholder="名前を入力"

     value="${escapeHtml(oldName)}"

    >

   </div>

   `;

 }

 $("setup").classList.add("hidden");

 $("playerSetup")

 .classList.remove("hidden");

}

/* ==================================================

   ゲーム開始

================================================== */

function startGame(){

 const names=[];

 for(

   let i=0;

   i<selectedRoles.length;

   i++

 ){

   const input=$("playerName"+i);

   const name=input.value.trim();

   if(!name){

     alert(

       `プレイヤー${i+1}の名前を入力してください。`

     );

     input.focus();

     return;

   }

   names.push(name);

   localStorage.setItem(

     "jinroPlayer"+i,

     name

   );

 }

 players=

 names.map(

   (name,index)=>({

     id:index,

     name:name,

     roleId:null,

     alive:true,

     lover:false,

     loverPartner:null,

     abilitiesUsed:{},

     lastTrapTarget:null,

     copiedRole:null,

     cursedAwakened:false,

     toughHit:false,

     lastDeathReason:null,

     hunterUsed:false

   })

 );

 if(gameMode==="noCard"){

   assignRandomRoles();

   finishRoleAssignment();

   return;

 }

 currentCardPlayer=0;

 $("playerSetup")

 .classList.add("hidden");

 $("cardSetup")

 .classList.remove("hidden");

 showCardPlayer();

}

/* ==================================================

   ランダム配役

================================================== */

function assignRandomRoles(){

 const shuffled=

 [...selectedRoles]

 .sort(

   ()=>Math.random()-0.5

 );

 players.forEach(

   (player,index)=>{

     player.roleId=

     shuffled[index];

   }

 );

}

/* ==================================================

   カード入力

================================================== */

function showCardPlayer(){

 const player=

 players[currentCardPlayer];

 $("cardPlayerTitle")

 .innerHTML=

 `<h3>${escapeHtml(player.name)} さん</h3>`;

 $("cardSelect").innerHTML=

 `<option value="">

 配られたカードを選択してください

 </option>`;

 ROLES.forEach(role=>{

   if(

     role[0]==="lover" &&

     loverMode

   ){

     return;

   }

   const option=

   document.createElement("option");

   option.value=role[0];

   option.textContent=role[1];

   $("cardSelect")

   .appendChild(option);

 });

 $("cardStatus")

 .textContent=

 "配られたカードを選択してください。";

 $("cardNextButton")

 .disabled=true;

}

/* ==================================================

   カード選択

================================================== */

function cardSelectionChanged(){

 const value=

 $("cardSelect").value;

 $("cardNextButton")

 .disabled=!value;

}

/* ==================================================

   カード登録

================================================== */

function confirmCard(){

 const roleId=

 $("cardSelect").value;

 if(!roleId)return;

 players[

   currentCardPlayer

 ].roleId=roleId;

 currentCardPlayer++;

 if(

   currentCardPlayer<

   players.length

 ){

   showCardPlayer();

   return;

 }

 $("cardSetup")

 .classList.add("hidden");

 $("cardCheck")

 .classList.remove("hidden");

 checkCards();

}

/* ==================================================

   カード確認

================================================== */

function checkCards(){

 const enteredCounts={};

 ROLES.forEach(

   role=>{

     enteredCounts[role[0]]=0;

   }

 );

 players.forEach(

   player=>{

     if(player.roleId){

       enteredCounts[player.roleId]++;

     }

   }

 );

 let correct=true;

 let messages=[];

 ROLES.forEach(role=>{

   const id=role[0];

   if(

     id==="lover" &&

     loverMode

   ){

     return;

   }

   const expected=

   roleCounts[id]||0;

   const entered=

   enteredCounts[id]||0;

   if(expected!==entered){

     correct=false;

     messages.push(

       `${role[1]}：設定 ${expected}枚 / 入力 ${entered}枚`

     );

   }

 });

 if(correct){

   $("cardCheckResult")

   .innerHTML=`

   <div class="success">

    🎉 カード登録完了！

   </div>

   <p>

    設定した役職と入力したカードが一致しました。

   </p>

   `;

   $("cardCheckNextButton")

   .classList.remove("hidden");

   $("retryCardButton")

   .classList.add("hidden");

 }else{

   $("cardCheckResult")

   .innerHTML=`

   <div class="error-box">

    <div class="warning">

     ❌ カードの枚数が一致しません。

    </div>

    <p>

/* ==================================================

================================================== */

function finishVoting(){

 const alive=

 alivePlayers();

 const counts={};

 alive.forEach(

   p=>{

     counts[p.id]=0;

   }

 );

 for(

   const voter of alive

 ){

   const select=

   $(`vote-${voter.id}`);

   if(!select.value){

     alert(

       `${voter.name}さんの投票先を選択してください。`

     );

     select.focus();

     return;

   }

   const targetId=

   Number(select.value);

   /*

    王様は2票

   */

   const voteCount=

   voter.roleId==="king"

   ?2

   :1;

   counts[targetId]+=voteCount;

 }

 let max=0;

 Object.values(counts)

 .forEach(

   count=>{

     if(count>max){

       max=count;

     }

   }

 );

 const top=

 Object.entries(counts)

 .filter(

   ([id,count])=>

     count===max

 )

 .map(

   ([id])=>Number(id)

 );

 let resultText="";

 resultText+=`

 <h3>🗳️ 投票結果</h3>

 `;

 alive.forEach(

   p=>{

     resultText+=

     `<p>

      ${escapeHtml(p.name)}：

      <strong>${counts[p.id]}票</strong>

     </p>`;

   }

 );

 if(top.length>=2){

   resultText+=`

   <hr>

   <div class="warning">

    ⚠️ 同票のため、今回は追放なしです。

   </div>

   `;

 }else{

   const target=

   players.find(

     p=>p.id===top[0]

   );

   resultText+=`

   <hr>

   <div class="result">

    ⚖️ ${escapeHtml(target.name)}さんが追放されました。

   </div>

   `;

   eliminatePlayer(

     target,

     "vote"

   );

   /*

    ハンターの場合だけ役職を表示

   */

   if(target.roleId==="hunter"){

     resultText+=`

     <p class="warning">

      🔫 ${escapeHtml(target.name)}さんは

      ハンターでした。

     </p>

     `;

   }else{

     resultText+=`

     <p class="small">

      ※役職は公開されません。

     </p>

     `;

   }

 }

 $("vote")

 .classList.add("hidden");

 $("voteResult")

 .classList.remove("hidden");

 $("voteResultText")

 .innerHTML=resultText;

}

/* ==================================================

   夜の対象ボタン

================================================== */

function showTargetButtons(

 title,

 targets,

 functionName

){

 let html=

 `<h3>${title}</h3>`;

 targets.forEach(

   target=>{

     html+=`

     <button

       class="choice"

       onclick="${functionName}(${target.id})"

     >

       ${escapeHtml(target.name)}

     </button>

     `;

   }

 );

 $("nightAction")

 .innerHTML=html;

}

/* ==================================================

   夜終了

================================================== */

function finishNight(){

 let attackTargets=[];

 if(

   nightData.wolfAttack!==null &&

   nightData.wolfAttack!==undefined

 ){

   attackTargets.push(

     nightData.wolfAttack

   );

 }

 if(

   nightData.betrayAttack!==null &&

   nightData.betrayAttack!==undefined

 ){

   attackTargets.push(

     nightData.betrayAttack

   );

 }

 /*

  奇術師

 */

 if(

   nightData.changedTarget!==null &&

   nightData.changedTarget!==undefined

 ){

   attackTargets=[

     nightData.changedTarget

   ];

 }

 attackTargets=[

   ...new Set(attackTargets)

 ];

 /*

  妖狐の占い死亡

 */

 players.forEach(

   target=>{

     if(

       target.alive &&

       target.roleId==="fox" &&

       target.foxDivined

     ){

       target.alive=false;

       target.lastDeathReason=

       "seer";

       target.foxDivined=false;

       lastNightDeaths.push(target);

     }

   }

 );

 /*

  襲撃処理

 */

 attackTargets.forEach(

   targetId=>{

     const target=

     players.find(

       p=>p.id===targetId

     );

     if(

       !target ||

       !target.alive

     ){

       return;

     }

     /*

      妖狐

     */

     if(

       target.roleId==="fox"

     ){

       return;

     }

     /*

      ボディーガード

     */

     if(

       nightData.bodyguard===

       target.id

     ){

       return;

     }

     /*

      騎士団

     */

     if(

       nightData.knights===

       target.id

     ){

       return;

     }

     /*

      罠

     */

     if(

       nightData.trap===

       target.id

     ){

       const wolves=

       players.filter(

         p=>

           p.alive &&

           isWolf(p)

       );

       if(wolves.length){

         const randomWolf=

         wolves[

           Math.floor(

             Math.random()*

             wolves.length

           )

         ];

         randomWolf.alive=false;

         randomWolf.lastDeathReason=

         "trap";

         lastNightDeaths.push(

           randomWolf

         );

       }

       return;

     }

     /*

      呪われた者

     */

     if(

       target.roleId==="cursed"

     ){

       target.cursedAwakened=true;

       return;

     }

     /*

      タフガイ

     */

     if(

       target.roleId==="tough" &&

       !target.toughHit

     ){

       target.toughHit=true;

       return;

     }

     /*

      通常死亡

     */

     eliminatePlayer(

       target,

       "night"

     );

     lastNightDeaths.push(

       target

     );

   }

 );

 /*

  恋人後追い

 */

 players.forEach(

   p=>{

     if(

       !p.alive &&

       p.lover

     ){

       const partner=

       players.find(

         x=>

           x.name===p.loverPartner &&

           x.alive

       );

       if(

         partner &&

         partner.alive

       ){

         partner.alive=false;

         partner.lastDeathReason=

         "lover";

         lastNightDeaths.push(

           partner

         );

       }

     }

   }

 );

 /*

  重複削除

 */

 lastNightDeaths=[

   ...new Map(

     lastNightDeaths.map(

       p=>[p.id,p]

     )

   ).values()

 ];

 lastNightDeathIds=

 lastNightDeaths.map(

   p=>p.id

 );

 $("night")

 .classList.add("hidden");

 if(checkWin()){

   return;

 }

 day++;

 startDayAfterNight();

}

/* ==================================================

   翌朝

================================================== */

function startDayAfterNight(){

 $("day")

 .classList.remove("hidden");

 $("discussionArea")

 .classList.add("hidden");

 let deathText="";

 if(lastNightDeaths.length){

   deathText=

   lastNightDeaths

   .map(

     p=>

     `残念ながら${escapeHtml(p.name)}さんが亡くなってしまいました。`

   )

   .join("<br>");

 }else{

   deathText=

   "今夜は亡くなった人はいません。";

 }

 $("dayInfo")

 .innerHTML=`

 <h3>🌅 朝になりました</h3>

 <p>

 みなさん目を覚ましてください。

 </p>

 <div class="result">

 ${deathText}

 </div>

 <p>

 お昼です。議論を始めます。

 </p>

 `;

 $("morningAction")

 .innerHTML=`

 <div class="action-box">

  <button

   onclick="startDayDiscussion()"

  >

   ☀️ お昼です。議論スタート

  </button>

 </div>

 `;

 /*

  死亡者をGMが読み上げる

 */

 speak(

   "朝になりました。みなさん目を覚ましてください。"

 );

 setTimeout(

   ()=>{

     if(lastNightDeaths.length){

       lastNightDeaths.forEach(

         (p,index)=>{

           setTimeout(

             ()=>{

               speak(

                 `残念ながら${p.name}さんが亡くなってしまいました。`

               );

             },

             index*2200

           );

         }

       );

     }else{

       setTimeout(

         ()=>{

           speak(

             "今夜は亡くなった人はいません。"

           );

         },

         1000

       );

     }

     const delay=

     lastNightDeaths.length

     ?lastNightDeaths.length*2200+1000

     :2500;

     setTimeout(

       ()=>{

         speak(

           "お昼です。議論をスタートしてください。"

         );

       },

       delay

     );

   },

   1500

 );

}
