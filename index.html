<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:20px;

  text-align:center;

}

.container{

  max-width:680px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{margin-top:0}

input,button,select{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{display:none}

.info{

  font-size:18px;

  line-height:1.7;

}

.mode-box{

  display:flex;

  justify-content:center;

  gap:15px;

  margin:15px 0;

  flex-wrap:wrap;

}

.mode-option{

  border:2px solid #ddd;

  border-radius:15px;

  padding:15px;

  min-width:130px;

  cursor:pointer;

}

.mode-option.selected{

  border-color:#333;

  background:#f0f0f0;

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{color:green}

.ng{color:red}

.player-box{

  margin:15px 0;

}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:23px;

  font-weight:bold;

  margin-top:15px;

}

.wolf-info{

  color:#555;

  font-size:20px;

  font-weight:bold;

  margin-top:15px;

}

.lover-partner{

  font-size:20px;

  margin-top:8px;

}

.card-box,

.action-box{

  margin:20px 0;

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

}

.card-select{

  width:90%;

  max-width:450px;

}

.status{

  font-size:18px;

  font-weight:bold;

  margin:15px;

}

.warning{

  color:#c00;

  font-weight:bold;

}

.success{

  color:green;

  font-weight:bold;

}

.error-box{

  background:#fff0f0;

  border:2px solid #d33;

  border-radius:15px;

  padding:15px;

  margin:20px 0;

}

.choice{

  display:block;

  width:90%;

  max-width:500px;

  margin:10px auto;

}

.result{

  font-size:24px;

  font-weight:bold;

  margin:20px;

}

.vote-player{

  padding:15px;

  margin:10px 0;

  border:2px solid #ddd;

  border-radius:12px;

}

.vote-player select{

  width:90%;

  max-width:400px;

}

.small{

  font-size:14px;

  color:#666;

}

hr{

  border:none;

  border-top:1px solid #ddd;

  margin:25px 0;

}

/* タイマー */

.timer{

  font-size:56px;

  font-weight:bold;

  margin:20px 0;

}

.timer.running{

  font-size:64px;

}

.timer-box{

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

  margin:20px 0;

}

/* 強制終了ボタン */

.force-end{

  background:#8b0000;

}

/* GM表示 */

.gm-message{

  font-size:24px;

  font-weight:bold;

  line-height:1.6;

  margin:25px 0;

}

/* 死亡 */

.death-message{

  font-size:25px;

  font-weight:bold;

  margin:25px 0;

}

/* ハンター */

.hunter-box{

  border:3px solid #333;

  border-radius:15px;

  padding:20px;

  margin:20px 0;

  background:#fafafa;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- =========================

ゲーム設定

========================= -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>🎮 ゲームモード</h3>

<div class="mode-box">

<label class="mode-option selected" id="modeNoCard">

<input

 type="radio"

 name="gameMode"

 value="noCard"

 checked

 onchange="changeGameMode()"

>

📱 カードなし

</label>

<label class="mode-option" id="modeCard">

<input

 type="radio"

 name="gameMode"

 value="card"

 onchange="changeGameMode()"

>

🃏 カードあり

</label>

</div>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>🎭 今回使う役職</h3>

<div id="totalDisplay" class="total ng">

配役：0 / 6人

</div>

<div id="roleList" class="role-list"></div>

<br>

<h3>⏱️ 昼の議論時間</h3>

<select id="discussionTime">

<option value="60">1分</option>

<option value="180">3分</option>

<option value="300" selected>5分</option>

<option value="600">10分</option>

<option value="900">15分</option>

</select>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- =========================

プレイヤー名

========================= -->

<div id="playerSetup" class="hidden">

<h2>👥 プレイヤー名</h2>

<p>プレイヤーの名前を入力してください。</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- =========================

カード入力

========================= -->

<div id="cardSetup" class="hidden">

<h2>🃏 カード登録</h2>

<div id="cardPlayerTitle"></div>

<div class="card-box">

<p class="info">

このプレイヤーに実際に配ったカードを選んでください。

</p>

<select

 id="cardSelect"

 class="card-select"

 onchange="cardSelectionChanged()"

>

<option value="">

配られたカードを選択してください

</option>

</select>

<div id="cardStatus" class="status"></div>

</div>

<button

 id="cardNextButton"

 onclick="confirmCard()"

 disabled

>

このカードで登録

</button>

</div>

<!-- =========================

カード確認

========================= -->

<div id="cardCheck" class="hidden">

<h2>🔍 カードを確認しています</h2>

<div id="cardCheckResult"></div>

<button

 id="retryCardButton"

 onclick="retryCardInput()"

 class="hidden"

>

最初の人からもう一度入力

</button>

<button

 id="cardCheckNextButton"

 onclick="finishCardCheck()"

 class="hidden"

>

役職確認へ

</button>

</div>

<!-- =========================

役職確認

========================= -->

<div id="game" class="hidden">

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

</div>

<div id="loverArea"></div>

<p id="info" class="info">

役職を見るボタンを押してください。

</p>

<div id="seerChoiceArea"></div>

<button

 id="mainButton"

 onclick="showRole()"

>

役職を見る

</button>

</div>

<!-- =========================

昼

========================= -->

<div id="day" class="hidden">

<h2>☀️ 昼の議論</h2>

<div id="dayInfo" class="info"></div>

<!-- 強制終了 -->

<div id="specialDayActions"></div>

<div class="timer-box">

<h3>⏱️ 議論タイマー</h3>

<div id="timer" class="timer">

05:00

</div>

<button onclick="startDiscussionTimer()">

▶️ 議論スタート

</button>

<button onclick="pauseDiscussionTimer()">

⏸️ 一時停止

</button>

<button onclick="resetDiscussionTimer()">

🔄 リセット

</button>

</div>

<button onclick="endDiscussion()">

🗳️ 議論を終了して投票へ

</button>

</div>

<!-- =========================

投票

========================= -->

<div id="vote" class="hidden">

<h2>🗳️ 投票</h2>

<p id="voteInstruction" class="info"></p>

<div id="votePlayers"></div>

<button onclick="finishVoting()">

⚖️ 投票を集計する

</button>

</div>

<!-- =========================

投票結果

========================= -->

<div id="voteResult" class="hidden">

<h2>⚖️ 投票結果</h2>

<div id="voteResultText" class="info"></div>

<button onclick="afterVote()">

次へ

</button>

</div>

<!-- =========================

夜開始

========================= -->

<div id="gameReady" class="hidden">

<h2>🌙 夜の時間</h2>

<p class="info">

昼の議論と投票が終了しました。

</p>

<button onclick="startNight()">

🌙 夜を開始

</button>

</div>

<!-- =========================

夜

========================= -->

<div id="night" class="hidden">

<h2 id="nightTitle">

🌙 夜

</h2>

<div id="nightInfo" class="gm-message"></div>

<div id="nightAction" class="action-box"></div>

</div>

<!-- =========================

ハンター

========================= -->

<div id="hunterAction" class="hidden">

<h2>🔫 ハンター</h2>

<div id="hunterInfo" class="hunter-box"></div>

</div>

<!-- =========================

ゲーム終了

========================= -->

<div id="gameOver" class="hidden">

<h2>🏆 ゲーム終了</h2>

<div id="winner" class="result"></div>

</div>

<script>

/* ==================================================

役職

================================================== */

const ROLES = [

["werewolf","🐺 人狼"],

["wolfChild","👶 人狼の子ども"],

["betrayer","😈 裏切り者"],

["betrayShared","🤝 裏切りの共有者"],

["informant","👁️ 内通者"],

["betrayAttacker","⚔️ 裏切りの襲撃者"],

["spy","🕵️ スパイ"],

["villager","👤 市民"],

["seer","🔮 預言者"],

["bodyguard","🛡️ ボディーガード"],

["medium","👻 霊媒師"],

["hunter","🔫 ハンター"],

["shared","🤝 共有者"],

["dictator","👑 独裁者"],

["tough","💪 タフガイ"],

["counselor","🩺 カウンセラー"],

["magician","🎩 奇術師"],

["trapper","🪤 罠師"],

["knights","🛡️ 騎士団"],

["shadow","🪞 影武者"],

["king","👑 王様"],

["cursed","🧟 呪われた者"],

["fox","🦊 妖狐"],

["god","🙏 神様"],

["lover","❤️ 恋人"],

["loneWolf","🐺 一匹狼"],

["android","🤖 アンドロイド"],

["scarecrow","🌾 案山子"]

];

/* ==================================================

陣営

================================================== */

const WOLF_ROLES=[

"werewolf",

"wolfChild",

"loneWolf"

];

const BETRAYER_ROLES=[

"betrayer",

"betrayShared",

"informant",

"betrayAttacker"

];

/* ==================================================

変数

================================================== */

let roleCounts={};

let players=[];

let selectedRoles=[];

let currentPlayer=0;

let currentCardPlayer=0;

let loverMode=false;

let gameMode="noCard";

let day=1;

let nightStep=0;

let nightData={};

let voteData={};

let discussionSeconds=300;

let timerInterval=null;

let currentNightDeaths=[];

/* ==================================================

共通

================================================== */

function $(id){

return document.getElementById(id);

}

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

function getRoleName(id){

const role=ROLES.find(r=>r[0]===id);

return role?role[1]:"不明";

}

function isWolf(player){

return WOLF_ROLES.includes(player.roleId);

}

function isBetrayer(player){

return BETRAYER_ROLES.includes(player.roleId);

}

function alivePlayers(){

return players.filter(p=>p.alive);

}

function getTargets(excludeId=null){

return alivePlayers().filter(p=>p.id!==excludeId);

}

/* ==================================================

GM音声

================================================== */

function speak(text){

if(!("speechSynthesis" in window)) return;

window.speechSynthesis.cancel();

const utterance=new SpeechSynthesisUtterance(text);

utterance.lang="ja-JP";

utterance.rate=0.95;

utterance.pitch=1;

window.speechSynthesis.speak(utterance);

}

/* ==================================================

ゲームモード

================================================== */

function changeGameMode(){

gameMode=document.querySelector(

'input[name="gameMode"]:checked'

).value;

$("modeNoCard").classList.toggle(

"selected",

gameMode==="noCard"

);

$("modeCard").classList.toggle(

"selected",

gameMode==="card"

);

}

/* ==================================================

恋人

================================================== */

function updateLoverMode(){

loverMode=

document.querySelector(

'input[name="loverMode"]:checked'

).value==="true";

renderRoleList();

}

/* ==================================================

役職初期化

================================================== */

function resetRoleCounts(){

roleCounts={};

ROLES.forEach(role=>{

roleCounts[role[0]]=0;

});

renderRoleList();

}

/* ==================================================

役職一覧

================================================== */

function renderRoleList(){

const list=$("roleList");

list.innerHTML="";

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode)return;

list.innerHTML+=`

<div class="role-item">

<div class="role-name">

${role[1]}

</div>

<div class="counter">

<button onclick="changeRoleCount('${id}',-1)">

−

</button>

<div class="count">

${roleCounts[id]||0}

</div>

<button onclick="changeRoleCount('${id}',1)">

＋

</button>

</div>

</div>

`;

});

updateTotal();

}

/* ==================================================

人数変更

================================================== */

function changeRoleCount(id,change){

const playerCount=Number($("playerCount").value);

const next=(roleCounts[id]||0)+change;

if(next<0)return;

if(next>playerCount)return;

roleCounts[id]=next;

renderRoleList();

}

/* ==================================================

合計

================================================== */

function updateTotal(){

const playerCount=Number($("playerCount").value);

let total=0;

Object.entries(roleCounts).forEach(([id,count])=>{

if(id==="lover" && loverMode)return;

total+=count;

});

$("totalDisplay").textContent=

`配役：${total} / ${playerCount}人`;

$("totalDisplay").className=

"total "+(total===playerCount?"ok":"ng");

$("nextButton").disabled=

total!==playerCount;

}

/* ==================================================

プレイヤー準備

================================================== */

function preparePlayers(){

const count=Number($("playerCount").value);

if(count<4 || count>20){

alert("4人〜20人で入力してください。");

return;

}

selectedRoles=[];

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode)return;

const count=roleCounts[id]||0;

for(let i=0;i<count;i++){

selectedRoles.push(id);

}

});

const area=$("playerInputs");

area.innerHTML="";

for(let i=0;i<count;i++){

const oldName=

localStorage.getItem("jinroPlayer"+i)||"";

area.innerHTML+=`

<div class="player-box">

<label>

プレイヤー${i+1}

</label>

<br>

<input

id="playerName${i}"

type="text"

maxlength="20"

placeholder="名前を入力"

value="${escapeHtml(oldName)}"

>

</div>

`;

}

$("setup").classList.add("hidden");

$("playerSetup").classList.remove("hidden");

}

/* ==================================================

ゲーム開始

================================================== */

function startGame(){

const names=[];

for(let i=0;i<selectedRoles.length;i++){

const input=$("playerName"+i);

const name=input.value.trim();

if(!name){

alert(

`プレイヤー${i+1}の名前を入力してください。`

);

input.focus();

return;

}

names.push(name);

localStorage.setItem(

"jinroPlayer"+i,

name

);

}

players=names.map((name,index)=>({

id:index,

name:name,

roleId:null,

alive:true,

lover:false,

loverPartner:null,

abilitiesUsed:{},

copiedRole:null,

cursedAwakened:false,

toughHit:false,

lastDeathReason:null,

loverFollowed:false

}));

if(gameMode==="noCard"){

assignRandomRoles();

finishRoleAssignment();

return;

}

currentCardPlayer=0;

$("playerSetup").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

/* ==================================================

ランダム配役

================================================== */

function assignRandomRoles(){

const shuffled=[...selectedRoles]

.sort(()=>Math.random()-0.5);

players.forEach((player,index)=>{

player.roleId=shuffled[index];

});

}

/* ==================================================

カード

================================================== */

function showCardPlayer(){

const player=players[currentCardPlayer];

$("cardPlayerTitle").innerHTML=

`<h3>${escapeHtml(player.name)} さん</h3>`;

$("cardSelect").innerHTML=`

<option value="">

配られたカードを選択してください

</option>

`;

ROLES.forEach(role=>{

if(role[0]==="lover" && loverMode)return;

const option=document.createElement("option");

option.value=role[0];

option.textContent=role[1];

$("cardSelect").appendChild(option);

});

$("cardStatus").textContent=

"配られたカードを選択してください。";

$("cardNextButton").disabled=true;

}

function cardSelectionChanged(){

$("cardNextButton").disabled=

!$("cardSelect").value;

}

function confirmCard(){

const roleId=$("cardSelect").value;

if(!roleId)return;

players[currentCardPlayer].roleId=roleId;

currentCardPlayer++;

if(currentCardPlayer<players.length){

showCardPlayer();

return;

}

$("cardSetup").classList.add("hidden");

$("cardCheck").classList.remove("hidden");

checkCards();

}

/* ==================================================

カード確認

================================================== */

function checkCards(){

const enteredCounts={};

ROLES.forEach(role=>{

enteredCounts[role[0]]=0;

});

players.forEach(player=>{

if(player.roleId){

enteredCounts[player.roleId]++;

}

});

let correct=true;

let messages=[];

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode)return;

const expected=roleCounts[id]||0;

const entered=enteredCounts[id]||0;

if(expected!==entered){

correct=false;

messages.push(

`${role[1]}：設定 ${expected}枚 / 入力 ${entered}枚`

);

}

});

if(correct){

$("cardCheckResult").innerHTML=`

<div class="success">

🎉 カード登録完了！

</div>

<p>

設定した役職と入力したカードが一致しました。

</p>

`;

$("cardCheckNextButton").classList.remove("hidden");

$("retryCardButton").classList.add("hidden");

}else{

$("cardCheckResult").innerHTML=`

<div class="error-box">

<div class="warning">

❌ カードの枚数が一致しません。

</div>

<p>

${messages.join("<br>")}

</p>

</div>

`;

$("retryCardButton").classList.remove("hidden");

$("cardCheckNextButton").classList.add("hidden");

}

}

function retryCardInput(){

players.forEach(player=>{

player.roleId=null;

});

currentCardPlayer=0;

$("cardCheck").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

function finishCardCheck(){

$("cardCheck").classList.add("hidden");

finishRoleAssignment();

}

/* ==================================================

役職決定

================================================== */

function finishRoleAssignment(){

if(loverMode){

const shuffled=[...players]

.sort(()=>Math.random()-0.5);

const a=shuffled[0];

const b=shuffled[1];

a.lover=true;

b.lover=true;

a.loverPartner=b.name;

b.loverPartner=a.name;

}

currentPlayer=0;

$("game").classList.remove("hidden");

showPlayer();

}

/* ==================================================

役職確認

================================================== */

function showPlayer(){

const player=players[currentPlayer];

$("playerTitle").textContent=

`${player.name} さん`;

$("roleArea").textContent="？？？";

$("loverArea").innerHTML="";

$("seerChoiceArea").innerHTML="";

$("info").textContent=

"役職を見るボタンを押してください。";

$("mainButton").style.display="inline-block";

$("mainButton").textContent="役職を見る";

$("mainButton").onclick=showRole;

}

/* ==================================================

役職表示

================================================== */

function showRole(){

const player=players[currentPlayer];

$("roleArea").textContent=

getRoleName(player.roleId);

let extra="";

/* 恋人 */

if(player.lover){

extra+=`

<div class="lover">

❤️ 恋人

</div>

<div class="lover-partner">

恋人：${escapeHtml(player.loverPartner)}

</div>

`;

}

/* 人狼仲間 */

if(isWolf(player)){

const wolves=players.filter(p=>

p.id!==player.id &&

WOLF_ROLES.includes(p.roleId)

);

if(wolves.length){

extra+=`

<div class="wolf-info">

function resetDiscussionTimer(){

function updateTimer(){

const min=Math.floor(discussionSeconds/60);

const sec=discussionSeconds%60;

$("timer").textContent=

`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

}

function startDiscussionTimer(){

clearInterval(timerInterval);

discussionSeconds--;

updateTimer();

if(discussionSeconds<=0){

clearInterval(timerInterval);

speak("議論時間終了です。投票へ進んでください。");

}

},1000);

}

/* ==================================================

投票集計

================================================== */

function finishVoting(){

const alive=alivePlayers();

const counts={};

alive.forEach(p=>{

counts[p.id]=0;

});

for(const voter of alive){

const select=$(`vote-${voter.id}`);

if(!select.value){

alert(

`${voter.name}さんの投票先を選択してください。`

);

select.focus();

return;

}

const targetId=Number(select.value);

counts[targetId]++;

if(voter.roleId==="king"){

counts[targetId]++;

}

}

let max=0;

Object.values(counts).forEach(count=>{

if(count>max)max=count;

});

const top=Object.entries(counts)

.filter(([id,count])=>count===max)

.map(([id])=>Number(id));

let resultText=`

<h3>🗳️ 投票結果</h3>

`;

alive.forEach(p=>{

resultText+=`

<p>

${escapeHtml(p.name)}：

<strong>${counts[p.id]}票</strong>

</p>

`;

});

if(top.length>=2){

resultText+=`

<hr>

<div class="warning">

⚠️ 同票のため、今回は追放なしです。

</div>

`;

}else{

const target=players.find(p=>p.id===top[0]);

resultText+=`

<hr>

<div class="result">

⚖️ ${escapeHtml(target.name)}さんが追放されました。

</div>

`;

eliminatePlayer(target,"vote");

}

$("vote").classList.add("hidden");

$("voteResult").classList.remove("hidden");

$("voteResultText").innerHTML=resultText;

}

function eliminatePlayer(player,reason){

if(!player.alive)return;

player.alive=false;

player.lastDeathReason=reason;

/* 恋人後追い */

if(player.lover){

const partner=players.find(p=>

p.alive &&

p.name===player.loverPartner

);

if(partner){

partner.alive=false;

partner.lastDeathReason="lover";

}

}

}

/* ==================================================

投票後

================================================== */

function afterVote(){

$("voteResult").classList.add("hidden");

const dead=players.filter(p=>

!p.alive &&

p.lastDeathReason==="vote"

);

if(dead.length){

announceDeaths(dead,()=>{

if(checkWin())return;

showGameReady();

});

}else{

if(checkWin())return;

showGameReady();

}

}

/* ==================================================

勝敗

================================================== */

function checkWin(){

const alive=alivePlayers();

const wolves=alive.filter(p=>isWolf(p));

if(wolves.length===0){

showWinner("🎉 市民陣営の勝利！");

return true;

}

const nonWolf=alive.filter(p=>!isWolf(p));

if(wolves.length>=nonWolf.length){

showWinner("🐺 人狼陣営の勝利！");

return true;

}

return false;

}

$("nightAction").innerHTML=`

<p>

🩺 行動が完了しました。

</p>

<button onclick="nextNight()">

次へ

</button>

`;

}

/* ==================================================

裏切り者

================================================== */

function nightBetrayer(){

const active=players.find(p=>

isBetrayer(p) &&

p.alive

);

if(!active){

nextNight();

return;

}

$("nightInfo").innerHTML=

"😈 裏切り者系の方、目を開けてください。";

speak("裏切り者系の方、目を開けてください。");

$("nightAction").innerHTML=`

<p>

夜の行動を行ってください。

</p>

<button onclick="nextNight()">

次へ

</button>

`;

}

/* ==================================================

奇術師

================================================== */

function nightMagician(){

const magician=players.find(p=>

p.roleId==="magician" &&

p.alive &&

!p.abilitiesUsed.magician

);

if(!magician){

nextNight();

return;

}

if(day<2){

nextNight();

return;

}

$("nightInfo").innerHTML=

"🎩 奇術師の方、目を開けてください。";

speak("奇術師の方、目を開けてください。");

$("nightAction").innerHTML=`

<p>

襲撃先を変更する場合は選択してください。

</p>

${alivePlayers().map(target=>`

<button

class="choice"

onclick="useMagician(${target.id})"

>

${escapeHtml(target.name)}

</button>

`).join("")}

<button onclick="nextNight()">

使用せず次へ

</button>

`;

}

function useMagician(id){

const magician=players.find(p=>

p.roleId==="magician" &&

p.alive

);

magician.abilitiesUsed.magician=true;

nightData.changedTarget=Number(id);

$("nightAction").innerHTML=`

<p>

🎩 襲撃先を変更しました。

</p>

<button onclick="nextNight()">

次へ

</button>

`;

/* ==================================================

霊媒師

================================================== */

function nightMedium(){

const medium=players.find(p=>

p.roleId==="medium" &&

p.alive

);

if(!medium){

nextNight();

return;

}

$("nightInfo").innerHTML=

"👻 霊媒師の方、目を開けてください。";

speak("霊媒師の方、目を開けてください。");

const dead=players.find(p=>

!p.alive &&

p.lastDeathReason==="vote" &&

!p.mediumChecked

);

if(dead){

dead.mediumChecked=true;

const result=isWolf(dead)?"人狼":"人間";

$("nightAction").innerHTML=`

<p>

霊媒結果を確認してください。

</p>

<div class="result">

${result}

</div>

<button onclick="nextNight()">

次へ

</button>

`;

}else{

$("nightAction").innerHTML=`

<p>

確認できる追放者はいません。

</p>

<button onclick="nextNight()">

次へ

</button>

`;

}

}

/* ==================================================

夜終了

================================================== */

function finishNight(){

let attackTargets=[];

if(nightData.wolfAttack!==null){

attackTargets.push(nightData.wolfAttack);

}

if(nightData.betrayAttack!==null){

attackTargets.push(nightData.betrayAttack);

}

if(nightData.changedTarget!==null){

attackTargets=[nightData.changedTarget];

}

attackTargets=[

...new Set(attackTargets)

];

currentNightDeaths=[];

/* 襲撃処理 */

attackTargets.forEach(targetId=>{

const target=players.find(p=>

p.id===targetId

);

if(!target || !target.alive)return;

/* 妖狐 */

if(target.roleId==="fox"){

return;

}

/* ボディーガード */

if(nightData.bodyguard===target.id){

return;

}

/* 騎士団 */

if(nightData.knights===target.id){

return;

}

/* 罠 */

if(nightData.trap===target.id){

const wolves=players.filter(p=>

p.alive &&

isWolf(p)

);

if(wolves.length){

const randomWolf=

wolves[

Math.floor(Math.random()*wolves.length)

];

randomWolf.alive=false;

randomWolf.lastDeathReason="trap";

currentNightDeaths.push(randomWolf);

}

return;

}

/* 呪われた者 */

if(target.roleId==="cursed"){

target.cursedAwakened=true;

return;

}

/* タフガイ */

if(

target.roleId==="tough" &&

!target.toughHit

){

target.toughHit=true;

return;

}

/* 通常死亡 */

eliminatePlayer(target,"night");

currentNightDeaths.push(target);

/* ハンターは後で処理 */

});

/* ==================================================

妖狐が占われた場合

================================================== */

const seer=players.find(p=>

p.roleId==="seer" &&

p.alive

);

/*

ここでは夜の占いは行わない仕様なので、

初日の占い結果で妖狐が死亡する処理を別途管理。

*/

/* 恋人後追い */

players.forEach(p=>{

if(!p.alive && p.lover){

const partner=players.find(x=>

x.name===p.loverPartner &&

x.alive

);

if(partner){

partner.alive=false;

partner.lastDeathReason="lover";

currentNightDeaths.push(partner);

}

}

});

$("night").classList.add("hidden");

if(checkWin()){

return;

}

day++;

startMorningAnnouncement();

}

/* ==================================================

朝のGMアナウンス

================================================== */

function startMorningAnnouncement(){

$("day").classList.remove("hidden");

$("dayInfo").innerHTML="";

$("specialDayActions").innerHTML="";

const deaths=[...new Set(

currentNightDeaths

)];

let message=

"朝になりました。みなさん目を覚ましてください。";

speak(message);

$("dayInfo").innerHTML=`

<div class="gm-message">

🌅 朝になりました。<br>

みなさん目を覚ましてください。

</div>

`;

setTimeout(()=>{

if(deaths.length===0){

const text=

"残念ながら、今朝は亡くなった方はいません。";

$("dayInfo").innerHTML+=`

<div class="death-message">

🌟 今朝は亡くなった方はいません。

</div>

`;

speak(text);

}else{

announceMorningDeaths(deaths);

}

},2200);

}

/* ==================================================

死亡者読み上げ

================================================== */

function announceMorningDeaths(deaths){

let index=0;

function next(){

if(index>=deaths.length){

setTimeout(()=>{

showDayStart();

},1200);

return;

}

const player=deaths[index];

$("dayInfo").innerHTML+=`

<div class="death-message">

💀 残念ながら、${escapeHtml(player.name)}さんが

亡くなってしまいました。

</div>

`;

speak(

`残念ながら、${player.name}さんが亡くなってしまいました。`

);

index++;

setTimeout(next,2500);

}

next();

}

昼開始

$("dayInfo").innerHTML+=`

<hr>

<div class="gm-message">

☀️ お昼です。<br>

議論スタート。

</div>

`;

speak("お昼です。議論スタート。");

prepareDaySpecialButtons();

resetDiscussionTimer();

}

初期化

================================================== */

resetRoleCounts();
