<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  padding:16px;

  background:#f5f5f5;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

  text-align:center;

}

#app{

  width:100%;

  max-width:720px;

  margin:0 auto;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:22px;

  margin:12px 0;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

}

h1{

  margin:4px 0 20px;

  font-size:27px;

}

button{

  width:100%;

  padding:14px;

  margin:6px 0;

  border:0;

  border-radius:12px;

  background:#222;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

button.gray{

  background:#777;

}

button.red{

  background:#9d0000;

}

button:disabled{

  opacity:.4;

}

input,

select{

  width:100%;

  padding:13px;

  border:1px solid #ccc;

  border-radius:10px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  text-align:left;

  margin:12px 0 6px;

  font-weight:bold;

}

.notice{

  padding:14px;

  margin:12px 0;

  border-radius:12px;

  background:#f0f0f0;

  line-height:1.7;

}

.big{

  font-size:34px;

  font-weight:bold;

  margin:18px 0;

}

.small{

  font-size:13px;

  color:#666;

}

.roleGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

}

.roleBox{

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  background:#fff;

}

.roleName{

  font-weight:bold;

  margin-bottom:5px;

}

.counter{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin-top:9px;

}

.counter button{

  width:46px;

  height:46px;

  padding:0;

  margin:0;

  font-size:25px;

}

.counterValue{

  min-width:38px;

  font-size:23px;

  font-weight:bold;

}

.roleTotal{

  font-size:34px;

  font-weight:bold;

  margin:12px 0 18px;

}

.targetGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.timer{

  font-size:48px;

  font-weight:bold;

  margin:10px 0 20px;

}

.confirmNumber{

  font-size:18px;

  font-weight:bold;

  margin-bottom:10px;

}

.result{

  font-size:27px;

  font-weight:bold;

  margin:18px 0;

  transition:.3s;

}

.cross{

  text-decoration:line-through;

  opacity:.35;

}

.voteRow{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:10px 0;

  border-bottom:1px solid #ddd;

}

.voteName{

  text-align:left;

  flex:1;

}

.voteCount{

  font-weight:bold;

  min-width:55px;

  text-align:right;

}

@media(max-width:520px){

  .roleGrid,

  .targetGrid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const ROLE_INFO={

  werewolf:{

    name:"🐺 人狼",

    voice:"人狼",

    max:6,

    team:"werewolf"

  },

  citizen:{

    name:"👤 市民",

    voice:"市民",

    max:28,

    team:"citizen"

  },

  seer:{

    name:"🔮 予言者",

    voice:"予言者",

    max:1,

    team:"citizen"

  },

  medium:{

    name:"👻 霊媒師",

    voice:"霊媒師",

    max:1,

    team:"citizen"

  },

  bodyguard:{

    name:"🛡️ ボディーガード",

    voice:"ボディーガード",

    max:1,

    team:"citizen"

  },

  traitor:{

    name:"🃏 裏切り者",

    voice:"裏切り者",

    max:3,

    team:"werewolf"

  },

  informant:{

    name:"📡 内通者",

    voice:"内通者",

    max:2,

    team:"werewolf"

  },

  fox:{

    name:"🦊 妖狐",

    voice:"ようこ",

    max:3,

    team:"fox"

  },

  hunter:{

    name:"🔫 ハンター",

    voice:"ハンター",

    max:2,

    team:"citizen"

  },

  shared:{

    name:"🤝 共有者",

    voice:"共有者",

    max:2,

    team:"citizen"

  },

  lover:{

    name:"❤️ 恋人",

    voice:"恋人",

    max:6,

    team:"citizen"

  },

  dictator:{

    name:"👑 独裁者",

    voice:"独裁者",

    max:1,

    team:"citizen"

  }

};

const state={

  screen:"start",

  mode:"",

  playerCount:0,

  names:[],

  loverCompatible:false,

  roleCounts:{

    werewolf:0,

    citizen:0,

    seer:0,

    medium:0,

    bodyguard:0,

    traitor:0,

    informant:0,

    fox:0,

    hunter:0,

    shared:0,

    lover:0,

    dictator:0

  },

  roles:{},

  alive:{},

  lovers:[],

  loverPairs:[],

  confirmIndex:0,

  firstSeerDone:false,

  firstNightDeaths:[],

  day:0,

  night:0,

  discussionMinutes:5,

  seconds:0,

  timer:null,

  lastExecuted:null,

  wolfTarget:null,

  guardTarget:null,

  previousGuardTarget:null,

  seerTarget:null,

  nightDeaths:[],

  voteVoters:[],

  voteIndex:0,

  votes:{},

  runoffCandidates:[],

  runoffVotes:{},

  dictatorUsed:false,

  hunterUsed:[],

  hunterIndex:null,

  hunterReason:"",

  gameOver:false,

  winner:null,

  winStage:0,

  currentNightStep:"",

  cardIndex:0,

  cardRoles:[]

};

const app=document.getElementById("app");

function speak(text){

  try{

    speechSynthesis.cancel();

    const utterance=

      new SpeechSynthesisUtterance(text);

    utterance.lang="ja-JP";

    utterance.rate=.95;

    speechSynthesis.speak(utterance);

  }catch(e){}

}

function esc(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function shuffle(array){

  const result=[...array];

  for(

    let i=result.length-1;

    i>0;

    i--

  ){

    const j=

      Math.floor(

        Math.random()*(i+1)

      );

    [

      result[i],

      result[j]

    ]=[

      result[j],

      result[i]

    ];

  }

  return result;

}

function isAlive(index){

  return state.alive[index]===true;

}

function alivePlayers(){

  return state.names

    .map((_,index)=>index)

    .filter(isAlive);

}

function playersWithRole(

  role,

  aliveOnly=false

){

  return state.names

    .map((_,index)=>index)

    .filter(index=>{

      if(state.roles[index]!==role){

        return false;

      }

      if(

        aliveOnly &&

        !isAlive(index)

      ){

        return false;

      }

      return true;

    });

}

function hasRole(role){

  return playersWithRole(role).length>0;

}

function loverPairOf(index){

  return state.loverPairs.find(

    pair=>pair.includes(index)

  );

}

function primaryTotal(){

  let total=0;

  Object.keys(state.roleCounts)

    .forEach(role=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      total+=

        Number(

          state.roleCounts[role]

        )||0;

    });

  return total;

}

function showCard(title,content){

  app.innerHTML=`

    <div class="card">

      <h1>${title}</h1>

      ${content}

    </div>

  `;

}

function render(){

  app.innerHTML="";

  switch(state.screen){

    case"start":

      renderStart();

      break;

    case"count":

      renderCount();

      break;

    case"names":

      renderNames();

      break;

    case"loverMode":

      renderLoverMode();

      break;

    case"roles":

      renderRoles();

      break;

    case"cardInput":

      renderCardInput();

      break;

    case"confirm":

      renderConfirm();

      break;

    case"firstSeerTarget":

      renderFirstSeerTarget();

      break;

    case"initialMorning":

      renderInitialMorning();

      break;

    case"daySettings":

      renderDaySettings();

      break;

    case"day":

      renderDay();

      break;

    case"vote":

      renderVote();

      break;

    case"voteResult":

      renderVoteResultScreen();

      break;

    case"runoff":

      renderRunoff();

      break;

    case"runoffResult":

      renderRunoffResultScreen();

      break;

    case"nightIntro":

      renderNightIntro();

      break;

    case"nightAction":

      renderNightAction();

      break;

    case"morning":

      renderMorning();

      break;

    case"hunter":

      renderHunter();

      break;

    case"win":

      renderWin();

      break;

  }

}

/* =========================

   スタート

========================= */

function renderStart(){

  showCard(

    "🐺 人狼コンプリートGM",

    `

      <div class="notice">

        ゲーム方式を選んでください。

      </div>

      <button

        onclick="chooseMode('random')"

      >

        📱 カードなし

      </button>

      <button

        onclick="chooseMode('card')"

      >

        🃏 カードあり

      </button>

    `

  );

}

function chooseMode(mode){

  state.mode=mode;

  state.screen="count";

  render();

}

/* =========================

   人数

========================= */

function renderCount(){

  let options="";

  for(let i=4;i<=28;i++){

    options+=`

      <option value="${i}">

        ${i}人

      </option>

    `;

  }

  showCard(

    "人数設定",

    `

      <label>

        プレイヤー人数

      </label>

      <select id="playerCount">

        ${options}

      </select>

      <button onclick="savePlayerCount()">

        次へ

      </button>

    `

  );

}

function savePlayerCount(){

  state.playerCount=

    Number(

      document.getElementById(

        "playerCount"

      ).value

    );

  state.names=

    Array(

      state.playerCount

    ).fill("");

  const saved=

    localStorage.getItem(

      "jinro_names"

    );

  if(saved){

    try{

      const previous=

        JSON.parse(saved);

      if(Array.isArray(previous)){

        for(

          let i=0;

          i<

          Math.min(

            previous.length,

            state.playerCount

          );

          i++

        ){

          state.names[i]=

            previous[i]||"";

        }

      }

    }catch(e){}

  }

  state.screen="names";

  render();

}

/* =========================

   名前

========================= */

function renderNames(){

  let html="";

  for(

    let i=0;

    i<state.playerCount;

    i++

  ){

    html+=`

      <label>

        ${i+1}人目

      </label>

      <input

        id="name${i}"

        value="${esc(state.names[i])}"

        placeholder="名前"

      >

    `;

  }

  html+=`

    <button onclick="saveNames()">

      次へ

    </button>

  `;

  showCard(

    "プレイヤー名",

    html

  );

}

function saveNames(){

  const names=[];

  for(

    let i=0;

    i<state.playerCount;

    i++

  ){

    const value=

      document

        .getElementById(

          "name"+i

        )

        .value

        .trim();

    if(!value){

      alert(

        "全員の名前を入力してください。"

      );

      return;

    }

    names.push(value);

  }

  if(

    new Set(names).size!==names.length

  ){

    alert(

      "同じ名前は使用できません。"

    );

    return;

  }

  state.names=names;

  localStorage.setItem(

    "jinro_names",

    JSON.stringify(names)

  );

  state.screen="loverMode";

  render();

}

/* =========================

   恋人兼用設定

========================= */

function renderLoverMode(){

  showCard(

    "❤️ 恋人設定",

    `

      <div class="notice">

        恋人を他の役職と兼用できるようにするか、

        先に決めてください。

        <br><br>

        恋人を選ばない場合は

        0枚で進められます。

      </div>

      <button

        onclick="setLoverCompatible(true)"

      >

        ❤️ 兼用する

      </button>

      <button

        class="gray"

        onclick="setLoverCompatible(false)"

      >

        ❤️ 兼用しない

      </button>

    `

  );

}

function setLoverCompatible(value){

  state.loverCompatible=value;

  state.screen="roles";

  render();

}

/* =========================

   役職選択

========================= */

function renderRoles(){

  const total=

    primaryTotal();

  let html=`

    <div class="roleTotal">

      ${total}/${state.playerCount}

    </div>

    <div class="notice">

      役職の枚数を選んでください。

      <br>

      ➖ 0 ＋ で変更できます。

      <br>

      ❤️ 恋人を選ぶ場合は2枚1組です。

      <br>

      🤝 共有者を選ぶ場合は2枚1セットです。

      <br><br>

      恋人・共有者は選ばなくてもOKです。

    </div>

    <div class="roleGrid">

  `;

  Object.entries(ROLE_INFO)

    .forEach(

      ([id,info])=>{

        const count=

          Number(

            state.roleCounts[id]

          )||0;

        const overlay=

          state.loverCompatible &&

          id==="lover";

        html+=`

          <div class="roleBox">

            <div class="roleName">

              ${info.name}

            </div>

            <div class="small">

              ${

                overlay

                  ?"兼用役職"

                  :"最大"+info.max+"枚"

              }

            </div>

            <div class="counter">

              <button

                class="gray"

                onclick="changeRole('${id}',-1)"

                ${count<=0?"disabled":""}

              >

                −

              </button>

              <div class="counterValue">

                ${count}

              </div>

              <button

                onclick="changeRole('${id}',1)"

                ${count>=info.max?"disabled":""}

              >

                ＋

              </button>

            </div>

          </div>

        `;

      }

    );

  html+=`

    </div>

    <button onclick="finishRoleSelection()">

      次へ

    </button>

  `;

  showCard(

    "役職選択",

    html

  );

}

function changeRole(id,change){

  const current=

    Number(

      state.roleCounts[id]

    )||0;

  const next=

    current+change;

  if(next<0){

    return;

  }

  if(

    next>

    ROLE_INFO[id].max

  ){

    return;

  }

  if(

    id==="lover" &&

    next%2!==0

  ){

    alert(

      "恋人は2枚1組なので、2枚ずつ選んでください。"

    );

    return;

  }

  if(

    id==="shared" &&

    next!==0 &&

    next!==2

  ){

    alert(

      "共有者は2枚1セットです。"

    );

    return;

  }

  /*

    ここでは合計人数による

    ＋ボタンのロックをしない。

    いったん役職を増やしてから

    他の役職を減らせるようにすることで、

    恋人・共有者が選べない問題を防ぐ。

  */

  state.roleCounts[id]=next;

  render();

}

function finishRoleSelection(){

  const total=

    primaryTotal();

  if(

    total!==state.playerCount

  ){

    alert(

      `役職の合計を${state.playerCount}枚にしてください。`

    );

    return;

  }

  if(

    state.roleCounts.lover%2!==0

  ){

    alert(

      "恋人は2枚1組です。"

    );

    return;

  }

  if(

    state.roleCounts.shared!==0 &&

    state.roleCounts.shared!==2

  ){

    alert(

      "共有者は2枚1セットです。"

    );

    return;

  }

  if(

    state.mode==="card"

  ){

    state.cardIndex=0;

    state.cardRoles=[];

    state.screen="cardInput";

    render();

    return;

  }

  assignRandomRoles();

}

/* =========================

   ランダム役職

========================= */

function createRolePool(){

  const pool=[];

  Object.entries(

    state.roleCounts

  )

  .forEach(

    ([role,count])=>{

      if(

        state.loverCompatible &&

        role==="lover"

      ){

        return;

      }

      for(

        let i=0;

        i<count;

        i++

      ){

        pool.push(role);

      }

    }

  );

  return pool;

}

function assignRandomRoles(){

  const pool=

    shuffle(

      createRolePool()

    );

  state.roles={};

  pool.forEach(

    (role,index)=>{

      state.roles[index]=role;

    }

  );

  setupLovers();

  startRoleConfirmation();

}

/* =========================

   カードあり

   1人ずつ入力

========================= */

function renderCardInput(){

  const index=

    state.cardIndex;

  let options=`

    <option value="">

      カードを選択

    </option>

  `;

  Object.entries(

    ROLE_INFO

  )

  .forEach(

    ([id,info])=>{

      if(

        state.loverCompatible &&

        id==="lover"

      ){

        return;

      }

      options+=`

        <option value="${id}">

          ${info.name}

        </option>

      `;

    }

  );

  showCard(

    "🃏 カード入力",

    `

      <div class="confirmNumber">

        ${index+1}/${state.playerCount}

      </div>

      <div class="notice">

        ${esc(state.names[index])}さんだけが

        画面を見てください。

        <br><br>

        配られたカードを入力してください。

        <br>

        残り枚数は表示しません。

      </div>

      <select id="cardRole">

        ${options}

      </select>

      <button onclick="saveOneCard()">

        このカードを確認

      </button>

    `

  );

}

function saveOneCard(){

  const value=

    document

      .getElementById(

        "cardRole"

      )

      .value;

  if(!value){

    alert(

      "カードを選択してください。"

    );

    return;

  }

  state.cardRoles[

    state.cardIndex

  ]=value;

  state.cardIndex++;

  if(

    state.cardIndex<

    state.playerCount

  ){

    render();

    return;

  }

  const actual={};

  state.cardRoles.forEach(

    role=>{

      actual[role]=

        (actual[role]||0)+1;

    }

  );

  for(

    const role of Object.keys(

      ROLE_INFO

    )

  ){

    if(

      state.loverCompatible &&

      role==="lover"

    ){

      continue;

    }

    const expected=

      Number(

        state.roleCounts[role]

      )||0;

    const got=

      Number(

        actual[role]

      )||0;

    if(expected!==got){

      alert(

        `${ROLE_INFO[role].name}の枚数が設定と一致していません。カード入力を最初からやり直してください。`

      );

      state.cardIndex=0;

      state.cardRoles=[];

      render();

      return;

    }

  }

  state.roles={};

  state.cardRoles.forEach(

    (role,index)=>{

      state.roles[index]=role;

    }

  );

  setupLovers();

  startRoleConfirmation();

}

/* =========================

   恋人セット

========================= */

function setupLovers(){

  state.lovers=[];

  state.loverPairs=[];

  const count=

    Number(

      state.roleCounts.lover

    )||0;

  if(count===0){

    return;

  }

  let candidates=[];

  if(

    state.loverCompatible

  ){

    candidates=

      shuffle(

        Array.from(

          {

            length:

              state.playerCount

          },

          (_,i)=>i

        )

      ).slice(

        0,

        count

      );

  }else{

    candidates=

      playersWithRole(

        "lover"

      );

  }

  state.lovers=

    candidates;

  for(

    let i=0;

    i<candidates.length;

    i+=2

  ){

    if(

      candidates[i+1]!==undefined

    ){

      state.loverPairs.push([

        candidates[i],

        candidates[i+1]

      ]);

    }

  }

}

/* =========================

   役職確認

========================= */

function startRoleConfirmation(){

  state.alive={};

  for(

    let i=0;

    i<state.playerCount;

    i++

  ){

    state.alive[i]=true;

  }

  state.confirmIndex=0;

  state.day=0;

  state.night=0;

  state.lastExecuted=null;

  state.firstSeerDone=false;

  state.firstNightDeaths=[];

  state.dictatorUsed=false;

  state.hunterUsed=[];

  state.gameOver=false;

  state.winner=null;

  state.winStage=0;

  state.screen="confirm";

  render();

}

function getRoleDisplay(index){

  let text=

    ROLE_INFO[

      state.roles[index]

    ].name;

  if(

    state.loverCompatible &&

    state.lovers.includes(index)

  ){

    text+=" + ❤️ 恋人";

  }

  return text;

}

function getConfirmationDetails(index){

  const lines=[];

  const role=

    state.roles[index];

  if(

    role==="werewolf"

  ){

    const wolves=

      playersWithRole(

        "werewolf"

      )

      .filter(

        i=>i!==index

      )

      .map(

        i=>state.names[i]

      );

    if(wolves.length){

      lines.push(

        "仲間の人狼："+wolves.join("、")

function countVotes(votes){

  const counts={};

  Object.values(votes)

    .forEach(

          (counts[target]||0)+1;

      }

    );

  return counts;

function getTopCandidates(counts){

  const values=

    Object.values(counts);

  if(!values.length){

    return [];

  const max=

    Math.max(...values);

  return Object.keys(counts)

    .filter(

      key=>

        counts[key]===max

    )

    .map(Number);

}

/* =========================

   死亡処理

========================= */

function executePlayer(index){

  if(

    !isAlive(index)

  ){

    return [];

  }

  const deaths=[index];

  state.alive[index]=false;

  state.lastExecuted=index;

  const partners=

    killLoverPartner(index);

  partners.forEach(

    p=>deaths.push(p)

  );

  return [

    ...new Set(deaths)

  ];

}

function killPlayer(index){

  if(

    !isAlive(index)

  ){

    return [];

  }

  state.alive[index]=false;

  const deaths=[index];

  const partners=

    killLoverPartner(index);

  partners.forEach(

    p=>deaths.push(p)

  );

  return [

    ...new Set(deaths)

  ];

}

function killLoverPartner(index){

  const pair=

    loverPairOf(index);

  if(!pair){

    return [];

  }

  const partner=

    pair.find(

      i=>i!==index

    );

  if(

    partner!==undefined &&

    isAlive(partner)

  ){

    state.alive[partner]=false;

    return [partner];

  }

  return [];

}

        "霊媒師の方、目を覚ましてください。現在、死亡しているため行動できません。"

      );

    }else{

      speak(

        "霊媒師の方、目を覚ましてください。"

      );

    }

    return;

  }

  finishNight();

}

/* =========================

   夜終了

========================= */

function finishNight(){

  const deaths=[

    ...state.nightDeaths

  ];

  /*

    人狼襲撃。

    妖狐は通常襲撃では死なない。

  */

  if(

    state.wolfTarget!==null &&

    isAlive(state.wolfTarget)

  ){

    const target=

      state.wolfTarget;

    const targetRole=

      state.roles[target];

    if(

      targetRole!=="fox" &&

      state.guardTarget!==target

    ){

      const killed=

        killPlayer(target);

      killed.forEach(

        index=>{

          deaths.push(index);

        }

      );

    }

  }

  state.nightDeaths=[

    ...new Set(deaths)

  ];

  /*

    ハンターは死亡したら必ず道連れ。

  */

  if(

    resolveHunterIfNeeded(

      state.nightDeaths,

      "night"

    )

  ){

    return;

  }

  if(

    checkVictory()

  ){

    return;

  }

  state.screen="morning";

  render();

}

/* =========================

   ハンター

========================= */

function resolveHunterIfNeeded(

  deaths,

  reason

){

  const hunter=

    deaths.find(

      index=>

        state.roles[index]==="hunter" &&

        !state.hunterUsed.includes(index)

    );

  if(

    hunter===undefined

  ){

    return false;

  }

  state.hunterUsed.push(

    hunter

  );

  state.hunterIndex=

    hunter;

  state.hunterReason=

    reason;

  state.screen="hunter";

  render();

  speak(

    "ハンターの方、道連れにする人を選んでください。"

  );

  return true;

}

function renderHunter(){

  const hunter=

    state.hunterIndex;

  let html=`

    <div class="notice">

      ${esc(

        state.names[hunter]

      )}さんの死亡が確定しました。

    </div>

    <div class="big">

      道連れにする人を選んでください。

    </div>

    <div class="targetGrid">

  `;

  alivePlayers()

    .filter(

      index=>

        index!==hunter

    )

    .forEach(

      index=>{

        html+=`

          <button

            class="gray"

            onclick="chooseHunterTarget(${index})"

          >

            ${esc(

              state.names[index]

            )}

          </button>

        `;

      }

    );

  html+=`

    </div>

  `;

  showCard(

    "ハンター",

    html

  );

}

function chooseHunterTarget(index){

  if(

    !isAlive(index)

  ){

    return;

  }

  const deaths=

    killPlayer(index);

  if(

    state.hunterReason==="night"

  ){

    deaths.forEach(

      i=>{

        state.nightDeaths.push(i);

      }

    );

    state.nightDeaths=[

      ...new Set(

        state.nightDeaths

      )

    ];

    if(

      checkVictory()

    ){

      return;

    }

    state.screen="morning";

    render();

    return;

  }

  if(

    state.hunterReason==="day"

  ){

    if(

      checkVictory()

    ){

      return;

    }

    beginNight();

    return;

  }

}

/* =========================

   朝

function renderMorning(){

  const deaths=[

    ...new Set(

      state.nightDeaths

        .filter(

          index=>

            !isAlive(index)

        )

    )

  let html=`

    <div class="notice">

      朝になりました。

      <br>

      みなさん目を覚ましてください。

    </div>

  `;

    deaths.length===0

  ){

    html+=`

      <div class="big">

        昨夜の犠牲者はいませんでした。

      </div>

    `;

  }else{

    deaths.forEach(

      index=>{

        html+=`

          <div class="big">

            ${esc(

              state.names[index]

            )}さんが亡くなりました。

        `;

      }

    );

  html+=`

      onclick="goToNextDay()"

    </button>

  showCard(

    html

  );

  if(

    deaths.length===0

  ){

    speak(

      "朝になりました。"+

      "みなさん目を覚ましてください。"+

      "昨夜の犠牲者はいませんでした。"+

      "お昼です。議論スタートです。"

    );

  }else{

    speak(

      "朝になりました。"+

      "みなさん目を覚ましてください。"+

      deaths

        .map(

          index=>

            state.names[index]+

            "さんが亡くなりました。"

        )

        .join("")+

      "お昼です。議論スタートです。"

    );

}

function goToNextDay(){

  if(

    checkVictory()

  ){

    return;

  }

  state.day++;

  state.lastExecuted=null;

  startDiscussion();

}

/* =========================

   勝利判定

========================= */

function getCitizenTeamAlive(){

  return alivePlayers()

    .filter(

      index=>

        ROLE_INFO[

          state.roles[index]

        ].team==="citizen"

    );

}

function getWerewolfTeamAlive(){

  return alivePlayers()

    .filter(

      index=>

        state.roles[index]==="werewolf"

    );

}

function normalVictory(){

  const wolves=

    getWerewolfTeamAlive().length;

  const citizens=

    getCitizenTeamAlive().length;

  if(

    wolves===0

  ){

    return "citizen";

  }

  if(

    wolves>=citizens

  ){

    return "werewolf";

  }

  return null;

}

function foxVictory(){

  const foxes=

    playersWithRole(

      "fox",

      true

    );

  if(

    foxes.length===0

  ){

    return false;

  }

  return(

    normalVictory()!==null

  );

}

function loverVictory(){

  if(

    state.loverPairs.length===0

  ){

    return false;

  }

  return state.loverPairs.some(

    pair=>

      isAlive(pair[0]) &&

      isAlive(pair[1])

  );

}

function checkVictory(){

  if(

    state.gameOver

  ){

    return true;

  }

  const normal=

    normalVictory();

  const lovers=

    loverVictory();

  const fox=

    foxVictory();

  if(

    !normal &&

    !lovers &&

    !fox

  ){

    return false;

  }

  state.winner={

    normal:normal,

    lovers:lovers,

    fox:fox

  };

  state.gameOver=true;

  state.winStage=0;

  state.screen="win";

  render();

  return true;

}

/* =========================

   勝利結果

========================= */

function getWinnerResults(){

  const results=[];

  if(

    state.winner.normal

  ){

    results.push(

      state.winner.normal==="werewolf"

        ?"🐺 人狼の勝利です！"

        :"👤 市民の勝利です！"

    );

  }

  if(

    state.winner.lovers

  ){

    results.push(

      "❤️ 恋人の勝利です！"

    );

  }

  if(

    state.winner.fox

  ){

    results.push(

      "🦊 妖狐の勝利です！"

    );

  }

  return results;

}

function renderWin(){

  const results=

    getWinnerResults();

  /*

    最初から後の勝利を表示しない。

    例：

    人狼の勝利です！

    ↓しばらくして

    人狼の勝利です！ ← バッテン

    妖狐の勝利です！

  */

  let html="";

  for(

    let i=0;

    i<=state.winStage &&

    i<results.length;

    i++

  ){

    html+=`

      <div class="result ${

        i<state.winStage

          ?"cross"

          :""

      }">

        ${results[i]}

      </div>

    `;

  }

  if(

    state.winStage<

    results.length-1

  ){

    html+=`

      <div class="small">

        勝利判定を確認しています…

      </div>

    `;

    showCard(

      "🏆 ゲーム終了",

      html

    );

    setTimeout(

      ()=>{

        if(

          state.screen==="win"

        ){

          state.winStage++;

          render();

        }

      },

      1800

    );

    return;

  }

  html+=`

    <div class="notice">

      勝利の優先順位

      <br>

      妖狐 ＞ 恋人 ＞ 人狼・市民

      <br><br>

      最終勝利

      <br>

      <strong>

        ${results[

          results.length-1

        ]}

      </strong>

    </div>

    <button

      onclick="location.reload()"

    >

      もう一度遊ぶ

    </button>

  `;

  showCard(

    "🏆 ゲーム終了",

    html

  );

  /*

    音声には絵文字を入れない。

    妖狐は「ようこ」と読む。

  */

  let voice=

    results[

      results.length-1

    ]

    .replace(

      /🐺|👤|🔮|👻|🛡️|🃏|📡|🦊|🔫|🤝|❤️|👑/g,

      ""

    )

    .replace(

      "妖狐",

      "ようこ"

    );

  speak(voice);

}

render();
