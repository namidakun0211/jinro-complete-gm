<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:16px;

  background:#f4f4f4;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

  text-align:center;

}

#app{

  max-width:720px;

  margin:auto;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:22px;

  margin:12px 0;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

}

h1{

  font-size:28px;

  margin:8px 0 20px;

}

h2{

  margin:8px 0 18px;

}

button{

  width:100%;

  padding:14px;

  margin:6px 0;

  border:0;

  border-radius:12px;

  background:#222;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

button.gray{

  background:#777;

}

button.red{

  background:#9d1111;

}

button:disabled{

  opacity:.4;

}

input,select{

  width:100%;

  padding:12px;

  border:1px solid #ccc;

  border-radius:10px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  text-align:left;

  margin:12px 0 6px;

  font-weight:bold;

}

.notice{

  padding:14px;

  margin:12px 0;

  background:#f1f1f1;

  border-radius:12px;

  line-height:1.6;

}

.nameGrid,

.targetGrid,

.roleGrid{

  display:grid;

  gap:8px;

}

.targetGrid,

.roleGrid{

  grid-template-columns:1fr 1fr;

}

.roleBox{

  border:1px solid #ddd;

  border-radius:12px;

  padding:10px;

  text-align:left;

}

.big{

  font-size:32px;

  font-weight:bold;

  margin:16px 0;

}

.small{

  color:#666;

  font-size:13px;

}

.timer{

  font-size:46px;

  font-weight:bold;

  margin:10px 0 20px;

}

.voteRow{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  align-items:center;

  margin:8px 0;

}

.result{

  font-size:25px;

  font-weight:bold;

  margin:18px 0;

}

.cross{

  text-decoration:line-through;

  opacity:.3;

}

@media(max-width:520px){

  .targetGrid,

  .roleGrid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const ROLES={

  werewolf:{

    name:"🐺 人狼",

    max:6,

    team:"werewolf"

  },

  citizen:{

    name:"👤 市民",

    max:28,

    team:"citizen"

  },

  seer:{

    name:"🔮 予言者",

    max:1,

    team:"citizen"

  },

  medium:{

    name:"👻 霊媒師",

    max:1,

    team:"citizen"

  },

  bodyguard:{

    name:"🛡️ ボディーガード",

    max:1,

    team:"citizen"

  },

  traitor:{

    name:"🃏 裏切り者",

    max:3,

    team:"werewolf"

  },

  informant:{

    name:"📡 内通者",

    max:2,

    team:"werewolf"

  },

  fox:{

    name:"🦊 妖狐",

    max:3,

    team:"fox"

  },

  hunter:{

    name:"🏹 ハンター",

    max:2,

    team:"citizen"

  },

  shared:{

    name:"🤝 共有者",

    max:2,

    team:"citizen"

  },

  lover:{

    name:"❤️ 恋人",

    max:6,

    team:"lover"

  },

  dictator:{

    name:"👑 独裁者",

    max:1,

    team:"citizen"

  }

};

const state={

  screen:"start",

  mode:"",

  playerCount:0,

  names:[],

  roleCounts:{},

  roles:{},

  alive:{},

  loverCompatible:false,

  loverPairs:[],

  day:0,

  night:0,

  firstSeerChoice:null,

  firstSeerConfirmed:false,

  lastExecuted:null,

  wolfTarget:null,

  guardTarget:null,

  previousGuardTarget:null,

  seerTarget:null,

  seerResult:null,

  discussionMinutes:5,

  timer:null,

  seconds:0,

  votes:{},

  dictatorUsed:false,

  dictatorTarget:null,

  nightDeaths:[],

  hunterContext:null,

  hunterIndex:null,

  cardRoles:[],

  cardIndex:0,

  gameEnded:false

};

const app=document.getElementById("app");

function speak(text){

  try{

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    u.rate=.95;

    speechSynthesis.speak(u);

  }catch(e){}

}

function esc(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function roleName(role){

  return ROLES[role]?.name||"";

}

function isAlive(i){

  return state.alive[i]===true;

}

function alivePlayers(){

  return state.names

    .map((_,i)=>i)

    .filter(i=>isAlive(i));

}

function playersWithRole(role,aliveOnly=false){

  return state.names

    .map((_,i)=>i)

    .filter(i=>

      state.roles[i]===role &&

      (!aliveOnly||isAlive(i))

    );

}

function hasRole(role){

  return playersWithRole(role).length>0;

}

function loverPairOf(i){

  return state.loverPairs.find(pair=>pair.includes(i));

}

function isWolf(i){

  return state.roles[i]==="werewolf";

}

function render(){

  app.innerHTML="";

  if(state.screen==="start")startScreen();

  if(state.screen==="count")countScreen();

  if(state.screen==="names")namesScreen();

  if(state.screen==="roles")rolesScreen();

  if(state.screen==="lover")loverScreen();

  if(state.screen==="cards")cardsScreen();

  if(state.screen==="confirm")confirmScreen();

  if(state.screen==="day")dayScreen();

  if(state.screen==="vote")voteScreen();

  if(state.screen==="runoff")runoffScreen();

  if(state.screen==="nightIntro")nightIntroScreen();

  if(state.screen==="nightAction")nightActionScreen();

  if(state.screen==="hunter")hunterScreen();

  if(state.screen==="morning")morningScreen();

  if(state.screen==="win")winScreen();

}

function card(title,html){

  app.innerHTML=`

    <div class="card">

      <h1>${title}</h1>

      ${html}

    </div>

  `;

}

function startScreen(){

  card("🐺 人狼コンプリートGM",`

    <div class="notice">

      ゲーム方式を選んでください。

    </div>

    <button onclick="selectMode('card')">

      🃏 カードあり

    </button>

    <button onclick="selectMode('random')">

      📱 カードなし

    </button>

  `);

}

function selectMode(mode){

  state.mode=mode;

  state.screen="count";

  render();

}

function countScreen(){

  let options="";

  for(let i=4;i<=28;i++){

    options+=`

      <option value="${i}">

        ${i}人

      </option>

    `;

  }

  card("人数設定",`

    <label>プレイヤー人数</label>

    <select id="playerCount">

      ${options}

    </select>

    <button onclick="savePlayerCount()">次へ</button>

  `);

}

function savePlayerCount(){

  state.playerCount=

    Number(document.getElementById("playerCount").value);

  state.names=Array(state.playerCount).fill("");

  state.screen="names";

  render();

}

function namesScreen(){

  const oldNames=

    JSON.parse(

      localStorage.getItem("jinro_names")||"[]"

    );

  let html=`<div class="nameGrid">`;

  for(let i=0;i<state.playerCount;i++){

    html+=`

      <div>

        <label>${i+1}人目</label>

        <input

          id="name${i}"

          value="${esc(state.names[i]||oldNames[i]||"")}"

          placeholder="名前"

        >

      </div>

    `;

  }

  html+=`

    </div>

    <button onclick="saveNames()">次へ</button>

  `;

  card("プレイヤー名",html);

}

function saveNames(){

  const names=[];

  for(let i=0;i<state.playerCount;i++){

    const value=

      document.getElementById("name"+i).value.trim();

    if(!value){

      alert("全員の名前を入力してください。");

      return;

    }

    names.push(value);

  }

  if(new Set(names).size!==names.length){

    alert("同じ名前は使用できません。");

    return;

  }

  state.names=names;

  localStorage.setItem(

    "jinro_names",

    JSON.stringify(names)

  );

  state.screen="roles";

  render();

}

function rolesScreen(){

  let html=`<div class="roleGrid">`;

  Object.entries(ROLES).forEach(([id,role])=>{

    html+=`

      <div class="roleBox">

        <strong>${role.name}</strong>

        <div class="small">最大${role.max}枚</div>

        <input

          id="count_${id}"

          type="number"

          min="0"

          max="${role.max}"

          value="${state.roleCounts[id]||0}"

        >

      </div>

    `;

  });

  html+=`

    </div>

    <button onclick="saveRoles()">次へ</button>

  `;

  card("役職設定",html);

}

function saveRoles(){

  const counts={};

  let total=0;

  for(const [id,role] of Object.entries(ROLES)){

    const n=

      Number(document.getElementById("count_"+id).value)||0;

    if(n<0||n>role.max){

      alert(`${role.name}の枚数が正しくありません。`);

      return;

    }

    counts[id]=n;

    total+=n;

  }

  if(total!==state.playerCount){

    alert("役職の合計枚数をプレイヤー人数と同じにしてください。");

    return;

  }

  if(counts.lover%2!==0){

    alert("恋人は2枚1組なので偶数枚にしてください。");

    return;

  }

  if(counts.shared!==0&&counts.shared!==2){

    alert("共有者は2枚1セットです。");

    return;

  }

  state.roleCounts=counts;

  if(counts.lover>0){

    state.screen="lover";

    render();

  }else{

    prepareRoles();

  }

}

function loverScreen(){

  card("❤️ 恋人設定",`

    <div class="notice">

      恋人を他の役職と兼用するか選んでください。

    </div>

    <button onclick="setLoverCompatible(true)">

      ❤️ 兼用する

    </button>

    <button onclick="setLoverCompatible(false)">

      ❤️ 兼用しない

    </button>

  `);

}

function setLoverCompatible(value){

  state.loverCompatible=value;

  prepareRoles();

}

function prepareRoles(){

  let list=[];

  Object.entries(state.roleCounts).forEach(([role,count])=>{

    for(let i=0;i<count;i++){

      list.push(role);

    }

  });

  if(state.loverCompatible){

    const loverCount=state.roleCounts.lover;

    list=list.filter(role=>role!=="lover");

    const base=list.slice();

    const indexes=shuffle(

      base.map((_,i)=>i)

    ).slice(0,loverCount);

    const roles=[...base];

    indexes.forEach(i=>{

      roles[i]=

        roles[i]==="lover"

          ?roles[i]

          :"lover+"+roles[i];

    });

    state.loverBaseRoles=roles;

  }

  if(state.mode==="random"){

    assignRandomRoles();

  }else{

    state.cardRoles=list;

    state.cardIndex=0;

    cardsScreen();

  }

}

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function assignRandomRoles(){

  let roles=[];

  if(state.loverCompatible){

    roles=

      state.loverBaseRoles.map(r=>{

        if(r.startsWith("lover+")){

          return r;

        }

        return r;

      });

  }else{

    Object.entries(state.roleCounts)

      .forEach(([role,count])=>{

        for(let i=0;i<count;i++){

          roles.push(role);

        }

      });

  }

  roles=shuffle(roles);

  state.roles={};

  roles.forEach((role,i)=>{

    if(role.startsWith("lover+")){

      const base=role.substring(6);

      state.roles[i]=base;

      if(!state.loverPlayers){

        state.loverPlayers=[];

      }

      state.loverPlayers.push(i);

    }else{

      state.roles[i]=role;

    }

  });

  if(!state.loverCompatible){

    state.loverPlayers=

      playersWithRole("lover");

  }

  finishRoleAssignment();

}

function cardsScreen(){

  if(state.cardIndex>=state.playerCount){

    finishCardRoles();

    return;

  }

  let remaining={};

  state.cardRoles.forEach(role=>{

    const clean=

      role.startsWith("lover+")

        ?role.substring(6)

        :role;

    remaining[clean]=(remaining[clean]||0)+1;

  });

  let options="";

  Object.entries(remaining).forEach(([role,count])=>{

    options+=`

      <option value="${role}">

        ${roleName(role)}

      </option>

    `;

  });

  card("カード入力",`

    <div class="big">

      ${state.cardIndex+1}/${state.playerCount}

    </div>

    <div class="notice">

      ${esc(state.names[state.cardIndex])}さんのカードを入力してください。

    </div>

    <select id="cardSelect">

      ${options}

    </select>

    <button onclick="acceptCard()">確認</button>

  `);

}

function acceptCard(){

  const role=

    document.getElementById("cardSelect").value;

  const index=state.cardRoles.findIndex(r=>{

    const clean=

      r.startsWith("lover+")

        ?r.substring(6)

        :r;

    return clean===role;

  });

  if(index===-1){

    alert("その役職は残っていません。");

    return;

  }

  state.cardRoles.splice(index,1);

  state.roles[state.cardIndex]=role;

  if(

    state.loverCompatible &&

    state.roleCounts.lover>0

  ){

    const chance=

      state.roleCounts.lover/

      state.playerCount;

    if(Math.random()<chance){

      state.loverPlayers=

        state.loverPlayers||[];

      if(

        state.loverPlayers.length<

        state.roleCounts.lover

      ){

        state.loverPlayers.push(state.cardIndex);

      }

    }

  }

  state.cardIndex++;

  if(state.cardIndex<state.playerCount){

    cardsScreen();

  }else{

    finishCardRoles();

  }

}

function finishCardRoles(){

  if(

    state.loverCompatible &&

    state.roleCounts.lover>0

  ){

    state.loverPlayers=

      state.loverPlayers||[];

    while(

      state.loverPlayers.length<

      state.roleCounts.lover

    ){

      const candidates=

        state.names

          .map((_,i)=>i)

          .filter(i=>!state.loverPlayers.includes(i));

      if(!candidates.length)break;

      state.loverPlayers.push(

        candidates[

          Math.floor(Math.random()*candidates.length)

        ]

      );

    }

  }else{

    state.loverPlayers=

      playersWithRole("lover");

  }

  finishRoleAssignment();

}

function finishRoleAssignment(){

  state.alive={};

  for(let i=0;i<state.playerCount;i++){

    state.alive[i]=true;

  }

  createLoverPairs();

  state.day=0;

  state.night=0;

  state.lastExecuted=null;

  state.firstSeerConfirmed=false;

  state.firstSeerChoice=null;

  state.dictatorUsed=false;

  state.screen="confirm";

  render();

}

function createLoverPairs(){

  const lovers=

    state.loverCompatible

      ?state.loverPlayers

      :playersWithRole("lover");

  state.loverPairs=[];

  for(let i=0;i<lovers.length;i+=2){

    if(lovers[i+1]!==undefined){

      state.loverPairs.push([

        lovers[i],

        lovers[i+1]

      ]);

    }

  }

}

function displayRole(i){

  let role=state.roles[i];

  let text=roleName(role);

  if(

    state.loverCompatible &&

    state.loverPlayers?.includes(i)

  ){

    text+=" + ❤️ 恋人";

  }

  if(role==="werewolf"){

    const wolves=

      playersWithRole("werewolf")

        .map(x=>state.names[x]);

    text+=

      `\n\n仲間の人狼：${wolves.join("、")}`;

  }

  if(role==="informant"){

    const wolves=

      playersWithRole("werewolf")

        .map(x=>state.names[x]);

    text+=

      `\n\n人狼：${wolves.join("、")}`;

  }

  if(role==="shared"){

    const partners=

      playersWithRole("shared")

        .filter(x=>x!==i);

    text+=

      `\n\nもう1人の共有者：${

        partners.map(x=>state.names[x]).join("、")

      }`;

  }

  if(

    (role==="lover")||

    state.loverPlayers?.includes(i)

  ){

    const pair=loverPairOf(i);

    if(pair){

      const partner=

        pair.find(x=>x!==i);

      if(partner!==undefined){

        text+=

          `\n\n恋人：${state.names[partner]}`;

      }

    }

  }

  return text;

}

function revealRole(i){

  alert(

    `${state.names[i]}さん\n\n`+

    displayRole(i)

  );

}

function confirmScreen(){

  let html=`

    <div class="notice">

      自分の名前を押して「？？？」を確認してください。

    </div>

    <div class="nameGrid">

  `;

  state.names.forEach((name,i)=>{

    html+=`

      <button

        class="gray"

        onclick="revealRole(${i})"

      >

        ${esc(name)}<br>

        ？？？

      </button>

    `;

  });

  html+=`</div>`;

  if(hasRole("seer")){

    html+=`

      <button onclick="chooseFirstSeer()">

        🔮 初日の占いを設定

      </button>

    `;

  }

  html+=`

    <button onclick="completeConfirm()">

      確認完了

    </button>

  `;

  card("役職確認",html);

}

function chooseFirstSeer(){

  if(state.firstSeerConfirmed){

    alert("すでに設定されています。");

    return;

  }

  state.firstSeerChoice=

    confirm("予言者は初日の占いをしますか？");

  state.firstSeerConfirmed=true;

  alert(

    state.firstSeerChoice

      ?"初日の占いを行います。"

      :"初日の占いは行いません。"

  );

}

function completeConfirm(){

  if(

    hasRole("seer") &&

    !state.firstSeerConfirmed

  ){

    alert("初日の占いをするか決めてください。");

    return;

  }

  state.day=1;

  startDay();

}

function startDay(){

  state.screen="day";

  state.seconds=

    state.discussionMinutes*60;

  clearInterval(state.timer);

  render();

  speak(

    "お昼です。みなさんで話し合ってください。"

  );

  if(state.discussionMinutes>0){

    state.timer=setInterval(()=>{

      state.seconds--;

      updateTimer();

      if(state.seconds<=0){

        clearInterval(state.timer);

        state.screen="vote";

        render();

        speak(

          "話し合いの時間が終了しました。投票を始めます。"

        );

      }

    },1000);

  }

}

function updateTimer(){

  const el=document.getElementById("timer");

  if(el){

    el.textContent=

      formatTime(state.seconds);

  }

}

function formatTime(sec){

  const m=Math.floor(sec/60);

  const s=sec%60;

  return(

    String(m).padStart(2,"0")+

    ":"+

    String(s).padStart(2,"0")

  );

}

function dayScreen(){

  let html="";

  if(state.discussionMinutes>0){

    html+=`

      <div id="timer" class="timer">

        ${formatTime(state.seconds)}

      </div>

    `;

  }else{

    html+=`

      <div class="notice">

        タイマーなし

      </div>

    `;

  }

  html+=`

    <div class="notice">

      ${state.day}日目の話し合いです。

    </div>

  `;

  const dictator=

    playersWithRole("dictator",true)[0];

  if(

    dictator!==undefined &&

    !state.dictatorUsed

  ){

    html+=`

      <label>👑 独裁者</label>

      <input

        id="dictatorName"

        placeholder="独裁者の名前を入力"

      >

      <button onclick="checkDictator()">

        👑 独裁者を使用

      </button>

    `;

  }

  html+=`

    <button onclick="openVote()">

      🗳️ 投票へ

    </button>

  `;

  card(`🌞 ${state.day}日目`,html);

  updateTimer();

}

function checkDictator(){

  const name=

    document.getElementById("dictatorName")

      .value

      .trim();

  const index=

    state.names.indexOf(name);

  if(

    index===-1 ||

    !isAlive(index) ||

    state.roles[index]!=="dictator" ||

    state.dictatorUsed

  ){

    alert("独裁者の名前が一致しません。");

    return;

  }

  const targetName=

    prompt("追放する人の名前を入力してください。");

  if(!targetName)return;

  const target=

    state.names.indexOf(targetName.trim());

  if(

    target===-1 ||

    !isAlive(target) ||

    target===index

  ){

    alert("追放対象の名前が正しくありません。");

    return;

  }

  clearInterval(state.timer);

  state.dictatorUsed=true;

  state.dictatorTarget=target;

  speak(

    "独裁者の能力が使用されました。議論を終了します。"

  );

  executePlayer(target);

}

function openVote(){

  clearInterval(state.timer);

  state.screen="vote";

  render();

}

function voteScreen(){

  const voters=alivePlayers();

  let html=`

    <div class="notice">

      投票先は個人ごとに入力します。

    </div>

  `;

  voters.forEach(voter=>{

    let options=

      `<option value="">投票先を選択</option>`;

    alivePlayers()

      .filter(i=>i!==voter)

      .forEach(target=>{

        options+=`

          <option value="${target}">

            ${esc(state.names[target])}

          </option>

        `;

      });

    html+=`

      <div class="voteRow">

        <strong>${esc(state.names[voter])}</strong>

        <select id="vote_${voter}">

          ${options}

        </select>

      </div>

    `;

  });

  html+=`

    <button onclick="submitVote()">

      投票を確定

    </button>

  `;

  card("🗳️ 投票",html);

}

function submitVote(){

  const counts={};

  for(const voter of alivePlayers()){

    const value=

      document.getElementById(

        "vote_"+voter

      ).value;

    if(value===""){

      alert("全員の投票先を選んでください。");

      return;

    }

    const target=Number(value);

    const weight=

      state.roles[voter]==="dictator"

        ?2

        :1;

    counts[target]=

      (counts[target]||0)+weight;

  }

  state.votes=counts;

  const max=

    Math.max(...Object.values(counts));

  const top=

    Object.keys(counts)

      .filter(k=>counts[k]===max)

      .map(Number);

  if(top.length>1){

    state.runoffCandidates=top;

    state.screen="runoff";

    render();

    return;

  }

  executePlayer(top[0]);

}

function runoffScreen(){

  let html=`

    <div class="notice">

      決選投票です。

      <br>

      ${state.runoffCandidates

        .map(i=>esc(state.names[i]))

        .join("、")}

    </div>

  `;

  alivePlayers().forEach(voter=>{

    let options=

      `<option value="">投票先を選択</option>`;

    state.runoffCandidates

      .filter(i=>i!==voter)

      .forEach(target=>{

        options+=`

          <option value="${target}">

            ${esc(state.names[target])}

          </option>

        `;

      });

    html+=`

      <div class="voteRow">

        <strong>${esc(state.names[voter])}</strong>

        <select id="run_${voter}">

          ${options}

        </select>

      </div>

    `;

  });

  html+=`

    <button onclick="submitRunoff()">

      決選投票を確定

    </button>

  `;

  card("🗳️ 決選投票",html);

}

function submitRunoff(){

  const counts={};

  for(const voter of alivePlayers()){

    const value=

      document.getElementById(

        "run_"+voter

      ).value;

    if(value===""){

      alert("全員の投票先を選んでください。");

      return;

    }

    const target=Number(value);

    const weight=

      state.roles[voter]==="dictator"

        ?2

        :1;

    counts[target]=

      (counts[target]||0)+weight;

  }

  const max=

    Math.max(...Object.values(counts));

  const top=

    Object.keys(counts)

      .filter(k=>counts[k]===max)

      .map(Number);

  if(top.length>1){

    alert(

      "決選投票でも同票のため、追放者はいません。"

    );

    state.lastExecuted=null;

    beginNight();

    return;

  }

  executePlayer(top[0]);

}

function executePlayer(index){

  state.alive[index]=false;

  state.lastExecuted=index;

  speak(

    `${state.names[index]}さんが追放されました。`

  );

  killLoverPartner(index);

  if(state.roles[index]==="hunter"){

    state.hunterContext="day";

    state.hunterIndex=index;

    state.screen="hunter";

    render();

    speak(

      "ハンターの方、道連れにする人を選んでください。"

    );

    return;

  }

  if(checkVictory())return;

  beginNight();

}

function killLoverPartner(index){

  const pair=loverPairOf(index);

  if(!pair)return;

  const partner=

    pair.find(i=>i!==index);

  if(

    partner!==undefined &&

    isAlive(partner)

  ){

    state.alive[partner]=false;

  }

}

function beginNight(){

  state.night++;

  state.wolfTarget=null;

  state.guardTarget=null;

  state.seerTarget=null;

  state.seerResult=null;

  state.nightDeaths=[];

  state.screen="nightIntro";

  render();

}

function nightIntroScreen(){

  card(`🌙 ${state.night}夜目`,`

    <div class="notice">

      夜になりました。

    </div>

    <button onclick="startNight()">

      夜の行動を開始

    </button>

  `);

}

function startNight(){

  runNightStep("werewolf");

}

function runNightStep(step){

  if(step==="werewolf"){

    if(!hasRole("werewolf")){

      runNightStep("bodyguard");

      return;

    }

    state.currentNight="werewolf";

    state.screen="nightAction";

    render();

    speak(

      "人狼の方、目を覚ましてください。"+

      "今夜襲撃する人を選んでください。"

    );

    return;

  }

  if(step==="bodyguard"){

    if(!hasRole("bodyguard")){

      runNightStep("seer");

      return;

    }

    state.currentNight="bodyguard";

    state.screen="nightAction";

    render();

    speak(

      "ボディーガードの方、目を覚ましてください。"+

      "今夜守る人を選んでください。"

    );

    return;

  }

  if(step==="seer"){

    if(

      !hasRole("seer") ||

      (

        state.night===1 &&

        state.firstSeerChoice===false

      )

    ){

      runNightStep("medium");

      return;

    }

    state.currentNight="seer";

    state.screen="nightAction";

    render();

    speak(

      "予言者の方、目を覚ましてください。"+

      "今夜占う人を選んでください。"

    );

    return;

  }

  if(step==="medium"){

    if(

      !hasRole("medium") ||

      state.lastExecuted===null

    ){

      resolveNight();

      return;

    }

    state.currentNight="medium";

    state.screen="nightAction";

    render();

    speak(

      "霊媒師の方、目を覚ましてください。"+

      "昨日追放された人を確認してください。"

    );

    return;

  }

  resolveNight();

}

function nightActionScreen(){

  const action=state.currentNight;

  if(action==="werewolf"){

    renderWerewolfAction();

  }

  if(action==="bodyguard"){

    renderBodyguardAction();

  }

  if(action==="seer"){

    renderSeerAction();

  }

  if(action==="medium"){

    renderMediumAction();

  }

}

function renderWerewolfAction(){

  const wolves=

    playersWithRole("werewolf",true);

  if(!wolves.length){

    runNightStep("bodyguard");

    return;

  }

  const targets=

    alivePlayers()

      .filter(i=>!isWolf(i));

  let html=`

    <div class="notice">

      人狼の皆さんで相談して、

      今夜の襲撃先を1人選んでください。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="wolfChoose(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`</div>`;

  card("🌙 人狼",html);

}

function wolfChoose(index){

  state.wolfTarget=index;

  runNightStep("bodyguard");

}

function renderBodyguardAction(){

  const guards=

    playersWithRole("bodyguard",true);

  if(!guards.length){

    runNightStep("seer");

    return;

  }

  const guard=guards[0];

  const targets=

    alivePlayers()

      .filter(i=>i!==guard)

      .filter(i=>i!==state.previousGuardTarget);

  let html=`

    <div class="notice">

      今夜守る人を1人選んでください。

      <br>

      自分自身は守れません。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="guardChoose(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`</div>`;

  card("🌙 ボディーガード",html);

}

function guardChoose(index){

  state.guardTarget=index;

  state.previousGuardTarget=index;

  runNightStep("seer");

}

function renderSeerAction(){

  const seers=

    playersWithRole("seer",true);

  if(!seers.length){

    runNightStep("medium");

    return;

  }

  const targets=

    alivePlayers()

      .filter(i=>state.roles[i]!=="seer");

  let html=`

    <div class="notice">

      今夜占う人を1人選んでください。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="seerChoose(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`</div>`;

  card("🌙 予言者",html);

}

function seerChoose(index){

  state.seerTarget=index;

  const role=state.roles[index];

  if(role==="fox"){

    state.seerResult="人間";

    state.alive[index]=false;

    state.nightDeaths.push(index);

    killLoverPartner(index);

  }else{

    state.seerResult=

      role==="werewolf"

        ?"人狼"

        :"人間";

  }

  alert(

    `${state.names[index]}さんは`+

    `${state.seerResult}です。`

  );

  runNightStep("medium");

}

function renderMediumAction(){

  if(

    state.lastExecuted===null ||

    state.lastExecuted===undefined

  ){

    resolveNight();

    return;

  }

  const role=

    state.roles[state.lastExecuted];

  const result=

    role==="werewolf"

      ?"人狼"

      :"人間";

  card("🌙 霊媒師",`

    <div class="notice">

      昨日追放された

      ${esc(state.names[state.lastExecuted])}

      さんは

      <strong>${result}</strong>

      です。

    </div>

    <button onclick="mediumNext()">

      確認しました

    </button>

  `);

}

function mediumNext(){

  resolveNight();

}

function resolveNight(){

  state.nightDeaths=

    Array.from(new Set(state.nightDeaths));

  if(

    state.wolfTarget!==null &&

    state.wolfTarget!==undefined &&

    isAlive(state.wolfTarget)

  ){

    const target=state.wolfTarget;

    if(state.guardTarget!==target){

      state.alive[target]=false;

      state.nightDeaths.push(target);

    }

  }

  const hunter=

    state.nightDeaths.find(

      i=>state.roles[i]==="hunter"

    );

  if(hunter!==undefined){

    state.hunterContext="night";

    state.hunterIndex=hunter;

    state.screen="hunter";

    render();

    speak(

      "ハンターの方、道連れにする人を選んでください。"

    );

    return;

  }

  killNightLovers();

  if(checkVictory())return;

  state.screen="morning";

  render();

  const deaths=

    state.nightDeaths

      .filter(i=>!isAlive(i));

  if(deaths.length){

    speak(

      "朝になりました。みなさん目を覚ましてください。"+

      "残念ながら"+

      deaths.map(i=>state.names[i]).join("、")+

      "さんが亡くなってしまいました。"+

      "お昼です。議論スタート。"

    );

  }else{

    speak(

      "朝になりました。みなさん目を覚ましてください。"+

      "昨夜の犠牲者はいませんでした。"+

      "お昼です。議論スタート。"

    );

  }

}

function killNightLovers(){

  state.loverPairs.forEach(pair=>{

    const a=pair[0];

    const b=pair[1];

    if(!isAlive(a)&&isAlive(b)){

      state.alive[b]=false;

      state.nightDeaths.push(b);

    }

    if(!isAlive(b)&&isAlive(a)){

      state.alive[a]=false;

      state.nightDeaths.push(a);

    }

  });

  state.nightDeaths=

    Array.from(new Set(state.nightDeaths));

}

function hunterScreen(){

  const hunter=state.hunterIndex;

  let html=`

    <div class="notice">

      ${esc(state.names[hunter])}さんの

      死亡が確定しました。

    </div>

    <div class="big">

      道連れにする人を選んでください。

    </div>

    <div class="targetGrid">

  `;

  alivePlayers()

    .filter(i=>i!==hunter)

    .forEach(i=>{

      html+=`

        <button

          class="gray"

          onclick="hunterChoose(${i})"

        >

          ${esc(state.names[i])}

        </button>

      `;

    });

  html+=`</div>`;

  card("🏹 ハンター",html);

}

function hunterChoose(target){

  if(!isAlive(target))return;

  state.alive[target]=false;

  killLoverPartner(target);

  if(

    state.hunterContext==="day"

  ){

    if(checkVictory())return;

    beginNight();

    return;

  }

  state.nightDeaths.push(target);

  if(checkVictory())return;

  state.screen="morning";

  render();

  speak(

    `${state.names[target]}さんが道連れになりました。`

  );

}

function baseResult(){

  const wolves=

    playersWithRole("werewolf",true);

  if(wolves.length===0){

    return "citizen";

  }

  const opposing=

    alivePlayers()

      .filter(i=>{

        const role=state.roles[i];

        return(

          role!=="werewolf" &&

          role!=="traitor" &&

          role!=="informant"

        );

      });

  if(wolves.length>=opposing.length){

    return "werewolf";

  }

  return null;

}

function victoryState(){

  const base=baseResult();

  const loverWin=

    state.loverPairs.some(pair=>

      isAlive(pair[0])&&

      isAlive(pair[1])

    );

  const foxWin=

    playersWithRole("fox",true).length>0 &&

    (

      alivePlayers().length<=

      playersWithRole("fox",true).length+1

      ||

      base!==null

    );

  return{

    base,

    loverWin,

    foxWin

  };

}

function checkVictory(){

  const result=victoryState();

  if(

    result.base||

    result.loverWin||

    result.foxWin

  ){

    state.winResult=result;

    state.gameEnded=true;

    state.screen="win";

    render();

    return true;

  }

  return false;

}

function winScreen(){

  const r=state.winResult;

  const results=[];

  if(r.base){

    results.push(

      r.base==="werewolf"

        ?"🐺 人狼の勝利です！"

        :"👤 市民の勝利です！"

    );

  }

  if(r.loverWin){

    results.push(

      "❤️ 恋人の勝利です！"

    );

  }

  if(r.foxWin){

    results.push(

      "🦊 妖狐の勝利です！"

    );

  }

  let html="";

  results.forEach((text,i)=>{

    html+=`

      <div class="result ${

        i<results.length-1

          ?"cross"

          :""

      }">

        ${text}

      </div>

    `;

  });

  const finalText=

    results[results.length-1];

  html+=`

    <div class="notice">

      最終勝利

      <br>

      <strong>${finalText}</strong>

    </div>

    <button onclick="location.reload()">

      最初に戻る

    </button>

  `;

  card("🏆 ゲーム終了",html);

  speak(finalText);

}

render();

</script>

</body>

</html>
