<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐺 人狼コンプリートGM</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:20px;text-align:center}
.container{max-width:680px;margin:auto;background:white;padding:25px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h1{margin-top:0} input,button,select{font-size:18px;padding:10px;margin:6px;border-radius:10px;border:1px solid #ccc}
button{cursor:pointer;background:#333;color:white;border:none}button:disabled{background:#aaa;cursor:not-allowed}
.hidden{display:none}.info{font-size:18px;line-height:1.7}.mode-box{display:flex;justify-content:center;gap:15px;margin:15px 0;flex-wrap:wrap}
.mode-option{border:2px solid #ddd;border-radius:15px;padding:15px;min-width:130px;cursor:pointer}.mode-option.selected{border-color:#333;background:#f0f0f0}
.role-list{text-align:left;max-height:500px;overflow-y:auto;border:1px solid #ddd;padding:10px;border-radius:10px}
.role-item{display:flex;align-items:center;justify-content:space-between;padding:10px 5px;border-bottom:1px solid #eee;gap:5px}.role-name{flex:1;font-size:17px}
.counter{display:flex;align-items:center;gap:3px}.counter button{width:42px;height:42px;padding:0;margin:0;font-size:24px}.count{width:35px;text-align:center;font-size:20px;font-weight:bold}
.total{font-size:22px;font-weight:bold;margin:15px 0}.ok{color:green}.ng{color:red}.player-box{margin:15px 0}.role{font-size:30px;font-weight:bold;margin:25px 0}
.lover{color:#d63384;font-size:23px;font-weight:bold;margin-top:15px}.wolf-info{color:#555;font-size:20px;font-weight:bold;margin-top:15px}.lover-partner{font-size:20px;margin-top:8px}
.card-box,.action-box{margin:20px 0;padding:20px;border:2px solid #ddd;border-radius:15px}.card-select{width:90%;max-width:450px}
.status{font-size:18px;font-weight:bold;margin:15px}.warning{color:#c00;font-weight:bold}.success{color:green;font-weight:bold}
.error-box{background:#fff0f0;border:2px solid #d33;border-radius:15px;padding:15px;margin:20px 0}.choice{display:block;width:90%;max-width:500px;margin:10px auto}
.result{font-size:24px;font-weight:bold;margin:20px}.vote-player{padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:12px}.vote-player select{width:90%;max-width:400px}
.small{font-size:14px;color:#666}hr{border:none;border-top:1px solid #ddd;margin:25px 0}
.voice{background:#f0f0f0;border-radius:15px;padding:10px;margin:15px 0}.voice button{font-size:16px}
</style>
</head>
<body>
<div class="container">
<h1>🐺 人狼コンプリートGM</h1>

<div id="setup">
<h2>🎮 ゲーム設定</h2>
<p>参加人数を入力してください</p>
<input id="playerCount" type="number" min="4" max="20" value="6" onchange="resetRoleCounts()">

<h3>🎮 ゲームモード</h3>
<div class="mode-box">
<label class="mode-option selected" id="modeNoCard"><input type="radio" name="gameMode" value="noCard" checked onchange="changeGameMode()"> 📱 カードなし</label>
<label class="mode-option" id="modeCard"><input type="radio" name="gameMode" value="card" onchange="changeGameMode()"> 🃏 カードあり</label>
</div>

<h3>❤️ 恋人の役職兼用</h3>
<label><input type="radio" name="loverMode" value="false" checked onchange="updateLoverMode()"> なし</label>
<label><input type="radio" name="loverMode" value="true" onchange="updateLoverMode()"> あり</label>

<h3>🎭 今回使う役職</h3>
<div id="totalDisplay" class="total ng">配役：0 / 6人</div>
<div id="roleList" class="role-list"></div>
<br>
<button id="nextButton" onclick="preparePlayers()" disabled>プレイヤー名を入力</button>
</div>

<div id="playerSetup" class="hidden">
<h2>👥 プレイヤー名</h2><p>プレイヤーの名前を入力してください。</p>
<div id="playerInputs"></div>
<button onclick="startGame()">ゲーム開始</button>
</div>

<div id="cardSetup" class="hidden">
<h2>🃏 カード登録</h2><div id="cardPlayerTitle"></div>
<div class="card-box"><p class="info">このプレイヤーに実際に配ったカードを選んでください。</p>
<select id="cardSelect" class="card-select" onchange="cardSelectionChanged()"></select>
<div id="cardStatus" class="status"></div></div>
<button id="cardNextButton" onclick="confirmCard()" disabled>このカードで登録</button>
</div>

<div id="cardCheck" class="hidden">
<h2>🔍 カードを確認しています</h2><div id="cardCheckResult"></div>
<button id="retryCardButton" onclick="retryCardInput()" class="hidden">最初の人からもう一度入力</button>
<button id="cardCheckNextButton" onclick="finishCardCheck()" class="hidden">役職確認へ</button>
</div>

<div id="game" class="hidden">
<h2 id="playerTitle"></h2><div id="roleArea" class="role">？？？</div><div id="loverArea"></div>
<p id="info" class="info">役職を見るボタンを押してください。</p>
<button id="mainButton" onclick="showRole()">役職を見る</button>
</div>

<div id="day" class="hidden">
<h2>☀️ 昼の議論</h2><div id="dayInfo" class="info"></div>
<div class="voice"><button onclick="speakDay()">🎙️ GM音声を再生</button> <button onclick="stopVoice()">🔇 停止</button></div>
<hr><button onclick="startVoting()">🗳️ 投票へ</button>
</div>

<div id="vote" class="hidden">
<h2>🗳️ 投票</h2><p id="voteInstruction" class="info"></p><div id="votePlayers"></div>
<button onclick="finishVoting()">⚖️ 投票を集計する</button>
</div>

<div id="voteResult" class="hidden"><h2>⚖️ 投票結果</h2><div id="voteResultText" class="info"></div><button onclick="afterVote()">次へ</button></div>

<div id="gameReady" class="hidden"><h2>🌙 夜の時間</h2><p class="info">昼の議論と投票が終了しました。</p>
<button onclick="startNight()">🌙 夜を開始</button></div>

<div id="night" class="hidden">
<h2 id="nightTitle">🌙 夜</h2><div id="nightInfo" class="info"></div>
<div id="nightVoice" class="voice"><button onclick="speakNight()">🎙️ GM音声</button><button onclick="stopVoice()">🔇 停止</button></div>
<div id="nightAction" class="action-box"></div>
</div>

<div id="gameOver" class="hidden"><h2>🏆 ゲーム終了</h2><div id="winner" class="result"></div></div>
</div>

<script>
const ROLES=[
["werewolf","🐺 人狼"],["wolfChild","👶 人狼の子ども"],["betrayer","😈 裏切り者"],["betrayShared","🤝 裏切りの共有者"],["informant","👁️ 内通者"],["betrayAttacker","⚔️ 裏切りの襲撃者"],["spy","🕵️ スパイ"],["villager","👤 市民"],["seer","🔮 預言者"],["bodyguard","🛡️ ボディーガード"],["medium","👻 霊媒師"],["hunter","🔫 ハンター"],["shared","🤝 共有者"],["dictator","👑 独裁者"],["tough","💪 タフガイ"],["counselor","🩺 カウンセラー"],["magician","🎩 奇術師"],["trapper","🪤 罠師"],["knights","🛡️ 騎士団"],["shadow","🪞 影武者"],["king","👑 王様"],["cursed","🧟 呪われた者"],["fox","🦊 妖狐"],["god","🙏 神様"],["lover","❤️ 恋人"],["loneWolf","🐺 一匹狼"],["android","🤖 アンドロイド"],["scarecrow","🌾 案山子"]
];
const WOLF_ROLES=["werewolf","wolfChild","loneWolf"];
const BETRAYER_ROLES=["betrayer","betrayShared","informant","betrayAttacker"];
let roleCounts={},players=[],selectedRoles=[],currentPlayer=0,currentCardPlayer=0,loverMode=false,gameMode="noCard",day=1,nightStep=0,nightData={},voteData={},voteOrder=[],voteIndex=0,voteRound=1,runoffCandidates=[],initialSeerIndex=0;

function $(id){return document.getElementById(id)}
function escapeHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function getRoleName(id){const r=ROLES.find(x=>x[0]===id);return r?r[1]:"不明"}
function isWolf(p){return WOLF_ROLES.includes(p.roleId)}
function isBetrayer(p){return BETRAYER_ROLES.includes(p.roleId)}
function alivePlayers(){return players.filter(p=>p.alive)}
function getTargets(excludeId=null){return alivePlayers().filter(p=>p.id!==excludeId)}
function speak(text){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.95;u.pitch=1;window.speechSynthesis.speak(u)}
function stopVoice(){if("speechSynthesis" in window)window.speechSynthesis.cancel()}
function speakDay(){speak(`${day}日目の昼です。生存者は、${alivePlayers().map(p=>p.name).join("、")}さんです。みんなで議論を開始してください。`)}
function speakNight(){speak(nightVoiceText())}
function nightVoiceText(){const s=NIGHT_STEPS[nightStep];return `${s}の皆さん、目を開けてください。${activeNamesForStep(nightStep)}。行動が終わったら、目を閉じてください。`}
function activeNamesForStep(step){
 const map=[
 ()=>players.filter(p=>p.roleId==="cursed"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="spy"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="android"&&p.alive&&!p.copiedRole).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="trapper"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="bodyguard"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="knights"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>isWolf(p)&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="betrayAttacker"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="counselor"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>isBetrayer(p)&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="magician"&&p.alive&&!p.abilitiesUsed.magician).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="seer"&&p.alive).map(p=>p.name).join("、"),
 ()=>players.filter(p=>p.roleId==="medium"&&p.alive).map(p=>p.name).join("、")
 ]; return map[step]();
}
function changeGameMode(){gameMode=document.querySelector('input[name="gameMode"]:checked').value;$("modeNoCard").classList.toggle("selected",gameMode==="noCard");$("modeCard").classList.toggle("selected",gameMode==="card")}
function updateLoverMode(){loverMode=document.querySelector('input[name="loverMode"]:checked').value==="true";renderRoleList()}
function resetRoleCounts(){roleCounts={};ROLES.forEach(r=>roleCounts[r[0]]=0);renderRoleList()}
function renderRoleList(){const list=$("roleList");list.innerHTML="";ROLES.forEach(r=>{if(r[0]==="lover"&&loverMode)return;list.innerHTML+=`<div class="role-item"><div class="role-name">${r[1]}</div><div class="counter"><button type="button" onclick="changeRoleCount('${r[0]}',-1)">−</button><div class="count">${roleCounts[r[0]]||0}</div><button type="button" onclick="changeRoleCount('${r[0]}',1)">＋</button></div></div>`});updateTotal()}
function changeRoleCount(id,ch){const pc=Number($("playerCount").value),n=(roleCounts[id]||0)+ch;if(n<0||n>pc)return;roleCounts[id]=n;renderRoleList()}
function updateTotal(){const pc=Number($("playerCount").value);let t=0;Object.entries(roleCounts).forEach(([id,n])=>{if(!(id==="lover"&&loverMode))t+=n});$("totalDisplay").textContent=`配役：${t} / ${pc}人`;$("totalDisplay").className="total "+(t===pc?"ok":"ng");$("nextButton").disabled=t!==pc}
function preparePlayers(){const n=Number($("playerCount").value);if(n<4||n>20){alert("4人〜20人で入力してください。");return}selectedRoles=[];ROLES.forEach(r=>{if(r[0]==="lover"&&loverMode)return;for(let i=0;i<(roleCounts[r[0]]||0);i++)selectedRoles.push(r[0])});$("playerInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="player-box"><label>プレイヤー${i+1}</label><br><input id="playerName${i}" type="text" maxlength="20" placeholder="名前を入力" value="${escapeHtml(localStorage.getItem("jinroPlayer"+i)||"")}"></div>`).join("");$("setup").classList.add("hidden");$("playerSetup").classList.remove("hidden")}
function startGame(){const names=[];for(let i=0;i<selectedRoles.length;i++){const el=$("playerName"+i),name=el.value.trim();if(!name){alert(`プレイヤー${i+1}の名前を入力してください。`);el.focus();return}names.push(name);localStorage.setItem("jinroPlayer"+i,name)}
players=names.map((name,id)=>({id,name,roleId:null,alive:true,lover:false,loverPartner:null,abilitiesUsed:{},copiedRole:null,cursedAwakened:false,toughHit:false,lastDeathReason:null,lastGuardTarget:null}));
if(gameMode==="noCard"){assignRandomRoles();finishRoleAssignment()}else{currentCardPlayer=0;$("playerSetup").classList.add("hidden");$("cardSetup").classList.remove("hidden");showCardPlayer()}}
function assignRandomRoles(){const a=[...selectedRoles].sort(()=>Math.random()-.5);players.forEach((p,i)=>p.roleId=a[i])}
function showCardPlayer(){const p=players[currentCardPlayer];$("cardPlayerTitle").innerHTML=`<h3>${escapeHtml(p.name)} さん</h3>`;$("cardSelect").innerHTML=`<option value="">配られたカードを選択してください</option>`;ROLES.forEach(r=>{if(r[0]==="lover"&&loverMode)return;const o=document.createElement("option");o.value=r[0];o.textContent=r[1];$("cardSelect").appendChild(o)});$("cardStatus").textContent="配られたカードを選択してください。";$("cardNextButton").disabled=true}
function cardSelectionChanged(){$("cardNextButton").disabled=!$("cardSelect").value}
function confirmCard(){const role=$("cardSelect").value;if(!role)return;players[currentCardPlayer].roleId=role;currentCardPlayer++;if(currentCardPlayer<players.length){showCardPlayer();return}$("cardSetup").classList.add("hidden");$("cardCheck").classList.remove("hidden");checkCards()}
function checkCards(){const entered={};ROLES.forEach(r=>entered[r[0]]=0);players.forEach(p=>{if(p.roleId)entered[p.roleId]++});let ok=true,msg=[];ROLES.forEach(r=>{if(r[0]==="lover"&&loverMode)return;const e=roleCounts[r[0]]||0,a=entered[r[0]]||0;if(e!==a){ok=false;msg.push(`${r[1]}：設定 ${e}枚 / 入力 ${a}枚`)}});if(ok){$("cardCheckResult").innerHTML='<div class="success">🎉 カード登録完了！</div><p>設定した役職と入力したカードが一致しました。</p>';$("cardCheckNextButton").classList.remove("hidden");$("retryCardButton").classList.add("hidden")}else{$("cardCheckResult").innerHTML=`<div class="error-box"><div class="warning">❌ カードの枚数が一致しません。</div><p>${msg.join("<br>")}</p></div>`;$("retryCardButton").classList.remove("hidden");$("cardCheckNextButton").classList.add("hidden")}}
function retryCardInput(){players.forEach(p=>p.roleId=null);currentCardPlayer=0;$("cardCheck").classList.add("hidden");$("cardSetup").classList.remove("hidden");showCardPlayer()}
function finishCardCheck(){$("cardCheck").classList.add("hidden");finishRoleAssignment()}
function finishRoleAssignment(){if(loverMode){const a=[...players].sort(()=>Math.random()-.5);a[0].lover=a[1].lover=true;a[0].loverPartner=a[1].name;a[1].loverPartner=a[0].name}currentPlayer=0;$("game").classList.remove("hidden");showPlayer()}
function showPlayer(){const p=players[currentPlayer];$("playerTitle").textContent=`${p.name} さん`;$("roleArea").textContent="？？？";$("loverArea").innerHTML="";$("info").textContent="役職を見るボタンを押してください。";$("mainButton").style.display="inline-block";$("mainButton").textContent="役職を見る";$("mainButton").onclick=showRole}
function showRole(){const p=players[currentPlayer];$("roleArea").textContent=getRoleName(p.roleId);let extra="";if(p.lover)extra+=`<div class="lover">❤️ 恋人</div><div class="lover-partner">恋人：${escapeHtml(p.loverPartner)}</div>`;if(isWolf(p)){const ws=players.filter(x=>x.id!==p.id&&isWolf(x));if(ws.length)extra+=`<div class="wolf-info">🐺 人狼仲間</div><div class="lover-partner">${ws.map(x=>escapeHtml(x.name)).join("、")}</div>`}$("loverArea").innerHTML=extra;$("info").textContent=getRoleDescription(p.roleId);$("mainButton").textContent="次の人";$("mainButton").onclick=nextPlayer}
function nextPlayer(){currentPlayer++;if(currentPlayer>=players.length){$("game").classList.add("hidden");initialSeerChoice();return}showPlayer()}
function getRoleDescription(id){const d={werewolf:"🐺 毎夜1人を襲撃します。人狼同士を知っています。",wolfChild:"👶 人狼として行動します。人狼同士を知っています。",loneWolf:"🐺 人狼として行動します。",betrayer:"😈 人狼陣営です。",betrayShared:"🤝 裏切りの共有者です。",informant:"👁️ 人狼を知っています。",betrayAttacker:"⚔️ 毎夜1人を襲撃します。",spy:"🕵️ スパイです。",villager:"👤 特別な能力はありません。",seer:"🔮 毎夜1人を占います。",bodyguard:"🛡️ 毎夜1人を守ります。自分自身は守れません。同じ人を2夜連続では守れません。",medium:"👻 前日の追放者を確認できます。",hunter:"🔫 死亡時に1人を道連れにできます。",shared:"🤝 共有者同士を知っています。",dictator:"👑 1回だけ昼の議論を強制終了できます。",tough:"💪 襲撃を1回耐えます。",counselor:"🩺 裏切り者系を改心させます。",magician:"🎩 襲撃先を変更できます。",trapper:"🪤 毎晩1人に罠を仕掛けます。",knights:"🛡️ 騎士団で守ります。",shadow:"🪞 1回だけ議論を強制終了します。",king:"👑 投票を2票分として数えます。",cursed:"🧟 襲撃された夜は死亡せず、翌夜に人狼になります。",fox:"🦊 人狼の襲撃では死亡せず、占われると死亡します。",god:"🙏 全員の役職を知っています。",lover:"❤️ 恋人同士はお互いを知っています。",android:"🤖 誰か1人の役職をコピーします。",scarecrow:"🌾 案山子同士を知っています。"};return d[id]||"役職の説明はありません。"}
function startInitialDay(){day=1;$("game").classList.add("hidden");$("day").classList.remove("hidden");$("dayInfo").innerHTML=`<h3>☀️ 1日目の昼</h3><p>役職確認が完了しました。</p><p>生存者：${alivePlayers().map(p=>escapeHtml(p.name)).join("、")}</p>`;speak("1日目の昼です。議論を開始してください。")}
function initialSeerChoice(){const seers=players.filter(p=>p.roleId==="seer"&&p.alive);if(!seers.length){startInitialDay();return}initialSeerIndex=0;showInitialSeer()}
function showInitialSeer(){const seers=players.filter(p=>p.roleId==="seer"&&p.alive);if(initialSeerIndex>=seers.length){startInitialDay();return}const s=seers[initialSeerIndex];$("game").classList.remove("hidden");$("playerTitle").textContent=`${s.name} さん`;$("roleArea").textContent="🔮 預言者";$("loverArea").innerHTML="";$("info").textContent="初日に占いますか？";$("mainButton").style.display="inline-block";$("mainButton").textContent="🔮 占う";$("mainButton").onclick=()=>showInitialTargets(s);$("mainButton").insertAdjacentHTML("afterend",'<button id="skipInitial" onclick="skipInitialSeer()">占わない</button>');speak(`${s.name}さん、初日の占いです。占う場合は占うボタンを押してください。占わない場合は占わないを押してください。`)}
function cleanupInitial(){const x=$("skipInitial");if(x)x.remove();const t=$("initialSeerTargets");if(t)t.remove()}
function skipInitialSeer(){cleanupInitial();initialSeerIndex++;showInitialSeer()}
function showInitialTargets(s){cleanupInitial();$("info").textContent="占う相手を選んでください。";const div=document.createElement("div");div.id="initialSeerTargets";div.innerHTML=getTargets(s.id).map(t=>`<button class="choice" onclick="initialSeerResult(${t.id})">${escapeHtml(t.name)}</button>`).join("");$("info").insertAdjacentElement("afterend",div);$("mainButton").style.display="none"}
function initialSeerResult(id){const t=players.find(p=>p.id===Number(id));const result=(isWolf(t)||t.roleId==="fox")?"人狼":"市民";$("initialSeerTargets").innerHTML=`<div class="result">🔮 占い結果</div><p>${escapeHtml(t.name)}さんは</p><div class="result">「${result}」</div><button onclick="finishInitialSeer()">結果を確認して次へ</button>`}
function finishInitialSeer(){cleanupInitial();initialSeerIndex++;showInitialSeer()}

function startVoting(){
 $("day").classList.add("hidden");$("vote").classList.remove("hidden");
 voteRound=1;voteData={};voteOrder=alivePlayers();voteIndex=0;runoffCandidates=[];renderCurrentVote();
}
function renderCurrentVote(){
 const voter=voteOrder[voteIndex];
 if(!voter){return}
 const candidates=voteRound===2?runoffCandidates.map(id=>players.find(p=>p.id===id)).filter(Boolean):alivePlayers();
 $("voteInstruction").innerHTML=`<strong>${voteRound===2?"⚖️ 決選投票":"🗳️ 投票"}</strong><br>${escapeHtml(voter.name)}さんの投票です。<br><span class="small">他の人にはこの投票先を表示しません。</span>`;
 $("votePlayers").innerHTML=`<div class="vote-player"><strong>🗳️ ${escapeHtml(voter.name)}さん</strong><br><select id="currentVote"><option value="">投票先を選択</option>${candidates.filter(t=>t.id!==voter.id).map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("")}</select></div>`;
}
function finishVoting(){
 const voter=voteOrder[voteIndex],s=$("currentVote");
 if(!voter||!s||!s.value){alert(`${voter?voter.name:"このプレイヤー"}さんの投票先を選択してください。`);if(s)s.focus();return}
 voteData[voter.id]=Number(s.value);voteIndex++;
 if(voteIndex<voteOrder.length){renderCurrentVote();return}
 const c={};alivePlayers().forEach(p=>c[p.id]=0);
 Object.entries(voteData).forEach(([voterId,targetId])=>{const voter=players.find(p=>p.id===Number(voterId));if(voter)c[targetId]=(c[targetId]||0)+pVoteWeight(voter)});
 const max=Math.max(...Object.values(c)),top=Object.entries(c).filter(([id,n])=>n===max).map(([id])=>Number(id));
 if(voteRound===1&&top.length>1){startRunoff(top);return}
 showVotingResult(c,top,voteRound===2);
}
function startRunoff(candidates){
 voteRound=2;runoffCandidates=candidates;voteData={};voteOrder=alivePlayers();voteIndex=0;
 $("voteInstruction").innerHTML='<strong>⚖️ 決選投票</strong><br>最も票が多かった候補者への決選投票です。<br><span class="small">今回も1人ずつ投票します。</span>';
 renderCurrentVote();
}
function showVotingResult(c,top,runoff){
 let text=`<h3>🗳️ ${runoff?"決選投票":"投票"}結果</h3>`;
 alivePlayers().forEach(p=>text+=`<p>${escapeHtml(p.name)}：<strong>${c[p.id]||0}票</strong></p>`);
 if(top.length>1){text+="<hr><div class='warning'>⚠️ 決選投票も同票のため、追放者はありません。</div>";speak("決選投票も同数でした。追放者はいません。");}
 else{const t=players.find(p=>p.id===top[0]);eliminatePlayer(t,"vote");text+=`<hr><div class='result'>⚖️ ${escapeHtml(t.name)}さんが追放されました。</div><p>役職：${getRoleName(t.roleId)}</p>`;speak(`${t.name}さんが追放されました。`)}
 $("vote").classList.add("hidden");$("voteResult").classList.remove("hidden");$("voteResultText").innerHTML=text;
}
function pVoteWeight(p){return p.roleId==="king"?2:1}
function eliminatePlayer(p,reason){if(!p||!p.alive)return;p.alive=false;p.lastDeathReason=reason;if(p.lover){const q=players.find(x=>x.name===p.loverPartner&&x.alive);if(q){q.alive=false;q.lastDeathReason="lover"}}}
function afterVote(){$("voteResult").classList.add("hidden");if(checkWin())return;$("gameReady").classList.remove("hidden")}
function checkWin(){const a=alivePlayers(),wolves=a.filter(isWolf);if(!a.length){showWinner("⚖️ 生存者なし");return true}if(wolves.length===0){showWinner("🎉 市民陣営の勝利！");return true}if(wolves.length>=a.filter(p=>!isWolf(p)).length){showWinner("🐺 人狼陣営の勝利！");return true}return false}
function showWinner(t){stopVoice();["day","gameReady","night","vote","voteResult","game"].forEach(id=>$(id).classList.add("hidden"));$("gameOver").classList.remove("hidden");$("winner").textContent=t;speak(t)}

const NIGHT_STEPS=["🧟 呪われた者","🕵️ スパイ","🤖 アンドロイド","🪤 罠師","🛡️ ボディーガード","🛡️ 騎士団","🐺 人狼／人狼の子ども／一匹狼","⚔️ 裏切りの襲撃者","🩺 カウンセラー","😈 裏切り者系","🎩 奇術師","🔮 預言者","👻 霊媒師"];
function startNight(){$("gameReady").classList.add("hidden");$("night").classList.remove("hidden");nightStep=0;nightData={cursed:null,trap:null,bodyguard:null,knights:null,wolfAttack:null,betrayAttack:null,changedTarget:null,android:null};runNightStep()}
function runNightStep(){if(nightStep>=NIGHT_STEPS.length){finishNight();return}$("nightTitle").textContent=NIGHT_STEPS[nightStep];$("nightInfo").textContent="";speakNight();[nightCursed,nightSpy,nightAndroid,nightTrapper,nightBodyguard,nightKnights,nightWolves,nightBetrayAttacker,nightCounselor,nightBetrayer,nightMagician,nightSeer,nightMedium][nightStep]()}
function nextNight(){nightStep++;runNightStep()}
function finishStep(text){$("nightInfo").textContent=text;$("nightAction").innerHTML='<button onclick="nextNight()">目を閉じて次へ</button>'}
function nightCursed(){const p=players.find(p=>p.roleId==="cursed"&&p.alive);if(p&&p.cursedAwakened){p.roleId="werewolf";p.cursedAwakened=false;finishStep("🧟 呪われた者は人狼になりました。")}else finishStep("🧟 呪われた者の確認が終わりました。")}
function nightSpy(){finishStep(players.some(p=>p.roleId==="spy"&&p.alive)?"🕵️ スパイの行動を確認しました。":"🕵️ スパイはいません。")}
function nightAndroid(){const p=players.find(p=>p.roleId==="android"&&p.alive&&!p.copiedRole);if(!p){nextNight();return}showTargetButtons("🤖 コピーする相手",getTargets(p.id),"androidCopy")}
function androidCopy(id){const p=players.find(p=>p.roleId==="android"&&p.alive&&!p.copiedRole),t=players.find(x=>x.id===Number(id));if(p&&t)p.copiedRole=t.roleId;$("nightAction").innerHTML=`<p>🤖 ${escapeHtml(p.name)}さんは${getRoleName(t.roleId)}をコピーしました。</p><button onclick="nextNight()">目を閉じて次へ</button>`}
function nightTrapper(){const p=players.find(p=>p.roleId==="trapper"&&p.alive);if(!p){nextNight();return}showTargetButtons("🪤 罠を仕掛ける相手",getTargets(p.id),"setTrap")}
function setTrap(id){nightData.trap=Number(id);finishStep("🪤 罠を仕掛けました。")}
function nightBodyguard(){const p=players.find(p=>p.roleId==="bodyguard"&&p.alive);if(!p){nextNight();return}const targets=alivePlayers().filter(t=>t.id!==p.id&&t.id!==p.lastGuardTarget);if(!targets.length){finishStep("🛡️ 守れる相手がいません。");return}showTargetButtons("🛡️ 守る相手",targets,"setBodyguard")}
function setBodyguard(id){const p=players.find(p=>p.roleId==="bodyguard"&&p.alive);const target=Number(id);if(p){p.lastGuardTarget=target;nightData.bodyguard=target}finishStep("🛡️ 守る相手を決定しました。") }
function nightKnights(){const p=players.find(p=>p.roleId==="knights"&&p.alive);if(!p){nextNight();return}showTargetButtons("🛡️ 騎士団が守る相手",alivePlayers(),"setKnights")}
function setKnights(id){nightData.knights=Number(id);finishStep("🛡️ 騎士団の守る相手を決定しました。")}
function nightWolves(){const w=players.filter(p=>isWolf(p)&&p.alive);if(!w.length){nextNight();return}showTargetButtons("🐺 襲撃する相手",alivePlayers(),"setWolfAttack")}
function setWolfAttack(id){nightData.wolfAttack=Number(id);finishStep("🐺 襲撃先を決定しました。")}
function nightBetrayAttacker(){const p=players.find(p=>p.roleId==="betrayAttacker"&&p.alive);if(!p){nextNight();return}showTargetButtons("⚔️ 襲撃する相手",getTargets(p.id),"setBetrayAttack")}
function setBetrayAttack(id){nightData.betrayAttack=Number(id);finishStep("⚔️ 襲撃先を決定しました。")}
function nightCounselor(){const p=players.find(p=>p.roleId==="counselor"&&p.alive);if(!p){nextNight();return}showTargetButtons("🩺 改心させる相手",getTargets(p.id),"setCounselor")}
function setCounselor(id){const t=players.find(p=>p.id===Number(id));if(t&&isBetrayer(t))t.roleId="villager";finishStep("🩺 カウンセラーの処理が完了しました。")}
function nightBetrayer(){finishStep(players.some(p=>isBetrayer(p)&&p.alive)?"😈 裏切り者系の確認が終わりました。":"😈 裏切り者系はいません。")}
function nightMagician(){const p=players.find(p=>p.roleId==="magician"&&p.alive&&!p.abilitiesUsed.magician);if(!p){nextNight();return}if(day<2){finishStep("🎩 奇術師は2日目以降に使用できます。");return}showTargetButtons("🎩 襲撃先を変更する相手",alivePlayers(),"useMagician")}
function useMagician(id){const p=players.find(p=>p.roleId==="magician"&&p.alive);p.abilitiesUsed.magician=true;nightData.changedTarget=Number(id);finishStep("🎩 襲撃先を変更しました。")}
function nightSeer(){const p=players.find(p=>p.roleId==="seer"&&p.alive);if(!p){nextNight();return}showTargetButtons("🔮 占う相手",getTargets(p.id),"seerResult")}
function seerResult(id){const t=players.find(p=>p.id===Number(id)),r=(isWolf(t)||t.roleId==="fox")?"人狼":"市民";$("nightAction").innerHTML=`<div class="result">🔮 占い結果</div><p>${escapeHtml(t.name)}さんは</p><div class="result">「${r}」</div><button onclick="nextNight()">目を閉じて次へ</button>`}
function nightMedium(){const p=players.find(p=>p.roleId==="medium"&&p.alive);if(!p){nextNight();return}const d=players.find(x=>x.lastDeathReason==="vote"&&!x.mediumSeen);if(!d){finishStep("👻 今回確認できる追放者はいません。");return}d.mediumSeen=true;finishStep(`👻 ${d.name}さんは「${isWolf(d)?"人狼":"市民"}」でした。`)}
function showTargetButtons(title,targets,fn){$("nightAction").innerHTML=`<h3>${title}</h3>${targets.map(t=>`<button class="choice" onclick="${fn}(${t.id})">${escapeHtml(t.name)}</button>`).join("")}`}
function finishNight(){
 let attacks=[];if(nightData.wolfAttack!=null)attacks.push(nightData.wolfAttack);if(nightData.betrayAttack!=null)attacks.push(nightData.betrayAttack);if(nightData.changedTarget!=null)attacks=[nightData.changedTarget];attacks=[...new Set(attacks)];
 attacks.forEach(id=>{const t=players.find(p=>p.id===id);if(!t||!t.alive)return;
 if(t.roleId==="fox"){eliminatePlayer(t,"night");t.lastDeathReason="night";return}
 if(nightData.bodyguard===t.id||nightData.knights===t.id)return;
 if(nightData.trap===t.id){const wolves=players.filter(p=>p.alive&&isWolf(p));if(wolves.length){const w=wolves[Math.floor(Math.random()*wolves.length)];w.alive=false;w.lastDeathReason="trap"}return}
 if(t.roleId==="cursed"){t.cursedAwakened=true;return}
 if(t.roleId==="tough"&&!t.toughHit){t.toughHit=true;return}
 eliminatePlayer(t,"night")
 });
 $("night").classList.add("hidden");if(checkWin())return;day++;startDayAfterNight()
}
function startDayAfterNight(){const dead=players.filter(p=>!p.alive);$("day").classList.remove("hidden");$("dayInfo").innerHTML=`<h3>☀️ ${day}日目の昼</h3>${dead.length?`<p>💀 死亡者：${dead.map(p=>escapeHtml(p.name)).join("、")}</p>`:"<p>🌟 今夜は死亡者はいません。</p>"}<p>生存者：${alivePlayers().map(p=>escapeHtml(p.name)).join("、")}</p><hr><p>議論をしてください。</p>`;speakDay()}

resetRoleCounts();
</script>
</body>
