<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<script>

/* =====================================================

   役職一覧

===================================================== */

const ROLES=[

  "人狼",

  "人狼の子ども",

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者",

  "スパイ",

  "市民",

  "予言者",

  "ボディーガード",

  "霊媒師",

  "ハンター",

  "共有者",

  "独裁者",

  "タフガイ",

  "カウンセラー",

  "奇術師",

  "罠師",

  "騎士団",

  "影武者",

  "王様",

  "妖狐",

  "神様",

  "恋人",

  "一匹狼",

  "アンドロイド",

  "案山子",

  "呪われた者"

];

/* =====================================================

   人狼として扱う役職

===================================================== */

const WOLF_ROLES=[

  "人狼",

  "人狼の子ども",

  "一匹狼"

];

const NORMAL_WOLF_ROLES=[

  "人狼",

  "人狼の子ども"

];

const BETRAYER_ROLES=[

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者"

];

/* =====================================================

   8/20確定版・夜の13段階

===================================================== */

const NIGHT_ORDER=[

  "裏切り者確認",

  "スパイ",

  "人狼の子ども",

  "人狼",

  "裏切りの襲撃者",

  "ボディーガード",

  "騎士団",

  "罠師",

  "カウンセラー",

  "予言者",

  "霊媒師",

  "奇術師",

  "アンドロイド"

];

/* =====================================================

   ゲームデータ

===================================================== */

let game={

  players:[],

  roleCount:{},

  day:0,

  night:0,

  confirmIndex:0,

  confirmRevealed:false,

  firstSeer:true,

  firstDay:true,

  discussionTime:300,

  discussionTimer:null,

  discussionEnded:false,

  nightIndex:0,

  wolfTarget:null,

  wolfTargets:[],

  raiderTarget:null,

  guardTarget:null,

  lastGuard:null,

  knightTarget:null,

  trapTarget:null,

  lastTrap:null,

  trapActive:false,

  trapOwner:null,

  counselTarget:null,

  magicTarget:null,

  magicUsed:false,

  lastExiled:null,

  toughPending:[],

  lovers:[],

  loverPairs:[],

  android:{},

  blockedRoles:{},

  convertedThisNight:[],

  childRage:false,

  voteRound:0,

  dictatorUsed:false,

  shadowUsed:false,

  nightDeaths:[],

  morningDeaths:[],

  gameOver:false

};

const app=document.getElementById("app");

/* =====================================================

   基本関数

===================================================== */

function escapeHTML(text){

  return String(text).replace(

    /[&<>"']/g,

    function(c){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[c];

    }

  );

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=

      new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    u.rate=1;

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(

    p=>p.alive

  );

}

function rolePlayers(role){

  return game.players.filter(

    p=>p.role===role

  );

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function getPlayer(id){

  return game.players.find(

    p=>p.id===Number(id)

  );

}

function isWolfRole(role){

  return WOLF_ROLES.includes(role);

}

function isNormalWolf(role){

  return NORMAL_WOLF_ROLES.includes(role);

}

function isBetrayer(role){

  return BETRAYER_ROLES.includes(role);

}

function formatTime(sec){

  const m=

    Math.floor(sec/60);

  const s=

    sec%60;

  return(

    m+

    ":"+

    String(s).padStart(2,"0")

  );

}

/* =====================================================

   人狼表示

===================================================== */

function wolfDisplayName(player){

  return(

    `${escapeHTML(player.name)}（人狼）`

  );

}

/* =====================================================

   占い結果

===================================================== */

function seerResult(player){

  /*

    妖狐は人間と出る。

  */

  if(player.role==="妖狐"){

    return "人間";

  }

  /*

    人狼・人狼の子ども・一匹狼

  */

  if(isWolfRole(player.role)){

    return "人狼";

  }

  /*

    呪われた者が人狼化している場合

  */

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  /*

    アンドロイド

  */

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   霊媒結果

===================================================== */

function mediumResult(player){

  if(

    player.role==="人狼" ||

    player.role==="人狼の子ども" ||

    player.role==="一匹狼" ||

    player.role==="案山子"

  ){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   アンドロイド

===================================================== */

function androidCurrentAlignment(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "human";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "human";

  }

  if(isWolfRole(target.role)){

    return "wolf";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "wolf";

  }

  return "human";

}

function androidRoleText(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "まだコピーしていません";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "不明";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "人狼";

  }

  if(isWolfRole(target.role)){

    return "人狼";

  }

  return target.role;

}

/* =====================================================

   ゲーム開始画面

===================================================== */

function startScreen(){

  render(`

  <div class="card">

    <h2>🎮 ゲーム設定</h2>

    <p>

      👥 プレイヤー人数

      <select id="playerCount">

        ${Array.from(

          {length:17},

          (_,i)=>

            `<option value="${i+4}">

              ${i+4}人

            </option>`

        ).join("")}

      </select>

    </p>

    <p>

      🔮 初日の予言

      <select id="firstSeer">

        <option value="yes">

          する

        </option>

        <option value="no">

          しない

        </option>

      </select>

    </p>

    <p>

      ⏱️ 議論時間

      <select id="discussion">

        <option value="180">

          3分

        </option>

        <option value="300" selected>

          5分

        </option>

        <option value="600">

          10分

        </option>

      </select>

    </p>

  </div>

  <div class="card">

    <h2>🃏 役職選択</h2>

    <div

      id="roleTotal"

      class="total-count"

    >

      0 / 4

    </div>

    <p class="small center">

      役職カードの合計枚数を

      プレイヤー人数に合わせてください。

    </p>

    <div id="roleList">

      ${ROLES.map(

        (role,index)=>`

        <div class="role-row">

          <span>

            ${escapeHTML(role)}

          </span>

          <span>

            <button

              onclick="changeRole('${role}',-1)"

            >

              −

            </button>

            <span

              class="count"

              id="count${index}"

            >

              0

            </span>

            <button

              onclick="changeRole('${role}',1)"

            >

              ＋

            </button>

          </span>

        </div>

      `

      ).join("")}

    </div>

  </div>

  <button

    class="green"

    onclick="nameScreen()"

  >

    👤 プレイヤー名入力へ

  </button>

  `);

  updateRoleTotal();

}

/* =====================================================

   役職合計

===================================================== */

function updateRoleTotal(){

  const countElement=

    document.getElementById(

      "playerCount"

    );

  const totalElement=

    document.getElementById(

      "roleTotal"

    );

  if(

    !countElement ||

    !totalElement

  ){

    return;

  }

  const playerCount=

    Number(countElement.value);

  const total=

    Object.values(

      game.roleCount

    ).reduce(

      (sum,value)=>

        sum+Number(value||0),

      0

    );

  totalElement.textContent=

    `${total} / ${playerCount}`;

}

/* =====================================================

   人数変更時

===================================================== */

document.addEventListener(

  "change",

  function(e){

    if(

      e.target &&

      e.target.id==="playerCount"

    ){

      updateRoleTotal();

    }

  }

);

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  /*

    騎士団 0～3

  */

  if(

    role==="騎士団" &&

    value>3

  ){

    value=3;

  }

  /*

    案山子 最大3

  */

  if(

    role==="案山子" &&

    value>3

  ){

    value=3;

  }

  /*

    恋人は2枚セット

  */

  if(

    role==="恋人" &&

    value>2

  ){

    value=2;

  }

  /*

    共有者は2枚セット

  */

  if(

    role==="共有者" &&

    value>2

  ){

    value=2;

  }

  /*

    裏切りの共有者は2枚セット

  */

  if(

    role==="裏切りの共有者" &&

    value>2

  ){

    value=2;

  }

  game.roleCount[role]=value;

  const index=

    ROLES.indexOf(role);

  const el=

    document.getElementById(

      "count"+index

    );

  if(el){

    el.textContent=value;

  }

  updateRoleTotal();

}

/* =====================================================

   名前入力

===================================================== */

function nameScreen(){

  const countElement=

    document.getElementById(

      "playerCount"

    );

  const n=

    Number(countElement.value);

  const saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      ) || "[]"

    );

  game.players=[];

  for(

    let i=0;

    i<n;

    i++

  ){

    game.players.push({

      id:i,

      name:

        saved[i] ||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      androidCopied:false

    });

  }

  game.firstSeer=

    document.getElementById(

      "firstSeer"

    ).value==="yes";

  game.discussionTime=

    Number(

      document.getElementById(

        "discussion"

      ).value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small center">

      前回の名前があれば

      自動で表示されます。

    </p>

    ${game.players.map(

      (p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="width:90%;margin:6px"

      >

    `

    ).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🃏 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach(

    (p,i)=>{

      const el=

        document.getElementById(

          "playerName"+i

        );

      const name=

        el

          ? el.value.trim()

          : "";

      p.name=

        name ||

        `プレイヤー${i+1}`;

    }

  );

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  /*

    人数と役職枚数

  */

  if(

    deck.length!==game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `人数と役職枚数を合わせてください。`

    );

    return;

  }

  /*

    恋人

  */

  if(

    (game.roleCount["恋人"]||0)%2!==0

  ){

    alert(

      "恋人は2枚ワンセットです。"

    );

    return;

  }

  /*

    共有者

  */

  if(

    (game.roleCount["共有者"]||0)!==0 &&

    (game.roleCount["共有者"]||0)!==2

  ){

    alert(

      "共有者は2枚ワンセットです。"

    );

    return;

  }

  /*

    裏切りの共有者

  */

  if(

    (game.roleCount["裏切りの共有者"]||0)!==0 &&

    (game.roleCount["裏切りの共有者"]||0)!==2

  ){

    alert(

      "裏切りの共有者は2枚ワンセットです。"

    );

    return;

  }

  /*

    シャッフル

  */

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach(

    (p,i)=>{

      p.role=deck[i];

      p.alive=true;

      p.cursedWolf=false;

      p.toughHit=false;

      p.blocked=false;

      p.androidCopied=false;

    }

  );

  preparePairs();

  /*

    ゲーム状態を初期化

  */

  game.day=0;

  game.night=0;

  game.confirmIndex=0;

  game.confirmRevealed=false;

  game.lastExiled=null;

  game.toughPending=[];

  game.android={};

  game.childRage=false;

  game.magicUsed=false;

  game.dictatorUsed=false;

  game.shadowUsed=false;

  /*

    役職確認へ

  */

  roleConfirmation();

}

/* =====================================================

   恋人ペア

===================================================== */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(lovers[i+1]){

      const pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(pair);

      game.lovers.push(

        ...pair

      );

    }

  }

}

/* =====================================================

   役職確認情報

===================================================== */

function roleInfoFor(player){

  let info="";

  /*

    人狼確認

  */

  if(

    isWolfRole(player.role)

  ){

    const wolves=

      game.players.filter(

        x=>

          isWolfRole(x.role) &&

          x.id!==player.id

      );

    if(wolves.length){

      info+=`

      <div class="success">

        <strong>

          🐺 あなたが知っている人狼

        </strong>

        <p>

          ${wolves

            .map(wolfDisplayName)

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /*

    内通者

  */

  if(

    player.role==="内通者"

  ){

    const wolves=

      game.players.filter(

        x=>isWolfRole(x.role)

      );

    info+=`

    <div class="success">

      <strong>

        📨 人狼

      </strong>

      <p>

        ${

          wolves.length

            ? wolves

                .map(wolfDisplayName)

                .join("・")

            : "なし"

        }

      </p>

    </div>

    `;

  }

  /*

    裏切りの共有者

  */

  if(

    player.role==="裏切りの共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="裏切りの共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          🤝 裏切りの共有者

        </strong>

        <p>

          ${mates

            .map(

              x=>escapeHTML(x.name)

            )

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /*

    共有者

  */

  if(

    player.role==="共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          🤝 共有者

        </strong>

        <p>

          ${mates

            .map(

              x=>escapeHTML(x.name)

            )

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /*

    恋人

  */

  if(

    player.role==="恋人"

  ){

    const pair=

      game.loverPairs.find(

        pair=>

          pair.includes(

            player.id

          )

      );

    if(pair){

      const mate=

        game.players.find(

          x=>

            x.id===

            pair.find(

              id=>id!==player.id

            )

        );

      if(mate){

        info+=`

        <div class="success">

          <strong>

            ❤️ 恋人

          </strong>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        </div>

        `;

      }

    }

  }

  /*

    神様

  */

  if(

    player.role==="神様"

  ){

    info+=`

    <div class="success">

      <strong>

function finishVote(votes){

  const ids =

    Object.keys(votes);

  if(!ids.length){

    game.voteRound = 0;

    afterNoVote();

    return;

  }

  const max =

    Math.max(

      ...Object.values(votes)

    );

  const winners =

    ids.filter(

      id => votes[id] === max

    );

  /*

    通常投票で同票

    → 決選投票

  */

  if(winners.length > 1){

    if(game.voteRound === 0){

      game.voteRound = 1;

      const names =

        winners.map(

          id =>

            escapeHTML(

  const candidates =

    candidateIds

      .map(id => getPlayer(id))

      .filter(

        p => p && p.alive

      );

  const voters =

    living();

  let index = 0;

  const votes = {};

  function nextVoter(){

    if(index >= voters.length){

      finishDecisionVote(

        votes,

        candidates

      );

      return;

    }

    const voter =

      voters[index++];

    render(`

      <div class="card">

        <div class="progress">

        ${candidates.map(

          p => `

              onclick="castDecisionVote(${p.id})"

            >

              ${escapeHTML(p.name)}

            </button>

          `

        ).join("")}

      </div>

    `);

    window.castDecisionVote =

      function(id){

        const target =

          getPlayer(id);

        if(

          !target ||

          !target.alive

        ){

          return;

        }

        const value =

          voter.role === "王様"

            ? 2

            : 1;

        votes[id] =

          (votes[id] || 0) + value;

        nextVoter();

      };

  }

  nextVoter();

}

function nightStep(){

  if(game.nightIndex >= NIGHT_ORDER.length){

    morning();

    return;

  }

  const role = NIGHT_ORDER[game.nightIndex];

  game.nightIndex++;

  if(role === "裏切り者確認"){

    betrayerCheckStep();

    return;

  }

  if(!hasRole(role)){

    nightStep();

    return;

  }

  wakeRole(role);

}

/* =====================================================

   夜の役職行動

===================================================== */

function performNightRole(role){

  const actors =

    rolePlayers(role).filter(p => p.alive);

  /*

    役職は採用されているが、

    生存者がいない場合はそのまま次へ。

  */

  if(!actors.length){

    nightStep();

    return;

  }

  const actor = actors[0];

  if(role === "呪われた者"){

    nightStep();

    return;

  }

  if(role === "スパイ"){

    spyAction(actor);

    return;

  }

  if(role === "アンドロイド"){

    androidAction(actor);

    return;

  }

  if(role === "罠師"){

    trapAction(actor);

    return;

  }

  if(role === "ボディーガード"){

    bodyguardAction(actor);

    return;

  }

  if(role === "騎士団"){

    knightAction(actor);

    return;

  }

  if(role === "人狼"){

    wolfAction();

    return;

  }

  if(role === "裏切りの襲撃者"){

    raiderAction(actor);

    return;

  }

  if(role === "カウンセラー"){

    counselorAction(actor);

    return;

  }

  if(role === "奇術師"){

    magicAction(actor);

    return;

  }

  if(role === "予言者"){

    seerAction(actor);

    return;

  }

  if(role === "霊媒師"){

    mediumAction(actor);

    return;

  }

  nightStep();

}

function choose(

  title,

  players,

  callback,

  skip = true

){

  let html = `

    <div class="card">

      <h2>${title}</h2>

  `;

  if(players.length === 0){

    html += `

      <p class="small">

        選択できる人はいません。

      </p>

    `;

  }

  players.forEach(p => {

    html += `

      <button

        class="name-button"

        onclick="${callback}(${p.id})"

      >

        ${escapeHTML(p.name)}

      </button>

    `;

  });

  if(skip){

    html += `

      <br>

      <button

        class="orange"

        onclick="nightStep()"

      >

        行動しない

      </button>

    `;

  }

  html += `</div>`;

  render(html);

}

    "アンドロイド"

  ];

  /*

/* =====================================================

   夜の死亡処理

===================================================== */

function killPlayer(player){

  if(!player || !player.alive){

    return false;

  }

  /*

    タフガイは最初の襲撃では死亡しない。

  */

  if(

    player.role === "タフガイ" &&

    !player.toughHit

  ){

    player.toughHit = true;

    if(

      !game.toughPending.includes(player.id)

    ){

      game.toughPending.push(

        player.id

      );

    }

    return false;

  }

  player.alive = false;

  return true;

}

/* =====================================================

   恋人の連動死亡

===================================================== */

function killLoverPartner(player){

  if(!player){

    return;

  }

  const pair =

    game.loverPairs.find(

      p => p.includes(player.id)

    );

  if(!pair){

    return;

  }

  pair.forEach(id => {

    if(id === player.id){

      return;

    }

    const mate = getPlayer(id);

    if(mate && mate.alive){

      mate.alive = false;

    }

  });

}

function morning(){

    タフガイの翌夜死亡処理。

  game.toughPending =

    game.toughPending || [];

  const pending =

    [...game.toughPending];

  game.toughPending = [];

  pending.forEach(id => {

    const p = getPlayer(id);

    if(

      p &&

      p.alive &&

      p.toughHit

    ){

      p.alive = false;

      killLoverPartner(p);

    }

  });

  /*

    カウンセラー処理。

  */

  processCounselor();

  /*

    人狼の襲撃処理。

  */

  processWolfAttack();

  /*

    裏切りの襲撃者の処理。

  */

  processRaiderAttack();

  /*

    妖狐などの死亡も含め、

    恋人の連動死亡を整理。

  */

  game.players.forEach(p => {

    if(!p.alive){

      killLoverPartner(p);

    }

  });

    return;

  const deaths =

/* =====================================================

   カウンセラー処理

===================================================== */

function processCounselor(){

  const id = game.counselTarget;

  if(id === null || id === undefined){

    return;

  }

  const target = getPlayer(id);

  if(!target || !target.alive){

    return;

  }

  /*

    人狼を対象にした場合、

    カウンセラー自身が犠牲になる。

  */

  if(isWolfRole(target.role)){

    const counselor =

      rolePlayers("カウンセラー")

        .find(p => p.alive);

    if(counselor){

      counselor.alive = false;

      killLoverPartner(counselor);

    }

    return;

  }

  /*

    裏切り者系なら市民へ更生。

  */

  if(isBetrayer(target.role)){

    target.role = "市民";

    game.convertedThisNight.push(

      target.id

    );

  }

}

/* =====================================================

   人狼襲撃処理

===================================================== */

function processWolfAttack(){

  game.nightDeaths =

    game.nightDeaths || [];

  const targets = [];

  if(game.wolfTarget !== null){

    targets.push(

      game.wolfTarget

    );

  }

  if(game.wolfTarget2 !== null &&

     game.wolfTarget2 !== undefined){

    targets.push(

      game.wolfTarget2

    );

  }

  targets.forEach(

    targetId => {

      let target =

        getPlayer(targetId);

      if(!target || !target.alive){

        return;

      }

      /*

        奇術師が襲撃先を変更した場合、

        変更先は守り・罠などを無視して死亡。

      */

      if(

        game.magicTarget !== null &&

        game.magicTarget !== undefined

      ){

        target =

          getPlayer(

            game.magicTarget

          );

        if(

          target &&

          target.alive

        ){

          target.alive = false;

          game.nightDeaths.push(

            target.id

          );

          killLoverPartner(target);

        }

        return;

      }

      /*

        ボディーガードが守っている場合。

      */

      if(

        game.guardTarget === target.id

      ){

        /*

          罠対象がボディーガードだった場合は

          ボディーガードには罠が効かず、

          襲撃した人狼が死亡する。

        */

        if(

          game.trapTarget === target.id

        ){

          killAttackingWolf();

        }

        return;

      }

      /*

        騎士団の護衛。

      */

      if(

        game.knightTarget === target.id

      ){

        return;

      }

      /*

        罠。

      */

      if(

        game.trapTarget === target.id

      ){

        killAttackingWolf();

        return;

      }

      /*

        通常の襲撃。

      */

      const died =

        killPlayer(target);

      if(died){

        game.nightDeaths.push(

          target.id

        );

        killLoverPartner(target);

      }

    }

  );

}

/* =====================================================

   襲撃した人狼を死亡させる

===================================================== */

function killAttackingWolf(){

  const wolves =

    living().filter(

      p => isNormalWolf(p.role)

    );

  if(!wolves.length){

    return;

  }

  const victim =

    wolves[

      Math.floor(

        Math.random() * wolves.length

      )

    ];

  victim.alive = false;

  game.nightDeaths =

    game.nightDeaths || [];

  game.nightDeaths.push(

    victim.id

  );

  killLoverPartner(victim);

}

/* =====================================================

   裏切りの襲撃者の処理

===================================================== */

function processRaiderAttack(){

  if(

    game.raiderTarget === null ||

    game.raiderTarget === undefined

  ){

    return;

  }

  let target =

    getPlayer(game.raiderTarget);

  if(!target || !target.alive){

    return;

  }

  /*

    罠師の罠にかかっていた場合、

    裏切りの襲撃者自身が死亡。

  */

  if(

    game.trapTarget === target.id

  ){

    const raider =

      rolePlayers("裏切りの襲撃者")

        .find(p => p.alive);

    if(raider){

      raider.alive = false;

      game.nightDeaths =

        game.nightDeaths || [];

      game.nightDeaths.push(

        raider.id

      );

      killLoverPartner(raider);

    }

    return;

  }

  /*

    通常の襲撃。

    裏切りの襲撃者は人狼を襲撃することもできる。

  */

  if(

    game.guardTarget === target.id ||

    game.knightTarget === target.id

  ){

    return;

  }

  const died =

    killPlayer(target);

  if(died){

    game.nightDeaths =

      game.nightDeaths || [];

    game.nightDeaths.push(

      target.id

    );

    killLoverPartner(target);

  }

}

const WIN_PRIORITY = [

  "案山子",

  "アンドロイド",

  "神様",

  "妖狐",

  "恋人",

  "人狼・市民"

];

function checkVictory(){

  const alive = living();

  if(!alive.length){

    return showVictory(

      "案山子",

      "全員が死亡しました。案山子の勝利です。"

    );

  }

  /*

    案山子

    「全員死亡」が勝利条件。

  */

  if(

    hasLivingRole("案山子") &&

    alive.length === 1

  ){

    return showVictory(

      "案山子",

      "最後まで生き残った案山子の勝利です。"

    );

  }

  /*

    神様

    生存していれば最優先。

  */

  if(hasLivingRole("神様")){

    return showVictory(

      "神様",

      "神様が生き残っています。神様の勝利です。"

    );

  }

  /*

    アンドロイド

    コピーした対象の陣営に従う。

  */

  const androids =

    alive.filter(

      p => p.role === "アンドロイド"

    );

  if(androids.length){

    const wolfAndroid =

      androids.some(

        p =>

          androidCurrentAlignment(p) === "wolf"

      );

    /*

      人狼化したアンドロイドが

      人狼側勝利条件を満たしている場合は

      後段で判定する。

    */

    if(!wolfAndroid){

      const fox =

        alive.some(

          p => p.role === "妖狐"

        );

      if(!fox){

        const wolves =

          alive.filter(

            p => isWolfRole(p.role)

          );

        const citizens =

          alive.filter(

            p => !isWolfRole(p.role)

          );

        if(

          wolves.length === 0 &&

          citizens.length > 0

        ){

          return showVictory(

            "アンドロイド",

            "アンドロイド陣営の勝利です。"

          );

        }

      }

    }

  }

  /*

    妖狐

    生存していて、人狼側・市民側の

    通常勝利条件が成立した時に勝利。

  */

  const fox =

    alive.find(

      p => p.role === "妖狐"

    );

  if(fox){

    const wolves =

      alive.filter(

        p => isWolfRole(p.role)

      );

    const citizens =

      alive.filter(

        p =>

          !isWolfRole(p.role) &&

          p.role !== "妖狐"

      );

    if(

      wolves.length === 0 ||

      wolves.length >= citizens.length

    ){

      return showVictory(

        "妖狐",

        "妖狐が生き残りました。妖狐の勝利です。"

      );

    }

  }

  /*

    恋人

    恋人が2人とも生存し、

    恋人勝利条件になった場合。

  */

  if(game.loverPairs.length){

    const aliveLoverPair =

      game.loverPairs.find(

        pair =>

          pair.every(

            id => {

              const p = getPlayer(id);

              return p && p.alive;

            }

          )

      );

    if(aliveLoverPair){

      const wolves =

        alive.filter(

          p => isWolfRole(p.role)

        );

      const nonWolves =

        alive.filter(

          p => !isWolfRole(p.role)

        );

      if(

        wolves.length === 0 ||

        wolves.length >= nonWolves.length

      ){

        return showVictory(

          "恋人",

          "恋人が生き残りました。恋人の勝利です。"

        );

      }

    }

  }

  /*

    通常の人狼・市民陣営の勝利。

  */

  const wolves =

    alive.filter(

      p => isWolfRole(p.role)

    );

  const nonWolves =

    alive.filter(

      p =>

        !isWolfRole(p.role) &&

        p.role !== "妖狐"

    );

  /*

    人狼が0人

  */

  if(wolves.length === 0){

    return showVictory(

      "市民陣営",

      "人狼がいなくなりました。市民陣営の勝利です。"

    );

  }

  /*

    人狼数が市民陣営以上になった場合

  */

  if(wolves.length >= nonWolves.length){

    return showVictory(

      "人狼",

      "人狼が市民陣営を上回りました。人狼の勝利です。"

    );

  }

  return false;

}

function formatTime(seconds){

  const min =

    Math.floor(seconds / 60);

  const sec =

    seconds % 60;

  return (

    String(min).padStart(2,"0") +

    ":" +

    String(sec).padStart(2,"0")

  );

}

function roleConfirmation(){

  /*

    全員の役職確認が終わったら、

    初日の予言へ進む。

  */

  if(

    game.confirmIndex >=

    game.players.length

  ){

    game.confirmRevealed = false;

    afterRoleConfirmation();

    return;

  }

  const p =

    game.players[

      game.confirmIndex

    ];

  const number =

    game.confirmIndex + 1;

  const total =

    game.players.length;

  /*

    まだ役職を見ていない。

  */

  if(!game.confirmRevealed){

    speak(

      `${p.name}さん、役職を確認してください。`

    );

    render(`

      <div class="card">

        <div class="progress">

          ${number} / ${total}

        </div>

        <h2>

          ${escapeHTML(p.name)}さん

        </h2>

        <p>

          あなたの役職を確認してください。

        </p>

        <div

          class="big"

          style="font-size:42px"

        >

          ？？？

        </div>

        <button

          class="blue"

          onclick="revealRole()"

        >

          👀 役職を見る

        </button>

      </div>

    `);

    return;

  }

  /*

    役職を表示。

  */

  render(`

    <div class="card private">

      <div class="progress">

        ${number} / ${total}

      </div>

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <div class="big">

        ${escapeHTML(p.role)}

      </div>

      ${roleInfoFor(p)}

      <p class="small">

        この画面は本人だけが確認してください。

      </p>

    </div>

    <button

      class="green"

      onclick="finishRoleConfirmation()"

    >

      ✅ 確認しました

    </button>

  `);

}

/* =====================================================

   役職表示

===================================================== */

function revealRole(){

  game.confirmRevealed = true;

  roleConfirmation();

}

/* =====================================================

   役職確認終了

===================================================== */

function finishRoleConfirmation(){

  game.confirmRevealed = false;

  game.confirmIndex++;

  roleConfirmation();

}

/* =====================================================

   最初の昼

===================================================== */

function startFirstDay(){

  game.day = 1;

  game.night = 0;

  game.firstDay = true;

  game.discussionEnded = false;

  speak(

    "役職の確認が終わりました。みなさん目を覚ましてください。お昼です。議論スタート。"

  );

  setTimeout(

    () => startDiscussion(true),

    700

  );

}

/* =====================================================

   議論開始

===================================================== */

function startDiscussion(firstDay=false){

  clearInterval(

    game.discussionTimer

  );

  game.discussionEnded = false;

  let remain =

    game.discussionTime;

  render(`

    <div class="card">

      <h2>

        ☀️ ${game.day}日目・昼

      </h2>

      <div

        class="timer"

        id="discussionTimer"

      >

        ${formatTime(remain)}

      </div>

      <div class="big">

        💬 議論スタート

      </div>

      <p>

        生存者で話し合ってください。

      </p>

      <hr>

      <p class="small">

        議論を早く終わらせたい場合は、

        下のボタンを押してください。

      </p>

    </div>

    <button

      class="orange"

      onclick="endDiscussion()"

    >

      🛑 議論を終了する

    </button>

  `);

  game.discussionTimer =

    setInterval(

      () => {

        remain--;

        const el =

          document.getElementById(

            "discussionTimer"

          );

        if(el){

          el.textContent =

            formatTime(

              Math.max(0,remain)

            );

        }

        if(remain <= 0){

          clearInterval(

            game.discussionTimer

          );

          game.discussionEnded = true;

          speak(

            "議論時間が終了しました。投票を開始します。"

          );

          startVote();

        }

      },

      1000

    );

}

/* =====================================================

   議論終了

===================================================== */

function endDiscussion(){

  if(game.discussionEnded){

    return;

  }

  game.discussionEnded = true;

  clearInterval(

    game.discussionTimer

  );

  speak(

    "議論を終了します。投票を開始します。"

  );

  startVote();

}

/* =====================================================

   初期化

===================================================== */

function initializeGame(){

  /*

    gameの初期値を安全に整える。

  */

  game.players =

    game.players || [];

  game.roleCount =

    game.roleCount || {};

  game.android =

    game.android || {};

  game.loverPairs =

    game.loverPairs || [];

  game.lovers =

    game.lovers || [];

  game.blockedRoles =

    game.blockedRoles || {};

  game.toughPending =

    game.toughPending || [];

  game.convertedThisNight =

    game.convertedThisNight || [];

  game.nightDeaths =

    game.nightDeaths || [];

  game.wolfTarget2 = null;

  game.firstSeerDone = false;

  game.gameOver = false;

}
