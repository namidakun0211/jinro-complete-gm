<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:15px;

  font-family:sans-serif;

  background:#f4f4f4;

  color:#222;

}

.container{

  max-width:700px;

  margin:auto;

}

.card{

  background:white;

  border-radius:18px;

  padding:20px;

  margin:15px 0;

  box-shadow:0 3px 12px #0002;

}

h1,h2{

  text-align:center;

}

button{

  border:0;

  border-radius:12px;

  padding:12px 18px;

  margin:5px;

  font-size:16px;

  background:#333;

  color:white;

}

button:disabled{

  opacity:.4;

}

input,select{

  font-size:17px;

  padding:9px;

  border-radius:9px;

  border:1px solid #bbb;

}

.role-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:7px 0;

  border-bottom:1px solid #eee;

}

.count{

  min-width:25px;

  display:inline-block;

  font-weight:bold;

  text-align:center;

}

.role-total{

  text-align:center;

  font-size:24px;

  font-weight:bold;

  padding:15px;

  background:#f1f1f1;

  border-radius:14px;

  margin-bottom:15px;

}

.big{

  font-size:25px;

  font-weight:bold;

  text-align:center;

}

.result{

  font-size:22px;

  font-weight:bold;

  padding:20px;

}

.timer{

  font-size:42px;

  font-weight:bold;

  text-align:center;

}

.private{

  background:#fff7d6;

}

.small{

  font-size:13px;

  color:#666;

}

.hidden{

  display:none;

}

.role-secret{

  font-size:34px;

  font-weight:bold;

  text-align:center;

  padding:25px 10px;

}

.mystery{

  font-size:40px;

  font-weight:bold;

  text-align:center;

  padding:35px 10px;

  background:#222;

  color:white;

  border-radius:16px;

  cursor:pointer;

}

.center{

  text-align:center;

}

.notice{

  background:#eef6ff;

  border-radius:12px;

  padding:15px;

  margin:10px 0;

}

.success{

  background:#e9f8e9;

  border-radius:12px;

  padding:15px;

}

.danger{

  background:#ffe9e9;

  border-radius:12px;

  padding:15px;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<div id="app"></div>

</div>

<script>

/* =========================================================

   役職

========================================================= */

const ROLES=[

  "人狼",

  "人狼の子ども",

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者",

  "スパイ",

  "市民",

  "予言者",

  "ボディーガード",

  "霊媒師",

  "ハンター",

  "共有者",

  "独裁者",

  "タフガイ",

  "カウンセラー",

  "奇術師",

  "罠師",

  "騎士団",

  "影武者",

  "王様",

  "妖狐",

  "神様",

  "恋人",

  "一匹狼",

  "アンドロイド",

  "案山子",

  "呪われた者"

];

const WOLF_ROLES=[

  "人狼",

  "人狼の子ども",

  "一匹狼"

];

const NORMAL_WOLF_ROLES=[

  "人狼",

  "人狼の子ども"

];

const BETRAYER_ROLES=[

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者"

];

/*

  夜の順番

  呪われた者は確認対象として存在。

  死亡している役職者は行動できない。

*/

const NIGHT_ORDER=[

  "呪われた者",

  "スパイ",

  "アンドロイド",

  "罠師",

  "ボディーガード",

  "騎士団",

  "人狼",

  "裏切りの襲撃者",

  "カウンセラー",

  "奇術師",

  "予言者",

  "霊媒師"

];

/* =========================================================

   ゲームデータ

========================================================= */

let game={

  players:[],

  roleCount:{},

  night:1,

  day:1,

  nightIndex:0,

  confirmIndex:0,

  wolfTarget:null,

  raiderTarget:null,

  guardTarget:null,

  knightTarget:null,

  trapTarget:null,

  magicTarget:null,

  counselTarget:null,

  lastGuard:null,

  lastTrap:null,

  magicUsed:false,

  dictatorUsed:false,

  shadowUsed:false,

  firstSeer:true,

  firstSeerDone:false,

  android:{},

  discussionTime:300,

  lastExiled:null,

  toughPending:[],

  lovers:[],

  loverPairs:[],

  voteRound:0,

  blockedRoles:{},

  timer:null

};

const app=document.getElementById("app");

/* =========================================================

   共通

========================================================= */

function escapeHTML(text){

  return String(text).replace(/[&<>"']/g,function(c){

    return {

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[c];

  });

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(p=>p.alive);

}

function rolePlayers(role){

  return game.players.filter(p=>p.role===role);

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function isBlocked(player){

  return !!game.blockedRoles[player.id];

}

/* =========================================================

   初期設定

========================================================= */

function startScreen(){

  render(`

  <div class="card">

    <h2>⚙️ ゲーム設定</h2>

    <p>

      人数　

      <select id="playerCount">

        ${Array.from(

          {length:17},

          (_,i)=>

          `<option value="${i+4}">${i+4}人</option>`

        ).join("")}

      </select>

    </p>

    <p>

      初日の予言　

      <select id="firstSeer">

        <option value="yes">する</option>

        <option value="no">しない</option>

      </select>

    </p>

    <p>

      議論時間　

      <select id="discussion">

        <option value="180">3分</option>

        <option value="300" selected>5分</option>

        <option value="600">10分</option>

      </select>

    </p>

  </div>

  <div class="card">

    <h2>🎴 役職選択</h2>

    <div class="role-total">

      役職枚数：

      <span id="roleTotal">0</span>

      /

      <span id="roleNeed">4</span>

    </div>

    ${ROLES.map((role,index)=>`

      <div class="role-row">

        <span>${role}</span>

        <span>

          <button

            onclick="changeRole('${role}',-1)"

          >−</button>

          <span

            class="count"

            id="count${index}"

          >0</span>

          <button

            onclick="changeRole('${role}',1)"

          >＋</button>

        </span>

      </div>

    `).join("")}

  </div>

  <div class="center">

    <button

      id="nameButton"

      onclick="nameScreen()"

    >

      👤 プレイヤー名入力

    </button>

  </div>

  `);

  updateRoleTotal();

}

function updateRoleTotal(){

  const count=Object.values(game.roleCount)

    .reduce((a,b)=>a+b,0);

  const need=

    Number(

      document.getElementById("playerCount")?.value || 4

    );

  const total=

    document.getElementById("roleTotal");

  const roleNeed=

    document.getElementById("roleNeed");

  if(total){

    total.textContent=count;

  }

  if(roleNeed){

    roleNeed.textContent=need;

  }

}

/*

  人数変更時にも1/10などが変わるようにする。

*/

document.addEventListener("change",function(e){

  if(e.target.id==="playerCount"){

    updateRoleTotal();

  }

});

/* =========================================================

   役職枚数変更

========================================================= */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0)value=0;

  /*

    枚数制限

  */

  if(role==="騎士団" && value>3)

    value=3;

  if(role==="案山子" && value>3)

    value=3;

  /*

    恋人・共有者・裏切りの共有者は

    2枚単位でセット。

  */

  if(

    role==="恋人" ||

    role==="共有者" ||

    role==="裏切りの共有者"

  ){

    if(value>2)value=2;

    if(value===1)value=0;

  }

  game.roleCount[role]=value;

  const index=ROLES.indexOf(role);

  const el=

    document.getElementById("count"+index);

  if(el){

    el.textContent=value;

  }

  updateRoleTotal();

}

/* =========================================================

   名前

========================================================= */

function nameScreen(){

  const n=

    Number(

      document.getElementById("playerCount").value

    );

  const saved=

    JSON.parse(

      localStorage.getItem("jinroNames")||"[]"

    );

  game.players=[];

  for(let i=0;i<n;i++){

    game.players.push({

      id:i,

      name:

        saved[i] ||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      copiedRole:null,

      copiedTarget:null

    });

  }

  game.firstSeer=

    document.getElementById("firstSeer").value==="yes";

  game.discussionTime=

    Number(

      document.getElementById("discussion").value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    ${game.players.map((p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="width:90%;margin:6px"

      >

    `).join("")}

  </div>

  <div class="center">

    <button onclick="dealRoles()">

      🎴 役職を配布

    </button>

  </div>

  `);

}

/* =========================================================

   役職配布

========================================================= */

function dealRoles(){

  game.players.forEach((p,i)=>{

    const input=

      document.getElementById("playerName"+i);

    const name=

      input ? input.value.trim() : "";

    p.name=

      name ||

      `プレイヤー${i+1}`;

  });

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(p=>p.name)

    )

  );

  let deck=[];

  Object.entries(game.roleCount)

    .forEach(([role,count])=>{

      for(let i=0;i<count;i++){

        deck.push(role);

      }

    });

  if(

    deck.length !==

    game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `役職枚数を${game.players.length}枚に合わせてください。`

    );

    return;

  }

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach((p,i)=>{

    p.role=deck[i];

    p.alive=true;

    p.cursedWolf=false;

    p.toughHit=false;

    p.blocked=false;

  });

  game.night=1;

  game.day=1;

  game.firstSeerDone=false;

  game.magicUsed=false;

  game.dictatorUsed=false;

  game.shadowUsed=false;

  game.android={};

  game.toughPending=[];

  game.lastExiled=null;

  game.voteRound=0;

  preparePairs();

  game.confirmIndex=0;

  roleConfirmation();

}

/* =========================================================

   ペア設定

========================================================= */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(lovers[i+1]){

      const pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(pair);

      game.lovers.push(...pair);

    }

  }

}

/* =========================================================

   人狼仲間表示

========================================================= */

function wolfInformation(p){

  /*

    人狼・人狼の子ども・一匹狼は

    お互いを「人狼」として認識。

  */

  if(!WOLF_ROLES.includes(p.role)){

    return "";

  }

  const wolves=

    game.players.filter(x=>

      WOLF_ROLES.includes(x.role) &&

      x.id!==p.id

    );

  return `

    <div class="notice">

      <strong>🐺 仲間の人狼</strong>

      <p>

      ${

        wolves.length

        ?

        wolves.map(x=>

          `${escapeHTML(x.name)}（人狼）`

        ).join("<br>")

        :

        "なし"

      }

      </p>

    </div>

  `;

}

/* =========================================================

   役職確認

========================================================= */

function roleConfirmation(){

  if(

    game.confirmIndex>=

    game.players.length

  ){

    render(`

      <div class="card">

        <div class="big">

          司会者はゲームを進行してください

        </div>

        <p class="center">

          全員の役職確認が終わりました。

        </p>

      </div>

      <div class="center">

        <button onclick="startNight()">

          🌙 夜を開始

        </button>

      </div>

    `);

    return;

  }

  const p=

    game.players[game.confirmIndex];

  render(`

    <div class="card private">

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <p class="center">

        他の人には見せないでください。

      </p>

      <div

        id="mystery"

        class="mystery"

        onclick="revealRole()"

      >

        ？？？

      </div>

      <p class="center small">

        ？？？をタップして役職を確認してください

      </p>

    </div>

  `);

}

/* =========================================================

   役職を表示

========================================================= */

function revealRole(){

  const p=

    game.players[game.confirmIndex];

  let info="";

  /*

    人狼仲間

  */

  info+=wolfInformation(p);

  /*

    共有者

  */

  if(p.role==="共有者"){

    const mates=

      game.players.filter(x=>

        x.role==="共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <div class="notice">

          <strong>🤝 共有者の仲間</strong>

          <p>

          ${

            mates.map(x=>

              escapeHTML(x.name)

            ).join("・")

          }

          </p>

        </div>

      `;

    }

  }

  /*

    裏切りの共有者

  */

  if(p.role==="裏切りの共有者"){

    const mates=

      game.players.filter(x=>

        x.role==="裏切りの共有者" &&

        x.id!==p.id

      );

    if(mates.length){

      info+=`

        <div class="notice">

          <strong>

            😈 裏切りの共有者

          </strong>

          <p>

          ${

            mates.map(x=>

              escapeHTML(x.name)

            ).join("・")

          }

          </p>

          <p class="small">

            この人もあなたと同じ裏切りの共有者です。

          </p>

        </div>

      `;

    }

  }

  /*

    内通者

  */

  if(p.role==="内通者"){

    const wolves=

      game.players.filter(x=>

        WOLF_ROLES.includes(x.role)

      );

    info+=`

      <div class="notice">

        <strong>

          🐺 人狼

        </strong>

        <p>

        ${

          wolves.length

          ?

          wolves.map(x=>

            `${escapeHTML(x.name)}（人狼）`

          ).join("<br>")

          :

          "なし"

        }

        </p>

      </div>

    `;

  }

  /*

    恋人

  */

  if(p.role==="恋人"){

    const pair=

      game.loverPairs.find(pair=>

        pair.includes(p.id)

      );

    if(pair){

      const mateId=

        pair.find(id=>id!==p.id);

      const mate=

        game.players.find(

          x=>x.id===mateId

        );

      if(mate){

        info+=`

          <div class="notice">

            <strong>❤️ 恋人</strong>

            <p>

              ${escapeHTML(mate.name)}

            </p>

            <p class="small">

              この人があなたの恋人です。

            </p>

          </div>

        `;

      }

    }

  }

  /*

    神様

  */

  if(p.role==="神様"){

    info+=`

      <div class="notice">

        <strong>✨ 全員の役職</strong>

        <p>

        ${

          game.players.map(x=>

            `${escapeHTML(x.name)}：

             ${escapeHTML(x.role)}`

          ).join("<br>")

        }

        </p>

      </div>

    `;

  }

  /*

    アンドロイド

    役職確認時にコピー対象を選ぶ。

  */

  if(p.role==="アンドロイド"){

    render(`

      <div class="card private">

        <h2>

          ${escapeHTML(p.name)}さん

        </h2>

        <div class="role-secret">

          🤖 アンドロイド

        </div>

        <p>

          誰か1人を選んで、その人の役職をコピーします。

        </p>

        <p class="small">

          選ばれた本人にはコピーされたことは知らされません。

        </p>

        ${

          living()

            .filter(x=>x.id!==p.id)

            .map(x=>`

              <button

                onclick="androidInitialPick(${x.id})"

              >

                ${escapeHTML(x.name)}

              </button>

            `).join("")

        }

      </div>

    `);

    return;

  }

  /*

    予言者の初日占い

  */

  if(

    p.role==="予言者" &&

    game.firstSeer &&

    !game.firstSeerDone

  ){

    render(`

      <div class="card private">

        <h2>

          ${escapeHTML(p.name)}さん

        </h2>

        <div class="role-secret">

          🔮 予言者

        </div>

        ${info}

        <div class="notice">

          <strong>

            初日の占い

          </strong>

          <p>

            初日の占いをしますか？

          </p>

          <button

            onclick="firstSeerChoice(true)"

          >

            占う

          </button>

          <button

            onclick="firstSeerChoice(false)"

          >

            占わない

          </button>

        </div>

      </div>

    `);

    return;

  }

  /*

    通常の役職表示

  */

  render(`

    <div class="card private">

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <div class="role-secret">

        ${escapeHTML(p.role)}

      </div>

      ${info}

    </div>

    <div class="center">

      <button onclick="nextRoleConfirmation()">

        確認しました・次へ

      </button>

    </div>

  `);

}

/* =========================================================

   アンドロイド初回コピー

========================================================= */

function androidInitialPick(id){

  const p=

    game.players[game.confirmIndex];

  const target=

    game.players[id];

  p.copiedTarget=id;

  p.copiedRole=target.role;

  game.android[p.id]=id;

  render(`

    <div class="card private">

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <div class="role-secret">

        🤖 ${escapeHTML(target.role)}

      </div>

      <p>

        ${escapeHTML(target.name)}さんの役職をコピーしました。

      </p>

      <p class="small">

        コピーされた人には知らされません。

      </p>

    </div>

    <div class="center">

      <button onclick="nextRoleConfirmation()">

        確認しました・次へ

      </button>

    </div>

  `);

}

function nextRoleConfirmation(){

  const p=

    game.players[game.confirmIndex];

  /*

    初日の占いが未処理なら、

    次の人へ進む前に処理を完了させる。

  */

  if(

    p.role==="予言者" &&

    game.firstSeer &&

    !game.firstSeerDone

  ){

    game.firstSeerDone=true;

  }

  game.confirmIndex++;

  roleConfirmation();

}

/* =========================================================

   初日の占い

========================================================= */

function firstSeerChoice(doSeer){

  if(!doSeer){

    game.firstSeerDone=true;

    nextRoleConfirmation();

    return;

  }

  const seer=

    game.players[game.confirmIndex];

  const targets=

    living().filter(p=>

      p.id!==seer.id

    );

  render(`

    <div class="card private">

      <h2>🔮 初日の占い</h2>

      <p>

        占う人を1人選んでください。

      </p>

      ${

        targets.map(p=>`

          <button

            onclick="firstSeerPick(${p.id})"

          >

            ${escapeHTML(p.name)}

          </button>

        `).join("")

      }

    </div>

  `);

}

function firstSeerPick(id){

  const target=

    game.players[id];

  let result="人間";

  if(

    target.role==="妖狐"

  ){

    result="人間";

    target.alive=false;

  }

  else if(

    NORMAL_WOLF_ROLES.includes(target.role)

  ){

    result="人狼";

  }

  else if(

    target.role==="一匹狼"

  ){

    result="人狼";

  }

   夜開始

========================================================= */

function startNight(){

  game.nightIndex=0;

  resetNightActions();

  game.blockedRoles={};

  nightStep();

}

function resetNightActions(){

  game.wolfTarget=null;

  game.raiderTarget=null;

  game.guardTarget=null;

  game.knightTarget=null;

  game.trapTarget=null;

  game.magicTarget=null;

  game.counselTarget=null;

/* =========================================================

   夜の進行

========================================================= */

function nightStep(){

  if(

    game.nightIndex>=

    NIGHT_ORDER.length

  ){

    morning();

    return;

  }

  const role=

    NIGHT_ORDER[game.nightIndex];

  game.nightIndex++;

  const actors=

    rolePlayers(role)

      .filter(p=>p.alive);

  /*

    採用されていない役職は呼び出さない。

    死亡している役職者は行動できず、

    そのまま次へ。

  */

  if(

    actors.length===0

  ){

    nightStep();

    return;

  }

  /*

    呪われた者は確認タイム。

  */

  if(role==="呪われた者"){

    cursedCheck(actors);

    return;

  }

  const actor=actors[0];

  /*

    妨害

  */

  if(

    isBlocked(actor)

  ){

    render(`

      <div class="card">

        <div class="big">

          ${escapeHTML(actor.name)}さんの

          今夜の能力は妨害されています。

        </div>

      </div>

      <div class="center">

        <button onclick="nightStep()">

          次へ

        </button>

      </div>

    `);

    return;

  }

  if(role==="スパイ"){

    spyAction(actor);

    return;

  }

  if(role==="アンドロイド"){

    androidAction(actor);

    return;

  }

  if(role==="罠師"){

    trapAction(actor);

    return;

  }

  if(role==="ボディーガード"){

    bodyguardAction(actor);

    return;

  }

  if(role==="騎士団"){

    knightAction(actor);

    return;

  }

  if(role==="人狼"){

    wolfAction();

    return;

  }

  if(role==="裏切りの襲撃者"){

    raiderAction(actor);

    return;

  }

  if(role==="カウンセラー"){

    counselorAction(actor);

    return;

  }

  if(role==="奇術師"){

    magicAction(actor);

    return;

  }

  if(role==="予言者"){

    seerAction(actor);

    return;

  }

  if(role==="霊媒師"){

    mediumAction(actor);

    return;

  }

  nightStep();

}

/* =========================================================

   選択共通

========================================================= */

function choose(

  title,

  players,

  callback,

  skip=true

){

  let html=`

    <div class="card">

      <h2>${title}</h2>

  `;

  players.forEach(p=>{

    html+=`

      <button

        onclick="${callback}(${p.id})"

      >

        ${escapeHTML(p.name)}

      </button>

    `;

  });

  if(skip){

    html+=`

      <br>

      <button

        onclick="nightStep()"

      >

        行動しない

      </button>

    `;

  }

  html+=`</div>`;

  render(html);

}

/* =========================================================

   死亡処理

========================================================= */

function killPlayer(player){

  if(!player.alive)

    return false;

  /*

    タフガイ

    襲撃された夜は死なず、

    翌日の議論に参加。

    その日の夜に死亡する。

  */

  if(

    player.role==="タフガイ" &&

    !player.toughHit

  ){

    player.toughHit=true;

    game.toughPending.push(

      player.id

    );

    return false;

  }

  player.alive=false;

  return true;

}

/* =========================================================

   朝

========================================================= */

function morning(){

  let deaths=[];

  /* -------------------------------------------------------

     人狼襲撃

  ------------------------------------------------------- */

  let wolfTarget=

    game.magicTarget!==null

    ?

    game.magicTarget

    :

    game.wolfTarget;

  if(wolfTarget!==null){

    const target=

      game.players[wolfTarget];

    /*

      奇術師で変更された場合は

      ボディーガード・騎士団・罠師を無視して必ず死亡。

    */

    if(

      game.magicTarget!==null

    ){

      if(killPlayer(target)){

        deaths.push(target.id);

      }

    }

    else{

      const protectedBy=

        game.guardTarget===wolfTarget ||

        game.knightTarget===wolfTarget;

      /*

        ボディーガードが罠対象の場合、

        ボディーガードは死亡せず、

        襲撃した人狼側が死亡。

      */

      if(

        game.trapTarget===wolfTarget &&

        target.role==="ボディーガード"

      ){

        const wolves=

          living().filter(p=>

            WOLF_ROLES.includes(p.role)

          );

        if(wolves.length){

          const deadWolf=

            wolves[

              Math.floor(

                Math.random()*wolves.length

              )

            ];

          deadWolf.alive=false;

          deaths.push(deadWolf.id);

        }

      }

      /*

        通常の護衛

      */

      else if(

        protectedBy

      ){

        /*

          守られているため死亡しない。

        */

      }

      /*

        罠

      */

      else if(

        game.trapTarget===wolfTarget

      ){

        const wolves=

          living().filter(p=>

            WOLF_ROLES.includes(p.role)

          );

        if(wolves.length){

          const deadWolf=

            wolves[

              Math.floor(

                Math.random()*wolves.length

              )

            ];

          deadWolf.alive=false;

          deaths.push(deadWolf.id);

        }

      }

      /*

        呪われた者

      */

      else if(

        target.role==="呪われた者"

      ){

        target.cursedWolf=true;

        target.role="人狼";

        /*

          その夜は死亡しない。

          翌夜から人狼として行動。

        */

      }

      else{

        if(killPlayer(target)){

          deaths.push(target.id);

        }

      }

    }

  }

  /* -------------------------------------------------------

     裏切りの襲撃者

  ------------------------------------------------------- */

  if(

    game.raiderTarget!==null

  ){

    const target=

      game.players[game.raiderTarget];

    /*

      罠があれば裏切りの襲撃者は死亡。

    */

    if(

      game.trapTarget===

      game.raiderTarget

    ){

      /*

        襲撃者自身が罠にかかった場合。

        targetが自分自身なら死亡。

      */

      if(

        target.role==="裏切りの襲撃者"

      ){

        target.alive=false;

        deaths.push(target.id);

      }

      else{

        if(killPlayer(target)){

          deaths.push(target.id);

        }

      }

    }

    else{

      if(killPlayer(target)){

        deaths.push(target.id);

      }

    }

  }

  /* -------------------------------------------------------

     カウンセラー

  ------------------------------------------------------- */

  if(

    game.counselTarget!==null &&

    game.counselTarget!==undefined

  ){

    const target=

      game.players[game.counselTarget];

    if(

      target &&

      target.alive

    ){

      /*

        裏切り者系は改心して市民。

      */

      if(

        BETRAYER_ROLES.includes(

          target.role

        )

      ){

        target.role="市民";

      }

      /*

        人狼ならカウンセラー死亡。

      */

      else if(

        WOLF_ROLES.includes(target.role)

      ){

        const counselor=

          rolePlayers("カウンセラー")

            .find(p=>p.alive);

        if(counselor){

          counselor.alive=false;

          deaths.push(counselor.id);

        }

      }

    }

  }

  /* -------------------------------------------------------

     恋人

  ------------------------------------------------------- */

  const extraLoverDeaths=[];

  deaths.forEach(id=>{

    game.loverPairs

      .filter(pair=>pair.includes(id))

      .forEach(pair=>{

        pair.forEach(pid=>{

          if(pid!==id){

            const p=

              game.players[pid];

            if(p.alive){

              p.alive=false;

              extraLoverDeaths.push(pid);

            }

          }

        });

      });

  });

  deaths.push(...extraLoverDeaths);

  /* -------------------------------------------------------

     タフガイ

  ------------------------------------------------------- */

  if(

    game.toughPending.length

  ){

    /*

      その日の昼に追放されていない場合、

      次の朝に死亡。

    */

    game.toughPending

      .forEach(id=>{

        const p=

          game.players[id];

        if(p.alive){

          p.alive=false;

          deaths.push(id);

        }

      });

    game.toughPending=[];

  }

  /*

    重複死亡を削除

  */

  deaths=[

    ...new Set(deaths)

  ];

  game.lastExiled=null;

  /*

    初日の処理が終了。

  */

  game.firstSeer=false;

  const names=

    deaths.map(id=>

      escapeHTML(

        game.players[id].name

      )

    );

  let message;

  if(names.length){

    /*

      死亡理由は公開しない。

    */

    message=

      `朝になりました。みなさん目を覚ましてください。`+

      `残念ながら${names.join("、")}さんが亡くなってしまいました。`+

      `お昼です。議論スタート`;

  }

  else{

    message=

      "朝になりました。みなさん目を覚ましてください。" +

      "昨夜の犠牲者はいませんでした。" +

      "お昼です。議論スタート";

  }

  speak(message);

  render(`

    <div class="card">

      <div class="big">

        ☀️ 朝になりました

      </div>

      <p>

        ${

          names.length

          ?

          names.map(n=>

            `${n}さんが亡くなりました`

          ).join("<br>")

          :

          "昨夜の犠牲者はいませんでした"

        }

      </p>

      <div class="big">

        お昼です。議論スタート

      </div>

      <div

        class="timer"

        id="timer"

      >

        ${formatTime(game.discussionTime)}

      </div>

    </div>

    <div class="center">

      <button onclick="startVote()">

        🗳️ 投票へ

      </button>

    </div>

  `);

  startTimer();

}

/* =========================================================

   タイマー

========================================================= */

function formatTime(sec){

  const m=

    Math.floor(sec/60);

  const s=

    sec%60;

  return(

    m+

    ":"+

    String(s).padStart(2,"0")

  );

}

function startTimer(){

  clearInterval(game.timer);

  let remain=

    game.discussionTime;

  game.timer=

    setInterval(()=>{

      remain--;

      const el=

        document.getElementById("timer");

      if(el){

        el.textContent=

          formatTime(

            Math.max(0,remain)

          );

      }

      if(remain<=0){

        clearInterval(game.timer);

        startVote();

      }

    },1000);

}

  }

  window.castVote=

    function(voterId,targetId){

      const voter=

        game.players[voterId];

      /*

        王様は2票。

      */

      const value=

        voter.role==="王様"

        ?

        2

        :

        1;

      votes[targetId]=

        (votes[targetId]||0)+value;

      nextVoter();

    };

  nextVoter();

}

/* =========================================================

   独裁者

========================================================= */

function dictatorUse(id){

  if(game.dictatorUsed){

    return;

  }

  const dictator=

    game.players[id];

  const name=

    prompt(

      "追放する人の名前を入力してください。"

    );

  if(!name){

    startVote();

    return;

  }

  const target=

    living().find(p=>

      p.name===name.trim()

    );

  if(!target){

    alert(

      "その名前の人が見つかりません。"

    );

    startVote();

    return;

  }

  game.dictatorUsed=true;

  /*

    使用した回は独裁者のみの投票。

    ここでは宣言された対象を追放。

  */

  target.alive=false;

  game.lastExiled=target.id;

  if(target.role==="ハンター"){

    hunterAction(target);

    return;

  }

  checkVictory();

}

/* =========================================================

   影武者

========================================================= */

function shadowUse(id){

  if(game.shadowUsed){

    return;

  }

  game.shadowUsed=true;

  const target=

    game.players[id];

  /*

    影武者自身が追放される。

  */

  target.alive=false;

  game.lastExiled=target.id;

  if(target.role==="ハンター"){

    hunterAction(target);

    return;

  }

  checkVictory();

}

/* =========================================================

   投票結果

========================================================= */

function finishVote(

  votes,

  candidates

){

  const entries=

    Object.entries(votes);

  if(!entries.length){

    game.voteRound=0;

    nextNight();

    return;

  }

  const max=

    Math.max(

      ...entries.map(

        ([id,v])=>v

      )

    );

  const winners=

    entries

      .filter(

        ([id,v])=>v===max

      )

      .map(

        ([id])=>Number(id)

      );

  /*

    同票

  */

  if(winners.length>1){

    if(game.voteRound===0){

      game.voteRound=1;

      render(`

        <div class="card">

          <div class="big">

            ⚖️ 同票です

          </div>

          <p>

            決戦投票を行います。

          </p>

          <p class="small">

            同票になった人だけで決戦投票をします。

          </p>

        </div>

        <div class="center">

          <button

            onclick="startRunoffVote(${JSON.stringify(winners)})"

          >

            決戦投票へ

          </button>

        </div>

      `);

      return;

    }

    /*

      決戦も同票

    */

    game.voteRound=0;

    render(`

      <div class="card">

        <div class="big">

          ⚖️ 決戦投票も同票です

        </div>

        <p>

          今回は追放なしです。

        </p>

      </div>

      <div class="center">

        <button onclick="nextNight()">

          🌙 次の夜へ

        </button>

      </div>

    `);

    return;

  }

  game.voteRound=0;

  const target=

    game.players[winners[0]];

  target.alive=false;

  game.lastExiled=

    target.id;

  if(target.role==="ハンター"){

    hunterAction(target);

    return;

  }

  checkVictory();

}

/* =========================================================

   決戦投票

========================================================= */

function startRunoffVote(ids){

  const candidates=

    ids.map(

      id=>game.players[id]

    ).filter(

      p=>p.alive

    );

  const voters=

    living();

  const votes={};

  let index=0;

  function next(){

    if(index>=voters.length){

      finishRunoffVote(

        votes,

        candidates

      );

      return;

    }

    const voter=

      voters[index++];

    const targets=

      candidates.filter(

        p=>p.id!==voter.id

      );

    /*

      決戦対象が1人だけなら、

      その人への投票を受ける。

    */

    if(targets.length===1){

      const value=

        voter.role==="王様"

        ?

        2

        :

        1;

      votes[targets[0].id]=

        (votes[targets[0].id]||0)+value;

      next();

      return;

    }

    render(`

      <div class="card">

        <h2>

          ${escapeHTML(voter.name)}さん

        </h2>

        <p>

          決戦投票です。

        </p>

        ${targets.map(p=>`

          <button

            onclick="runoffPick(

              ${voter.id},

              ${p.id}

            )"

          >

            ${escapeHTML(p.name)}

          </button>

        `).join("")}

      </div>

    `);

  }

  window.runoffPick=

    function(voterId,targetId){

      const voter=

        game.players[voterId];

      const value=

        voter.role==="王様"

        ?

        2

        :

        1;

      votes[targetId]=

        (votes[targetId]||0)+value;

      next();

    };

  next();

  function finishRunoffVote(

    votes,

    candidates

  ){

    const entries=

      Object.entries(votes);

    const max=

      Math.max(

        ...entries.map(

          ([id,v])=>v

        )

      );

    const winners=

      entries.filter(

        ([id,v])=>v===max

      );

    if(winners.length>1){

      game.voteRound=0;

      render(`

        <div class="card">

          <div class="big">

            ⚖️ 決戦投票も同票

          </div>

          <p>

            追放なしです。

          </p>

        </div>

        <div class="center">

          <button onclick="nextNight()">

            🌙 次の夜へ

          </button>

        </div>

      `);

      return;

    }

    game.voteRound=0;

    const target=

      game.players[

        Number(winners[0][0])

      ];

    target.alive=false;

    game.lastExiled=

      target.id;

    if(target.role==="ハンター"){

      hunterAction(target);

      return;

    }

    checkVictory();

  }

}

/* =========================================================

   ハンター

========================================================= */

function hunterAction(hunter){

  /*

    ハンター自身の死亡が確定したタイミング。

  */

  speak(

    "ハンターの道連れを選んでください。"

  );

  const targets=

    living();

  render(`

    <div class="card">

      <h2>🏹 ハンター</h2>

      <div class="big">

        道連れを選んでください

      </div>

      <p class="small">

        役職ではなく、人を1人選びます。

      </p>

      ${

        targets.map(p=>`

          <button

            onclick="hunterPick(${p.id})"

          >

            ${escapeHTML(p.name)}

          </button>

        `).join("")

      }

    </div>

  `);

  window.hunterPick=

    function(id){

      const target=

        game.players[id];

      if(!target.alive){

        return;

      }

      target.alive=false;

      /*

        恋人道連れ

      */

      game.loverPairs

        .filter(

          pair=>pair.includes(id)

        )

        .forEach(pair=>{

          pair.forEach(pid=>{

            if(pid!==id){

              game.players[pid].alive=false;

            }

          });

        });

      checkVictory();

    };

}

/* =========================================================

   次の夜

========================================================= */

function nextNight(){

  game.night++;

  game.day++;

  startNight();

}

/* =========================================================

   勝利判定

========================================================= */

function checkVictory(){

  const alive=

    living();

  /*

    神様

  */

  const gods=

    alive.filter(

      p=>p.role==="神様"

    );

  if(gods.length){

    endGame("神様");

    return;

  }

  /*

    案山子

    全員死亡した場合。

  */

  if(

    alive.length===0 &&

    hasRole("案山子")

  ){

    endGame("案山子");

    return;

  }

  /*

    妖狐

  */

  const fox=

    alive.filter(

      p=>p.role==="妖狐"

    );

  if(fox.length){

    const normalWolves=

      alive.filter(

        p=>

          NORMAL_WOLF_ROLES.includes(

            p.role

          )

      );

    const nonWolf=

      alive.filter(

        p=>

          !NORMAL_WOLF_ROLES.includes(

            p.role

          ) &&

          p.role!=="妖狐"

      );

    /*

      人狼側が勝利条件に到達した時、

      妖狐が生きていれば乗っ取り。

    */

    if(

      normalWolves.length===0 ||

      normalWolves.length>=nonWolf.length

    ){

      endGame("妖狐");

      return;

    }

  }

  /*

    一匹狼

  */

  const lone=

    alive.filter(

      p=>p.role==="一匹狼"

    );

  const normalWolves=

    alive.filter(

      p=>NORMAL_WOLF_ROLES.includes(p.role)

    );

  if(

    lone.length &&

    normalWolves.length===0

  ){

    endGame("一匹狼");

    return;

  }

  /*

    恋人

    2人とも最後まで生き残った場合。

  */

  for(

    const pair of game.loverPairs

  ){

    const a=

      game.players[pair[0]];

    const b=

      game.players[pair[1]];

    if(

      a.alive &&

      b.alive

    ){

      const others=

        alive.filter(

          p=>

            p.id!==a.id &&

            p.id!==b.id

        );

      if(others.length===0){

        endGame("恋人");

        return;

      }

    }

  }

  /*

    通常の人狼

  */

  const wolves=

    alive.filter(

      p=>

        NORMAL_WOLF_ROLES.includes(

          p.role

        )

    );

  const nonWolves=

    alive.filter(

      p=>

        !NORMAL_WOLF_ROLES.includes(

          p.role

        ) &&

        p.role!=="一匹狼"

    );

  if(wolves.length===0){

    /*

      独立陣営がいなければ市民勝利。

    */

    endGame("市民");

    return;

  }

  if(

    wolves.length>=nonWolves.length

  ){

    endGame("人狼");

    return;

  }

  /*

    継続

  */

  nextNight();

}

/* =========================================================

   ゲーム終了

========================================================= */

function endGame(winner){

  clearInterval(game.timer);

  speak(

    `${winner}の勝利です。`

  );

  render(`

    <div class="card">

      <div class="result">

        🏆 ${escapeHTML(winner)}勝利！

      </div>

      <h2>

        最終役職一覧

      </h2>

      ${

        game.players.map(p=>`

          <p>

            ${escapeHTML(p.name)}

            ：

            ${escapeHTML(p.role)}

            ${

              p.alive

              ?

              "（生存）"

              :

              "（死亡）"

            }

          </p>

        `).join("")

      }

    </div>

    <div class="center">

      <button

        onclick="location.reload()"

      >

        🔄 もう一度ゲームする

      </button>

    </div>

  `);

}

/* =========================================================

   起動

========================================================= */

startScreen();
