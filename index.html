<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:15px;

  font-family:sans-serif;

  background:#f4f4f4;

  color:#222;

}

.container{

  max-width:700px;

  margin:auto;

}

.card{

  background:white;

  border-radius:18px;

  padding:20px;

  margin:15px 0;

  box-shadow:0 3px 12px #0002;

}

h1,h2{text-align:center}

button{

  border:0;

  border-radius:12px;

  padding:12px 18px;

  margin:5px;

  font-size:16px;

  background:#333;

  color:white;

}

button:disabled{

  opacity:.4;

}

input,select{

  font-size:17px;

  padding:9px;

  border-radius:9px;

  border:1px solid #bbb;

}

.role-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:7px 0;

  border-bottom:1px solid #eee;

}

.count{

  min-width:25px;

  display:inline-block;

  font-weight:bold;

}

.big{

  font-size:25px;

  font-weight:bold;

  text-align:center;

}

.result{

  font-size:22px;

  font-weight:bold;

  padding:20px;

}

.timer{

  font-size:42px;

  font-weight:bold;

  text-align:center;

}

.private{

  background:#fff7d6;

}

.small{

  font-size:13px;

  color:#666;

}

.hidden{

  display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<div id="app"></div>

</div>

<script>

const ROLES=[

"人狼",

"人狼の子ども",

"裏切り者",

"裏切りの共有者",

"内通者",

"裏切りの襲撃者",

"スパイ",

"市民",

"予言者",

"ボディーガード",

"霊媒師",

"ハンター",

"共有者",

"独裁者",

"タフガイ",

"カウンセラー",

"奇術師",

"罠師",

"騎士団",

"影武者",

"王様",

"妖狐",

"神様",

"恋人",

"一匹狼",

"アンドロイド",

"案山子",

"呪われた者"

];

const WOLF_ROLES=[

"人狼",

"人狼の子ども",

"一匹狼"

];

const BETRAYER_ROLES=[

"裏切り者",

"裏切りの共有者",

"内通者",

"裏切りの襲撃者"

];

const NIGHT_ORDER=[

"呪われた者",

"スパイ",

"アンドロイド",

"罠師",

"ボディーガード",

"騎士団",

"人狼",

"裏切りの襲撃者",

"カウンセラー",

"裏切り者確認",

"奇術師",

"予言者",

"霊媒師"

];

let game={

  players:[],

  roleCount:{},

  night:1,

  day:1,

  nightIndex:0,

  wolfTarget:null,

  raiderTarget:null,

  guardTarget:null,

  knightTarget:null,

  trapTarget:null,

  magicTarget:null,

  lastGuard:null,

  lastTrap:null,

  magicUsed:false,

  dictatorUsed:false,

  shadowUsed:false,

  firstSeer:true,

  android:{},

  discussionTime:300,

  lastExiled:null,

  toughPending:[],

  lovers:[],

  loverPairs:[],

  voteRound:0

};

const app=document.getElementById("app");

function escapeHTML(text){

  return String(text).replace(/[&<>"']/g,function(c){

    return {

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[c];

  });

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(p=>p.alive);

}

function rolePlayers(role){

  return game.players.filter(p=>p.role===role);

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

/* =========================

   初期設定

========================= */

function startScreen(){

render(`

<div class="card">

<h2>ゲーム設定</h2>

<p>

人数

<select id="playerCount">

${Array.from({length:17},(_,i)=>

`<option value="${i+4}">${i+4}人</option>`

).join("")}

</select>

</p>

<p>

初日の予言

<select id="firstSeer">

<option value="yes">する</option>

<option value="no">しない</option>

</select>

</p>

<p>

議論時間

<select id="discussion">

<option value="180">3分</option>

<option value="300" selected>5分</option>

<option value="600">10分</option>

</select>

</p>

</div>

<div class="card">

<h2>役職選択</h2>

${ROLES.map((role,index)=>`

<div class="role-row">

<span>${role}</span>

<span>

<button onclick="changeRole('${role}',-1)">−</button>

<span class="count" id="count${index}">0</span>

<button onclick="changeRole('${role}',1)">＋</button>

</span>

</div>

`).join("")}

</div>

<button onclick="nameScreen()">

プレイヤー名入力

</button>

`);

}

function changeRole(role,diff){

let value=game.roleCount[role]||0;

value+=diff;

if(value<0)value=0;

/* 特殊な枚数制限 */

if(role==="騎士団" && value>3)value=3;

if(role==="案山子" && value>3)value=3;

if(role==="恋人" && value>2)value=2;

if(role==="共有者" && value>2)value=2;

if(role==="裏切りの共有者" && value>2)value=2;

game.roleCount[role]=value;

let index=ROLES.indexOf(role);

document.getElementById("count"+index).textContent=value;

}

/* =========================

   名前

========================= */

function nameScreen(){

let n=Number(

document.getElementById("playerCount").value

);

let saved=JSON.parse(

localStorage.getItem("jinroNames")||"[]"

);

game.players=[];

for(let i=0;i<n;i++){

game.players.push({

 id:i,

 name:saved[i]||`プレイヤー${i+1}`,

 role:"",

 alive:true,

 cursedWolf:false,

 toughHit:false

 });

}

game.firstSeer=

document.getElementById("firstSeer").value==="yes";

game.discussionTime=

Number(document.getElementById("discussion").value);

render(`

<div class="card">

<h2>👤 プレイヤー名</h2>

${game.players.map((p,i)=>`

<input

id="playerName${i}"

value="${escapeHTML(p.name)}"

placeholder="プレイヤー${i+1}"

style="width:90%;margin:6px"

>

`).join("")}

</div>

<button onclick="dealRoles()">

役職を配布

</button>

`);

}

/* =========================

   役職配布

========================= */

function dealRoles(){

game.players.forEach((p,i)=>{

let name=

document.getElementById("playerName"+i).value.trim();

p.name=name||`プレイヤー${i+1}`;

});

localStorage.setItem(

"jinroNames",

JSON.stringify(game.players.map(p=>p.name))

);

let deck=[];

Object.entries(game.roleCount).forEach(([role,count])=>{

for(let i=0;i<count;i++){

deck.push(role);

}

});

if(deck.length!==game.players.length){

alert(

`役職カードが${deck.length}枚です。

プレイヤーは${game.players.length}人です。

人数と役職枚数を合わせてください。`

);

return;

}

deck.sort(()=>Math.random()-0.5);

game.players.forEach((p,i)=>{

p.role=deck[i];

p.alive=true;

});

preparePairs();

game.confirmIndex=0;

roleConfirmation();

}

/* =========================

   ペア設定

========================= */

function preparePairs(){

game.lovers=[];

game.loverPairs=[];

let lovers=

game.players.filter(p=>p.role==="恋人");

for(let i=0;i<lovers.length;i+=2){

if(lovers[i+1]){

let pair=[

lovers[i].id,

lovers[i+1].id

];

game.loverPairs.push(pair);

game.lovers.push(...pair);

}

}

}

/* =========================

   役職確認

========================= */

function roleConfirmation(){

if(game.confirmIndex>=game.players.length){

render(`

<div class="card">

<div class="big">

司会者はゲームを進行してください

</div>

</div>

<button onclick="startNight()">

🌙 夜を開始

</button>

`);

return;

}

let p=

game.players[game.confirmIndex];

let info="";

if(p.role==="共有者"){

let mates=

game.players.filter(x=>

x.role==="共有者" &&

x.id!==p.id

);

if(mates.length){

info+=`

<p>

共有者：

${mates.map(x=>escapeHTML(x.name)).join("・")}

</p>

`;

}

}

if(p.role==="裏切りの共有者"){

let mates=

game.players.filter(x=>

x.role==="裏切りの共有者" &&

x.id!==p.id

);

if(mates.length){

info+=`

<p>

裏切りの共有者：

${mates.map(x=>escapeHTML(x.name)).join("・")}

</p>

`;

}

}

if(p.role==="内通者"){

let wolves=

game.players.filter(x=>

WOLF_ROLES.includes(x.role)

);

info+=`

<p>

人狼：

${wolves.length?

wolves.map(x=>escapeHTML(x.name)).join("・"):

"なし"}

</p>

`;

}

if(p.role==="一匹狼"){

let wolves=

game.players.filter(x=>

WOLF_ROLES.includes(x.role) &&

x.role!=="一匹狼"

);

info+=`

<p>

人狼：

${wolves.length?

wolves.map(x=>escapeHTML(x.name)).join("・"):

"なし"}

</p>

`;

}

if(p.role==="神様"){

info+=`

<p>

全役職：

</p>

<p>

${game.players.map(x=>

escapeHTML(x.name)+"："+x.role

).join("<br>")}

</p>

`;

}

if(p.role==="恋人"){

let pair=

game.loverPairs.find(pair=>

pair.includes(p.id)

);

if(pair){

let mate=

game.players.find(x=>

x.id===pair.find(id=>id!==p.id)

);

if(mate){

info+=`

<p>

恋人：

${escapeHTML(mate.name)}

</p>

`;

}

}

}

render(`

<div class="card private">

<h2>

${escapeHTML(p.name)}さん

</h2>

<p>

他の人には見せないでください

</p>

<div class="big">

${p.role}

</div>

${info}

</div>

<button onclick="nextRoleConfirmation()">

確認しました

</button>

`);

}

function nextRoleConfirmation(){

game.confirmIndex++;

roleConfirmation();

}

/* =========================

   夜

========================= */

function startNight(){

game.nightIndex=0;

resetNightActions();

nightStep();

}

function resetNightActions(){

game.wolfTarget=null;

game.raiderTarget=null;

game.guardTarget=null;

game.knightTarget=null;

game.trapTarget=null;

game.magicTarget=null;

}

function nightStep(){

if(game.nightIndex>=NIGHT_ORDER.length){

morning();

return;

}

let role=

NIGHT_ORDER[game.nightIndex];

game.nightIndex++;

let actors=

rolePlayers(role).filter(p=>p.alive);

if(actors.length===0){

nightStep();

return;

}

let actor=actors[0];

if(role==="呪われた者"){

nightStep();

return;

}

if(role==="スパイ"){

spyAction(actor);

return;

}

if(role==="アンドロイド"){

androidAction(actor);

return;

}

if(role==="罠師"){

trapAction(actor);

return;

}

if(role==="ボディーガード"){

bodyguardAction(actor);

return;

}

if(role==="騎士団"){

knightAction(actor);

return;

}

if(role==="人狼"){

wolfAction();

return;

}

if(role==="裏切りの襲撃者"){

raiderAction(actor);

return;

}

if(role==="カウンセラー"){

counselorAction(actor);

return;

}

if(role==="奇術師"){

magicAction(actor);

return;

}

if(role==="予言者"){

seerAction(actor);

return;

}

if(role==="霊媒師"){

mediumAction(actor);

return;

}

nightStep();

}

/* =========================

   選択画面

========================= */

function choose(title,players,callback,skip=true){

let html=`

<div class="card">

<h2>${title}</h2>

`;

players.forEach(p=>{

html+=`

<button onclick="${callback}(${p.id})">

${escapeHTML(p.name)}

</button>

`;

});

if(skip){

html+=`

<br>

<button class="alt" onclick="nightStep()">

行動しない

</button>

`;

}

html+="</div>";

render(html);

}

/* =========================

   スパイ

========================= */

function spyAction(actor){

let targets=

living().filter(p=>p.id!==actor.id);

choose(

"🕵️ スパイの方、妨害する人を選んでください",

targets,

"spyPick"

);

}

function spyPick(id){

let target=

game.players[id];

target.blocked=true;

nightStep();

}

/* =========================

   アンドロイド

========================= */

function androidAction(actor){

if(game.android[actor.id]!==undefined){

nightStep();

return;

}

let targets=

living().filter(p=>p.id!==actor.id);

choose(

"🤖 アンドロイドの方、コピーする人を選んでください",

targets,

"androidPick",

false

);

}

function androidPick(id){

let actor=

rolePlayers("アンドロイド").find(p=>p.alive);

if(actor){

game.android[actor.id]=id;

}

nightStep();

}

/* =========================

   罠師

========================= */

function trapAction(actor){

let targets=

living().filter(p=>

p.id!==game.lastTrap

);

choose(

"🪤 罠師の方、罠を仕掛ける人を選んでください",

targets,

"trapPick"

);

}

function trapPick(id){

game.trapTarget=id;

game.lastTrap=id;

nightStep();

}

/* =========================

   ボディーガード

========================= */

function bodyguardAction(actor){

let targets=

living().filter(p=>

p.id!==actor.id &&

p.id!==game.lastGuard

);

choose(

"🛡️ ボディーガードの方、守る人を選んでください",

targets,

"bodyguardPick"

);

}

function bodyguardPick(id){

game.guardTarget=id;

game.lastGuard=id;

nightStep();

}

/* =========================

   騎士団

========================= */

function knightAction(actor){

let targets=living();

choose(

"⚔️ 騎士団の方、目を開けてください。今夜守る人を選んでください",

targets,

"knightPick"

);

}

function knightPick(id){

game.knightTarget=id;

nightStep();

}

/* =========================

   人狼

========================= */

function wolfAction(){

let targets=

living().filter(p=>

!WOLF_ROLES.includes(p.role)

);

if(targets.length===0){

nightStep();

return;

}

choose(

"🐺 人狼の方、襲撃先を選んでください",

targets,

"wolfPick",

false

);

}

function wolfPick(id){

game.wolfTarget=id;

nightStep();

}

/* =========================

   裏切りの襲撃者

========================= */

function raiderAction(actor){

let targets=living();

choose(

"🐺 裏切りの襲撃者の方、襲撃先を選んでください",

targets,

"raiderPick"

);

}

function raiderPick(id){

game.raiderTarget=id;

nightStep();

}

/* =========================

   カウンセラー

========================= */

function counselorAction(actor){

let targets=living();

choose(

"💭 カウンセラーの方、カウンセリングする人を選んでください",

targets,

"counselPick"

);

}

function counselPick(id){

game.counselTarget=id;

nightStep();

}

/* =========================

   奇術師

========================= */

function magicAction(actor){

if(game.magicUsed){

nightStep();

return;

}

let targets=living();

choose(

"🎩 奇術師の方、人狼の襲撃先を変更してください",

targets,

"magicPick"

);

}

function magicPick(id){

game.magicTarget=id;

game.magicUsed=true;

nightStep();

}

/* =========================

   予言者

========================= */

function seerAction(actor){

if(game.night===1 && !game.firstSeer){

nightStep();

return;

}

let targets=

living().filter(p=>

p.id!==actor.id

);

choose(

"🔮 予言者の方、占う人を選んでください",

targets,

"seerPick",

false

);

}

function seerPick(id){

let target=

game.players[id];

let result=

WOLF_ROLES.includes(target.role)?

"人狼":

"人間";

if(target.role==="妖狐"){

target.alive=false;

}

render(`

<div class="card private">

<h2>🔮 占い結果</h2>

<div class="big">

${escapeHTML(target.name)}さんは

「${result}」です。

</div>

</div>

<button onclick="nightStep()">

確認しました

</button>

`);

}

/* =========================

   霊媒師

========================= */

function mediumAction(actor){

if(game.lastExiled===null){

nightStep();

return;

}

let target=

game.players[game.lastExiled];

let result="人間";

if(

target.role==="人狼" ||

target.role==="人狼の子ども" ||

target.role==="一匹狼" ||

target.role==="案山子"

){

result="人狼";

}

if(target.role==="呪われた者" && target.cursedWolf){

result="人狼";

}

render(`

<div class="card private">

<h2>👻 霊媒結果</h2>

<div class="big">

昨日追放された

${escapeHTML(target.name)}さんは

「${result}」です。

</div>

<p>

霊媒師だけが確認できます。

</p>

</div>

<button onclick="nightStep()">

確認しました

</button>

`);

}

/* =========================

   夜→朝の処理

========================= */

function killPlayer(player){

if(!player.alive)return false;

if(player.role==="タフガイ" && !player.toughHit){

player.toughHit=true;

game.toughPending.push(player.id);

return false;

}

player.alive=false;

return true;

}

function morning(){

let deaths=[];

/* 人狼の襲撃先 */

let wolfTarget=

game.magicTarget!==null?

game.magicTarget:

game.wolfTarget;

if(wolfTarget!==null){

let target=

game.players[wolfTarget];

let protectedBy=

game.guardTarget===wolfTarget ||

game.knightTarget===wolfTarget;

/* 奇術師は護衛・罠を無視 */

if(game.magicTarget===null && protectedBy){

}

else if(

game.magicTarget===null &&

game.trapTarget===wolfTarget &&

target.role==="ボディーガード"

){

/* ボディーガードには罠が効かない */

let wolves=

living().filter(p=>

p.role==="人狼" ||

p.role==="人狼の子ども" ||

p.role==="一匹狼"

);

if(wolves.length){

let deadWolf=

wolves[Math.floor(Math.random()*wolves.length)];

deadWolf.alive=false;

deaths.push(deadWolf.id);

}

}

else if(

target.role==="呪われた者"

){

target.cursedWolf=true;

target.role="人狼";

}

else{

if(killPlayer(target)){

deaths.push(target.id);

}

}

}

/* 裏切りの襲撃者 */

if(game.raiderTarget!==null){

let target=

game.players[game.raiderTarget];

if(

game.trapTarget===game.raiderTarget

){

if(killPlayer(target)){

deaths.push(target.id);

}

}

else{

if(killPlayer(target)){

deaths.push(target.id);

}

}

}

/* カウンセラー */

if(game.counselTarget!==undefined){

let target=

game.players[game.counselTarget];

if(target && target.alive){

if(BETRAYER_ROLES.includes(target.role)){

target.role="市民";

}

else if(WOLF_ROLES.includes(target.role)){

let counselor=

rolePlayers("カウンセラー").find(p=>p.alive);

if(counselor){

counselor.alive=false;

deaths.push(counselor.id);

}

}

}

}

/* 恋人の道連れ */

let extra=[];

deaths.forEach(id=>{

let pairs=

game.loverPairs.filter(pair=>

pair.includes(id)

);

pairs.forEach(pair=>{

pair.forEach(pid=>{

if(pid!==id){

let p=game.players[pid];

if(p.alive){

p.alive=false;

extra.push(pid);

}

}

});

});

});

deaths.push(...extra);

/* タフガイの前夜死亡 */

if(game.toughPending.length){

game.toughPending.forEach(id=>{

let p=game.players[id];

if(p.alive){

p.alive=false;

deaths.push(id);

}

});

game.toughPending=[];

}

game.lastExiled=null;

game.firstSeer=false;

let names=deaths.map(id=>

escapeHTML(game.players[id].name)

);

let message=

names.length?

`朝になりました。残念ながら${names.join("、")}さんが亡くなってしまいました。お昼です。議論スタート`:

"朝になりました。昨夜の犠牲者はいませんでした。お昼です。議論スタート";

speak(message);

render(`

<div class="card">

<div class="big">

☀️ 朝になりました

</div>

<p>

${names.length?

names.map(n=>n+"さんが亡くなりました").join("<br>"):

"昨夜の犠牲者はいませんでした"}

</p>

<div class="big">

お昼です。議論スタート

</div>

<div class="timer" id="timer">

${formatTime(game.discussionTime)}

</div>

</div>

<button onclick="startVote()">

投票へ

</button>

`);

startTimer();

}

/* =========================

   タイマー

========================= */

function formatTime(sec){

let m=Math.floor(sec/60);

let s=sec%60;

return m+":"+String(s).padStart(2,"0");

}

function startTimer(){

clearInterval(game.timer);

let remain=game.discussionTime;

game.timer=setInterval(()=>{

remain--;

let el=document.getElementById("timer");

if(el){

el.textContent=

formatTime(Math.max(0,remain));

}

if(remain<=0){

clearInterval(game.timer);

startVote();

}

},1000);

}

/* =========================

   投票

========================= */

function startVote(){

clearInterval(game.timer);

let voters=living();

let index=0;

let votes={};

function nextVoter(){

if(index>=voters.length){

finishVote(votes);

return;

}

let voter=voters[index++];

let targets=

voters.filter(p=>p.id!==voter.id);

render(`

<div class="card">

<h2>

${escapeHTML(voter.name)}さん

</h2>

<p>

投票先を選んでください。

</p>

<p class="small">

他の人には見せないでください。

</p>

${targets.map(target=>`

<button onclick="castVote(${target.id})">

${escapeHTML(target.name)}

</button>

`).join("")}

</div>

`);

window.castVote=function(id){

let value=

voter.role==="王様"?2:1;

votes[id]=(votes[id]||0)+value;

nextVoter();

};

}

nextVoter();

}

function finishVote(votes){

let max=Math.max(...Object.values(votes));

let winners=

Object.keys(votes).filter(id=>

votes[id]===max

);

/* 同票 */

if(winners.length>1){

if(game.voteRound===0){

game.voteRound=1;

render(`

<div class="card">

<div class="big">

⚖️ 同票です

</div>

<p>

決戦投票を行います。

</p>

</div>

<button onclick="startVote()">

決戦投票

</button>

`);

return;

}

/* 決戦も同票 */

game.voteRound=0;

render(`

<div class="card">

<div class="big">

⚖️ 決戦投票も同票です

</div>

<p>

今回は追放なしです。

</p>

</div>

<button onclick="nextNight()">

次の夜へ

</button>

`);

return;

}

game.voteRound=0;

let target=

game.players[Number(winners[0])];

target.alive=false;

game.lastExiled=target.id;

/* ハンター */

if(target.role==="ハンター"){

hunterAction(target);

return;

}

/* 影武者 */

if(target.role==="影武者"){

/* 影武者は能力使用時に自身を追放する。

   通常追放でも死亡する */

}

checkVictory();

}

/* =========================

   ハンター

========================= */

function hunterAction(hunter){

speak("ハンターの道連れを選んでください。");

let targets=living();

render(`

<div class="card">

<h2>🏹 ハンター</h2>

<div class="big">

道連れを選んでください

</div>

${targets.map(p=>`

<button onclick="hunterPick(${p.id})">

${escapeHTML(p.name)}

</button>

`).join("")}

</div>

`);

window.hunterPick=function(id){

let target=

game.players[id];

target.alive=false;

let pairs=

game.loverPairs.filter(pair=>

pair.includes(id)

);

pairs.forEach(pair=>{

pair.forEach(pid=>{

if(pid!==id){

game.players[pid].alive=false;

}

});

});

checkVictory();

};

}

/* =========================

   次の夜

========================= */

function nextNight(){

game.night++;

startNight();

}

/* =========================

   勝利判定

========================= */

function checkVictory(){

let alive=living();

/*

  勝利判定は独立陣営を優先して確認。

  通常陣営の処理より先に乗っ取り系を確認。

*/

/* 神様 */

let god=

alive.filter(p=>p.role==="神様");

if(god.length){

endGame("神様");

return;

}

/* 妖狐 */

let fox=

alive.filter(p=>p.role==="妖狐");

if(fox.length){

/*

 最終局面で決着条件を満たした場合。

*/

let wolves=

alive.filter(p=>

p.role==="人狼" ||

p.role==="人狼の子ども"

);

let citizens=

alive.filter(p=>

!WOLF_ROLES.includes(p.role) &&

p.role!=="妖狐"

);

if(wolves.length===0 || wolves.length>=citizens.length){

endGame("妖狐");

return;

}

}

/* 一匹狼 */

let lone=

alive.filter(p=>p.role==="一匹狼");

let normalWolves=

alive.filter(p=>

p.role==="人狼" ||

p.role==="人狼の子ども"

);

if(lone.length && normalWolves.length===0){

endGame("一匹狼");

return;

}

/* 恋人 */

for(let pair of game.loverPairs){

let a=game.players[pair[0]];

let b=game.players[pair[1]];

if(a.alive && b.alive){

let others=

alive.filter(p=>

p.id!==a.id &&

p.id!==b.id

);

if(others.length===0){

endGame("恋人");

return;

}

}

}

/* 案山子 */

if(alive.length===0){

if(hasRole("案山子")){

endGame("案山子");

return;

}

}

/* 人狼 */

let wolves=

alive.filter(p=>

p.role==="人狼" ||

p.role==="人狼の子ども"

);

let nonWolves=

alive.filter(p=>

p.role!=="人狼" &&

p.role!=="人狼の子ども" &&

p.role!=="一匹狼"

);

if(wolves.length===0){

endGame("市民");

return;

}

if(wolves.length>=nonWolves.length){

endGame("人狼");

return;

}

/* まだ継続 */

nextNight();

}

/* =========================

   ゲーム終了

========================= */

function endGame(winner){

speak(`${winner}の勝利です。`);

render(`

<div class="card">

<div class="result">

🏆 ${winner}勝利！

</div>

<h2>役職一覧</h2>

${game.players.map(p=>`

<p>

${escapeHTML(p.name)}

：

${p.role}

${p.alive?"（生存）":"（死亡）"}

</p>

`).join("")}

</div>

<button onclick="location.reload()">

もう一度ゲームする

</button>

`);

}

/* =========================

   起動

========================= */

startScreen();

</script>

</body>

</html>
