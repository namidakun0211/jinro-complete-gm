/* ==========================

   ゲーム状態

=========================== */

let playerCount = 6;

let players = [];

let selectedRoles = {};

let roleCheckIndex = 0;

let cardIndex = 0;

let gameMode = "noCard";

let currentNight = 0;

let currentDay = 0;

let lastExecutedId = null;

let nightActions = {};

let previousGuardTargets = {};

let currentGuardTarget = null;

let currentTrapTarget = null;

let currentWolfTarget = null;

let currentHunterTarget = null;

let discussionTimer = null;

let discussionSeconds = 0;

let gameFinished = false;

/* 預言者の初日占い */

let prophetFirstNightChoice = null;

/* 恋人 */

let loverPair = [];

/* ==========================

   初期化

=========================== */

window.addEventListener("load",()=>{

  renderRoleList();

  updateTotal();

  document

    .getElementById("playerCount")

    .addEventListener(

      "change",

      changePlayerCount

    );

  document

    .getElementById("cardSelect")

    .addEventListener(

      "change",

      ()=>{

        document

          .getElementById("cardConfirmButton")

          .disabled =

            !document

              .getElementById("cardSelect")

              .value;

      }

    );

});

function changePlayerCount(){

  playerCount =

    Number(

      document

        .getElementById("playerCount")

        .value

    );

  if(

    playerCount < 4

  ){

    playerCount = 4;

    document

      .getElementById("playerCount")

      .value = 4;

  }

  if(

    playerCount > 20

  ){

    playerCount = 20;

    document

      .getElementById("playerCount")

      .value = 20;

  }

  selectedRoles = {};

  renderRoleList();

  updateTotal();

}

/* ==========================

   役職選択

=========================== */

function renderRoleList(){

  const area =

    document.getElementById("roleList");

  area.innerHTML = "";

  Object.keys(ROLE_DATA)

    .forEach(key=>{

      const role =

        ROLE_DATA[key];

      const count =

        selectedRoles[key] || 0;

      const row =

        document.createElement("div");

      row.className =

        "role-item";

      row.innerHTML = `

        <div class="role-name">

          ${role.emoji}

          ${role.name}

        </div>

        <div class="counter">

          <button

            onclick="changeRoleCount('${key}',-1)"

          >

            −

          </button>

          <span

            id="count-${key}"

            class="count"

          >

            ${count}

          </span>

          <button

            onclick="changeRoleCount('${key}',1)"

          >

            ＋

          </button>

        </div>

      `;

      area.appendChild(row);

    });

}

function changeRoleCount(

  key,

  amount

){

  const current =

    selectedRoles[key] || 0;

  const total =

    Object.values(selectedRoles)

      .reduce(

        (sum,n)=>sum+n,

        0

      );

  if(

    amount > 0 &&

    total >= playerCount

  ){

    return;

  }

  const next =

    Math.max(

      0,

      current + amount

    );

  if(next === 0){

    delete selectedRoles[key];

  }else{

    selectedRoles[key] = next;

  }

  const count =

    document.getElementById(

      `count-${key}`

    );

  if(count){

    count.textContent = next;

  }

  updateTotal();

}

function updateTotal(){

  const total =

    Object.values(selectedRoles)

      .reduce(

        (sum,n)=>sum+n,

        0

      );

  const display =

    document.getElementById(

      "totalDisplay"

    );

  display.textContent =

    `配役：${total} / ${playerCount}人`;

  display.className =

    `total ${

      total === playerCount

        ? "ok"

        : "ng"

    }`;

  document

    .getElementById(

      "prepareButton"

    )

    .disabled =

      total !== playerCount;

}

/* ==========================

   プレイヤー名

=========================== */

function preparePlayers(){

  document

    .getElementById("setup")

    .classList.add("hidden");

  document

    .getElementById("playerSetup")

    .classList.remove("hidden");

  const area =

    document.getElementById(

      "playerInputs"

    );

  area.innerHTML = "";

  for(

    let i=0;

    i<playerCount;

    i++

  ){

    const input =

      document.createElement("input");

    input.id =

      `playerName-${i}`;

    input.className =

      "player-input";

    input.placeholder =

      `プレイヤー${i+1}`;

    area.appendChild(input);

    area.appendChild(

      document.createElement("br")

    );

  }

}

/* ==========================

   ゲーム開始

=========================== */

function startGame(){

  players = [];

  for(

    let i=0;

    i<playerCount;

    i++

  ){

    const input =

      document.getElementById(

        `playerName-${i}`

      );

    const name =

      input.value.trim();

    if(!name){

      alert(

        `プレイヤー${i+1}の名前を入力してください。`

      );

      return;

    }

    players.push({

      id:i,

      name:name,

      role:null,

      alive:true,

      lover:false,

      loverPartner:null,

      guardHistory:[],

      abilityUsed:{},

      cardRole:null

    });

  }

  gameMode =

    document.querySelector(

      'input[name="gameMode"]:checked'

    ).value;

  assignRoles();

  setupLovers();

  document

    .getElementById("playerSetup")

    .classList.add("hidden");

  if(gameMode === "card"){

    startCardSetup();

  }else{

    startRoleCheck();

  }

}

function assignRoles(){

  let pool = [];

  Object.keys(selectedRoles)

    .forEach(key=>{

      for(

        let i=0;

        i<selectedRoles[key];

        i++

      ){

        pool.push(key);

      }

    });

  pool =

    shuffle(pool);

  players.forEach(

    (player,index)=>{

      player.role =

        pool[index];

    }

  );

}

/* ==========================

   恋人設定

=========================== */

function setupLovers(){

  loverPair = [];

  if(

    !document

      .getElementById("loverMode")

      .checked

  ){

    return;

  }

  if(players.length < 2){

    return;

  }

  const shuffled =

    shuffle(

      players.map(

        p=>p.id

      )

    );

  loverPair = [

    shuffled[0],

    shuffled[1]

  ];

  const a =

    players.find(

      p=>p.id===loverPair[0]

    );

  const b =

    players.find(

      p=>p.id===loverPair[1]

    );

  a.lover = true;

  b.lover = true;

  a.loverPartner = b.id;

  b.loverPartner = a.id;

}

/* ==========================

   シャッフル

=========================== */

function shuffle(array){

  const result =

    [...array];

  for(

    let i=result.length-1;

    i>0;

    i--

  ){

    const j =

      Math.floor(

        Math.random()*(i+1)

      );

    [

      result[i],

      result[j]

    ] = [

      result[j],

      result[i]

    ];

  }

  return result;

}

/* ==========================

function startCardSetup(){

  cardIndex = 0;

  document

    .getElementById("cardSetup")

    .classList.remove("hidden");

  showCardPlayer();

}

function showCardPlayer(){

  const player =

    players[cardIndex];

      "cardPlayerTitle"

    .textContent =

  const select =

    document.getElementById(

      "cardSelect"

    );

  select.innerHTML =

    `<option value="">

      カードを選択

    </option>`;

  Object.keys(ROLE_DATA)

    .forEach(key=>{

      const option =

        document.createElement(

          "option"

        );

      option.value = key;

      option.textContent =

        `${ROLE_DATA[key].emoji} ${ROLE_DATA[key].name}`;

      select.appendChild(option);

    });

  document

    .getElementById(

      "cardConfirmButton"

    )

    .disabled = true;

}

function confirmCard(){

  const role =

    document

      .getElementById(

        "cardSelect"

      )

      .value;

  if(!role){

    return;

  }

  players[cardIndex].cardRole =

    role;

  players[cardIndex].role =

    role;

  cardIndex++;

  if(

    cardIndex >= players.length

  ){

    document

      .getElementById(

        "cardSetup"

      )

      .classList.add("hidden");

    startRoleCheck();

    return;

  }

  showCardPlayer();

}

function getNightActionOrder(){

   * 呪われた者を最初に確認

   */

  const cursed =

    players.filter(

      p =>

        p.alive &&

        p.role === "cursed"

    );

  const spy =

    players.filter(

      p =>

        p.alive &&

    );

        p.role === "werewolf"

    );

  const trapper =

    players.filter(

      p =>

        p.alive &&

        p.role === "trapper"

    );

  const bodyguards =

    players.filter(

      p =>

        p.alive &&

        (

          p.role === "bodyguard" ||

          p.role === "knight"

        )

    );

  const seers =

    players.filter(

      p =>

        p.alive &&

        (

          p.role === "seer" ||

          p.role === "prophet"

        )

    );

  const mediums =

    players.filter(

      p =>

        p.alive &&

        p.role === "medium"

    );

  const others =

    players.filter(

      p =>

        p.alive &&

        (

          p.role === "priest" ||

          p.role === "witch" ||

          p.role === "detective" ||

          p.role === "thief" ||

          p.role === "infiltrator" ||

          p.role === "wolfSeer" ||

          p.role === "wolfGuard" ||

          p.role === "wolfHunter"

        )

    );

  return [

    ...cursed,

    ...spy,

    ...wolves,

    ...trapper,

    ...bodyguards,

    ...seers,

    ...mediums,

    ...others

  ];

}

function processNightAction(

  order,

  index

){

  if(

    index >= order.length

  ){

    finishNight();

    return;

  }

  const player =

    order[index];

  /*

   * 生存していなければ次へ

   */

  if(!player.alive){

    processNightAction(

      order,

      index+1

    );

    return;

  }

  /*

   * 次へ進む関数を保存

   */

  window._nightNext =

    function(){

      processNightAction(

        order,

        index+1

      );

    };

  showNightAction(

    player

  );

}

function showGuardAction(

  const previous =

    player.guardHistory[

      player.guardHistory.length-1

  const targets =

    players.filter(

      p => {

        if(!p.alive){

          return false;

        }

        if(

          !canSelfGuard &&

          p.id === player.id

        ){

          return false;

        }

        /*

         * ボディガードは

         * 2夜連続で同じ人を守れない

         */

        if(

          !canSelfGuard &&

          previous !== undefined &&

          p.id === previous

        ){

          return false;

        }

        return true;

      }

    );

  setActionArea(`

    <div class="action-box">

      <h3>

        ${canSelfGuard ? "⚔️ 騎士団" : "🛡️ ボディガード"}

 /* ==========================

   夜終了処理

=========================== */

function finishNight(){

  /*

   * 人狼の襲撃先

   */

  const wolfTarget =

    currentWolfTarget;

  /*

   * 罠師の罠

   */

  const trapTarget =

    currentTrapTarget;

  /*

   * 護衛対象

   */

  const guardTarget =

    currentGuardTarget;

  /*

   * 罠にかかった人を人狼が襲撃

   *

   * → 人狼側が死亡

   *

   * 人狼が複数いる場合は

   * ランダムに1人死亡

   */

  if(

    wolfTarget !== null &&

    trapTarget !== null &&

    wolfTarget === trapTarget

  ){

    const wolves =

      players.filter(

        p =>

          p.alive &&

          p.role === "werewolf"

      );

    if(wolves.length){

      const deadWolf =

        wolves[

          Math.floor(

            Math.random() *

            wolves.length

          )

        ];

      deadWolf.alive = false;

    }

  }

  /*

   * 通常の襲撃

   *

   * 妖狐は人狼の襲撃では死亡しない

   */

  else if(

    wolfTarget !== null

  ){

    const target =

      players.find(

        p=>p.id===wolfTarget

      );

    if(

      target &&

      target.alive &&

      target.role !== "fox"

    ){

      /*

       * 護衛されていれば死亡しない

       */

      if(

        guardTarget !== target.id

      ){

        target.alive = false;

      }

    }

  }

  /*

   * 夜明け

   */

  showMorning();

}

  /*

   * 前回までに死亡していた人を除き、

   * 今夜新たに死亡した人だけを取得する

   */

  const newDeaths =

    deadPlayers.filter(

      p =>

        !p._announced

    );

  newDeaths.forEach(

    p=>{

      p._announced = true;

    }

  );

  let text =

    "朝になりました。みなさん目を覚ましてください。";

  if(newDeaths.length){

    const names =

      newDeaths

        .map(

          p=>p.name

        )

        .join("、");

    text +=

      ` 残念ながら${names}さんが亡くなってしまいました。`;

  }

  text +=

    " お昼です。議論スタート。";

  /*

   * 死亡理由は公開しない

   */

  setPhaseContent(`

    <div class="action-box">

      <p>

        ${text}

      </p>

      <p class="small">

        ※死亡理由は公開されません。

      </p>

    </div>

  `);

  setActionArea(`

    <div class="voice">

      <button onclick="speakMorning()">

        🔊 GM音声で読み上げ

      </button>

      <button onclick="startDiscussion()">

        議論を開始

      </button>

    </div>

  `);

  if(

    checkWinCondition()

  ){

    return;

  }

}

/* ==========================

   GM朝音声

=========================== */

function speakMorning(){

  const area =

    document.getElementById(

      "phaseContent"

    );

  const text =

    area.innerText

      .replace(

        "※死亡理由は公開されません。",

        ""

      );

  speak(

    text

  );

}

/* ==========================

   音声

=========================== */

function speak(text){

  if(

    !("speechSynthesis" in window)

  ){

    alert(

      "この端末では音声読み上げを利用できません。"

    );

    return;

  }

  speechSynthesis.cancel();

  const utterance =

    new SpeechSynthesisUtterance(

      text

    );

  utterance.lang =

    "ja-JP";

  utterance.rate =

    0.95;

  utterance.pitch =

    1;

  speechSynthesis.speak(

    utterance

  );

}

/* ==========================

   議論

=========================== */

function startDiscussion(){

  setPhaseTitle(

    "☀️ 昼・議論"

  );

  setPhaseContent(`

    <p>

      議論スタート！

    </p>

    <p>

      生存者で話し合ってください。

    </p>

  `);

  setActionArea(`

    <div class="action-box">

      <div id="timerDisplay">

        タイマーなし

      </div>

      <button

        onclick="startDiscussionTimer()"

      >

        ⏱️ タイマー開始

      </button>

      <button

        onclick="startVoting()"

      >

        🗳️ 投票へ

      </button>

    </div>

  `);

}

/* ==========================

   議論タイマー

=========================== */

function startDiscussionTimer(){

  const seconds =

    Number(

      document.getElementById(

        "discussionTime"

      ).value

    );

  if(

    seconds <= 0

  ){

    document

      .getElementById(

        "timerDisplay"

      )

      .textContent =

        "タイマーなし";

    return;

  }

  if(

    discussionTimer

  ){

    clearInterval(

      discussionTimer

    );

  }

  discussionSeconds =

    seconds;

  updateTimerDisplay();

  discussionTimer =

    setInterval(

      ()=>{

        discussionSeconds--;

        updateTimerDisplay();

        if(

          discussionSeconds <= 0

        ){

          clearInterval(

            discussionTimer

          );

          discussionTimer =

            null;

          speak(

            "議論時間終了です。投票を開始してください。"

          );

        }

      },

      1000

    );

}

function updateTimerDisplay(){

  const min =

    Math.floor(

      discussionSeconds / 60

    );

  const sec =

    discussionSeconds % 60;

  const display =

    document.getElementById(

      "timerDisplay"

    );

  if(!display){

    return;

  }

  display.textContent =

    `${min}:${String(sec).padStart(2,"0")}`;

}

/* ==========================

   投票開始

=========================== */

function startVoting(){

  if(

    discussionTimer

  ){

    clearInterval(

      discussionTimer

    );

    discussionTimer =

      null;

  }

  setPhaseTitle(

    "🗳️ 投票"

  );

  setPhaseContent(`

    <p>

      生存者は1人ずつ、

      自分の投票先を選んでください。

    </p>

    <p class="small">

      投票内容は他のプレイヤーには

      表示されません。

    </p>

  `);

  renderVoting();

}

/* ==========================

   投票画面

=========================== */

function renderVoting(){

  const alive =

    players.filter(

      p=>p.alive

    );

  const area =

    document.getElementById(

      "actionArea"

    );

  area.innerHTML = `

    <div class="action-box">

      <div id="voteArea"></div>

      <button

        onclick="confirmVoting()"

      >

        投票を確定

      </button>

    </div>

  `;

  const voteArea =

    document.getElementById(

      "voteArea"

    );

  alive.forEach(

    player=>{

      const targets =

        alive.filter(

          p =>

            p.id !== player.id

        );

      const options =

        targets

          .map(

            target =>

              `

                <option value="${target.id}">

                  ${target.name}

                </option>

              `

          )

          .join("");

      voteArea.innerHTML += `

        <div class="vote-player">

          <strong>

            ${player.name}さん

          </strong>

          <br>

          <select

            id="vote-${player.id}"

          >

            <option value="">

              投票先を選択

            </option>

            ${options}

          </select>

        </div>

      `;

    }

  );

}

/* ==========================

   投票確定

=========================== */

function confirmVoting(){

  const alive =

    players.filter(

      p=>p.alive

    );

  const votes = {};

  for(

    const player of alive

  ){

    const select =

      document.getElementById(

        `vote-${player.id}`

      );

    if(

      !select ||

      !select.value

    ){

      alert(

        `${player.name}さんの投票先を選んでください。`

      );

      return;

    }

    votes[player.id] =

      Number(

        select.value

      );

  }

  showVoteResult(

    votes

  );

}

/* ==========================

   投票結果

=========================== */

function showVoteResult(

  votes

){

  const counts = {};

  Object.values(votes)

    .forEach(

      id=>{

        counts[id] =

          (

            counts[id] || 0

          ) + 1;

      }

    );

  const maxVotes =

    Math.max(

      ...Object.values(counts)

        .map(Number)

    );

  const candidates =

    Object.keys(counts)

      .filter(

        id =>

          Number(counts[id]) === maxVotes

      )

      .map(Number);

  setPhaseTitle(

    "📊 投票結果"

  );

  let html = `

    <p>

      投票が終了しました。

    </p>

  `;

  /*

   * 個人個人の投票先は公開しない

   */

  if(

    candidates.length === 1

  ){

    const target =

      players.find(

        p =>

          p.id === candidates[0]

      );

    html += `

      <p>

        最多得票：

        <strong>

          ${target.name}

        </strong>

      </p>

      <p>

        ${maxVotes}票

      </p>

    `;

    setPhaseContent(

      html

    );

    setActionArea(`

      <button

        onclick="executePlayer(${target.id})"

      >

        ⚖️ ${target.name}さんを追放

      </button>

    `);

    return;

  }

  /*

   * 同票

   */

  html += `

    <p>

      同票になりました。

    </p>

    <p>

      決選投票を行います。

    </p>

  `;

  setPhaseContent(

    html

  );

  startRunoff(

    candidates

  );

}

/* ==========================

   決選投票

=========================== */

function startRunoff(

  candidates

){

  const alive =

    players.filter(

      p=>p.alive

    );

  setActionArea(`

    <div class="action-box">

      <h3>⚖️ 決選投票</h3>

      <p>

        以下の候補者から1人を選んでください。

      </p>

      <div id="runoffArea"></div>

      <button

        onclick="confirmRunoff()"

      >

        決選投票を確定

      </button>

    </div>

  `);

  const area =

    document.getElementById(

      "runoffArea"

    );

  alive.forEach(

    player=>{

      const options =

        candidates

          .filter(

            id =>

              id !== player.id

          )

          .map(

            id=>{

              const target =

                players.find(

                  p=>p.id===id

                );

              return `

                <option value="${id}">

                  ${target.name}

                </option>

              `;

            }

          )

          .join("");

      area.innerHTML += `

        <div class="vote-player">

          <strong>

            ${player.name}さん

          </strong>

          <br>

          <select

            id="runoff-${player.id}"

          >

            <option value="">

              投票先を選択

            </option>

            ${options}

          </select>

        </div>

      `;

    }

  );

  window.currentRunoffCandidates =

    candidates;

}

/* ==========================

   決選投票確定

=========================== */

function confirmRunoff(){

  const candidates =

    window.currentRunoffCandidates || [];

  const alive =

    players.filter(

      p=>p.alive

    );

  const counts = {};

  for(

    const player of alive

  ){

    const select =

      document.getElementById(

        `runoff-${player.id}`

      );

    if(

      !select ||

      !select.value

    ){

      alert(

        `${player.name}さんの投票先を選んでください。`

      );

      return;

    }

    const id =

      Number(

        select.value

      );

    counts[id] =

      (

        counts[id] || 0

      ) + 1;

  }

  const maxVotes =

    Math.max(

      ...Object.values(counts)

        .map(Number)

    );

  const winners =

    Object.keys(counts)

      .filter(

        id =>

          Number(counts[id]) === maxVotes

      )

      .map(Number);

  if(

    winners.length === 1

  ){

    const target =

      players.find(

        p =>

          p.id === winners[0]

      );

    setPhaseTitle(

      "⚖️ 決選投票結果"

    );

    setPhaseContent(`

      <p>

        決選投票の結果、

        <strong>

          ${target.name}

        </strong>

        さんが最多得票でした。

      </p>

    `);

    setActionArea(`

      <button

        onclick="executePlayer(${target.id})"

      >

        ⚖️ ${target.name}さんを追放

      </button>

    `);

    return;

  }

  /*

   * 決選投票でも同票

   * → 追放なし

   */

  setPhaseTitle(

    "⚖️ 決選投票結果"

  );

  setPhaseContent(`

    <p>

      決選投票も同票でした。

    </p>

    <p>

      今回は追放なしです。

    </p>

  `);

  setActionArea(`

    <button

      onclick="afterDayVote()"

    >

      次へ

    </button>

  `);

}

/* ==========================

   追放処理

=========================== */

function executePlayer(

  playerId

){

  const player =

    players.find(

      p=>p.id===playerId

    );

  if(

    !player ||

    !player.alive

  ){

    return;

  }

  player.alive =

    false;

  lastExecutedId =

    player.id;

  /*

   * ハンターなら道連れ

   */

  if(

    player.role === "hunter"

  ){

    showHunterAction(

      player

    );

    return;

  }

  if(

    checkWinCondition()

  ){

    return;

  }

  afterDayVote();

}

/* ==========================

   ハンター

=========================== */

function showHunterAction(

  hunter

){

  const targets =

    players.filter(

      p =>

        p.alive &&

        p.id !== hunter.id

    );

  setPhaseTitle(

    "🏹 ハンター"

  );

  setPhaseContent(`

    <p>

      ハンターの

      <strong>

        ${hunter.name}

      </strong>

      さんが死亡しました。

    </p>

    <p>

      道連れにする相手を選んでください。

    </p>

  `);

  setActionArea(`

    <div class="action-box">

      ${

        targets.map(

          target => `

            <label class="choice">

              <input

                type="radio"

                name="hunterTarget"

                value="${target.id}"

              >

              ${target.name}

            </label>

          `

        ).join("")

      }

      <button

        onclick="confirmHunter()"

      >

        道連れにする

      </button>

    </div>

  `);

}

/* ==========================

   ハンター確定

=========================== */

function confirmHunter(){

  const target =

    getRadio(

      "hunterTarget"

    );

  if(target === null){

    alert(

      "道連れにする相手を選んでください。"

    );

    return;

  }

  const player =

    players.find(

      p =>

        p.id === Number(target)

    );

  if(player){

    player.alive =

      false;

  }

  if(

    checkWinCondition()

  ){

    return;

  }

  setPhaseContent(`

    <p>

      🏹 ハンターは

      <strong>

        ${player ? player.name : ""}

      </strong>

      さんを道連れにしました。

    </p>

  `);

  setActionArea(`

    <button onclick="afterDayVote()">

      次へ

    </button>

  `);

}

/* ==========================

   昼終了 → 夜へ

=========================== */

function afterDayVote(){

  currentNight++;

  startNight();

}

/* ==========================

   勝敗判定

=========================== */

function checkWinCondition(){

  const alive =

    players.filter(

      p=>p.alive

    );

  const wolves =

    alive.filter(

      p =>

        p.role === "werewolf"

    );

  const foxes =

    alive.filter(

      p =>

        p.role === "fox"

    );

  const nonWolves =

    alive.filter(

      p =>

        p.role !== "werewolf" &&

        p.role !== "fox"

    );

  /*

   * 妖狐勝利

   *

   * 人狼と村人の決着条件になったとき、

   * 妖狐が生きていれば妖狐勝利

   */

  if(

    foxes.length > 0 &&

    (

      wolves.length === 0 ||

      wolves.length >= nonWolves.length

    )

  ){

    finishGame(

      "🦊 妖狐陣営の勝利！"

    );

    return true;

  }

  /*

   * 人狼全滅

   */

  if(

    wolves.length === 0

  ){

    finishGame(

      "🏘️ 村人陣営の勝利！"

    );

    return true;

  }

  /*

   * 人狼が村人以上

   */

  if(

    wolves.length >= nonWolves.length &&

    foxes.length === 0

  ){

    finishGame(

      "🐺 人狼陣営の勝利！"

    );

    return true;

  }

  return false;

}

/* ==========================

   ゲーム終了

=========================== */

function finishGame(

  message

){

  gameFinished =

    true;

  if(

    discussionTimer

  ){

    clearInterval(

      discussionTimer

    );

    discussionTimer =

      null;

  }

  setPhaseTitle(

    "🏆 ゲーム終了"

  );

  setPhaseContent(`

    <div class="result">

      ${message}

    </div>

  `);

  setActionArea("");

  document

    .getElementById(

      "gameResult"

    )

    .classList.remove("hidden");

  const result =

    document.getElementById(

      "gameResultText"

    );

  result.textContent =

    message;

  const final =

    document.getElementById(

      "finalRoles"

    );

  final.innerHTML = `

    <h3>最終役職</h3>

    ${

      players.map(

        p=>`

          <div class="vote-player">

            ${p.alive ? "🟢" : "⚫"}

            <strong>

              ${p.name}

            </strong>

            ：

            ${

              ROLE_DATA[p.role]

                ? ROLE_DATA[p.role].emoji

                : ""

            }

            ${

              ROLE_DATA[p.role]

                ? ROLE_DATA[p.role].name

                : ""

            }

          </div>

        `

      ).join("")

    }

  `;

}

/* ==========================

   ここから共通処理

=========================== */

function escapeHtml(

  text

){

  return String(text)

    .replace(

      /&/g,

      "&amp;"

    )

    .replace(

      /</g,

      "&lt;"

    )

    .replace(

      />/g,

      "&gt;"

    )

    .replace(

      /"/g,

      "&quot;"

    )

    .replace(

      /'/g,

      "&#039;"

    );

}

   ページ終了

=========================== */
