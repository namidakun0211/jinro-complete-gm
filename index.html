<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:15px;

  text-align:center;

}

.container{

  max-width:680px;

  margin:auto;

  background:white;

  padding:20px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{

  margin-top:0;

}

input,button,select{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

  box-sizing:border-box;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{

  display:none!important;

}

.info{

  font-size:18px;

  line-height:1.7;

}

.mode-box{

  display:flex;

  justify-content:center;

  gap:15px;

  margin:15px 0;

  flex-wrap:wrap;

}

.mode-option{

  border:2px solid #ddd;

  border-radius:15px;

  padding:15px;

  min-width:130px;

  cursor:pointer;

}

.mode-option.selected{

  border-color:#333;

  background:#f0f0f0;

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{

  color:green;

}

.ng{

  color:red;

}

.player-box{

  margin:15px 0;

}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:23px;

  font-weight:bold;

  margin-top:15px;

}

.wolf-info{

  color:#555;

  font-size:20px;

  font-weight:bold;

  margin-top:15px;

}

.lover-partner{

  font-size:20px;

  margin-top:8px;

}

.card-box,

.action-box{

  margin:20px 0;

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

}

.card-select{

  width:90%;

  max-width:450px;

}

.status{

  font-size:18px;

  font-weight:bold;

  margin:15px;

}

.warning{

  color:#c00;

  font-weight:bold;

}

.success{

  color:green;

  font-weight:bold;

}

.error-box{

  background:#fff0f0;

  border:2px solid #d33;

  border-radius:15px;

  padding:15px;

  margin:20px 0;

}

.choice{

  display:block;

  width:90%;

  max-width:500px;

  margin:10px auto;

}

.result{

  font-size:24px;

  font-weight:bold;

  margin:20px;

}

.vote-player{

  padding:15px;

  margin:10px 0;

  border:2px solid #ddd;

  border-radius:12px;

}

.vote-player select{

  width:90%;

  max-width:400px;

}

.small{

  font-size:14px;

  color:#666;

}

.timer{

  font-size:58px;

  font-weight:bold;

  margin:20px;

}

.timer.warning{

  color:red;

}

.night-title{

  font-size:28px;

  font-weight:bold;

  margin:20px 0;

}

.gm-message{

  background:#f1f1f1;

  padding:20px;

  border-radius:15px;

  font-size:21px;

  line-height:1.7;

  margin:20px 0;

}

.big-button{

  width:90%;

  max-width:500px;

  padding:15px;

  font-size:21px;

}

.death-list{

  font-size:21px;

  line-height:1.8;

}

hr{

  border:none;

  border-top:1px solid #ddd;

  margin:25px 0;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- =========================

     設定

========================= -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>🎮 ゲームモード</h3>

<div class="mode-box">

<label class="mode-option selected" id="modeNoCard">

<input

 type="radio"

 name="gameMode"

 value="noCard"

 checked

 onchange="changeGameMode()"

>

📱 カードなし

</label>

<label class="mode-option" id="modeCard">

<input

 type="radio"

 name="gameMode"

 value="card"

 onchange="changeGameMode()"

>

🃏 カードあり

</label>

</div>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>⏱️ 昼の議論時間</h3>

<select id="discussionTime">

<option value="60">1分</option>

<option value="180">3分</option>

<option value="300" selected>5分</option>

<option value="600">10分</option>

<option value="900">15分</option>

<option value="0">タイマーなし</option>

</select>

<h3>🎭 今回使う役職</h3>

<div id="totalDisplay" class="total ng">

配役：0 / 6人

</div>

<div id="roleList" class="role-list"></div>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- =========================

     プレイヤー名

========================= -->

<div id="playerSetup" class="hidden">

<h2>👥 プレイヤー名</h2>

<p>プレイヤーの名前を入力してください。</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- =========================

     カード登録

========================= -->

<div id="cardSetup" class="hidden">

<h2>🃏 カード登録</h2>

<div id="cardPlayerTitle"></div>

<div class="card-box">

<p class="info">

このプレイヤーに実際に配ったカードを選んでください。

</p>

<select

 id="cardSelect"

 class="card-select"

 onchange="cardSelectionChanged()"

>

<option value="">

配られたカードを選択してください

</option>

</select>

<div id="cardStatus" class="status"></div>

</div>

<button

 id="cardNextButton"

 onclick="confirmCard()"

 disabled

>

このカードで登録

</button>

</div>

<!-- =========================

     カード確認

========================= -->

<div id="cardCheck" class="hidden">

<h2>🔍 カードを確認しています</h2>

<div id="cardCheckResult"></div>

<button

 id="retryCardButton"

 onclick="retryCardInput()"

 class="hidden"

>

最初の人からもう一度入力

</button>

<button

 id="cardCheckNextButton"

 onclick="finishCardCheck()"

 class="hidden"

>

役職確認へ

</button>

</div>

<!-- =========================

     役職確認

========================= -->

<div id="game" class="hidden">

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

</div>

<div id="loverArea"></div>

<p id="info" class="info">

役職を見るボタンを押してください。

</p>

<button

 id="mainButton"

 onclick="showRole()"

>

役職を見る

</button>

</div>

<!-- =========================

     初日死亡発表

========================= -->

<div id="initialDeathAnnouncement" class="hidden">

<h2>🌅 ゲーム開始</h2>

<div id="initialDeathText" class="gm-message"></div>

<button

 class="big-button"

 onclick="beginFirstDay()"

>

昼へ進む

</button>

</div>

<!-- =========================

     昼

========================= -->

<div id="day" class="hidden">

<h2>☀️ 昼の議論</h2>

<div id="dayInfo" class="info"></div>

<div id="timerArea" class="hidden">

<div id="timer" class="timer">

05:00

</div>

<button onclick="startTimer()">

⏱️ 議論スタート

</button>

<button onclick="stopTimer()">

⏸️ 一時停止

</button>

</div>

<hr>

<p class="info">

みんなで議論してください。

</p>

<button

 onclick="startVoting()"

 class="big-button"

>

🗳️ 投票へ

</button>

</div>

<!-- =========================

     投票

========================= -->

<div id="vote" class="hidden">

<h2>🗳️ 投票</h2>

<p id="voteInstruction" class="info"></p>

<div id="specialVoteArea"></div>

<div id="votePlayers"></div>

<button

 onclick="finishVoting()"

 class="big-button"

>

⚖️ 投票を集計する

</button>

</div>

<!-- =========================

     投票結果

========================= -->

<div id="voteResult" class="hidden">

<h2>⚖️ 投票結果</h2>

<div id="voteResultText" class="info"></div>

<button onclick="afterVote()">

次へ

</button>

</div>

<!-- =========================

     夜開始

========================= -->

<div id="gameReady" class="hidden">

<h2>🌙 夜の時間</h2>

<p class="info">

昼の議論と投票が終了しました。

</p>

<button

 onclick="startNight()"

 class="big-button"

>

🌙 夜を開始

</button>

</div>

<!-- =========================

     夜

========================= -->

<div id="night" class="hidden">

<div id="nightTitle" class="night-title">

🌙 夜

</div>

<div id="nightInfo" class="gm-message"></div>

<div id="nightAction" class="action-box"></div>

</div>

<!-- =========================

     ゲーム終了

========================= -->

<div id="gameOver" class="hidden">

<h2>🏆 ゲーム終了</h2>

<div id="winner" class="result"></div>

<button onclick="location.reload()">

🔄 もう一度ゲームする

</button>

</div>

<script>

/* ==================================================

   役職一覧

================================================== */

const ROLES=[

["werewolf","🐺 人狼"],

["wolfChild","👶 人狼の子ども"],

["betrayer","😈 裏切り者"],

["betrayShared","🤝 裏切りの共有者"],

["informant","👁️ 内通者"],

["betrayAttacker","⚔️ 裏切りの襲撃者"],

["spy","🕵️ スパイ"],

["villager","👤 市民"],

["seer","🔮 預言者"],

["bodyguard","🛡️ ボディーガード"],

["medium","👻 霊媒師"],

["hunter","🔫 ハンター"],

["shared","🤝 共有者"],

["dictator","👑 独裁者"],

["tough","💪 タフガイ"],

["counselor","🩺 カウンセラー"],

["magician","🎩 奇術師"],

["trapper","🪤 罠師"],

["knights","🛡️ 騎士団"],

["shadow","🪞 影武者"],

["king","👑 王様"],

["cursed","🧟 呪われた者"],

["fox","🦊 妖狐"],

["god","🙏 神様"],

["lover","❤️ 恋人"],

["loneWolf","🐺 一匹狼"],

["android","🤖 アンドロイド"],

["scarecrow","🌾 案山子"]

];

/* ==================================================

   変数

================================================== */

let roleCounts={};

let players=[];

let selectedRoles=[];

let currentPlayer=0;

let currentCardPlayer=0;

let loverMode=false;

let gameMode="noCard";

let day=1;

let nightStep=0;

let nightData={};

let discussionSeconds=300;

let timerInterval=null;

let hunterQueue=[];

let initialDeathNames=[];

/* ==================================================

   人狼

================================================== */

const WOLF_ROLES=[

"werewolf",

"wolfChild",

"loneWolf"

];

/* ==================================================

   裏切り者系

================================================== */

const BETRAYER_ROLES=[

"betrayer",

"betrayShared",

"informant",

"betrayAttacker"

];

/* ==================================================

   共通

================================================== */

function $(id){

return document.getElementById(id);

}

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

function getRoleName(id){

const role=ROLES.find(r=>r[0]===id);

return role ? role[1] : "不明";

}

function isWolf(player){

return WOLF_ROLES.includes(player.roleId);

}

function isBetrayer(player){

return BETRAYER_ROLES.includes(player.roleId);

}

function alivePlayers(){

return players.filter(p=>p.alive);

}

function getTargets(excludeId=null){

return alivePlayers().filter(

p=>p.id!==excludeId

);

}

/* ==================================================

   GM音声

================================================== */

function speak(text){

if(!("speechSynthesis" in window)){

return;

}

window.speechSynthesis.cancel();

const utter=new SpeechSynthesisUtterance(text);

utter.lang="ja-JP";

utter.rate=0.9;

utter.pitch=1;

window.speechSynthesis.speak(utter);

}

/* ==================================================

   ゲームモード

================================================== */

function changeGameMode(){

gameMode=

document.querySelector(

'input[name="gameMode"]:checked'

).value;

$("modeNoCard")

.classList.toggle(

"selected",

gameMode==="noCard"

);

$("modeCard")

.classList.toggle(

"selected",

gameMode==="card"

);

}

/* ==================================================

   恋人

================================================== */

function updateLoverMode(){

loverMode=

document.querySelector(

'input[name="loverMode"]:checked'

).value==="true";

renderRoleList();

}

/* ==================================================

   役職初期化

================================================== */

function resetRoleCounts(){

roleCounts={};

ROLES.forEach(role=>{

roleCounts[role[0]]=0;

});

renderRoleList();

}

/* ==================================================

   役職一覧

================================================== */

function renderRoleList(){

const list=$("roleList");

list.innerHTML="";

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode){

return;

}

list.innerHTML+=`

<div class="role-item">

<div class="role-name">

${role[1]}

</div>

<div class="counter">

<button onclick="changeRoleCount('${id}',-1)">

−

</button>

<div class="count">

${roleCounts[id]||0}

</div>

<button onclick="changeRoleCount('${id}',1)">

＋

</button>

</div>

</div>

`;

});

updateTotal();

}

/* ==================================================

   人数変更

================================================== */

function changeRoleCount(id,change){

const playerCount=

Number($("playerCount").value);

const next=

(roleCounts[id]||0)+change;

if(next<0)return;

if(next>playerCount)return;

roleCounts[id]=next;

renderRoleList();

}

/* ==================================================

   合計

================================================== */

function updateTotal(){

const playerCount=

Number($("playerCount").value);

let total=0;

Object.entries(roleCounts).forEach(

([id,count])=>{

if(id==="lover" && loverMode){

return;

}

total+=count;

});

$("totalDisplay").textContent=

`配役：${total} / ${playerCount}人`;

$("totalDisplay").className=

"total "+(

total===playerCount

?"ok"

:"ng"

);

$("nextButton").disabled=

total!==playerCount;

}

/* ==================================================

   プレイヤー準備

================================================== */

function preparePlayers(){

const count=

Number($("playerCount").value);

if(count<4 || count>20){

alert("4人〜20人で入力してください。");

return;

}

selectedRoles=[];

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode){

return;

}

for(let i=0;i<(roleCounts[id]||0);i++){

selectedRoles.push(id);

}

});

const area=$("playerInputs");

area.innerHTML="";

for(let i=0;i<count;i++){

const oldName=

localStorage.getItem("jinroPlayer"+i)||"";

area.innerHTML+=`

<div class="player-box">

<label>

プレイヤー${i+1}

</label>

<br>

<input

id="playerName${i}"

type="text"

maxlength="20"

placeholder="名前を入力"

value="${escapeHtml(oldName)}"

>

</div>

`;

}

$("setup").classList.add("hidden");

$("playerSetup").classList.remove("hidden");

}

/* ==================================================

   ゲーム開始

================================================== */

function startGame(){

const names=[];

for(let i=0;i<selectedRoles.length;i++){

const input=$("playerName"+i);

const name=input.value.trim();

if(!name){

alert(

`プレイヤー${i+1}の名前を入力してください。`

);

input.focus();

return;

}

names.push(name);

localStorage.setItem(

"jinroPlayer"+i,

name

);

}

players=names.map((name,index)=>({

id:index,

name:name,

roleId:null,

alive:true,

lover:false,

loverPartner:null,

abilitiesUsed:{},

copiedRole:null,

cursedAwakened:false,

toughHit:false,

lastDeathReason:null,

wolfChildExtraAttack:false,

spyUsedRoles:{},

initialSeerDone:false

}));

if(gameMode==="noCard"){

assignRandomRoles();

finishRoleAssignment();

}else{

currentCardPlayer=0;

$("playerSetup").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

}

/* ==================================================

   ランダム配役

================================================== */

function assignRandomRoles(){

const shuffled=[...selectedRoles]

.sort(()=>Math.random()-0.5);

players.forEach((player,index)=>{

player.roleId=shuffled[index];

});

}

/* ==================================================

   カード

================================================== */

function showCardPlayer(){

const player=players[currentCardPlayer];

$("cardPlayerTitle").innerHTML=

`<h3>${escapeHtml(player.name)} さん</h3>`;

$("cardSelect").innerHTML=

`

<option value="">

配られたカードを選択してください

</option>

`;

ROLES.forEach(role=>{

if(role[0]==="lover" && loverMode){

return;

}

const option=document.createElement("option");

option.value=role[0];

option.textContent=role[1];

$("cardSelect").appendChild(option);

});

$("cardStatus").textContent=

"配られたカードを選択してください。";

$("cardNextButton").disabled=true;

}

/* ==================================================

   カード選択

================================================== */

function cardSelectionChanged(){

$("cardNextButton").disabled=

!$("cardSelect").value;

}

/* ==================================================

   カード登録

================================================== */

function confirmCard(){

const roleId=$("cardSelect").value;

if(!roleId)return;

players[currentCardPlayer].roleId=roleId;

currentCardPlayer++;

if(currentCardPlayer<players.length){

showCardPlayer();

return;

}

$("cardSetup").classList.add("hidden");

$("cardCheck").classList.remove("hidden");

checkCards();

}

/* ==================================================

   カード確認

================================================== */

function checkCards(){

const enteredCounts={};

ROLES.forEach(role=>{

enteredCounts[role[0]]=0;

});

players.forEach(player=>{

if(player.roleId){

enteredCounts[player.roleId]++;

}

});

let correct=true;

let messages=[];

ROLES.forEach(role=>{

const id=role[0];

if(id==="lover" && loverMode){

return;

}

const expected=roleCounts[id]||0;

const entered=enteredCounts[id]||0;

if(expected!==entered){

correct=false;

messages.push(

`${role[1]}：設定 ${expected}枚 / 入力 ${entered}枚`

);

}

});

if(correct){

$("cardCheckResult").innerHTML=`

<div class="success">

🎉 カード登録完了！

</div>

<p>

設定した役職と入力したカードが一致しました。

</p>

`;

$("cardCheckNextButton")

.classList.remove("hidden");

$("retryCardButton")

.classList.add("hidden");

}else{

$("cardCheckResult").innerHTML=`

<div class="error-box">

<div class="warning">

❌ カードの枚数が一致しません。

</div>

<p>

${messages.join("<br>")}

</p>

</div>

`;

$("retryCardButton")

.classList.remove("hidden");

$("cardCheckNextButton")

.classList.add("hidden");

}

}

/* ==================================================

   カードやり直し

================================================== */

function retryCardInput(){

players.forEach(player=>{

player.roleId=null;

});

currentCardPlayer=0;

$("cardCheck").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

/* ==================================================

   役職決定

================================================== */

function finishCardCheck(){

$("cardCheck").classList.add("hidden");

finishRoleAssignment();

}

/* ==================================================

   役職決定後

================================================== */

function finishRoleAssignment(){

/* 恋人 */

if(loverMode){

const shuffled=

[...players].sort(

()=>Math.random()-0.5

);

const a=shuffled[0];

const b=shuffled[1];

a.lover=true;

b.lover=true;

a.loverPartner=b.name;

b.loverPartner=a.name;

}

/* 共有者 */

setupSharedInfo();

/* 裏切りの共有者 */

setupBetraySharedInfo();

/* 内通者 */

setupInformantInfo();

/* 騎士団 */

setupKnightInfo();

/* 案山子 */

setupScarecrowInfo();

/* 神様 */

setupGodInfo();

/* アンドロイド */

setupAndroid();

currentPlayer=0;

$("game").classList.remove("hidden");

showPlayer();

}

/* ==================================================

   共有者・特殊情報

================================================== */

speak("裏切り者系の方、目を開けてください。確認してください。目を閉じてください。");

}

/* ==================================================

   対象ボタン

================================================== */

function showTargetButtons(

title,

targets,

functionName

){

let html=`<h3>${title}</h3>`;

targets.forEach(target=>{

html+=`

<button

class="choice"

onclick="${functionName}(${target.id})"

>

${escapeHtml(target.name)}

</button>

`;

});

$("nightAction").innerHTML=html;

}

/* ==================================================

   夜終了

================================================== */

function finishNight(){

let attacks=[...nightData.wolfAttacks];

if(

nightData.changedTarget!==null &&

nightData.changedTarget!==undefined

){

attacks=[

nightData.changedTarget

];

}

if(

nightData.betrayAttack!==null &&

nightData.betrayAttack!==undefined

){

attacks.push(

nightData.betrayAttack

);

}

/*

   重複削除

*/

attacks=[

...new Set(attacks)

];

/*

   襲撃

*/

attacks.forEach(targetId=>{

const target=players.find(

p=>p.id===targetId

);

if(!target || !target.alive){

return;

}

/*

   妖狐

*/

if(target.roleId==="fox"){

return;

}

/*

   ボディーガード

*/

if(nightData.bodyguard===target.id){

return;

}

/*

   騎士団

*/

if(nightData.knights===target.id){

return;

}

/*

   罠

*/

if(nightData.trap===target.id){

const wolves=players.filter(

p=>p.alive && isWolf(p)

);

if(wolves.length){

const randomWolf=

wolves[

Math.floor(

Math.random()*wolves.length

)

];

randomWolf.alive=false;

randomWolf.lastDeathReason="trap";

randomWolf.deathDay=day;

}

return;

}

/*

   呪われた者

*/

if(target.roleId==="cursed"){

target.cursedAwakened=true;

return;

}

/*

   タフガイ

*/

if(

target.roleId==="tough" &&

!target.toughHit

){

target.toughHit=true;

return;

}

/*

   通常死亡

*/

killPlayer(

target,

"night"

);

});

/*

   恋人後追い

*/

resolveLovers();

/*

   朝

*/

$("night").classList.add("hidden");

announceMorning();

}

/* ==================================================

   死亡

================================================== */

function killPlayer(player,reason){

if(!player.alive)return;

player.alive=false;

player.lastDeathReason=reason;

player.deathDay=day;

}

/* ==================================================

   恋人

================================================== */

function resolveLovers(){

players.forEach(p=>{

if(

!p.alive &&

p.lover

){

const partner=players.find(

x=>

x.name===p.loverPartner &&

x.alive

);

if(partner){

partner.alive=false;

partner.lastDeathReason="lover";

partner.deathDay=day;

}

}

});

}

/* ==================================================

   朝の死亡発表

================================================== */

function announceMorning(){

const dead=players.filter(

p=>

!p.alive &&

p.deathDay===day &&

p.lastDeathReason!=="vote"

);

if(checkWin()){

return;

}

$("day").classList.remove("hidden");

let text=

`🌅 朝になりました。<br>

みなさん、目を覚ましてください。<br><br>`;

if(dead.length){

text+=`

残念ながら、

${dead

.map(p=>`<strong>${escapeHtml(p.name)}さん</strong>`)

.join("、")}

が亡くなってしまいました。

`;

const speechNames=dead

.map(p=>p.name)

.join("さん、");

speak(

`朝になりました。みなさん、目を覚ましてください。残念ながら、${speechNames}さんが亡くなってしまいました。`

);

}else{

text+=`

🌟 今朝は犠牲者はいませんでした。

`;

speak(

"朝になりました。みなさん、目を覚ましてください。今朝は犠牲者はいませんでした。"

);

}

text+=`

<br><br>

☀️ お昼です。議論スタート。

`;

$("dayInfo").innerHTML=text;

setupDiscussionTimer();

}

/* ==================================================

   昼

================================================== */

function setupDiscussionTimer(){

const seconds=

Number($("discussionTime").value);

discussionSeconds=seconds;

if(seconds===0){

$("timerArea").classList.add("hidden");

}else{

$("timerArea").classList.remove("hidden");

updateTimerDisplay();

}

}

/* ==================================================

   タイマー

================================================== */

function updateTimerDisplay(){

const min=

Math.floor(discussionSeconds/60);

const sec=

discussionSeconds%60;

$("timer").textContent=

`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

$("timer").classList.toggle(

"warning",

discussionSeconds<=10

);

}

function startTimer(){

if(timerInterval)return;

speak("議論スタートです。");

timerInterval=setInterval(()=>{

discussionSeconds--;

updateTimerDisplay();

if(discussionSeconds<=0){

stopTimer();

speak("議論時間が終了しました。");

alert("⏰ 議論時間が終了しました。投票へ進んでください。");

}

},1000);

}

function stopTimer(){

if(timerInterval){

clearInterval(timerInterval);

timerInterval=null;

}

}

/* ==================================================

   議論→投票

================================================== */

function startVoting(){

stopTimer();

$("day").classList.add("hidden");

$("vote").classList.remove("hidden");

renderVote();

}

/* ==================================================

   投票

================================================== */

function renderVote(){

const alive=alivePlayers();

$("voteInstruction").textContent=

"それぞれのプレイヤーの投票先を選択してください。";

$("specialVoteArea").innerHTML="";

/*

   独裁者

*/

const dictator=alive.find(

p=>p.roleId==="dictator"

);

if(

dictator &&

!dictator.abilitiesUsed.dictator

){

$("specialVoteArea").innerHTML=`

<div class="action-box">

<h3>👑 独裁者</h3>

<p>

独裁者は1回だけ、指定した人を強制的に追放できます。

</p>

<select id="dictatorTarget">

<option value="">

指定する相手

</option>

${getTargets(dictator.id)

.map(p=>`

<option value="${p.id}">

${escapeHtml(p.name)}

</option>

`)

.join("")}

</select>

<br>

<button onclick="useDictator()">

👑 強制追放する

</button>

</div>

`;

}

/*

   影武者

*/

const shadow=alive.find(

p=>p.roleId==="shadow"

);

if(

shadow &&

!shadow.abilitiesUsed.shadow

){

$("specialVoteArea").innerHTML+=`

<div class="action-box">

<h3>🪞 影武者</h3>

<p>

影武者は1回だけ議論を強制終了し、

自分自身が追放されます。

</p>

<button onclick="useShadow()">

🪞 議論を終了して自分を追放

</button>

</div>

`;

}

$("votePlayers").innerHTML="";

alive.forEach(voter=>{

const targets=alive.filter(

target=>target.id!==voter.id

);

$("votePlayers").innerHTML+=`

<div class="vote-player">

<strong>

🗳️ ${escapeHtml(voter.name)}さん

</strong>

<br>

<select id="vote-${voter.id}">

<option value="">

投票先を選択

</option>

${targets.map(target=>`

<option value="${target.id}">

${escapeHtml(target.name)}

</option>

`).join("")}

</select>

</div>

`;

});

}

/* ==================================================

   独裁者

================================================== */

function useDictator(){

const dictator=players.find(

p=>p.roleId==="dictator" && p.alive

);

if(!dictator)return;

const select=$("dictatorTarget");

if(!select.value){

alert("追放する人を選んでください。");

return;

}

const target=players.find(

p=>p.id===Number(select.value)

);

dictator.abilitiesUsed.dictator=true;

killPlayer(

target,

"vote"

);

target.deathDay=day;

$("vote").classList.add("hidden");

$("voteResult").classList.remove("hidden");

$("voteResultText").innerHTML=`

<div class="result">

👑 独裁者による強制追放

</div>

<p>

${escapeHtml(target.name)}さんが追放されました。

</p>

`;

checkHunter(target);

resolveLovers();

};

/* ==================================================

   影武者

================================================== */

function useShadow(){

const shadow=players.find(

p=>p.roleId==="shadow" && p.alive

);

if(!shadow)return;

shadow.abilitiesUsed.shadow=true;

killPlayer(

shadow,

"vote"

);

$("vote").classList.add("hidden");

$("voteResult").classList.remove("hidden");

$("voteResultText").innerHTML=`

<div class="result">

🪞 影武者の能力発動

</div>

<p>

影武者自身が追放されました。

</p>

`;

resolveLovers();

}

/* ==================================================

   通常投票

================================================== */

function finishVoting(){

const alive=alivePlayers();

const counts={};

alive.forEach(

p=>counts[p.id]=0

);

for(const voter of alive){

const select=$(`vote-${voter.id}`);

if(!select.value){

alert(

`${voter.name}さんの投票先を選択してください。`

);

select.focus();

return;

}

const targetId=

Number(select.value);

const target=players.find(

p=>p.id===targetId

);

if(target && voter.roleId==="king"){

counts[targetId]+=2;

}else{

counts[targetId]++;

}

}

let max=0;

Object.values(counts).forEach(c=>{

if(c>max)max=c;

});

const top=

Object.entries(counts)

.filter(([id,count])=>count===max)

.map(([id])=>Number(id));

let result="";

alive.forEach(p=>{

result+=`

<p>

${escapeHtml(p.name)}：

<strong>${counts[p.id]}票</strong>

</p>

`;

});

if(top.length>1){

result+=`

<hr>

<div class="warning">

⚠️ 同票のため追放なし

</div>

`;

}else{

const target=players.find(

p=>p.id===top[0]

);

killPlayer(

target,

"vote"

);

target.deathDay=day;

result+=`

<hr>

<div class="result">

⚖️ ${escapeHtml(target.name)}さんが追放されました。

</div>

`;

checkHunter(target);

resolveLovers();

}

$("vote").classList.add("hidden");

$("voteResult").classList.remove("hidden");

$("voteResultText").innerHTML=result;

}

/* ==================================================

   ハンター

================================================== */

function checkHunter(player){

if(player.roleId!=="hunter"){

return;

}

hunterQueue.push(player.id);

showHunterAction();

}

function showHunterAction(){

if(!hunterQueue.length){

return;

}

const id=hunterQueue.shift();

const hunter=players.find(

p=>p.id===id

);

if(!hunter){

showHunterAction();

return;

}

const targets=alivePlayers();

$("voteResultText").innerHTML+=`

<div class="action-box">

<h3>🔫 ハンター</h3>

<p>

ハンターが死亡しました。

道連れにする人を選んでください。

</p>

${targets.map(p=>`

<button

class="choice"

onclick="hunterShoot(${p.id})"

>

${escapeHtml(p.name)}

</button>

`).join("")}

</div>

`;

}

function hunterShoot(id){

const target=players.find(

p=>p.id===Number(id)

);

if(!target)return;

killPlayer(

target,

"hunter"

);

$("voteResultText").innerHTML+=`

<p>

🔫 ${escapeHtml(target.name)}さんが

道連れになりました。

</p>

`;

resolveLovers();

if(

hunterQueue.length

){

showHunterAction();

}

}

/* ==================================================

   投票後

================================================== */

function afterVote(){

$("voteResult").classList.add("hidden");

if(checkWin()){

return;

}

$("gameReady").classList.remove("hidden");

}

/* ==================================================

   勝敗

================================================== */

function checkWin(){

const alive=alivePlayers();

const wolves=alive.filter(

p=>isWolf(p)

);

/*

   神様

*/

const gods=alive.filter(

p=>p.roleId==="god"

);

if(

gods.length &&

gods.length===players.filter(p=>p.roleId==="god").length

){

showWinner(

"🙏 神様の単独勝利！"

);

return true;

}

/*

   恋人

*/

const lovers=players.filter(

p=>p.lover

);

if(

lovers.length===2 &&

lovers.every(p=>p.alive)

){

const otherAlive=alive.filter(

p=>!p.lover

);

if(!otherAlive.length){

showWinner(

"❤️ 恋人の単独勝利！"

);

return true;

}

}

/*

   案山子

*/

const scarecrows=players.filter(

p=>p.roleId==="scarecrow"

);

if(

scarecrows.length &&

scarecrows.every(p=>!p.alive)

){

showWinner(

"🌾 案山子の単独勝利！"

);

return true;

}

/*

   一匹狼

*/

const loneWolf=alive.find(

p=>p.roleId==="loneWolf"

);

if(loneWolf){

const otherWolves=alive.filter(

p=>

isWolf(p) &&

p.roleId!=="loneWolf"

);

if(

otherWolves.length===0 &&

wolves.length===1

){

showWinner(

"🐺 一匹狼の単独勝利！"

);

return true;

}

}

/*

   妖狐

*/

const fox=alive.find(

p=>p.roleId==="fox"

);

if(

fox &&

wolves.length===0

){

showWinner(

"🦊 妖狐の勝利！"

);

return true;

}

/*

   人狼全滅

*/

if(wolves.length===0){

showWinner(

"🎉 市民陣営の勝利！"

);

return true;

}

/*

   人狼優勢

*/

const nonWolf=alive.filter(

p=>!isWolf(p)

);

if(

wolves.length>=nonWolf.length

){

showWinner(

"🐺 人狼陣営の勝利！"

);

return true;

}

return false;

}

/* ==================================================

   勝利表示

================================================== */

function showWinner(text){

stopTimer();

$("day").classList.add("hidden");

$("night").classList.add("hidden");

$("gameReady").classList.add("hidden");

$("vote").classList.add("hidden");

$("voteResult").classList.add("hidden");

$("gameOver").classList.remove("hidden");

$("winner").textContent=text;

speak(text);

}
