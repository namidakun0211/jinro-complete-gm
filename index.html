<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:20px;

  text-align:center;

}

.container{

  max-width:680px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{

  margin-top:0;

}

input,button,select{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{

  display:none;

}

.info{

  font-size:18px;

  line-height:1.7;

}

.mode-box{

  display:flex;

  justify-content:center;

  gap:15px;

  margin:15px 0;

  flex-wrap:wrap;

}

.mode-option{

  border:2px solid #ddd;

  border-radius:15px;

  padding:15px;

  min-width:130px;

  cursor:pointer;

}

.mode-option.selected{

  border-color:#333;

  background:#f0f0f0;

}

.mode-option input{

  transform:scale(1.3);

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{

  color:green;

}

.ng{

  color:red;

}

.player-box{

  margin:15px 0;

}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:23px;

  font-weight:bold;

  margin-top:15px;

}

.lover-partner{

  font-size:20px;

  margin-top:8px;

}

.card-box{

  margin:20px 0;

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

}

.card-select{

  width:90%;

  max-width:450px;

}

.status{

  font-size:18px;

  font-weight:bold;

  margin:15px;

}

.warning{

  color:#c00;

  font-weight:bold;

}

.success{

  color:green;

  font-weight:bold;

}

.error-box{

  background:#fff0f0;

  border:2px solid #d33;

  border-radius:15px;

  padding:15px;

  margin:20px 0;

}

.night-box{

  background:#171729;

  color:white;

  border-radius:20px;

  padding:25px;

  margin-top:20px;

}

.night-title{

  font-size:28px;

  font-weight:bold;

  margin-bottom:15px;

}

.action-title{

  font-size:23px;

  font-weight:bold;

  margin:15px 0;

}

.result-box{

  background:white;

  color:#222;

  padding:18px;

  border-radius:15px;

  margin:15px 0;

  line-height:1.7;

}

.day-box{

  background:#fff8df;

  border:2px solid #e6c75a;

  border-radius:20px;

  padding:25px;

  margin-top:20px;

}

.dead{

  color:#999;

  text-decoration:line-through;

}

.alive{

  color:green;

  font-weight:bold;

}

.choice-list{

  display:flex;

  flex-direction:column;

  gap:8px;

  margin:15px 0;

}

.choice-list button{

  width:100%;

}

.small{

  font-size:14px;

  color:#777;

}

hr{

  border:none;

  border-top:1px solid #ddd;

  margin:25px 0;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- =========================

     ゲーム設定

========================= -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>🎮 ゲームモード</h3>

<div class="mode-box">

<label class="mode-option selected" id="modeNoCard">

<input

 type="radio"

 name="gameMode"

 value="noCard"

 checked

 onchange="changeGameMode()"

>

📱 カードなし

</label>

<label class="mode-option" id="modeCard">

<input

 type="radio"

 name="gameMode"

 value="card"

 onchange="changeGameMode()"

>

🃏 カードあり

</label>

</div>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>🎭 今回使う役職</h3>

<div id="totalDisplay" class="total ng">

配役：0 / 6人

</div>

<div id="roleList" class="role-list"></div>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- =========================

     プレイヤー名

========================= -->

<div id="playerSetup" class="hidden">

<h2>👥 プレイヤー名</h2>

<p>プレイヤーの名前を入力してください。</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- =========================

     カード入力

========================= -->

<div id="cardSetup" class="hidden">

<h2>🃏 カード登録</h2>

<div id="cardPlayerTitle"></div>

<div class="card-box">

<p class="info">

このプレイヤーに実際に配ったカードを選んでください。

</p>

<select

 id="cardSelect"

 class="card-select"

 onchange="cardSelectionChanged()"

>

<option value="">

配られたカードを選択してください

</option>

</select>

<div id="cardStatus" class="status"></div>

</div>

<button

 id="cardNextButton"

 onclick="confirmCard()"

 disabled

>

このカードで登録

</button>

</div>

<!-- =========================

     カード再確認

========================= -->

<div id="cardCheck" class="hidden">

<h2>🔍 カードを確認しています</h2>

<p class="info">

全員が入力したカードと、最初に設定した役職枚数を確認しています。

</p>

<div id="cardCheckResult"></div>

<button

 id="retryCardButton"

 onclick="retryCardInput()"

 class="hidden"

>

最初の人からもう一度入力

</button>

<button

 id="cardCheckNextButton"

 onclick="finishCardCheck()"

 class="hidden"

>

役職確認へ

</button>

</div>

<!-- =========================

     役職確認

========================= -->

<div id="game" class="hidden">

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

</div>

<div id="loverArea"></div>

<p id="info" class="info">

役職を見るボタンを押してください。

</p>

<div id="prophetFirstDayArea"></div>

<button

 id="mainButton"

 onclick="showRole()"

>

役職を見る

</button>

</div>

<!-- =========================

     昼の議論

========================= -->

<div id="dayDiscussion" class="hidden">

<div class="day-box">

<h2>☀️ 昼の議論</h2>

<div id="dayNumber"></div>

<p class="info">

役職確認・初日の預言結果を確認したら、  

全員で議論してください。

</p>

<div id="dayProphetResult"></div>

<hr>

<button onclick="finishDayDiscussion()">

🗣️ 議論終了

</button>

</div>

</div>

<!-- =========================

     夜

========================= -->

<div id="night" class="hidden">

<div class="night-box">

<div class="night-title">

🌙 夜の時間

</div>

<div id="nightStep"></div>

<div id="nightContent"></div>

</div>

</div>

<!-- =========================

     ゲーム終了

========================= -->

<div id="gameOver" class="hidden">

<h2>🏆 ゲーム結果</h2>

<div id="gameOverResult"></div>

</div>

</div>

<script>

/* ==================================================

   役職一覧

================================================== */

const ROLES = [

 ["werewolf","🐺 人狼"],

 ["wolfChild","👶 人狼の子ども"],

 ["betrayer","😈 裏切り者"],

 ["betrayShared","🤝 裏切りの共有者"],

 ["informant","👁️ 内通者"],

 ["betrayAttacker","⚔️ 裏切りの襲撃者"],

 ["spy","🕵️ スパイ"],

 ["villager","👤 市民"],

 ["seer","🔮 預言者"],

 ["bodyguard","🛡️ ボディーガード"],

 ["medium","👻 霊媒師"],

 ["hunter","🔫 ハンター"],

 ["shared","🤝 共有者"],

 ["dictator","👑 独裁者"],

 ["tough","💪 タフガイ"],

 ["counselor","🩺 カウンセラー"],

 ["magician","🎩 奇術師"],

 ["trapper","🪤 罠師"],

 ["knights","🛡️ 騎士団"],

 ["shadow","🪞 影武者"],

 ["king","👑 王様"],

 ["cursed","🧟 呪われた者"],

 ["fox","🦊 妖狐"],

 ["god","🙏 神様"],

 ["lover","❤️ 恋人"],

 ["loneWolf","🐺 一匹狼"],

 ["android","🤖 アンドロイド"],

 ["scarecrow","🌾 案山子"]

];

/* ==================================================

   変数

================================================== */

let roleCounts = {};

let players = [];

let selectedRoles = [];

let currentPlayer = 0;

let currentCardPlayer = 0;

let loverMode = false;

let gameMode = "noCard";

let dayNumber = 1;

let nightStepIndex = 0;

let nightData = {

 cursedTarget:null,

 spyDone:false,

 androidDone:false,

 trapTarget:null,

 guardTarget:null,

 knightTarget:null,

 wolfTarget:null,

 attackTarget:null,

 counselorTarget:null,

 magicianTarget:null,

 prophetTarget:null,

 mediumTarget:null

};

let firstDayProphetDone = false;

let firstDayProphetResult = "";

/* ==================================================

   ゲームモード

================================================== */

function changeGameMode(){

 gameMode =

   document.querySelector(

     'input[name="gameMode"]:checked'

   ).value;

 document

   .getElementById("modeNoCard")

   .classList.toggle(

     "selected",

     gameMode === "noCard"

   );

 document

   .getElementById("modeCard")

   .classList.toggle(

     "selected",

     gameMode === "card"

   );

}

/* ==================================================

   恋人モード

================================================== */

function updateLoverMode(){

 loverMode =

   document.querySelector(

     'input[name="loverMode"]:checked'

   ).value === "true";

 renderRoleList();

}

/* ==================================================

   役職人数初期化

================================================== */

function resetRoleCounts(){

 roleCounts = {};

 ROLES.forEach(role=>{

   roleCounts[role[0]] = 0;

 });

 renderRoleList();

}

/* ==================================================

   役職一覧

================================================== */

function renderRoleList(){

 const list =

   document.getElementById("roleList");

 list.innerHTML = "";

 ROLES.forEach(role=>{

   const id = role[0];

   const name = role[1];

   if(id === "lover" && loverMode){

     return;

   }

   const item =

     document.createElement("div");

   item.className = "role-item";

   item.innerHTML = `

    <div class="role-name">

      ${name}

    </div>

    <div class="counter">

      <button

       onclick="changeRoleCount('${id}',-1)"

      >

       −

      </button>

      <div

       class="count"

       id="count-${id}"

      >

       ${roleCounts[id] || 0}

      </div>

      <button

       onclick="changeRoleCount('${id}',1)"

      >

       ＋

      </button>

    </div>

   `;

   list.appendChild(item);

 });

 updateTotal();

}

/* ==================================================

   役職人数変更

================================================== */

function changeRoleCount(id,change){

 const playerCount =

   Number(

     document.getElementById(

       "playerCount"

     ).value

   );

 const current =

   roleCounts[id] || 0;

 const next =

   current + change;

 if(next < 0){

   return;

 }

 if(next > playerCount){

   return;

 }

 roleCounts[id] = next;

 const element =

   document.getElementById(

     "count-"+id

   );

 if(element){

   element.textContent = next;

 }

 updateTotal();

}

/* ==================================================

   合計人数

================================================== */

function updateTotal(){

 const playerCount =

   Number(

     document.getElementById(

       "playerCount"

     ).value

   );

 let total = 0;

 Object.entries(roleCounts)

 .forEach(([id,count])=>{

   if(id === "lover" && loverMode){

     return;

   }

   total += count;

 });

 const display =

   document.getElementById(

     "totalDisplay"

   );

 const button =

   document.getElementById(

     "nextButton"

   );

 display.textContent =

   `配役：${total} / ${playerCount}人`;

 if(total === playerCount){

   display.className =

     "total ok";

   button.disabled = false;

 }else{

   display.className =

     "total ng";

   button.disabled = true;

 }

}

/* ==================================================

   名前入力

================================================== */

function preparePlayers(){

 const count =

   Number(

     document.getElementById(

       "playerCount"

     ).value

   );

 if(count < 4 || count > 20){

   alert(

     "4人〜20人で入力してください。"

   );

   return;

 }

 let total = 0;

 Object.entries(roleCounts)

 .forEach(([id,c])=>{

   if(id === "lover" && loverMode){

     return;

   }

   total += c;

 });

 if(total !== count){

   alert(

     "参加人数と配役人数を同じにしてください。"

   );

   return;

 }

 selectedRoles = [];

 ROLES.forEach(role=>{

   const id = role[0];

   if(id === "lover" && loverMode){

     return;

   }

   const count =

     roleCounts[id] || 0;

   for(let i=0;i<count;i++){

     selectedRoles.push(id);

   }

 });

 const area =

   document.getElementById(

     "playerInputs"

   );

 area.innerHTML = "";

 for(let i=0;i<count;i++){

   const oldName =

     localStorage.getItem(

       "jinroPlayer"+i

     ) || "";

   area.innerHTML += `

    <div class="player-box">

     <label>

      プレイヤー${i+1}

     </label>

     <br>

     <input

      id="playerName${i}"

      type="text"

      maxlength="20"

      placeholder="名前を入力"

      value="${escapeHtml(oldName)}"

     >

    </div>

   `;

 }

 document

   .getElementById("setup")

   .classList.add("hidden");

 document

   .getElementById("playerSetup")

   .classList.remove("hidden");

}

/* ==================================================

   HTMLエスケープ

================================================== */

function escapeHtml(text){

 return String(text)

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}

/* ==================================================

   ゲーム開始

================================================== */

function startGame(){

 const names = [];

 for(let i=0;i<selectedRoles.length;i++){

   const input =

     document.getElementById(

       "playerName"+i

     );

   const name =

     input.value.trim();

   if(!name){

     alert(

       `プレイヤー${i+1}の名前を入力してください。`

     );

     input.focus();

     return;

   }

   names.push(name);

   localStorage.setItem(

     "jinroPlayer"+i,

     name

   );

 }

 players =

   names.map((name,index)=>{

     return {

       id:index,

       name:name,

       roleId:null,

       alive:true,

       lover:false,

       loverPartner:null,

       abilitiesUsed:{},

       lastTrapTarget:null,

       copiedRole:null,

       cursedAwakened:false,

       protected:false,

       trapped:false,

       nightAction:null,

       nightActionDone:false,

       killedTonight:false,

       toughHit:false

     };

   });

 if(gameMode === "noCard"){

   assignRandomRoles();

   finishRoleAssignment();

   return;

 }

 currentCardPlayer = 0;

 document

   .getElementById("playerSetup")

   .classList.add("hidden");

 document

   .getElementById("cardSetup")

   .classList.remove("hidden");

 showCardPlayer();

}

/* ==================================================

   ランダム配役

================================================== */

function assignRandomRoles(){

 const shuffledRoles =

   [...selectedRoles]

   .sort(

     ()=>Math.random()-0.5

   );

 players.forEach(

   (player,index)=>{

     player.roleId =

       shuffledRoles[index];

   }

 );

}

/* ==================================================

   カード入力

================================================== */

function showCardPlayer(){

 const player =

   players[currentCardPlayer];

 document

   .getElementById(

     "cardPlayerTitle"

   )

   .innerHTML =

   `<h3>${escapeHtml(player.name)} さん</h3>`;

 const select =

   document.getElementById(

     "cardSelect"

   );

 select.innerHTML =

   `<option value="">

     配られたカードを選択してください

   </option>`;

 ROLES.forEach(role=>{

   const id = role[0];

   if(id === "lover" && loverMode){

     return;

   }

   const option =

     document.createElement("option");

   option.value = id;

   option.textContent = role[1];

   select.appendChild(option);

 });

 document

   .getElementById(

     "cardStatus"

   )

   .textContent =

   "配られたカードを選択してください。";

 document

   .getElementById(

     "cardNextButton"

   )

   .disabled = true;

}

/* ==================================================

   カード選択

================================================== */

function cardSelectionChanged(){

 const value =

   document.getElementById(

     "cardSelect"

   ).value;

 document

   .getElementById(

     "cardNextButton"

   )

   .disabled =

   !value;

 if(value){

   document

     .getElementById(

       "cardStatus"

     )

     .textContent =

     "カードを登録できます。";

 }

}

/* ==================================================

   カード登録

================================================== */

function confirmCard(){

 const roleId =

   document.getElementById(

     "cardSelect"

   ).value;

 if(!roleId){

   return;

 }

 players[currentCardPlayer].roleId =

   roleId;

 currentCardPlayer++;

 if(currentCardPlayer < players.length){

   showCardPlayer();

   return;

 }

 document

   .getElementById("cardSetup")

   .classList.add("hidden");

 document

   .getElementById("cardCheck")

   .classList.remove("hidden");

 checkCards();

}

/* ==================================================

   カードチェック

================================================== */

function checkCards(){

 const enteredCounts = {};

 ROLES.forEach(role=>{

   enteredCounts[role[0]] = 0;

 });

 players.forEach(player=>{

   if(player.roleId){

     enteredCounts[player.roleId]++;

   }

 });

 let correct = true;

 let errorMessages = [];

 ROLES.forEach(role=>{

   const id = role[0];

   if(id === "lover" && loverMode){

     return;

   }

   const expected =

     roleCounts[id] || 0;

   const entered =

     enteredCounts[id] || 0;

   if(expected !== entered){

     correct = false;

     errorMessages.push(

       `${role[1]}：設定 ${expected}枚 / 入力 ${entered}枚`

     );

   }

 });

 const result =

   document.getElementById(

     "cardCheckResult"

   );

 if(correct){

   result.innerHTML = `

    <div class="success">

      🎉 カード登録完了！

    </div>

    <p>

      設定した役職と、入力したカードが一致しました。

    </p>

   `;

   document

     .getElementById(

       "cardCheckNextButton"

     )

     .classList.remove("hidden");

   document

     .getElementById(

       "retryCardButton"

     )

     .classList.add("hidden");

   return;

 }

 result.innerHTML = `

   <div class="error-box">

    <div class="warning">

      ❌ カードの枚数が一致しません。

    </div>

    <p>

      ${errorMessages.join("<br>")}

    </p>

    <p>

      最初のプレイヤーから、

      もう一度カードを入力してください。

    </p>

   </div>

 `;

 document

   .getElementById(

     "retryCardButton"

   )

   .classList.remove("hidden");

 document

   .getElementById(

     "cardCheckNextButton"

   )

   .classList.add("hidden");

}

/* ==================================================

   カードやり直し

================================================== */

function retryCardInput(){

 players.forEach(player=>{

   player.roleId = null;

 });

 currentCardPlayer = 0;

 document

   .getElementById("cardCheck")

   .classList.add("hidden");

 document

   .getElementById("cardSetup")

   .classList.remove("hidden");

 showCardPlayer();

}

/* ==================================================

   カード確認完了

================================================== */

function finishCardCheck(){

 document

   .getElementById("cardCheck")

   .classList.add("hidden");

 finishRoleAssignment();

}

/* ==================================================

   恋人決定

================================================== */

function finishRoleAssignment(){

 if(loverMode){

   assignRandomLovers();

 }

 currentPlayer = 0;

 document

   .getElementById("game")

   .classList.remove("hidden");

 showPlayer();

}

/* ==================================================

   恋人ランダム

================================================== */

function assignRandomLovers(){

 if(players.length < 2){

   return;

 }

 const indexes =

   players.map(

     (_,index)=>index

   );

 indexes.sort(

   ()=>Math.random()-0.5

 );

 const a = indexes[0];

 const b = indexes[1];

 players[a].lover = true;

 players[b].lover = true;

 players[a].loverPartner =

   players[b].name;

 players[b].loverPartner =

   players[a].name;

}

/* ==================================================

   プレイヤー表示

================================================== */

function showPlayer(){

 const player =

   players[currentPlayer];

 document

   .getElementById(

function targetButtons(

  excludeSelf,

  callback,

  allowDead=false

){

 let html =

   `<div class="choice-list">`;

 players.forEach(player=>{

   if(!allowDead && !player.alive){

     return;

   }

   if(

     excludeSelf &&

     player.id === currentActionPlayerId()

   ){

     return;

   }

   html += `

    <button

     onclick="${callback}(${player.id})"

    >

      ${escapeHtml(player.name)}

      ${player.alive ? "" : "（死亡）"}

    </button>

   `;

 });

 html += `</div>`;

 return html;

}

function currentActionPlayerId(){

 const step =

   NIGHT_STEPS[nightStepIndex];

 if(!step){

   return -1;

 }

 const p =

   players.find(

     p=>p.alive &&

     step.roles.includes(p.roleId)

   );

 return p ? p.id : -1;

}

/* ==================================================

   夜の結果処理

================================================== */

function resolveNightResults(){

 /*

   カウンセラーによる死亡

 */

 players.forEach(player=>{

   if(player.killedTonight){

     killPlayer(player);

   }

 });

 /*

   人狼襲撃

 */

 if(nightData.wolfTarget !== null){

   const target =

     players.find(

       p=>p.id===nightData.wolfTarget

     );

   if(target && target.alive){

     processAttack(target);

   }

 }

 /*

   裏切りの襲撃者

 */

 if(nightData.attackTarget !== null){

   const target =

     players.find(

       p=>p.id===nightData.attackTarget

     );

   if(target && target.alive){

     processAttack(target);

   }

 }

 /*

   呪われた者の覚醒

 */

 players.forEach(player=>{

   if(

     player.cursedAwakened

   ){

     player.roleId =

       "werewolf";

     player.cursedAwakened = false;

   }

 });

 /*

   恋人後追い

 */

 processLovers();

}

/* ==================================================

   襲撃処理

================================================== */

function processAttack(target){

 /*

   ボディーガード・騎士団

 */

 if(target.protected){

   return;

 }

 /*

   罠

 */

 if(target.trapped){

   const wolves =

     players.filter(

       p=>p.alive &&

       isWerewolfRole(p.roleId)

     );

   if(wolves.length > 0){

     const killer =

       wolves[

         Math.floor(

           Math.random() *

           wolves.length

         )

       ];

     killPlayer(killer);

   }

   return;

 }

 /*

   呪われた者

 */

 if(target.roleId==="cursed"){

   target.cursedAwakened = true;

   return;

 }

 /*

   妖狐

 */

 if(target.roleId==="fox"){

   return;

 }

 /*

   タフガイ

 */

 if(target.roleId==="tough"){

   if(!target.toughHit){

     target.toughHit = true;

     return;

   }

 }

 killPlayer(target);

}

/* ==================================================

   プレイヤー死亡

================================================== */

function killPlayer(player){

 if(!player || !player.alive){

   return;

 }

 player.alive = false;

 player.killedTonight = true;

}

/* ==================================================

   恋人処理

================================================== */

function processLovers(){

 const deadLovers =

   players.filter(

     p=>p.lover && !p.alive

   );

 if(deadLovers.length === 0){

   return;

 }

 deadLovers.forEach(dead=>{

   const partner =

     players.find(

       p=>

       p.lover &&

       p.name===dead.loverPartner &&

       p.alive

     );

   if(partner){

     partner.alive = false;

   }

 });

}

================================================== */

function showNextDay(){

 let dead = players

   .filter(

     p=>!p.alive

   )

   .map(

     p=>escapeHtml(p.name)

   );

 let html = "";

 if(dead.length){

   html = `

    <div class="result-box">

     ☀️ 夜が明けました。

     <p>

      昨夜の死亡者：

      <strong>

      ${dead.join("、")}

      </strong>

     </p>

    </div>

   `;

 }else{

   html = `

    <div class="result-box">

     ☀️ 夜が明けました。

     <p>

      昨夜の死亡者はいません。

     </p>

    </div>

   `;

 }

 document

   .getElementById(

     "dayNumber"

   )

   .innerHTML =

   `<h3>第${dayNumber}日目</h3>`;

 document

   .getElementById(

     "dayProphetResult"

   )

   .innerHTML =

   html;

}

/* ==================================================

   陣営判定

================================================== */

function isWerewolfRole(roleId){

 return [

   "werewolf",

   "wolfChild",

   "loneWolf"

 ].includes(roleId);

}

function isBetrayerRole(roleId){

 return [

   "betrayer",

   "betrayShared",

   "informant",

   "betrayAttacker"

 ].includes(roleId);

}

function isEvilRole(roleId){

 return (

   isWerewolfRole(roleId) ||

   isBetrayerRole(roleId)

 );

}

 const role =

   ROLES.find(

     r=>r[0]===id

   );

 return role

   ? role[1]

   : "不明";

}
