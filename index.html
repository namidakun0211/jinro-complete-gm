<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

body{

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

  background:#f5f5f5;

  margin:0;

  padding:15px;

  text-align:center;

}

.container{

  max-width:680px;

  margin:auto;

  background:white;

  padding:22px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.15);

}

h1{margin-top:0}

input,button,select{

  font-size:18px;

  padding:10px;

  margin:6px;

  border-radius:10px;

  border:1px solid #ccc;

}

button{

  cursor:pointer;

  background:#333;

  color:white;

  border:none;

}

button:disabled{

  background:#aaa;

  cursor:not-allowed;

}

.hidden{display:none!important}

.info{

  font-size:18px;

  line-height:1.7;

}

.mode-box{

  display:flex;

  justify-content:center;

  gap:15px;

  margin:15px 0;

  flex-wrap:wrap;

}

.mode-option{

  border:2px solid #ddd;

  border-radius:15px;

  padding:15px;

  min-width:130px;

  cursor:pointer;

}

.mode-option.selected{

  border-color:#333;

  background:#f0f0f0;

}

.role-list{

  text-align:left;

  max-height:500px;

  overflow-y:auto;

  border:1px solid #ddd;

  padding:10px;

  border-radius:10px;

}

.role-item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:10px 5px;

  border-bottom:1px solid #eee;

  gap:5px;

}

.role-name{

  flex:1;

  font-size:17px;

}

.counter{

  display:flex;

  align-items:center;

  gap:3px;

}

.counter button{

  width:42px;

  height:42px;

  padding:0;

  margin:0;

  font-size:24px;

}

.count{

  width:35px;

  text-align:center;

  font-size:20px;

  font-weight:bold;

}

.total{

  font-size:22px;

  font-weight:bold;

  margin:15px 0;

}

.ok{color:green}

.ng{color:red}

.player-box{margin:15px 0}

.role{

  font-size:30px;

  font-weight:bold;

  margin:25px 0;

}

.lover{

  color:#d63384;

  font-size:23px;

  font-weight:bold;

  margin-top:15px;

}

.wolf-info{

  color:#555;

  font-size:20px;

  font-weight:bold;

  margin-top:15px;

}

.card-box,.action-box{

  margin:20px 0;

  padding:20px;

  border:2px solid #ddd;

  border-radius:15px;

}

.card-select{

  width:90%;

  max-width:450px;

}

.status{

  font-size:18px;

  font-weight:bold;

  margin:15px;

}

.warning{

  color:#c00;

  font-weight:bold;

}

.success{

  color:green;

  font-weight:bold;

}

.error-box{

  background:#fff0f0;

  border:2px solid #d33;

  border-radius:15px;

  padding:15px;

  margin:20px 0;

}

.choice{

  display:block;

  width:90%;

  max-width:500px;

  margin:10px auto;

}

.result{

  font-size:24px;

  font-weight:bold;

  margin:20px;

}

.vote-player{

  padding:15px;

  margin:10px 0;

  border:2px solid #ddd;

  border-radius:12px;

}

.vote-player select{

  width:90%;

  max-width:400px;

}

.timer{

  font-size:64px;

  font-weight:bold;

  margin:20px;

}

.timer.running{

  animation:pulse 1s infinite;

}

@keyframes pulse{

  50%{opacity:.5}

}

.timer-buttons button{

  min-width:120px;

}

.gm-message{

  background:#f0f0f0;

  border-radius:15px;

  padding:20px;

  margin:20px 0;

  font-size:22px;

  line-height:1.6;

  font-weight:bold;

}

.small{

  font-size:14px;

  color:#666;

}

hr{

  border:none;

  border-top:1px solid #ddd;

  margin:25px 0;

}

.dead{

  text-decoration:line-through;

  color:#888;

}

.special{

  background:#fff8df;

  border:2px solid #e0c45c;

  padding:15px;

  border-radius:15px;

  margin:15px 0;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<!-- =========================

ゲーム設定

========================= -->

<div id="setup">

<h2>🎮 ゲーム設定</h2>

<p>参加人数を入力してください</p>

<input

 id="playerCount"

 type="number"

 min="4"

 max="20"

 value="6"

 onchange="resetRoleCounts()"

>

<h3>🎮 ゲームモード</h3>

<div class="mode-box">

<label class="mode-option selected" id="modeNoCard">

<input

 type="radio"

 name="gameMode"

 value="noCard"

 checked

 onchange="changeGameMode()"

>

📱 カードなし

</label>

<label class="mode-option" id="modeCard">

<input

 type="radio"

 name="gameMode"

 value="card"

 onchange="changeGameMode()"

>

🃏 カードあり

</label>

</div>

<h3>❤️ 恋人の役職兼用</h3>

<label>

<input

 type="radio"

 name="loverMode"

 value="false"

 checked

 onchange="updateLoverMode()"

>

なし

</label>

<label>

<input

 type="radio"

 name="loverMode"

 value="true"

 onchange="updateLoverMode()"

>

あり

</label>

<h3>⏱️ 昼の議論時間</h3>

<select id="discussionMinutes">

<option value="1">1分</option>

<option value="3" selected>3分</option>

<option value="5">5分</option>

<option value="10">10分</option>

<option value="15">15分</option>

</select>

<h3>🎭 今回使う役職</h3>

<div id="totalDisplay" class="total ng">

配役：0 / 6人

</div>

<div id="roleList" class="role-list"></div>

<br>

<button

 id="nextButton"

 onclick="preparePlayers()"

 disabled

>

プレイヤー名を入力

</button>

</div>

<!-- =========================

プレイヤー名

========================= -->

<div id="playerSetup" class="hidden">

<h2>👥 プレイヤー名</h2>

<p>プレイヤーの名前を入力してください。</p>

<div id="playerInputs"></div>

<button onclick="startGame()">

ゲーム開始

</button>

</div>

<!-- =========================

カード

========================= -->

<div id="cardSetup" class="hidden">

<h2>🃏 カード登録</h2>

<div id="cardPlayerTitle"></div>

<div class="card-box">

<p class="info">

このプレイヤーに実際に配ったカードを選択してください。

</p>

<select id="cardSelect" class="card-select"

onchange="cardSelectionChanged()">

<option value="">

配られたカードを選択してください

</option>

</select>

<div id="cardStatus" class="status"></div>

</div>

<button

 id="cardNextButton"

 onclick="confirmCard()"

 disabled

>

このカードで登録

</button>

</div>

<!-- =========================

カード確認

========================= -->

<div id="cardCheck" class="hidden">

<h2>🔍 カードを確認しています</h2>

<div id="cardCheckResult"></div>

<button

 id="retryCardButton"

 onclick="retryCardInput()"

 class="hidden"

>

最初の人からもう一度入力

</button>

<button

 id="cardCheckNextButton"

 onclick="finishCardCheck()"

 class="hidden"

>

役職確認へ

</button>

</div>

<!-- =========================

役職確認

========================= -->

<div id="game" class="hidden">

<h2 id="playerTitle"></h2>

<div id="roleArea" class="role">

？？？

</div>

<div id="loverArea"></div>

<p id="info" class="info">

役職を見るボタンを押してください。

</p>

<button id="mainButton" onclick="showRole()">

役職を見る

</button>

</div>

<!-- =========================

夜前・初日占い

========================= -->

<div id="initialNight" class="hidden">

<h2>🌙 ゲーム開始</h2>

<div id="initialNightContent"></div>

</div>

<!-- =========================

昼

========================= -->

<div id="day" class="hidden">

<h2>☀️ 昼の議論</h2>

<div id="dayInfo" class="info"></div>

<div id="dayDeaths"></div>

<hr>

<div id="timer" class="timer">

03:00

</div>

<div class="timer-buttons">

<button onclick="startTimer()">

▶️ 議論開始

</button>

<button onclick="pauseTimer()">

⏸️ 一時停止

</button>

<button onclick="resetTimer()">

🔄 リセット

</button>

</div>

<br>

<button onclick="endDiscussion()">

⏭️ 議論を終えて投票へ

</button>

</div>

<!-- =========================

投票

========================= -->

<div id="vote" class="hidden">

<h2>🗳️ 投票</h2>

<div id="voteSpecial"></div>

<p id="voteInstruction" class="info"></p>

<div id="votePlayers"></div>

<button onclick="finishVoting()">

⚖️ 投票を集計する

</button>

</div>

<!-- =========================

投票結果

========================= -->

<div id="voteResult" class="hidden">

<h2>⚖️ 投票結果</h2>

<div id="voteResultText" class="info"></div>

<button onclick="afterVote()">

次へ

</button>

</div>

<!-- =========================

夜開始

========================= -->

<div id="gameReady" class="hidden">

<h2>🌙 夜の時間</h2>

<p class="info">

昼の議論と投票が終了しました。

</p>

<button onclick="startNight()">

🌙 夜を開始

</button>

</div>

<!-- =========================

夜

========================= -->

<div id="night" class="hidden">

<h2 id="nightTitle">🌙 夜</h2>

<div id="nightInfo" class="info"></div>

<div id="nightAction" class="action-box"></div>

</div>

<!-- =========================

ゲーム終了

========================= -->

<div id="gameOver" class="hidden">

<h2>🏆 ゲーム終了</h2>

<div id="winner" class="result"></div>

</div>

<script>

/* ==================================================

役職

================================================== */

const ROLES=[

["werewolf","🐺 人狼"],

["wolfChild","👶 人狼の子ども"],

["betrayer","😈 裏切り者"],

["betrayShared","🤝 裏切りの共有者"],

["informant","👁️ 内通者"],

["betrayAttacker","⚔️ 裏切りの襲撃者"],

["spy","🕵️ スパイ"],

["villager","👤 市民"],

["seer","🔮 預言者"],

["bodyguard","🛡️ ボディーガード"],

["medium","👻 霊媒師"],

["hunter","🔫 ハンター"],

["shared","🤝 共有者"],

["dictator","👑 独裁者"],

["tough","💪 タフガイ"],

["counselor","🩺 カウンセラー"],

["magician","🎩 奇術師"],

["trapper","🪤 罠師"],

["knights","🛡️ 騎士団"],

["shadow","🪞 影武者"],

["king","👑 王様"],

["cursed","🧟 呪われた者"],

["fox","🦊 妖狐"],

["god","🙏 神様"],

["lover","❤️ 恋人"],

["loneWolf","🐺 一匹狼"],

["android","🤖 アンドロイド"],

["scarecrow","🌾 案山子"]

];

const WOLF_ROLES=[

"werewolf",

"wolfChild",

"loneWolf"

];

const BETRAYER_ROLES=[

"betrayer",

"betrayShared",

"informant",

"betrayAttacker"

];

/* ==================================================

変数

================================================== */

let roleCounts={};

let players=[];

let selectedRoles=[];

let currentPlayer=0;

let currentCardPlayer=0;

let loverMode=false;

let gameMode="noCard";

let day=1;

let nightStep=0;

let nightData={};

let voteData={};

let discussionSeconds=180;

let timerInterval=null;

let dictatorChoice=null;

let shadowActive=false;

let lastDeaths=[];

let previousVoteDeath=null;

/* ==================================================

基本

================================================== */

function $(id){

return document.getElementById(id);

}

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

function getRoleName(id){

const r=ROLES.find(x=>x[0]===id);

return r?r[1]:"不明";

}

function isWolf(p){

return WOLF_ROLES.includes(p.roleId);

}

function isBetrayer(p){

return BETRAYER_ROLES.includes(p.roleId);

}

function alivePlayers(){

return players.filter(p=>p.alive);

}

function getTargets(exclude=null){

return alivePlayers().filter(p=>p.id!==exclude);

}

/* ==================================================

GM音声

================================================== */

function speak(text){

if(!("speechSynthesis" in window)) return;

window.speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.lang="ja-JP";

u.rate=.9;

u.pitch=1;

window.speechSynthesis.speak(u);

}

function gm(text){

$("nightInfo").textContent=text;

speak(text);

}

function gmBox(text){

$("initialNightContent").innerHTML=

`<div class="gm-message">${text}</div>`;

speak(text);

}

/* ==================================================

モード

================================================== */

function changeGameMode(){

gameMode=document.querySelector(

'input[name="gameMode"]:checked'

).value;

$("modeNoCard").classList.toggle(

"selected",

gameMode==="noCard"

);

$("modeCard").classList.toggle(

"selected",

gameMode==="card"

);

}

function updateLoverMode(){

loverMode=document.querySelector(

'input[name="loverMode"]:checked'

).value==="true";

renderRoleList();

}

/* ==================================================

役職設定

================================================== */

function resetRoleCounts(){

roleCounts={};

ROLES.forEach(r=>{

roleCounts[r[0]]=0;

});

renderRoleList();

}

function renderRoleList(){

const list=$("roleList");

list.innerHTML="";

ROLES.forEach(r=>{

if(r[0]==="lover" && loverMode)return;

list.innerHTML+=`

<div class="role-item">

<div class="role-name">${r[1]}</div>

<div class="counter">

<button onclick="changeRoleCount('${r[0]}',-1)">−</button>

<div class="count">${roleCounts[r[0]]||0}</div>

<button onclick="changeRoleCount('${r[0]}',1)">＋</button>

</div>

</div>

`;

});

updateTotal();

}

function changeRoleCount(id,n){

const max=Number($("playerCount").value);

const next=(roleCounts[id]||0)+n;

if(next<0)return;

if(next>max)return;

roleCounts[id]=next;

renderRoleList();

}

function updateTotal(){

const max=Number($("playerCount").value);

let total=0;

Object.entries(roleCounts).forEach(([id,n])=>{

if(id==="lover" && loverMode)return;

total+=n;

});

$("totalDisplay").textContent=

`配役：${total} / ${max}人`;

$("totalDisplay").className=

"total "+(total===max?"ok":"ng");

$("nextButton").disabled=total!==max;

}

/* ==================================================

プレイヤー準備

================================================== */

function preparePlayers(){

const count=Number($("playerCount").value);

selectedRoles=[];

ROLES.forEach(r=>{

if(r[0]==="lover" && loverMode)return;

for(let i=0;i<(roleCounts[r[0]]||0);i++){

selectedRoles.push(r[0]);

}

});

$("playerInputs").innerHTML="";

for(let i=0;i<count;i++){

const old=localStorage.getItem(

"jinroPlayer"+i

)||"";

$("playerInputs").innerHTML+=`

<div class="player-box">

<label>プレイヤー${i+1}</label><br>

<input

id="playerName${i}"

type="text"

maxlength="20"

placeholder="名前を入力"

value="${escapeHtml(old)}"

>

</div>

`;

}

$("setup").classList.add("hidden");

$("playerSetup").classList.remove("hidden");

}

/* ==================================================

ゲーム開始

================================================== */

function startGame(){

const names=[];

for(let i=0;i<selectedRoles.length;i++){

const input=$("playerName"+i);

const name=input.value.trim();

if(!name){

alert(`プレイヤー${i+1}の名前を入力してください。`);

input.focus();

return;

}

names.push(name);

localStorage.setItem(

"jinroPlayer"+i,

name

);

}

players=names.map((name,id)=>({

id,

name,

roleId:null,

alive:true,

lover:false,

loverPartner:null,

abilitiesUsed:{},

cursedAwakened:false,

toughHit:false,

lastDeathReason:null,

androidCopy:null,

spyUsed:{}

}));

if(gameMode==="noCard"){

assignRandomRoles();

finishRoleAssignment();

}else{

currentCardPlayer=0;

$("playerSetup").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

}

/* ==================================================

ランダム配役

================================================== */

function assignRandomRoles(){

const shuffled=[...selectedRoles]

.sort(()=>Math.random()-.5);

players.forEach((p,i)=>{

p.roleId=shuffled[i];

});

}

/* ==================================================

カード

================================================== */

function showCardPlayer(){

const p=players[currentCardPlayer];

$("cardPlayerTitle").innerHTML=

`<h3>${escapeHtml(p.name)} さん</h3>`;

$("cardSelect").innerHTML=

`<option value="">配られたカードを選択してください</option>`;

ROLES.forEach(r=>{

if(r[0]==="lover" && loverMode)return;

const o=document.createElement("option");

o.value=r[0];

o.textContent=r[1];

$("cardSelect").appendChild(o);

});

$("cardNextButton").disabled=true;

}

function cardSelectionChanged(){

$("cardNextButton").disabled=

!$("cardSelect").value;

}

function confirmCard(){

const role=$("cardSelect").value;

if(!role)return;

players[currentCardPlayer].roleId=role;

currentCardPlayer++;

if(currentCardPlayer<players.length){

showCardPlayer();

return;

}

$("cardSetup").classList.add("hidden");

$("cardCheck").classList.remove("hidden");

checkCards();

}

function checkCards(){

const entered={};

ROLES.forEach(r=>entered[r[0]]=0);

players.forEach(p=>{

if(p.roleId)entered[p.roleId]++;

});

let correct=true;

let messages=[];

ROLES.forEach(r=>{

if(r[0]==="lover" && loverMode)return;

const expected=roleCounts[r[0]]||0;

const actual=entered[r[0]]||0;

if(expected!==actual){

correct=false;

messages.push(

`${r[1]}：設定 ${expected}枚 / 入力 ${actual}枚`

);

}

});

if(correct){

$("cardCheckResult").innerHTML=`

<div class="success">🎉 カード登録完了！</div>

<p>設定した配役とカードが一致しました。</p>

`;

$("cardCheckNextButton").classList.remove("hidden");

$("retryCardButton").classList.add("hidden");

}else{

$("cardCheckResult").innerHTML=`

<div class="error-box">

<div class="warning">

❌ カードの枚数が一致しません。

</div>

<p>${messages.join("<br>")}</p>

</div>

`;

$("retryCardButton").classList.remove("hidden");

$("cardCheckNextButton").classList.add("hidden");

}

}

function retryCardInput(){

players.forEach(p=>p.roleId=null);

currentCardPlayer=0;

$("cardCheck").classList.add("hidden");

$("cardSetup").classList.remove("hidden");

showCardPlayer();

}

function finishCardCheck(){

$("cardCheck").classList.add("hidden");

finishRoleAssignment();

}

/* ==================================================

役職決定

================================================== */

function finishRoleAssignment(){

if(loverMode){

const shuffled=[...players]

.sort(()=>Math.random()-.5);

const a=shuffled[0];

const b=shuffled[1];

a.lover=true;

b.lover=true;

a.loverPartner=b.name;

b.loverPartner=a.name;

}

/* 裏切りの共有者 */

const betrayShared=players.filter(

p=>p.roleId==="betrayShared"

);

if(betrayShared.length>1){

const names=betrayShared

.map(p=>escapeHtml(p.name))

.join("、");

betrayShared.forEach(p=>{

p.sharedPartners=names;

});

}

/* 共有者 */

const shared=players.filter(

p=>p.roleId==="shared"

);

if(shared.length>1){

const names=shared

.map(p=>escapeHtml(p.name))

.join("、");

shared.forEach(p=>{

p.sharedPartners=names;

});

}

/* 案山子 */

const scare=players.filter(

p=>p.roleId==="scarecrow"

);

if(scare.length>1){

const names=scare

.map(p=>escapeHtml(p.name))

.join("、");

scare.forEach(p=>{

p.sharedPartners=names;

});

}

currentPlayer=0;

$("game").classList.remove("hidden");

showPlayer();

}

/* ==================================================

役職確認

================================================== */

function showPlayer(){

const p=players[currentPlayer];

$("playerTitle").textContent=

`${p.name} さん`;

$("roleArea").textContent="？？？";

$("loverArea").innerHTML="";

$("info").textContent=

"役職を見るボタンを押してください。";

$("mainButton").style.display="inline-block";

$("mainButton").textContent="役職を見る";

$("mainButton").onclick=showRole;

}

function showRole(){

const p=players[currentPlayer];

$("roleArea").textContent=

getRoleName(p.roleId);

let extra="";

if(p.lover){

extra+=`

<div class="lover">❤️ 恋人</div>

<div>恋人：${escapeHtml(p.loverPartner)}</div>

`;

}

if(isWolf(p)){

const wolves=players.filter(

x=>x.id!==p.id && isWolf(x)

);

if(wolves.length){

extra+=`

<div class="wolf-info">🐺 人狼仲間</div>

<div>

${wolves.map(x=>escapeHtml(x.name)).join("<br>")}

</div>

`;

}

}

/* 内通者 */

if(p.roleId==="informant"){

const wolves=players.filter(x=>isWolf(x));

if(wolves.length){

extra+=`

function setDiscussionTimer(){

clearInterval(timerInterval);

const minutes=

Number($("discussionMinutes").value);

discussionSeconds=minutes*60;

renderTimer();

}

function renderTimer(){

const m=Math.floor(discussionSeconds/60)

.toString().padStart(2,"0");

const s=(discussionSeconds%60)

.toString().padStart(2,"0");

$("timer").textContent=`${m}:${s}`;

}

function startTimer(){

if(timerInterval)return;

$("timer").classList.add("running");

timerInterval=setInterval(()=>{

if(discussionSeconds<=0){

clearInterval(timerInterval);

timerInterval=null;

$("timer").classList.remove("running");

speak("議論時間終了です。投票へ進んでください。");

return;

}

discussionSeconds--;

renderTimer();

},1000);

}

function pauseTimer(){

clearInterval(timerInterval);

timerInterval=null;

$("timer").classList.remove("running");

}

function resetTimer(){

pauseTimer();

setDiscussionTimer();

}

pauseTimer();

/* ==================================================

勝利判定

================================================== */

function checkWin(){

const alive=alivePlayers();

const wolves=alive.filter(p=>isWolf(p));

/* 神様 */

const god=alive.find(

p=>p.roleId==="god"

);

if(god && alive.length===1){

showWinner("🙏 神様の単独勝利！");

return true;

}

/* 恋人 */

const lovers=alive.filter(p=>p.lover);

if(lovers.length===2 &&

lovers[0].loverPartner===lovers[1].name &&

alive.length===2){

showWinner("❤️ 恋人の単独勝利！");

return true;

}

/* 案山子 */

const scare=players.filter(

p=>p.roleId==="scarecrow"

);

if(

scare.length>0 &&

scare.every(p=>!p.alive)

){

showWinner("🌾 案山子の単独勝利！");

return true;

}

/* 一匹狼 */

const lone=alive.filter(

p=>p.roleId==="loneWolf"

);

if(

lone.length===1 &&

wolves.length===1 &&

alive.length===1

){

showWinner("🐺 一匹狼の単独勝利！");

return true;

}

/* 人狼全滅 */

if(wolves.length===0){

showWinner("🎉 市民陣営の勝利！");

return true;

}

/* 一匹狼以外の人狼勝利 */

const nonWolf=alive.filter(

p=>!isWolf(p)

);

if(wolves.length>=nonWolf.length){

if(lone.length===1 && wolves.length===1){

showWinner("🐺 一匹狼の単独勝利！");

}else{

showWinner("🐺 人狼陣営の勝利！");

}

return true;

}

return false;

}

function showTargetButtons(title,targets,fn){

class="choice"

>

/* ==================================================

夜終了

================================================== */

function finishNight(){

let attacks=[...nightData.wolfAttack];

if(nightData.betrayAttack!==null){

attacks.push(nightData.betrayAttack);

}

/* 奇術師は人狼系だけ変更 */

if(nightData.changedTarget!==null){

attacks=[nightData.changedTarget];

}

if(nightData.childBonus){

attacks.push(...nightData.wolfAttack);

}

const deadThisNight=[];

attacks.forEach(id=>{

const target=players.find(

p=>p.id===id

);

if(!target||!target.alive)return;

/* 妖狐 */

if(target.roleId==="fox")return;

/* ボディーガード */

if(nightData.bodyguard===target.id)return;

/* 騎士団 */

if(nightData.knights===target.id)return;

/* 罠 */

if(nightData.trap===target.id){

const wolves=players.filter(

p=>isWolf(p)&&p.alive

);

if(wolves.length){

const w=

wolves[Math.floor(Math.random()*wolves.length)];

w.alive=false;

w.lastDeathReason="trap";

deadThisNight.push(w);

}

return;

}

/* 呪われた者 */

if(target.roleId==="cursed"){

target.cursedAwakened=true;

return;

}

/* タフガイ */

if(

target.roleId==="tough" &&

!target.toughHit

){

target.toughHit=true;

return;

}

/* 通常死亡 */

target.alive=false;

target.lastDeathReason="night";

deadThisNight.push(target);

});

/* 妖狐が占われて死亡 */

players.forEach(p=>{

if(

p.roleId==="fox" &&

!p.alive &&

p.lastDeathReason==="seer"

){

if(!deadThisNight.includes(p)){

deadThisNight.push(p);

}

}

});

/* 恋人後追い */

players.forEach(p=>{

if(!p.alive&&p.lover){

const partner=players.find(

x=>x.name===p.loverPartner&&x.alive

);

if(partner){

partner.alive=false;

partner.lastDeathReason="lover";

if(!deadThisNight.includes(partner)){

deadThisNight.push(partner);

}

}

}

});

$("night").classList.add("hidden");

if(checkWin())return;

day++;

previousVoteDeath=null;

showDay(deadThisNight);

}
