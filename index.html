<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐺 人狼コンプリートGM</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f4f4;color:#222}
.container{max-width:720px;margin:auto}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #0002}
h1,h2,h3{text-align:center}
button{border:0;border-radius:12px;padding:12px 16px;margin:5px;font-size:16px;background:#333;color:#fff;touch-action:manipulation}
button:disabled{opacity:.4}
.blue{background:#365f91}.green{background:#39734a}.orange{background:#a66a00}.red{background:#a33}
.name-button{display:block;width:92%;margin:8px auto;font-size:18px}
.role-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:7px 0}
.role-row>span:first-child{flex:1;text-align:left}
.count{display:inline-block;min-width:30px;text-align:center;font-weight:bold}
.total-count{text-align:center;font-size:22px;font-weight:bold;margin:12px}
.progress{text-align:center;font-weight:bold;font-size:18px;margin:8px}
.big{text-align:center;font-size:27px;font-weight:bold;margin:10px}
.timer{text-align:center;font-size:42px;font-weight:bold;margin:12px}
.small{font-size:13px;color:#666}
.center{text-align:center}
.private{background:#fff7d6}
.wake{text-align:center;font-size:24px;font-weight:bold;padding:18px}
.result{background:#e8f7e8;border-radius:12px;padding:14px;margin:10px 0}
.warning{background:#fff3cd;border-radius:12px;padding:14px;margin:10px 0}
.danger{background:#ffe5e5;border-radius:12px;padding:14px;margin:10px 0}
input,select{font-size:17px;padding:9px;border-radius:9px;border:1px solid #bbb;max-width:100%}
.player-count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.player-count-button{width:100%;margin:0;padding:14px 6px;font-size:17px}
.selected-count{text-align:center;font-size:24px;font-weight:bold;margin:12px}
.small-button{display:block;margin:8px auto;background:#666;font-size:14px}
label{display:block;margin:10px 0}
hr{border:0;border-top:1px solid #ddd;margin:18px 0}
</style>
</head>
<body>
<div class="container"><h1>🐺 人狼コンプリートGM</h1><div id="app"></div></div>
<script>
"use strict";

/* ===== 8/20確定役職 ===== */
const ROLES=[
"人狼","人狼の子ども","裏切り者","裏切りの共有者","内通者","裏切りの襲撃者",
"スパイ","市民","予言者","ボディーガード","霊媒師","ハンター","共有者","独裁者",
"タフガイ","カウンセラー","奇術師","罠師","騎士団","影武者","王様","呪われた者",
"妖狐","神様","恋人","一匹狼","アンドロイド","案山子"
];
const WOLF=["人狼","人狼の子ども","一匹狼"];
const BETRAYER=["裏切り者","裏切りの共有者","内通者","裏切りの襲撃者"];
const ORDER=["裏切り者確認","スパイ","人狼の子ども","人狼","裏切りの襲撃者","ボディーガード","騎士団","罠師","カウンセラー","予言者","霊媒師","奇術師","アンドロイド"];

let game={
 players:[],roleCount:{},loverMode:"off",cardMode:false,
 day:0,night:0,confirmIndex:0,confirmRevealed:false,
 firstSeer:true,firstSeerDone:false,discussionTime:300,discussionTimer:null,
 nightIndex:0,wolfTargets:[],wolfTarget:null,raiderTarget:null,guardTarget:null,
 knightTarget:null,trapTarget:null,lastTrap:null,trapActive:false,trapOwner:null,
 counselTarget:null,magicTarget:null,magicUsed:false,childRage:false,
 blockedRoles:{},blockedPlayers:{},convertedThisNight:[],nightDeaths:[],
 lastExiled:null,lastMedium:null,lastGuard:null,lastHunter:false,
 loverPairs:[],android:{},cursedWolf:{},toughPending:[],gameOver:false,voteRound:0,
 dictatorUsed:false,shadowUsed:false,firstDay:true
};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const living=()=>game.players.filter(p=>p.alive);
const get=id=>game.players.find(p=>p.id===Number(id));
const rolePlayers=r=>game.players.filter(p=>p.role===r);
const hasRole=r=>rolePlayers(r).length>0;
const isWolf=r=>WOLF.includes(r);
const isBetrayer=r=>BETRAYER.includes(r);
function render(h){app.innerHTML=h}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=1;speechSynthesis.speak(u)}}
function fmt(s){let m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")}
function blocked(role,playerId=null){return !!game.blockedRoles[role] || (playerId!=null&&!!game.blockedPlayers[playerId])}
function setBlock(role,pid){game.blockedRoles[role]=true;game.blockedPlayers[pid]=true}
function aliveRole(r){return rolePlayers(r).some(p=>p.alive)}
function random(a){return a[Math.floor(Math.random()*a.length)]}

/* ===== 起動 ===== */
function initializeGame(){
  game.roleCount={};
  ROLES.forEach(r=>game.roleCount[r]=0);
  titleScreen();
}
function titleScreen(){
 render(`<div class="card"><div class="big">🐺</div><h2>人狼コンプリートGM</h2><p class="center">8/20確定仕様版・GM進行アプリ</p></div>
 <button class="blue" onclick="startScreen()">🎮 ゲームを始める</button>`);
}

/* ===== 設定・役職選択 ===== */
function startScreen(){
 render(`<div class="card"><h2>👥 プレイヤー人数を選択</h2>
 <p class="center">参加する人数を選んでください。</p>
 <div class="player-count-grid">
 ${Array.from({length:25},(_,i)=>{const n=i+4;return `<button class="name-button player-count-button" onclick="selectPlayerCount(${n})">${n}人</button>`}).join("")}
 </div></div>`);
}
function selectPlayerCount(n){
 game.playerCount=Number(n);
 game.roleCount={};
 showGameSettings();
}
function showGameSettings(){
 const pc=Number(game.playerCount||4);
 render(`<div class="card"><h2>🎮 ゲーム設定</h2>
 <div class="selected-count">👥 ${pc}人でプレイ</div>
 <button class="small-button" onclick="startScreen()">人数を変更</button>
 <label>🔮 初日の予言
 <select id="firstSeer"><option value="yes">する</option><option value="no">しない</option></select></label>
 <label>⏱️ 議論時間
 <select id="discussion"><option value="60">1分</option><option value="180">3分</option><option value="300" selected>5分</option><option value="600">10分</option><option value="900">15分</option><option value="0">なし</option></select></label>
 <label>❤️ 恋人
 <select id="loverMode"><option value="off">恋人カードのみ</option><option value="on">他の役職と兼用</option></select></label></div>
 <div class="card"><h2>🃏 役職選択</h2><div id="roleTotal" class="total-count">0 / ${pc}</div><div id="roleList">
 ${ROLES.map((r,i)=>`<div class="role-row"><span>${esc(r)}</span><span><button type="button" onclick="changeRole(${JSON.stringify(r)},-1)">−</button><span class="count" id="c${i}">0</span><button type="button" onclick="changeRole(${JSON.stringify(r)},1)">＋</button></span></div>`).join("")}
 </div></div>
 <button class="green" onclick="goNames()">👤 プレイヤー名入力へ</button>`);
 updateTotal();
}
function updateTotal(){
 const pc=Number(game.playerCount||document.getElementById("playerCount")?.value||4);
 const total=Object.values(game.roleCount||{}).reduce((a,b)=>a+Number(b||0),0);
 const e=document.getElementById("roleTotal"); if(e)e.textContent=`${total} / ${pc}`;
}
function changeRole(role,d){
 let v=(game.roleCount[role]||0)+d;
 if(v<0)v=0;
 if(role==="恋人")v=Math.min(v,2);
 if(role==="共有者")v=Math.min(v,2);
 if(role==="裏切りの共有者")v=Math.min(v,2);
 if(role==="騎士団")v=Math.min(v,3);
 if(role==="案山子")v=Math.min(v,3);
 const pc=Number(game.playerCount||4);
 const total=Object.values(game.roleCount).reduce((a,b)=>a+Number(b||0),0);
 if(d>0&&total>=pc)return;
 game.roleCount[role]=v;
 const i=ROLES.indexOf(role),e=document.getElementById("c"+i);if(e)e.textContent=v;
 updateTotal();
}

/* ===== 名前・カード ===== */
function goNames(){
 const pc=Number(game.playerCount||4);
 const total=Object.values(game.roleCount).reduce((a,b)=>a+Number(b||0),0);
 if(total!==pc){alert(`役職カードの合計を${pc}枚にしてください。現在 ${total}枚です。`);return}
 game.discussionTime=Number(document.getElementById("discussion").value);
 game.firstSeer=document.getElementById("firstSeer").value==="yes";
 game.loverMode=document.getElementById("loverMode").value;
 game.cardMode=false;
 let saved=[];try{saved=JSON.parse(localStorage.getItem("jinroNames")||"[]")}catch{}
 render(`<div class="card"><h2>👤 プレイヤー名</h2><p class="small">前回の名前があれば自動で入っています。</p>
 ${Array.from({length:pc},(_,i)=>`<label>${i+1}人目<input id="n${i}" value="${esc(saved[i]||"")}" placeholder="${i+1}人目"></label>`).join("")}</div>
 <button class="green" onclick="assignRoles()">🎴 役職を決定する</button>`);
}
function assignRoles(){
 const pc=Number(game.playerCount||4),players=[];
 for(let i=0;i<pc;i++){let n=(document.getElementById("n"+i).value||"").trim();if(!n){alert(`${i+1}人目の名前を入力してください`);return}players.push({id:i+1,name:n,alive:true,role:"",blocked:false,cursedWolf:false,tough:false})}
 localStorage.setItem("jinroNames",JSON.stringify(players.map(p=>p.name)));
 let deck=[];ROLES.forEach(r=>{for(let i=0;i<(game.roleCount[r]||0);i++)deck.push(r)});
 for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 players.forEach((p,i)=>p.role=deck[i]);
 game.players=players;game.confirmIndex=0;game.confirmRevealed=false;game.gameOver=false;
 game.loverPairs=[];game.android={};game.cursedWolf={};game.toughPending=[];game.firstSeerDone=false;
 if(game.loverMode==="on"&&hasRole("恋人")){
   let candidates=players.filter(p=>p.role!=="恋人"); candidates.sort(()=>Math.random()-.5);
   const lovers=rolePlayers("恋人"); let pool=[...lovers,...candidates].sort(()=>Math.random()-.5);
   if(pool.length>=2)game.loverPairs=[[pool[0].id,pool[1].id]];
 }else{
   const lovers=rolePlayers("恋人"); if(lovers.length===2)game.loverPairs=[[lovers[0].id,lovers[1].id]];
 }
 roleConfirmation();
}

/* ===== 役職確認・初日占い ===== */
function roleInfo(p){
 let r=p.role,info={
 "市民":"能力はありません。","人狼":"夜に襲撃します。","人狼の子ども":"昼に追放されると、その夜は2人を襲撃できます。",
 "裏切り者":"人狼が誰かは分かりません。","裏切りの共有者":"2人がお互いを知っています。","内通者":"人狼が誰かを知っています。",
 "裏切りの襲撃者":"夜に1人を襲撃できます。人狼も対象にできます。","スパイ":"夜に1人の市民陣営役職の能力を妨害できます。",
 "予言者":"夜に1人を占います。妖狐は人間と出ますが、占われた妖狐は死亡します。",
 "ボディーガード":"夜に1人を守ります。自分自身は守れず、同じ人を2夜連続では守れません。","霊媒師":"前日に追放された人の役職を確認します。",
 "ハンター":"昼に追放された場合、1人を道連れにします。","共有者":"共有者同士がお互いを知っています。",
 "独裁者":"1回だけ昼の議論を強制終了し、追放者を決められます。","タフガイ":"夜に襲撃されてもその夜は死亡せず、翌夜に死亡します。",
 "カウンセラー":"毎晩1人を選び、裏切り者系なら市民に変えます。人狼を選ぶと自分が犠牲になります。",
 "奇術師":"1回だけ人狼の襲撃先を変更できます。変更先は護衛等に関係なく死亡します。",
 "罠師":"毎晩1人に罠を仕掛けます。同じ人には連続で仕掛けられません。","騎士団":"騎士団同士を知っています。自分を守れ、同じ人を連続で守れます。",
 "影武者":"1回だけ昼の議論を強制終了し、自分が追放されます。","王様":"投票が2票になります。","呪われた者":"最初は市民側。襲撃されると翌夜から人狼になります。",
 "妖狐":"夜の能力はありません。占われると死亡します。最後まで生き残ると勝利します。","神様":"全員の役職を知っています。生存していれば勝利します。",
 "恋人":"恋人の一方が死亡すると、もう一方も死亡します。","一匹狼":"独立した人狼側です。","アンドロイド":"1人の能力をコピーします。","案山子":"全員が死亡する前にゲームが終了しなければ勝利できません。"
 };return `<p>${esc(info[r]||"")}</p>`}
function roleConfirmation(){
 if(game.confirmIndex>=game.players.length){game.confirmRevealed=false;afterRoleConfirmation();return}
 const p=game.players[game.confirmIndex],num=game.confirmIndex+1,total=game.players.length;
 if(!game.confirmRevealed){
  render(`<div class="card"><div class="progress">${num} / ${total}</div><h2>${esc(p.name)}さん</h2><div class="big">？？？</div><p class="center">あなたの役職を確認してください。</p></div><button class="blue" onclick="revealRole()">👀 役職を見る</button>`);
 }else{
  render(`<div class="card private"><div class="progress">${num} / ${total}</div><h2>${esc(p.name)}さん</h2><div class="big">${esc(p.role)}</div>${roleInfo(p)}<p class="small center">この画面は本人だけが確認してください。</p></div><button class="green" onclick="finishRole()">✅ 確認しました</button>`);
 }
}
function revealRole(){game.confirmRevealed=true;roleConfirmation()}
function finishRole(){game.confirmRevealed=false;game.confirmIndex++;roleConfirmation()}
function afterRoleConfirmation(){
 const s=rolePlayers("予言者").find(p=>p.alive);
 if(s&&game.firstSeer&&!game.firstSeerDone){firstDaySeerAction(s);return}
 startFirstDay();
}
function firstDaySeerAction(seer){
 if(blocked("予言者",seer.id)){game.firstSeerDone=true;startFirstDay();return}
 const targets=living().filter(p=>p.id!==seer.id);
 render(`<div class="card private"><h2>🔮 初日の予言</h2><p class="center">${esc(seer.name)}さん、占う人を1人選んでください。</p>${targets.map(p=>`<button class="name-button" onclick="firstSeerPick(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.firstSeerPick=id=>{
  const t=get(id);if(!t)return;
  if(t.role==="妖狐"){t.alive=false;render(`<div class="card private"><div class="big">🔮 結果</div><p class="center">${esc(t.name)}さんは「人間」です。</p><div class="danger">妖狐を占ったため、死亡しました。</div></div><button class="blue" onclick="finishFirstSeer()">次へ</button>`)}
  else{render(`<div class="card private"><div class="big">🔮 結果</div><p class="center">${esc(t.name)}さんは「${esc(seerResult(t))}」です。</p></div><button class="blue" onclick="finishFirstSeer()">次へ</button>`)}
 }
}
function finishFirstSeer(){game.firstSeerDone=true;if(checkVictory())return;startFirstDay()}

/* ===== 昼・投票 ===== */
function startFirstDay(){game.day=1;game.night=0;game.firstDay=true;speak("役職の確認が終わりました。みなさん目を覚ましてください。お昼です。議論スタート。");setTimeout(()=>startDiscussion(),500)}
function startDiscussion(){
 clearInterval(game.discussionTimer);game.discussionEnded=false;
 if(game.discussionTime===0){render(`<div class="card"><h2>☀️ ${game.day}日目・昼</h2><div class="big">💬 議論スタート</div><p class="center">時間制限なしです。</p></div><button class="orange" onclick="endDiscussion()">🛑 議論を終了する</button>`);return}
 let left=game.discussionTime;
 render(`<div class="card"><h2>☀️ ${game.day}日目・昼</h2><div id="timer" class="timer">${fmt(left)}</div><div class="big">💬 議論スタート</div><p class="center">生存者で話し合ってください。</p></div><button class="orange" onclick="endDiscussion()">🛑 議論を終了する</button>`);
 game.discussionTimer=setInterval(()=>{left--;let e=document.getElementById("timer");if(e)e.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(game.discussionTimer);startVote()}},1000)
}
function endDiscussion(){if(game.discussionEnded)return;game.discussionEnded=true;clearInterval(game.discussionTimer);speak("議論を終了します。投票を開始します。");startVote()}
function startVote(){
 const voters=living();if(voters.length<=1){if(checkVictory())return;goNight();return}
 let i=0,votes={};
 function next(){if(i>=voters.length){finishVote(votes);return}let voter=voters[i++],targets=voters.filter(p=>p.id!==voter.id);
 render(`<div class="card"><div class="progress">投票 ${i}/${voters.length}</div><h2>🗳️ ${esc(voter.name)}さん</h2><p class="small center">投票先は次の人には見せません。</p>${targets.map(p=>`<button class="name-button" onclick="vote(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.vote=id=>{votes[id]=(votes[id]||0)+(voter.role==="王様"?2:1);next()}}
 next()
}
function finishVote(votes){
 let max=Math.max(...Object.values(votes)),ids=Object.keys(votes).filter(id=>votes[id]===max);
 if(ids.length>1){game.voteRound=1;decisionVote(ids);return}
 exile(get(ids[0]))
}
function decisionVote(ids){
 const candidates=ids.map(get).filter(Boolean),voters=living();let i=0,votes={};
 function next(){if(i>=voters.length){let max=Math.max(...Object.values(votes)),win=candidates.filter(p=>votes[p.id]===max);if(win.length!==1){game.voteRound=0;afterNoVote();return}exile(win[0]);return}
 let voter=voters[i++];render(`<div class="card"><div class="progress">⚖️ 決選投票 ${i}/${voters.length}</div><h2>${esc(voter.name)}さん</h2>${candidates.map(p=>`<button class="name-button" onclick="dv(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.dv=id=>{votes[id]=(votes[id]||0)+(voter.role==="王様"?2:1);next()}}
 speak("同票です。決選投票を行います。");next()
}
function afterNoVote(){speak("決選投票も同票でした。今回は追放なしです。");render(`<div class="card"><div class="big">⚖️ 追放なし</div><p class="center">今回は追放なしです。</p></div><button class="blue" onclick="goNight()">🌙 夜へ</button>`)}
function exile(p){
 if(!p)return afterNoVote();p.alive=false;game.lastExiled=p.id;
 loverDeath(p.id);showExile(p);
}
function showExile(p){
 speak(`投票の結果、${p.name}さんが追放されました。`);
 render(`<div class="card"><div class="big">⚖️ 投票結果</div><h2>${esc(p.name)}さんが追放されました。</h2></div>`);
 if(p.role==="ハンター"){setTimeout(()=>hunterAction(p),500);return}
 if(p.role==="人狼の子ども")game.childRage=true;
 if(p.role==="影武者")game.shadowUsed=true;
 setTimeout(()=>{if(checkVictory())return;goNight()},700)
}
function hunterAction(h){
 const targets=living();render(`<div class="card"><h2>🏹 ハンター</h2><p class="center">道連れにする人を1人選んでください。</p>${targets.map(p=>`<button class="name-button" onclick="hunterPick(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.hunterPick=id=>{let t=get(id);if(!t||!t.alive)return;t.alive=false;loverDeath(t.id);render(`<div class="card"><div class="big">🏹 ${esc(t.name)}さんが道連れ</div></div>`);setTimeout(()=>{if(checkVictory())return;goNight()},700)}
}
function goNight(){if(checkVictory())return;game.night++;game.firstDay=false;startNight()}

/* ===== 夜 ===== */
function startNight(){
 game.nightIndex=0;game.wolfTargets=[];game.wolfTarget=null;game.raiderTarget=null;game.guardTarget=null;game.knightTarget=null;game.trapTarget=null;game.counselTarget=null;game.magicTarget=null;game.nightDeaths=[];game.blockedRoles={};game.blockedPlayers={};game.convertedThisNight=[];
 game.players.forEach(p=>p.blocked=false);
 nightStep()
}
function nightStep(){
 if(game.nightIndex>=ORDER.length){resolveNight();return}
 const step=ORDER[game.nightIndex++];
 if(step==="裏切り者確認"){nightInfo(step);return}
 if(step==="スパイ"){spyStep();return}
 if(step==="人狼の子ども"){nightInfo(step);return}
 if(step==="人狼"){wolfStep();return}
 if(step==="裏切りの襲撃者"){raiderStep();return}
 if(step==="ボディーガード"){guardStep();return}
 if(step==="騎士団"){knightStep();return}
 if(step==="罠師"){trapStep();return}
 if(step==="カウンセラー"){counselStep();return}
 if(step==="予言者"){seerStep();return}
 if(step==="霊媒師"){mediumStep();return}
 if(step==="奇術師"){magicStep();return}
 if(step==="アンドロイド"){androidStep();return}
}
function nightInfo(label){
 render(`<div class="card"><div class="wake">🌙 ${esc(label)}</div><p class="center">この役職がゲームに採用されています。生存者がいなくても確認画面を表示します。</p></div><button class="blue" onclick="nightStep()">確認しました・次へ</button>`);
}
function selectable(title,players,cbText,cb){
 if(!players.length){nightStep();return}
 render(`<div class="card"><div class="wake">${esc(title)}</div><p class="center">${esc(cbText)}</p>${players.map(p=>`<button class="name-button" onclick="window.__pick(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.__pick=id=>cb(get(id));
}
function spyStep(){
 const s=rolePlayers("スパイ").find(p=>p.alive&&!blocked("スパイ",p.id));
 if(!s){nightStep();return}
 const targets=living().filter(p=>p.id!==s.id && ["人狼","人狼の子ども","一匹狼","妖狐","神様","案山子","市民"].indexOf(p.role)<0);
 if(!targets.length){nightStep();return}
 render(`<div class="card private"><h2>🕵️ スパイ</h2><p class="center">妨害する役職者を1人選んでください。</p>${targets.map(p=>`<button class="name-button" onclick="spyPick(${p.id})">${esc(p.name)}（${esc(p.role)}）</button>`).join("")}</div>`);
 window.spyPick=id=>{let t=get(id);if(!t){nightStep();return}setBlock(t.role,t.id);nightStep()}
}
function wolfStep(){
 const wolves=rolePlayers("人狼").filter(p=>p.alive&&!blocked("人狼",p.id));
 const lone=rolePlayers("一匹狼").find(p=>p.alive&&!blocked("一匹狼",p.id));
 if(!wolves.length&&!lone){nightStep();return}
 let voters=[...wolves];if(lone)voters.push(lone);
 const targets=living().filter(p=>!isWolf(p.role));
 if(!targets.length){nightStep();return}
 let i=0,chosen=[];
 function next(){if(i>=voters.length){if(chosen.length){game.wolfTargets=game.childRage?chosen.slice(0,2):[chosen[0]]}nightStep();return}
 let w=voters[i++];render(`<div class="card"><h2>🐺 人狼</h2><p class="center">${esc(w.name)}さん、襲撃先を選んでください。</p>${targets.map(p=>`<button class="name-button" onclick="wolfPick(${p.id})">${esc(p.name)}</button>`).join("")}</div>`);
 window.wolfPick=id=>{chosen.push(id);next()}}
 next()
}
function raiderStep(){
 const r=rolePlayers("裏切りの襲撃者").find(p=>p.alive&&!blocked("裏切りの襲撃者",p.id));if(!r){nightStep();return}
 selectable("🗡️ 裏切りの襲撃者",living().filter(p=>p.id!==r.id),"襲撃する人を選んでください。",t=>{game.raiderTarget=t?.id||null;nightStep()})
}
function guardStep(){
 const g=rolePlayers("ボディーガード").find(p=>p.alive&&!blocked("ボディーガード",p.id));if(!g){nightStep();return}
 const ts=living().filter(p=>p.id!==g.id&&p.id!==game.lastGuard);selectable("🛡️ ボディーガード",ts,"守る人を選んでください。",t=>{game.guardTarget=t?.id||null;game.lastGuard=game.guardTarget;nightStep()})
}
function knightStep(){
 const ks=rolePlayers("騎士団").filter(p=>p.alive&&!blocked("騎士団",p.id));if(!ks.length){nightStep();return}
 selectable("⚔️ 騎士団",living(),"守る人を選んでください。",t=>{game.knightTarget=t?.id||null;nightStep()})
}
function trapStep(){
 const t=rolePlayers("罠師").find(p=>p.alive&&!blocked("罠師",p.id));if(!t){nightStep();return}
 const ts=living().filter(p=>p.id!==game.lastTrap);selectable("🪤 罠師",ts,"罠を仕掛ける人を選んでください。",x=>{game.trapTarget=x?.id||null;game.lastTrap=game.trapTarget;game.trapActive=!!x;game.trapOwner=t.id;nightStep()})
}
function counselStep(){
 const c=rolePlayers("カウンセラー").find(p=>p.alive&&!blocked("カウンセラー",p.id));if(!c){nightStep();return}
 selectable("🩺 カウンセラー",living().filter(p=>p.id!==c.id),"対象を1人選んでください。",t=>{game.counselTarget=t?.id||null;nightStep()})
}
function seerStep(){
 const s=rolePlayers("予言者").find(p=>p.alive&&!blocked("予言者",p.id));if(!s){nightStep();return}
 selectable("🔮 予言者",living().filter(p=>p.id!==s.id),"占う人を1人選んでください。",t=>{
  if(!t){nightStep();return}
  if(t.role==="妖狐"){t.alive=false;loverDeath(t.id);render(`<div class="card private"><div class="big">🔮 結果</div><p>${esc(t.name)}さんは「人間」です。</p><div class="danger">妖狐を占ったため死亡しました。</div></div><button class="blue" onclick="nightStep()">次へ</button>`);window.__after=()=>{};return}
  render(`<div class="card private"><div class="big">🔮 結果</div><p>${esc(t.name)}さんは「${esc(seerResult(t))}」です。</p></div><button class="blue" onclick="nightStep()">次へ</button>`)
 })
}
function mediumStep(){
 const m=rolePlayers("霊媒師").find(p=>p.alive&&!blocked("霊媒師",p.id));if(!m){nightStep();return}
 if(game.lastExiled==null){nightStep();return}
 const p=get(game.lastExiled);if(!p){nightStep();return}
 render(`<div class="card private"><h2>🔮 霊媒師</h2><p>${esc(p.name)}さんの役職は「${esc(p.role)}」です。</p></div><button class="blue" onclick="nightStep()">次へ</button>`)
}
function magicStep(){
 const m=rolePlayers("奇術師").find(p=>p.alive&&!blocked("奇術師",p.id));if(!m||game.magicUsed||!game.wolfTargets.length){nightStep();return}
 const ts=living().filter(p=>p.id!==m.id);selectable("🎩 奇術師",ts,"人狼の襲撃先を変更します。変更先は護衛等に関係なく死亡します。",t=>{game.magicTarget=t?.id||null;game.magicUsed=true;nightStep()})
}
function androidStep(){
 const a=rolePlayers("アンドロイド").find(p=>p.alive&&!blocked("アンドロイド",p.id));if(!a||game.android[a.id]!=null){nightStep();return}
 const ts=living().filter(p=>p.id!==a.id);selectable("🤖 アンドロイド",ts,"コピーする人を1人選んでください。",t=>{if(t)game.android[a.id]=t.id;nightStep()})
}

/* ===== 夜の解決 ===== */
function resolveNight(){
 const deaths=[];
 const kill=id=>{let p=get(id);if(p&&p.alive&&!deaths.includes(id))deaths.push(id)};
 if(game.counselTarget!=null){
  let t=get(game.counselTarget),c=rolePlayers("カウンセラー").find(p=>p.alive);
  if(t&&c){
   if(isBetrayer(t.role)){t.role="市民";game.convertedThisNight.push(t.id)}
   else if(isWolf(t.role)){kill(c.id)}
  }
 }
 let wolfTargets=game.wolfTargets.slice();
 if(game.magicTarget!=null)wolfTargets=[game.magicTarget];
 wolfTargets.forEach(id=>{
  let t=get(id);if(!t||!t.alive)return;
  if(game.magicTarget==null && (game.guardTarget===id||game.knightTarget===id))return;
  if(game.trapActive&&game.trapTarget===id){
    const attackedWolf=rolePlayers("人狼").find(p=>p.alive);
    if(t.role==="ボディーガード"){if(attackedWolf)kill(attackedWolf.id);return}
    if(attackedWolf)kill(attackedWolf.id);
    return;
  }
  if(t.role==="タフガイ"&&!t.tough){t.tough=true;game.toughPending.push(t.id);return}
  if(t.role==="呪われた者"){game.cursedWolf[t.id]=true;t.cursedWolf=true;return}
  kill(id)
 });
 if(game.raiderTarget!=null){
  let t=get(game.raiderTarget);if(t&&t.alive){
   if(game.trapActive&&game.trapTarget===t.id){kill(get(game.trapOwner)?.id)}
   else if(t.role==="タフガイ"&&!t.tough){t.tough=true;game.toughPending.push(t.id)}
   else if(t.role!=="人狼")kill(t.id)
   else kill(t.id)
  }
 }
 game.toughPending.forEach(id=>{let p=get(id);if(p&&p.alive&&p.tough&&game.night>1)kill(id)});
 deaths.forEach(id=>{let p=get(id);if(p){p.alive=false;loverDeath(id)}})
 game.nightDeaths=deaths;
 if(checkVictory())return;
 morning()
}
function loverDeath(id){
 for(const pair of game.loverPairs){if(pair.includes(id)){pair.forEach(x=>{let p=get(x);if(p)p.alive=false})}}
}
function morning(){
 const names=game.nightDeaths.map(id=>get(id)?.name).filter(Boolean);
 let msg="朝になりました。みなさん目を覚ましてください。";
 if(names.length)msg+=`残念ながら${names.join("、")}さんが亡くなってしまいました。`;
 msg+="お昼です。議論スタート。";
 speak(msg);
 game.day++;
 setTimeout(()=>{if(checkVictory())return;startDiscussion()},800)
}

/* ===== 勝利判定 ===== */
function androidAlignment(a){
 const t=get(game.android[a.id]);if(!t)return"human";
 return isWolf(t.role)||(t.role==="呪われた者"&&t.cursedWolf)?"wolf":"human"
}
function checkVictory(){
 const a=living();
 if(!a.length)return victory("案山子","全員が死亡しました。案山子の勝利です。");
 if(hasRole("案山子")&&a.length===1&&a.some(p=>p.role==="案山子"))return victory("案山子","案山子が最後まで生き残りました。");
 if(a.some(p=>p.role==="神様"))return victory("神様","神様が生き残っています。神様の勝利です。");
 const fox=a.find(p=>p.role==="妖狐");
 if(fox){let w=a.filter(p=>isWolf(p.role)).length,c=a.filter(p=>!isWolf(p.role)&&p.role!=="妖狐").length;if(w===0||w>=c)return victory("妖狐","妖狐が生き残りました。妖狐の勝利です。")}
 for(const pair of game.loverPairs){if(pair.every(id=>get(id)?.alive)){let w=a.filter(p=>isWolf(p.role)).length,n=a.filter(p=>!isWolf(p.role)).length;if(w===0||w>=n)return victory("恋人","恋人が生き残りました。恋人の勝利です.")}}
 const wolves=a.filter(p=>isWolf(p.role)).length,non=a.filter(p=>!isWolf(p.role)&&p.role!=="妖狐").length;
 const android=a.find(p=>p.role==="アンドロイド");
 if(android&&androidAlignment(android)==="human"&&wolves===0&&non>0)return victory("アンドロイド","アンドロイド陣営の勝利です。");
 if(wolves===0)return victory("市民陣営","人狼がいなくなりました。市民陣営の勝利です。");
 if(wolves>=non)return victory("人狼","人狼が市民陣営を上回りました。人狼の勝利です。");
 return false
}
function victory(team,msg){
 game.gameOver=true;clearInterval(game.discussionTimer);speak(msg);
 render(`<div class="card"><div class="big">🏆 ゲーム終了</div><h2>${esc(team)}の勝利！</h2><p>${esc(msg)}</p></div>
 <div class="card"><h2>📋 最終結果</h2>${game.players.map(p=>`<div class="role-row"><span>${esc(p.name)}</span><span>${p.alive?"🟢 生存":"⚫ 死亡"} ／ ${esc(p.role)}</span></div>`).join("")}</div>
 <button class="blue" onclick="location.reload()">🔄 もう一度遊ぶ</button>`);return true
}

initializeGame();
</script>
