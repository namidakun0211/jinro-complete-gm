<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐺 人狼コンプリートGM</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:16px;

  background:#f5f5f5;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;

  text-align:center;

}

#app{

  max-width:700px;

  margin:auto;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:22px;

  margin:12px 0;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

}

h1{

  font-size:27px;

  margin:5px 0 20px;

}

h2{

  margin:5px 0 18px;

}

button{

  width:100%;

  padding:14px;

  margin:6px 0;

  border:0;

  border-radius:12px;

  background:#222;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

button.gray{

  background:#777;

}

button.red{

  background:#a00000;

}

button:disabled{

  opacity:.4;

}

input,

select{

  width:100%;

  padding:12px;

  border:1px solid #ccc;

  border-radius:10px;

  background:#fff;

  font-size:16px;

}

label{

  display:block;

  text-align:left;

  margin:12px 0 6px;

  font-weight:bold;

}

.notice{

  padding:14px;

  margin:12px 0;

  background:#f0f0f0;

  border-radius:12px;

  line-height:1.7;

}

.big{

  font-size:34px;

  font-weight:bold;

  margin:16px 0;

}

.small{

  font-size:13px;

  color:#666;

}

.roleGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.roleBox{

  border:1px solid #ddd;

  border-radius:14px;

  padding:12px;

  text-align:center;

  background:#fff;

}

.roleName{

  font-weight:bold;

  margin-bottom:8px;

}

.counter{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  margin-top:8px;

}

.counter button{

  width:46px;

  height:46px;

  padding:0;

  margin:0;

  font-size:25px;

  border-radius:12px;

}

.counterValue{

  min-width:38px;

  font-size:22px;

  font-weight:bold;

}

.roleTotal{

  font-size:34px;

  font-weight:bold;

  margin:18px 0;

}

.targetGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.timer{

  font-size:48px;

  font-weight:bold;

  margin:8px 0 20px;

}

.result{

  font-size:26px;

  font-weight:bold;

  margin:18px 0;

}

.cross{

  text-decoration:line-through;

  opacity:.3;

}

@media(max-width:520px){

  .roleGrid,

  .targetGrid{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div id="app"></div>

<script>

const ROLES={

  werewolf:{name:"🐺 人狼",max:6},

  citizen:{name:"👤 市民",max:28},

  seer:{name:"🔮 予言者",max:1},

  medium:{name:"👻 霊媒師",max:1},

  bodyguard:{name:"🛡️ ボディーガード",max:1},

  traitor:{name:"🃏 裏切り者",max:3},

  informant:{name:"📡 内通者",max:2},

  fox:{name:"🦊 妖狐",max:3},

  hunter:{name:"🔫 ハンター",max:2},

  shared:{name:"🤝 共有者",max:2},

  lover:{name:"❤️ 恋人",max:6},

  dictator:{name:"👑 独裁者",max:1}

};

const state={

  screen:"start",

  mode:"",

  playerCount:0,

  names:[],

  roleCounts:{},

  roles:{},

  alive:{},

  loverCompatible:null,

  loverPlayers:[],

  loverPairs:[],

  confirmIndex:0,

  firstSeerTarget:null,

  firstSeerResult:null,

  day:0,

  night:0,

  lastExecuted:null,

  wolfTarget:null,

  guardTarget:null,

  previousGuardTarget:null,

  seerTarget:null,

  seerResult:null,

  mediumResult:null,

  discussionMinutes:5,

  timer:null,

  seconds:0,

  voteVoters:[],

  voteIndex:0,

  votes:{},

  runoffCandidates:[],

  runoffVotes:{},

  dictatorUsed:false,

  nightDeaths:[],

  hunterContext:null,

  hunterIndex:null,

  currentNight:"",

  gameEnded:false,

  winResult:null

};

const app=document.getElementById("app");

function speak(text){

  try{

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    u.rate=.95;

    speechSynthesis.speak(u);

  }catch(e){}

}

function esc(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

function roleName(role){

  return ROLES[role]?.name||"";

}

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function isAlive(i){

  return state.alive[i]===true;

}

function alivePlayers(){

  return state.names

    .map((_,i)=>i)

    .filter(isAlive);

}

function playersWithRole(role,aliveOnly=false){

  return state.names

    .map((_,i)=>i)

    .filter(i=>

      state.roles[i]===role &&

      (!aliveOnly||isAlive(i))

    );

}

function hasRole(role){

  return playersWithRole(role).length>0;

}

function loverPairOf(i){

  return state.loverPairs.find(pair=>pair.includes(i));

}

function getRoleTotal(){

  let total=0;

  Object.keys(ROLES).forEach(id=>{

    total+=Number(state.roleCounts[id])||0;

  });

  return total;

}

function render(){

  app.innerHTML="";

  if(state.screen==="start")startScreen();

  if(state.screen==="count")countScreen();

  if(state.screen==="names")namesScreen();

  if(state.screen==="loverMode")loverModeScreen();

  if(state.screen==="roles")rolesScreen();

  if(state.screen==="confirm")confirmScreen();

  if(state.screen==="firstSeerTarget")firstSeerTargetScreen();

  if(state.screen==="daySettings")daySettingsScreen();

  if(state.screen==="day")dayScreen();

  if(state.screen==="vote")voteScreen();

  if(state.screen==="runoff")runoffScreen();

  if(state.screen==="nightIntro")nightIntroScreen();

  if(state.screen==="nightAction")nightActionScreen();

  if(state.screen==="mediumResult")mediumResultScreen();

  if(state.screen==="hunter")hunterScreen();

  if(state.screen==="morning")morningScreen();

  if(state.screen==="win")winScreen();

}

function card(title,html){

  app.innerHTML=`

    <div class="card">

      <h1>${title}</h1>

      ${html}

    </div>

  `;

}

function startScreen(){

  card("🐺 人狼コンプリートGM",`

    <div class="notice">

      ゲーム方式を選んでください。

    </div>

    <button onclick="selectMode('card')">

      🃏 カードあり

    </button>

    <button onclick="selectMode('random')">

      📱 カードなし

    </button>

  `);

}

function selectMode(mode){

  state.mode=mode;

  state.screen="count";

  render();

}

function countScreen(){

  let options="";

  for(let i=4;i<=28;i++){

    options+=`

      <option value="${i}">

        ${i}人

      </option>

    `;

  }

  card("人数設定",`

    <label>プレイヤー人数</label>

    <select id="playerCount">

      ${options}

    </select>

    <button onclick="savePlayerCount()">

      次へ

    </button>

  `);

}

function savePlayerCount(){

  state.playerCount=

    Number(document.getElementById("playerCount").value);

  state.names=Array(state.playerCount).fill("");

  state.screen="names";

  render();

}

function namesScreen(){

  let html="";

  for(let i=0;i<state.playerCount;i++){

    html+=`

      <label>${i+1}人目</label>

      <input

        id="name${i}"

        placeholder="名前"

      >

    `;

  }

  html+=`

    <button onclick="saveNames()">

      次へ

    </button>

  `;

  card("プレイヤー名",html);

}

function saveNames(){

  const names=[];

  for(let i=0;i<state.playerCount;i++){

    const value=

      document

        .getElementById("name"+i)

        .value

        .trim();

    if(!value){

      alert("全員の名前を入力してください。");

      return;

    }

    names.push(value);

  }

  if(new Set(names).size!==names.length){

    alert("同じ名前は使用できません。");

    return;

  }

  state.names=names;

  localStorage.setItem(

    "jinro_names",

    JSON.stringify(names)

  );

  state.screen="loverMode";

  render();

}

function loverModeScreen(){

  card("❤️ 恋人設定",`

    <div class="notice">

      恋人を他の役職と兼用するか、

      先に設定してください。

      <br>

      恋人を選ばない場合でも

      ゲームを進められます。

    </div>

    <button onclick="setLoverMode(true)">

      ❤️ 兼用する

    </button>

    <button class="gray" onclick="setLoverMode(false)">

      ❤️ 兼用しない

    </button>

  `);

}

function setLoverMode(value){

  state.loverCompatible=value;

  state.screen="roles";

  render();

}

function rolesScreen(){

  const total=getRoleTotal();

  let html=`

    <div class="roleTotal">

      ${total}/${state.playerCount}

    </div>

    <div class="notice">

      役職の枚数を選択してください。

      <br>

      ❤️ 恋人を選ぶ場合は2枚1組です。

      <br>

      🤝 共有者を選ぶ場合は2枚1セットです。

    </div>

    <div class="roleGrid">

  `;

  Object.entries(ROLES).forEach(([id,role])=>{

    const count=

      Number(state.roleCounts[id])||0;

    html+=`

      <div class="roleBox">

        <div class="roleName">

          ${role.name}

        </div>

        <div class="small">

          最大${role.max}枚

        </div>

        <div class="counter">

          <button

            class="gray"

            onclick="changeRoleCount('${id}',-1)"

            ${count<=0?"disabled":""}

          >

            −

          </button>

          <div class="counterValue">

            ${count}

          </div>

          <button

            onclick="changeRoleCount('${id}',1)"

            ${count>=role.max||total>=state.playerCount?"disabled":""}

          >

            ＋

          </button>

        </div>

      </div>

    `;

  });

  html+=`

    </div>

    <button onclick="saveRoles()">

      次へ

    </button>

  `;

  card("役職選択",html);

}

function changeRoleCount(id,change){

  const current=

    Number(state.roleCounts[id])||0;

  const next=current+change;

  if(next<0)return;

  if(next>ROLES[id].max)return;

  const total=getRoleTotal();

  if(change>0&&total>=state.playerCount)return;

  if(

    id==="lover" &&

    next%2!==0

  ){

    alert("恋人は2枚1組なので、2枚ずつ選択してください。");

    return;

  }

  if(

    id==="shared" &&

    next!==0 &&

    next!==2

  ){

    alert("共有者は2枚1セットです。");

    return;

  }

  state.roleCounts[id]=next;

  render();

}

function saveRoles(){

  const total=getRoleTotal();

  if(total!==state.playerCount){

    alert(

      `役職の合計を${state.playerCount}枚にしてください。`

    );

    return;

  }

  const lovers=

    Number(state.roleCounts.lover)||0;

  const shared=

    Number(state.roleCounts.shared)||0;

  if(lovers%2!==0){

    alert(

      "恋人を選ぶ場合は2枚1組です。"

    );

    return;

  }

  if(shared!==0&&shared!==2){

    alert(

      "共有者を選ぶ場合は2枚1セットです。"

    );

    return;

  }

  assignRoles();

}

function assignRoles(){

  let rolePool=[];

  Object.entries(state.roleCounts)

    .forEach(([role,count])=>{

      for(let i=0;i<count;i++){

        rolePool.push(role);

      }

    });

  rolePool=shuffle(rolePool);

  state.roles={};

  rolePool.forEach((role,i)=>{

    state.roles[i]=role;

  });

  state.alive={};

  for(let i=0;i<state.playerCount;i++){

    state.alive[i]=true;

  }

  if(state.loverCompatible){

    const loverCount=

      Number(state.roleCounts.lover)||0;

    state.loverPlayers=

      shuffle(

        Array.from(

          {length:state.playerCount},

          (_,i)=>i

        )

      ).slice(0,loverCount);

  }else{

    state.loverPlayers=

      playersWithRole("lover");

  }

  createLoverPairs();

  state.confirmIndex=0;

  state.firstSeerTarget=null;

  state.firstSeerResult=null;

  state.day=0;

  state.night=0;

  state.lastExecuted=null;

  state.dictatorUsed=false;

  state.screen="confirm";

  render();

}

function createLoverPairs(){

  state.loverPairs=[];

  const lovers=

    state.loverPlayers;

  const shuffled=shuffle(lovers);

  for(let i=0;i<shuffled.length;i+=2){

    if(shuffled[i+1]!==undefined){

      state.loverPairs.push([

        shuffled[i],

        shuffled[i+1]

      ]);

    }

  }

}

function getDisplayRole(i){

  let text=roleName(state.roles[i]);

  if(

    state.loverCompatible &&

    state.loverPlayers.includes(i)

  ){

    text+=" + ❤️ 恋人";

  }

  return text;

}

function roleDescription(i){

  const role=state.roles[i];

  let text=getDisplayRole(i);

  if(role==="werewolf"){

    const wolves=

      playersWithRole("werewolf")

        .map(x=>state.names[x]);

    if(wolves.length){

      text+=

        `\n\n人狼の仲間：${wolves.join("、")}`;

    }

  }

  if(role==="informant"){

    const wolves=

      playersWithRole("werewolf")

        .map(x=>state.names[x]);

    if(wolves.length){

      text+=

        `\n\n人狼：${wolves.join("、")}`;

    }

  }

  if(role==="shared"){

    const partners=

      playersWithRole("shared")

        .filter(x=>x!==i);

    if(partners.length){

      text+=

        `\n\n共有者：${partners.map(x=>state.names[x]).join("、")}`;

    }

  }

  const pair=loverPairOf(i);

  if(pair){

    const partner=

      pair.find(x=>x!==i);

    if(partner!==undefined){

      text+=

        `\n\n恋人：${state.names[partner]}`;

    }

  }

  return text;

}

function confirmScreen(){

  if(state.confirmIndex>=state.playerCount){

    state.screen="daySettings";

    render();

    return;

  }

  const i=state.confirmIndex;

  card("👤 役職確認",`

    <div class="notice">

      ${i+1}人目

    </div>

    <div class="notice">

      ${esc(state.names[i])}さんだけが画面を見てください。

    </div>

    <button onclick="revealCurrentRole()">

      ？？？<br>

      役職を確認

    </button>

  `);

}

function revealCurrentRole(){

  const i=state.confirmIndex;

  const role=state.roles[i];

  if(

    role==="seer" &&

    state.day===0

  ){

    card("👤 役職確認",`

      <div class="notice">

        ${esc(state.names[i])}さんの役職

      </div>

      <div class="big">

        ${esc(getDisplayRole(i))}

      </div>

      <div

        class="notice"

        style="white-space:pre-line"

      >

        ${esc(roleDescription(i))}

      </div>

      <div class="notice">

        初日の占いをしますか？

      </div>

      <button onclick="firstSeerChoose(true)">

        🔮 占う

      </button>

      <button

        class="gray"

        onclick="firstSeerChoose(false)"

      >

        占わない

      </button>

    `);

    return;

  }

  card("👤 役職確認",`

    <div class="notice">

      ${esc(state.names[i])}さんの役職

    </div>

    <div class="big">

      ${esc(getDisplayRole(i))}

    </div>

    <div

      class="notice"

      style="white-space:pre-line"

    >

      ${esc(roleDescription(i))}

    </div>

    <button onclick="finishCurrentRoleConfirm()">

      確認しました

    </button>

  `);

}

function firstSeerChoose(doSeer){

  if(!doSeer){

    finishCurrentRoleConfirm();

    return;

  }

  state.screen="firstSeerTarget";

  render();

}

function firstSeerTargetScreen(){

  const seer=state.confirmIndex;

  let html=`

    <div class="notice">

      初日に占う人を1人選んでください。

    </div>

    <div class="targetGrid">

  `;

  alivePlayers()

    .filter(i=>i!==seer)

    .forEach(i=>{

      html+=`

        <button

          class="gray"

          onclick="chooseFirstSeerTarget(${i})"

        >

          ${esc(state.names[i])}

        </button>

      `;

    });

  html+=`

    </div>

  `;

  card("🔮 初日の占い",html);

}

function chooseFirstSeerTarget(index){

  state.firstSeerTarget=index;

  if(state.roles[index]==="fox"){

    state.firstSeerResult="人間";

    state.alive[index]=false;

    killLoverPartner(index);

  }else{

    state.firstSeerResult=

      state.roles[index]==="werewolf"

        ?"人狼"

        :"人間";

  }

  alert(

    `${state.names[index]}さんは${state.firstSeerResult}です。`

  );

  finishCurrentRoleConfirm();

}

function finishCurrentRoleConfirm(){

  state.confirmIndex++;

  if(state.confirmIndex>=state.playerCount){

    state.screen="daySettings";

  }else{

    state.screen="confirm";

  }

  render();

}

function daySettingsScreen(){

  card("🌞 昼の設定",`

    <div class="notice">

      昼の話し合い時間を選んでください。

    </div>

    <select id="discussionTime">

      <option value="1">1分</option>

      <option value="3">3分</option>

      <option value="5" selected>5分</option>

      <option value="10">10分</option>

      <option value="15">15分</option>

      <option value="0">タイマーなし</option>

    </select>

    <button onclick="startFirstDay()">

      昼の話し合い開始

    </button>

  `);

}

function startFirstDay(){

  state.day=1;

  state.discussionMinutes=

    Number(

      document.getElementById("discussionTime").value

    );

  startDay();

}

function startDay(){

  state.screen="day";

  state.seconds=

    state.discussionMinutes*60;

  clearInterval(state.timer);

  render();

  speak(

    "お昼です。みなさんで話し合ってください。"

  );

  if(state.discussionMinutes>0){

    state.timer=setInterval(()=>{

      state.seconds--;

      updateTimer();

      if(state.seconds<=0){

        clearInterval(state.timer);

        openVote();

      }

    },1000);

  }

}

function updateTimer(){

  const el=document.getElementById("timer");

  if(el){

    el.textContent=

      formatTime(state.seconds);

  }

}

function formatTime(sec){

  return(

    String(Math.floor(sec/60)).padStart(2,"0")+

    ":"+

    String(sec%60).padStart(2,"0")

  );

}

function dayScreen(){

  let html="";

  if(state.discussionMinutes>0){

    html+=`

      <div id="timer" class="timer">

        ${formatTime(state.seconds)}

      </div>

    `;

  }else{

    html+=`

      <div class="notice">

        タイマーなし

      </div>

    `;

  }

  html+=`

    <div class="notice">

      ${state.day}日目の昼です。

    </div>

  `;

  const dictator=

    playersWithRole("dictator",true)[0];

  if(

    dictator!==undefined &&

    !state.dictatorUsed

  ){

    html+=`

      <label>👑 独裁者</label>

      <input

        id="dictatorName"

        placeholder="独裁者の名前を入力"

      >

      <button onclick="useDictator()">

        👑 独裁者を使用

      </button>

    `;

  }

  html+=`

    <button onclick="openVote()">

      🗳️ 投票へ

    </button>

  `;

  card(`🌞 ${state.day}日目`,html);

  updateTimer();

}

function useDictator(){

  const name=

    document

      .getElementById("dictatorName")

      .value

      .trim();

  const index=

    state.names.indexOf(name);

  const dictator=

    playersWithRole("dictator",true)[0];

  if(index!==dictator){

    alert(

      "独裁者の名前が一致しません。"

    );

    return;

  }

  const targetName=

    prompt(

      "追放する人の名前を入力してください。"

    );

  if(!targetName)return;

  const target=

    state.names.indexOf(

      targetName.trim()

    );

  if(

    target===-1||

    !isAlive(target)||

    target===dictator

  ){

    alert(

      "追放対象が正しくありません。"

    );

    return;

  }

  clearInterval(state.timer);

  state.dictatorUsed=true;

  state.alive[target]=false;

  state.lastExecuted=target;

  speak(

    `${state.names[target]}さんが追放されました。`

  );

  killLoverPartner(target);

  if(state.roles[target]==="hunter"){

    state.hunterContext="day";

    state.hunterIndex=target;

    state.screen="hunter";

    render();

    speak(

      "ハンターの方、道連れにする人を選んでください。"

    );

    return;

  }

  if(checkVictory())return;

  beginNight();

}

function openVote(){

  clearInterval(state.timer);

  state.voteVoters=alivePlayers();

  state.voteIndex=0;

  state.votes={};

  state.screen="vote";

  render();

}

function voteScreen(){

  if(

    state.voteIndex>=state.voteVoters.length

  ){

    finishVote();

    return;

  }

  const voter=

    state.voteVoters[state.voteIndex];

  let options=`

    <option value="">

      投票先を選択

    </option>

  `;

  alivePlayers()

    .filter(i=>i!==voter)

    .forEach(target=>{

      options+=`

        <option value="${target}">

          ${esc(state.names[target])}

        </option>

      `;

    });

  card("🗳️ 投票",`

    <div class="big">

      ${state.voteIndex+1}/${state.voteVoters.length}

    </div>

    <div class="notice">

      ${esc(state.names[voter])}さんだけが画面を見てください。

    </div>

    <select id="singleVote">

      ${options}

    </select>

    <button onclick="submitSingleVote()">

      投票する

    </button>

  `);

}

function submitSingleVote(){

  const voter=

    state.voteVoters[state.voteIndex];

  const value=

    document.getElementById("singleVote").value;

  if(value===""){

    alert(

      "投票先を選んでください。"

    );

    return;

  }

  state.votes[voter]=Number(value);

  state.voteIndex++;

  render();

}

function finishVote(){

  const counts={};

  Object.entries(state.votes)

    .forEach(([voter,target])=>{

      counts[target]=

        (counts[target]||0)+1;

    });

  const max=

    Math.max(...Object.values(counts));

  const top=

    Object.keys(counts)

      .filter(k=>counts[k]===max)

      .map(Number);

  if(top.length>1){

    state.runoffCandidates=top;

    state.runoffVotes={};

    state.voteIndex=0;

    state.voteVoters=alivePlayers();

    state.screen="runoff";

    render();

    return;

  }

  executeByVote(top[0]);

}

function executeByVote(index){

  state.alive[index]=false;

  state.lastExecuted=index;

  speak(

    `${state.names[index]}さんが追放されました。`

  );

  killLoverPartner(index);

  if(state.roles[index]==="hunter"){

    state.hunterContext="day";

    state.hunterIndex=index;

    state.screen="hunter";

    render();

    speak(

      "ハンターの方、道連れにする人を選んでください。"

    );

    return;

  }

  if(checkVictory())return;

  beginNight();

}

function runoffScreen(){

  if(

    state.voteIndex>=state.voteVoters.length

  ){

    finishRunoff();

    return;

  }

  const voter=

    state.voteVoters[state.voteIndex];

  let options=`

    <option value="">

      投票先を選択

    </option>

  `;

  state.runoffCandidates

    .filter(i=>i!==voter&&isAlive(i))

    .forEach(target=>{

      options+=`

        <option value="${target}">

          ${esc(state.names[target])}

        </option>

      `;

    });

  card("🗳️ 決選投票",`

    <div class="notice">

      決選投票です。

      <br>

      ${state.runoffCandidates

        .map(i=>esc(state.names[i]))

        .join("、")}

    </div>

    <div class="big">

      ${state.voteIndex+1}/${state.voteVoters.length}

    </div>

    <div class="notice">

      ${esc(state.names[voter])}さんだけが画面を見てください。

    </div>

    <select id="runoffVote">

      ${options}

    </select>

    <button onclick="submitRunoffVote()">

      投票する

    </button>

  `);

}

function submitRunoffVote(){

  const voter=

    state.voteVoters[state.voteIndex];

  const value=

    document.getElementById("runoffVote").value;

  if(value===""){

    alert(

      "投票先を選んでください。"

    );

    return;

  }

  state.runoffVotes[voter]=Number(value);

  state.voteIndex++;

  render();

}

function finishRunoff(){

  const counts={};

  Object.entries(state.runoffVotes)

    .forEach(([voter,target])=>{

      counts[target]=

        (counts[target]||0)+1;

    });

  const max=

    Math.max(...Object.values(counts));

  const top=

    Object.keys(counts)

      .filter(k=>counts[k]===max)

      .map(Number);

  if(top.length>1){

    alert(

      "決選投票でも同票のため、追放者はいません。"

    );

    state.lastExecuted=null;

    beginNight();

    return;

  }

  executeByVote(top[0]);

}

function beginNight(){

  state.night++;

  state.wolfTarget=null;

  state.guardTarget=null;

  state.seerTarget=null;

  state.seerResult=null;

  state.mediumResult=null;

  state.nightDeaths=[];

  state.screen="nightIntro";

  render();

}

function nightIntroScreen(){

  card(`🌙 ${state.night}夜目`,`

    <div class="notice">

      夜になりました。

    </div>

    <button onclick="startNight()">

      夜の行動を開始

    </button>

  `);

}

function startNight(){

  runNightStep("werewolf");

}

function runNightStep(step){

  if(step==="werewolf"){

    if(

      !hasRole("werewolf")||

      !playersWithRole("werewolf",true).length

    ){

      runNightStep("bodyguard");

      return;

    }

    state.currentNight="werewolf";

    state.screen="nightAction";

    render();

    speak(

      "人狼の方、目を覚ましてください。"+

      "今夜襲撃する人を選んでください。"

    );

    return;

  }

  if(step==="bodyguard"){

    if(

      !hasRole("bodyguard")||

      !playersWithRole("bodyguard",true).length

    ){

      runNightStep("seer");

      return;

    }

    state.currentNight="bodyguard";

    state.screen="nightAction";

    render();

    speak(

      "ボディーガードの方、目を覚ましてください。"+

      "今夜守る人を選んでください。"

    );

    return;

  }

  if(step==="seer"){

    if(

      !hasRole("seer")||

      !playersWithRole("seer",true).length

    ){

      runNightStep("medium");

      return;

    }

    state.currentNight="seer";

    state.screen="nightAction";

    render();

    speak(

      "予言者の方、目を覚ましてください。"+

      "今夜占う人を選んでください。"

    );

    return;

  }

  if(step==="medium"){

    if(

      !hasRole("medium")||

      !playersWithRole("medium",true).length||

      state.lastExecuted===null

    ){

      resolveNight();

      return;

    }

    state.currentNight="medium";

    state.screen="nightAction";

    render();

    speak(

      "霊媒師の方、目を覚ましてください。"

    );

    return;

  }

  resolveNight();

}

function nightActionScreen(){

  if(state.currentNight==="werewolf"){

    renderWerewolfAction();

  }

  if(state.currentNight==="bodyguard"){

    renderBodyguardAction();

  }

  if(state.currentNight==="seer"){

    renderSeerAction();

  }

  if(state.currentNight==="medium"){

    renderMediumAction();

  }

}

function renderWerewolfAction(){

  const targets=

    alivePlayers()

      .filter(i=>state.roles[i]!=="werewolf");

  let html=`

    <div class="notice">

      人狼の皆さんで相談して、

      襲撃先を1人選んでください。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="chooseWolfTarget(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`

    </div>

  `;

  card("🐺 人狼",html);

}

function chooseWolfTarget(index){

  state.wolfTarget=index;

  runNightStep("bodyguard");

}

function renderBodyguardAction(){

  const guard=

    playersWithRole("bodyguard",true)[0];

  if(guard===undefined){

    runNightStep("seer");

    return;

  }

  const targets=

    alivePlayers()

      .filter(i=>i!==guard)

      .filter(i=>i!==state.previousGuardTarget);

  let html=`

    <div class="notice">

      今夜守る人を1人選んでください。

      <br>

      自分自身は守れません。

      <br>

      同じ人を2夜連続では守れません。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="chooseGuardTarget(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`

    </div>

  `;

  card("🛡️ ボディーガード",html);

}

function chooseGuardTarget(index){

  state.guardTarget=index;

  state.previousGuardTarget=index;

  runNightStep("seer");

}

function renderSeerAction(){

  const seer=

    playersWithRole("seer",true)[0];

  if(seer===undefined){

    runNightStep("medium");

    return;

  }

  const targets=

    alivePlayers()

      .filter(i=>i!==seer);

  let html=`

    <div class="notice">

      今夜占う人を1人選んでください。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="chooseSeerTarget(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`

    </div>

  `;

  card("🔮 予言者",html);

}

function chooseSeerTarget(index){

  state.seerTarget=index;

  if(state.roles[index]==="fox"){

    state.seerResult="人間";

    state.alive[index]=false;

    state.nightDeaths.push(index);

    killLoverPartner(index);

  }else{

    state.seerResult=

      state.roles[index]==="werewolf"

        ?"人狼"

        :"人間";

  }

  alert(

    `${state.names[index]}さんは${state.seerResult}です。`

  );

  runNightStep("medium");

}

function renderMediumAction(){

  const index=state.lastExecuted;

  if(index===null){

    resolveNight();

    return;

  }

  const role=

    state.roles[index];

  state.mediumResult=

    role==="werewolf"

      ?"人狼"

      :"人間";

  state.screen="mediumResult";

  render();

}

function mediumResultScreen(){

  const index=

    state.lastExecuted;

  card("👻 霊媒師",`

    <div class="notice">

      昨日追放された

      <strong>${esc(state.names[index])}</strong>

      さんは

      <strong>${state.mediumResult}</strong>

      です。

    </div>

    <button onclick="mediumNext()">

      確認しました

    </button>

  `);

}

function mediumNext(){

  resolveNight();

}

function resolveNight(){

  state.nightDeaths=[];

  if(

    state.wolfTarget!==null &&

    state.wolfTarget!==undefined &&

    isAlive(state.wolfTarget)

  ){

    const target=

      state.wolfTarget;

    if(

      state.roles[target]!=="fox" &&

      state.guardTarget!==target

    ){

      state.alive[target]=false;

      state.nightDeaths.push(target);

    }

  }

  if(checkVictory())return;

  const hunters=

    state.nightDeaths.filter(

      i=>state.roles[i]==="hunter"

    );

  if(hunters.length){

    state.hunterIndex=hunters[0];

    state.hunterContext="night";

    state.screen="hunter";

    render();

    speak(

      "ハンターの方、道連れにする人を選んでください。"

    );

    return;

  }

  killNightLovers();

  if(checkVictory())return;

  state.screen="morning";

  render();

}

function killNightLovers(){

  state.loverPairs.forEach(pair=>{

    const a=pair[0];

    const b=pair[1];

    if(!isAlive(a)&&isAlive(b)){

      state.alive[b]=false;

      state.nightDeaths.push(b);

    }

    if(!isAlive(b)&&isAlive(a)){

      state.alive[a]=false;

      state.nightDeaths.push(a);

    }

  });

  state.nightDeaths=[

    ...new Set(state.nightDeaths)

  ];

}

function hunterScreen(){

  const hunter=

    state.hunterIndex;

  const targets=

    alivePlayers()

      .filter(i=>i!==hunter);

  let html=`

    <div class="notice">

      ${esc(state.names[hunter])}さんの死亡が確定しました。

    </div>

    <div class="big">

      道連れにする人を選んでください。

    </div>

    <div class="targetGrid">

  `;

  targets.forEach(i=>{

    html+=`

      <button

        class="gray"

        onclick="hunterChoose(${i})"

      >

        ${esc(state.names[i])}

      </button>

    `;

  });

  html+=`

    </div>

  `;

  card("🔫 ハンター",html);

}

function hunterChoose(target){

  if(!isAlive(target))return;

  state.alive[target]=false;

  if(state.hunterContext==="night"){

    state.nightDeaths.push(target);

  }

  killLoverPartner(target);

  if(checkVictory())return;

  if(state.hunterContext==="day"){

    beginNight();

    return;

  }

  state.screen="morning";

  render();

  speak(

    `${state.names[target]}さんが道連れになりました。`

  );

}

function killLoverPartner(index){

  const pair=

    loverPairOf(index);

  if(!pair)return;

  const partner=

    pair.find(i=>i!==index);

  if(

    partner!==undefined &&

    isAlive(partner)

  ){

    state.alive[partner]=false;

    if(state.night>0){

      state.nightDeaths.push(partner);

    }

  }

}

function baseVictory(){

  const wolves=

    playersWithRole("werewolf",true).length;

  if(wolves===0){

    return "citizen";

  }

  const opposing=

    alivePlayers()

      .filter(i=>

        state.roles[i]!=="werewolf" &&

        state.roles[i]!=="fox"

      )

      .length;

  if(wolves>=opposing){

    return "werewolf";

  }

  return null;

}

function foxVictory(){

  const foxes=

    playersWithRole("fox",true);

  if(!foxes.length){

    return false;

  }

  return baseVictory()!==null;

}

function loverVictory(){

  if(!state.loverPairs.length){

    return false;

  }

  return state.loverPairs.some(pair=>

    isAlive(pair[0]) &&

    isAlive(pair[1])

  );

}

function checkVictory(){

  const base=

    baseVictory();

  const lover=

    loverVictory();

  const fox=

    foxVictory();

  if(!base&&!lover&&!fox){

    return false;

  }

  state.winResult={

    base,

    lover,

    fox

  };

  state.gameEnded=true;

  state.screen="win";

  render();

  return true;

}

function winScreen(){

  const r=

    state.winResult;

  const results=[];

  if(r.base){

    results.push(

      r.base==="werewolf"

        ?"🐺 人狼の勝利です！"

        :"👤 市民の勝利です！"

    );

  }

  if(r.lover){

    results.push(

      "❤️ 恋人の勝利です！"

    );

  }

  if(r.fox){

    results.push(

      "🦊 妖狐の勝利です！"

    );

  }

  let html="";

  results.forEach((text,i)=>{

    html+=`

      <div class="result ${

        i<results.length-1

          ?"cross"

          :""

      }">

        ${text}

      </div>

    `;

  });

  html+=`

    <div class="notice">

      最終勝利

      <br>

      <strong>

        ${results[results.length-1]}

      </strong>

    </div>

    <button onclick="location.reload()">

      最初に戻る

    </button>

  `;

  card("🏆 ゲーム終了",html);

  speak(

    results[results.length-1]

  );

}

render();

</script>

</body>

</html>
