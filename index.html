}

  border-radius:12px;

  border-top:1px solid #ddd;

}

</style>

</head>

<body>

<div class="container">

<h1>🐺 人狼コンプリートGM</h1>

<div id="app"></div>

</div>

<script>

/* =====================================================

   役職一覧

===================================================== */

const ROLES=[

  "人狼",

  "人狼の子ども",

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者",

  "スパイ",

  "市民",

  "予言者",

  "ボディーガード",

  "霊媒師",

  "ハンター",

  "共有者",

  "独裁者",

  "タフガイ",

  "カウンセラー",

  "奇術師",

  "罠師",

  "騎士団",

  "影武者",

  "王様",

  "妖狐",

  "神様",

  "恋人",

  "一匹狼",

  "アンドロイド",

  "案山子",

  "呪われた者"

];

/* =====================================================

   人狼として扱う役職

===================================================== */

const WOLF_ROLES=[

  "人狼",

  "人狼の子ども",

  "一匹狼"

];

/* 通常の人狼 */

const NORMAL_WOLF_ROLES=[

  "人狼",

  "人狼の子ども"

];

/* 裏切り者系 */

const BETRAYER_ROLES=[

  "裏切り者",

  "裏切りの共有者",

  "内通者",

  "裏切りの襲撃者"

];

/* =====================================================

   夜の13段階

===================================================== */

const NIGHT_ORDER=[

  "呪われた者",

  "スパイ",

  "アンドロイド",

  "罠師",

  "ボディーガード",

  "騎士団",

  "人狼",

  "裏切りの襲撃者",

  "カウンセラー",

  "裏切り者確認",

  "奇術師",

  "予言者",

  "霊媒師"

];

/* =====================================================

   ゲームデータ

===================================================== */

let game={

  players:[],

  roleCount:{},

  night:0,

  day:0,

  confirmIndex:0,

  confirmRevealed:false,

  nightIndex:0,

  wolfTarget:null,

  raiderTarget:null,

  guardTarget:null,

  knightTarget:null,

  trapTarget:null,

  magicTarget:null,

  counselTarget:null,

  lastGuard:null,

  lastTrap:null,

  magicUsed:false,

  dictatorUsed:false,

  shadowUsed:false,

  firstSeer:true,

  firstDay:true,

  discussionTime:300,

  discussionTimer:null,

  discussionEnded:false,

  lastExiled:null,

  toughPending:[],

  lovers:[],

  loverPairs:[],

  android:{},

  voteRound:0,

  currentVotes:{},

  blockedRoles:{},

  convertedThisNight:[],

  childRage:false,

  trapActive:false,

  trapOwner:null,

  trapTarget:null,

  nightDeaths:[],

  morningDeaths:[],

  gameOver:false

};

const app=document.getElementById("app");

/* =====================================================

   基本関数

===================================================== */

function escapeHTML(text){

  return String(text).replace(

    /[&<>"']/g,

    function(c){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[c];

    }

  );

}

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const u=

      new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";

    u.rate=1;

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(

    p=>p.alive

  );

}

function rolePlayers(role){

  return game.players.filter(

    p=>p.role===role

  );

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function getPlayer(id){

  return game.players.find(

    p=>p.id===Number(id)

  );

}

function isWolfRole(role){

  return WOLF_ROLES.includes(role);

}

function isNormalWolf(role){

  return NORMAL_WOLF_ROLES.includes(role);

}

function isBetrayer(role){

  return BETRAYER_ROLES.includes(role);

}

function formatTime(sec){

  const m=

    Math.floor(sec/60);

  const s=

    sec%60;

  return(

    m+

    ":"+

    String(s).padStart(2,"0")

  );

}

/* =====================================================

   人狼表示

===================================================== */

function wolfDisplayName(player){

  return(

    `${escapeHTML(player.name)}（人狼）`

  );

}

/* =====================================================

   占い結果

===================================================== */

function seerResult(player){

  if(player.role==="妖狐"){

    return "人間";

  }

  if(isWolfRole(player.role)){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   霊媒結果

===================================================== */

function mediumResult(player){

  if(

    player.role==="人狼" ||

    player.role==="人狼の子ども" ||

    player.role==="一匹狼" ||

    player.role==="案山子"

  ){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(player.role==="アンドロイド"){

    return(

      androidCurrentAlignment(player)==="wolf"

        ? "人狼"

        : "人間"

    );

  }

  return "人間";

}

/* =====================================================

   アンドロイド

===================================================== */

function androidCurrentAlignment(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "human";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "human";

  }

  if(isWolfRole(target.role)){

    return "wolf";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "wolf";

  }

  return "human";

}

function androidRoleText(android){

  const targetId=

    game.android[android.id];

  if(targetId===undefined){

    return "まだコピーしていません";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "不明";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "人狼";

  }

  if(isWolfRole(target.role)){

    return "人狼";

  }

  return target.role;

}

/* =====================================================

   生存役職

===================================================== */

function hasLivingRole(role){

  return living().some(

    p=>p.role===role

  );

}

/* =====================================================

   ゲーム開始画面

===================================================== */

function startScreen(){

  render(`

  <div class="card">

    <h2>🎮 ゲーム設定</h2>

    <p>

      👥 人数

      <select id="playerCount">

        ${Array.from(

          {length:17},

          (_,i)=>

            `<option value="${i+4}">

              ${i+4}人

            </option>`

        ).join("")}

      </select>

    </p>

    <p>

      🔮 初日の予言

      <select id="firstSeer">

        <option value="yes">

          する

        </option>

        <option value="no">

          しない

        </option>

      </select>

    </p>

    <p>

      ⏱️ 議論時間

      <select id="discussion">

        <option value="180">

          3分

        </option>

        <option value="300" selected>

          5分

        </option>

        <option value="600">

          10分

        </option>

      </select>

    </p>

  </div>

  <div class="card">

    <h2>🃏 役職選択</h2>

    <p class="small">

      プレイヤー人数と役職カード枚数を合わせてください。

    </p>

    <div id="roleList">

      ${ROLES.map(

        (role,index)=>`

        <div class="role-row">

          <span>

            ${escapeHTML(role)}

          </span>

          <span>

            <button

              onclick="changeRole('${role}',-1)"

            >

              −

            </button>

            <span

              class="count"

              id="count${index}"

            >

              0

            </span>

            <button

              onclick="changeRole('${role}',1)"

            >

              ＋

            </button>

          </span>

        </div>

      `

      ).join("")}

    </div>

  </div>

  <button

    class="green"

    onclick="nameScreen()"

  >

    👤 プレイヤー名入力へ

  </button>

  `);

}

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  if(role==="騎士団" && value>3){

    value=3;

  }

  if(role==="案山子" && value>3){

    value=3;

  }

  if(role==="恋人" && value>2){

    value=2;

  }

  if(role==="共有者" && value>2){

    value=2;

  }

  if(

    role==="裏切りの共有者" &&

    value>2

  ){

    value=2;

  }

  game.roleCount[role]=value;

  const index=

    ROLES.indexOf(role);

  const el=

    document.getElementById(

      "count"+index

    );

  if(el){

    el.textContent=value;

  }

}

/* =====================================================

   名前入力

===================================================== */

function nameScreen(){

  const n=

    Number(

      document.getElementById(

        "playerCount"

      ).value

    );

  const saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      )||"[]"

    );

  game.players=[];

  for(

    let i=0;

    i<n;

    i++

  ){

    game.players.push({

      id:i,

      name:

        saved[i]||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      androidCopied:false,

      androidSource:null,

      converted:false,

      lover:false

    });

  }

  game.firstSeer=

    document.getElementById(

      "firstSeer"

    ).value==="yes";

  game.discussionTime=

    Number(

      document.getElementById(

        "discussion"

      ).value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small">

      前回の名前がある場合は自動で表示されます。

    </p>

    ${game.players.map(

      (p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="

          width:90%;

          margin:6px;

        "

      >

    `

    ).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🃏 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach(

    (p,i)=>{

      const el=

        document.getElementById(

          "playerName"+i

        );

      const name=

        el

          ? el.value.trim()

          : "";

      p.name=

        name||

        `プレイヤー${i+1}`;

    }

  );

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  if(

    deck.length!==game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `人数と役職枚数を合わせてください。`

    );

    return;

  }

  if(

    (game.roleCount["恋人"]||0)%2!==0

  ){

    alert(

      "恋人は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["共有者"]||0)!==0 &&

    (game.roleCount["共有者"]||0)!==2

  ){

    alert(

      "共有者は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["裏切りの共有者"]||0)!==0 &&

    (game.roleCount["裏切りの共有者"]||0)!==2

  ){

    alert(

      "裏切りの共有者は2枚ワンセットです。"

    );

    return;

  }

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach(

    (p,i)=>{

      p.role=deck[i];

      p.alive=true;

      p.cursedWolf=false;

      p.toughHit=false;

      p.blocked=false;

      p.androidCopied=false;

      p.androidSource=null;

      p.converted=false;

    }

  );

  preparePairs();

  game.confirmIndex=0;

  game.confirmRevealed=false;

  game.night=0;

  game.day=0;

  game.firstDay=true;

  game.lastExiled=null;

  roleConfirmation();

}

/* =====================================================

   恋人ペア設定

===================================================== */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(lovers[i+1]){

      const pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(pair);

      game.lovers.push(...pair);

    }

  }

}

/* =====================================================

   役職確認情報

===================================================== */

function roleInfoFor(player){

  let info="";

  /* 人狼仲間 */

  if(

    isWolfRole(player.role)

  ){

    const wolves=

      game.players.filter(

        x=>

          isWolfRole(x.role) &&

          x.id!==player.id

      );

    if(wolves.length){

      info+=`

      <div class="success">

        <strong>

          🐺 あなたが知っている人狼

        </strong>

        <p>

          ${wolves.map(

            wolfDisplayName

          ).join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 裏切りの共有者 */

  if(

    player.role==="裏切りの共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="裏切りの共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          😈 裏切りの共有者

        </strong>

        <p>

          ${mates.map(

            x=>escapeHTML(x.name)

          ).join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 共有者 */

  if(

    player.role==="共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          🤝 共有者

        </strong>

        <p>

          ${mates.map(

            x=>escapeHTML(x.name)

          ).join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 恋人 */

  if(

    player.role==="恋人"

  ){

    const pair=

      game.loverPairs.find(

        pair=>

          pair.includes(player.id)

      );

    if(pair){

      const mate=

        game.players.find(

          x=>

            x.id===

            pair.find(

              id=>id!==player.id

            )

        );

      if(mate){

        info+=`

        <div class="success">

          <strong>

            ❤️ 恋人

          </strong>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        </div>

        `;

      }

    }

  }

  /* 神様 */

  if(

    player.role==="神様"

  ){

    info+=`

    <div class="success">

      <strong>

        ✨ 全員の役職

      </strong>

      <p>

        ${game.players.map(

          x=>

            `${escapeHTML(x.name)}：

             ${escapeHTML(x.role)}`

        ).join("<br>")}

      </p>

    </div>

    `;

  }

  /* 内通者 */

  if(

    player.role==="内通者"

  ){

    const wolves=

      game.players.filter(

        x=>isWolfRole(x.role)

      );

    info+=`

    <div class="success">

      <strong>

        🐺 人狼

      </strong>

      <p>

        ${

          wolves.length

            ? wolves.map(

                wolfDisplayName

              ).join("・")

            : "なし"

        }

      </p>

    </div>

    `;

  }

  /* 予言者 */

  if(

    player.role==="予言者"

  ){

    info+=`

    <div class="warning">

      🔮 初日の予言：

      <strong>

        ${

          game.firstSeer

            ? "する"

            : "しない"

        }

      </strong>

    </div>

    `;

  }

  return info;

}
  /* =====================================================

   役職確認

===================================================== */

function roleConfirmation(){

  /*

    全員の確認が終わったら、

    夜ではなく「最初の昼の議論」へ進む。

  */

  if(

    game.confirmIndex>=game.players.length

  ){

    game.confirmRevealed=false;

    startFirstDay();

    return;

  }

  const p=

    game.players[

      game.confirmIndex

    ];

  const number=

    game.confirmIndex+1;

  const total=

    game.players.length;

  /*

    まだ見ていない状態

  */

  if(!game.confirmRevealed){

    render(`

    <div class="card">

      <div class="progress">

        ${number} / ${total}

      </div>

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <p style="text-align:center">

        あなたの役職を確認してください。

      </p>

      <button

        class="blue"

        onclick="revealRole()"

      >

        👀 役職を見る

      </button>

    </div>

    `);

    return;

  }

  /*

    役職を表示した状態

  */

  render(`

  <div class="card private">

    <div class="progress">

      ${number} / ${total}

    </div>

    <h2>

      ${escapeHTML(p.name)}さん

    </h2>

    <div class="big">

      ${escapeHTML(p.role)}

    </div>

    ${roleInfoFor(p)}

    <p class="small">

      この画面は本人だけが確認してください。

    </p>

  </div>

  <button

    class="green"

function startVote(){

  game.voteRound=

    game.voteRound||0;

    living();

  */

  if(voters.length<=1){

    game.voteRound=0;

    checkVictory();

    return;

  }

  let index=0;

  const votes={};

  /*

    投票者ごとに個別表示する。

    前の人の投票先は次の人には表示しない。

  */

  function nextVoter(){

    if(index>=voters.length){

      finishVote(votes);

      return;

    }

    const voter=

      voters[index++];

    const targets=

      voters.filter(

        p=>p.id!==voter.id

      );

    /*

      王様の場合は2票。

      それ以外は1票。

    */

    render(`

        >

          ${escapeHTML(target.name)}

        </button>

    `);

      function(id){

        const target=

          getPlayer(id);

        if(!target){

          return;

        }

        const value=

          voter.role==="王様"

            ? 2

            : 1;

        votes[id]=

          (votes[id]||0)+value;

        nextVoter();

      };

  }

  nextVoter();

}

function finishVote(votes){

  const ids=

    Object.keys(votes);

  if(!ids.length){

    game.voteRound=0;

    afterNoVote();

    return;

  }

  const max=

    Math.max(

      ...Object.values(votes)

    );

  const winners=

    ids.filter(

      id=>votes[id]===max

    );

  /*

    同票の場合

  */

  if(winners.length>1){

    /*

      まだ通常投票なら

      決選投票へ。

    */

    if(game.voteRound===0){

      game.voteRound=1;

      const names=

        winners.map(

          id=>

            escapeHTML(

              getPlayer(id).name

            )

        );

      speak(

        `同票です。${names.join("、")}さんで決選投票を行います。`

      );

      render(`

      <div class="card">

        <div class="vote-result">

          ⚖️ 同票です

        </div>

        <p style="text-align:center">

          ${names.join("、")}さんで

          決選投票を行います。

        </p>

      </div>

        class="orange"

        onclick='startDecisionVote(${JSON.stringify(winners)})'

      >

        ⚖️ 決選投票へ

      </button>

      `);

      return;

    }

    /*

      決選投票でも同票

    */

    game.voteRound=0;

    speak(

      "決選投票も同票でした。今回は追放なしです。"

    );

    render(`

    <div class="card">

      <div class="vote-result">

        ⚖️ 決選投票も同票

      <p style="text-align:center">

        今回は追放なしです。

      </p>

    </div>

    <button

      class="blue"

      onclick="afterNoVote()"

    >

      次へ

    </button>

    `);

    return;

  }

  game.voteRound=0;

  const target=

    getPlayer(winners[0]);

  if(!target){

    afterNoVote();

    return;

  }

  /*

    追放

  */

  target.alive=false;

  game.lastExiled=

    target.id;

  showExileResult(target);

}

function nightStep(){

  /*

    夜の13段階がすべて終わったら朝へ。

  */

  if(

    game.nightIndex>=NIGHT_ORDER.length

  ){

    morning();

    return;

  }

  const role=

    NIGHT_ORDER[game.nightIndex];

  game.nightIndex++;

  /*

    「裏切り者確認」は特殊な確認段階。

  */

  if(role==="裏切り者確認"){

    betrayerCheckStep();

    return;

  }

  /*

    採用されていない役職は呼ばない。

  */

  if(!hasRole(role)){

    nightStep();

    return;

  }

  /*

    採用されている役職なら、

    生存者がいなくても必ず呼び出す。

  */

  wakeRole(role);

}

/* =====================================================

   夜の役職行動

===================================================== */

function performNightRole(role){

  const actors=

    rolePlayers(role).filter(

      p=>p.alive

    );

  /*

    採用されているが死亡している場合は、

    呼び出しだけして、そのまま次へ。

  */

  if(!actors.length){

    nightStep();

    return;

  }

  const actor=actors[0];

  if(role==="呪われた者"){

    nightStep();

    return;

  }

  if(role==="スパイ"){

    spyAction(actor);

    return;

  }

  if(role==="アンドロイド"){

    androidAction(actor);

    return;

  }

  if(role==="罠師"){

    trapAction(actor);

    return;

  }

  if(role==="ボディーガード"){

    bodyguardAction(actor);

    return;

  }

  if(role==="騎士団"){

    knightAction(actor);

    return;

  }

  if(role==="人狼"){

    wolfAction(actor);

    return;

  }

  if(role==="裏切りの襲撃者"){

    raiderAction(actor);

    return;

  }

  if(role==="カウンセラー"){

    counselorAction(actor);

    return;

  }

  if(role==="奇術師"){

    magicAction(actor);

    return;

  }

  if(role==="予言者"){

    seerAction(actor);

    return;

  }

  if(role==="霊媒師"){

    mediumAction(actor);

    return;

  }

  nightStep();

}

    `;

  }

  html+=`

  </div>

  `;

  render(html);

}

/* =====================================================

   朝の処理

===================================================== */

function morning(){

  /*

    夜の結果をまとめて処理する。

  */

  const deaths=[];

  /*

    タフガイの前夜ダメージ処理。

  */

  if(game.toughPending.length){

    const pending=

      [...game.toughPending];

    game.toughPending=[];

    pending.forEach(

      id=>{

        const p=

          getPlayer(id);

        if(

          p &&

          p.alive &&

          p.toughHit

        ){

          p.alive=false;

          deaths.push(p);

        }

      }

    );

  }

  /*

    人狼の襲撃先。

    奇術師が使用された場合は変更。

  */

  let wolfTarget=

    game.wolfTarget;

  if(

    game.magicUsed &&

    game.magicTarget!==null

  ){

    wolfTarget=

      game.magicTarget;

  }

  /*

    人狼の襲撃。

  */

  if(wolfTarget!==null){

    const target=

      getPlayer(wolfTarget);

    if(

      target &&

      target.alive

    ){

      /*

        ボディーガードが守っていた場合。

      */

      if(

        game.guardTarget===target.id

      ){

        /*

          ボディーガードは罠の影響を受けない。

          守られた対象への通常襲撃は失敗。

        */

      }

      /*

        騎士団が守っていた場合。

      */

      else if(

        game.knightTarget===target.id

      ){

        /*

          騎士団の守りで襲撃失敗。

        */

      }

      /*

        罠が仕掛けられていた場合。

      */

      else if(

        game.trapActive &&

        game.trapTarget===target.id

      ){

        /*

          ボディーガードには罠が効かない。

        */

        if(target.role==="ボディーガード"){

          const trapOwner=

            game.trapOwner!==null

              ? getPlayer(game.trapOwner)

              : null;

          /*

            ボディーガード自身には

            罠の効果なし。

          */

          if(

            killPlayer(target) &&

            !deaths.includes(target)

          ){

            deaths.push(target);

          }

        }

        else{

          /*

            罠対象を襲撃した人狼側が死亡する。

            人狼が複数いる場合はランダムで1人。

          */

          const wolves=

            living().filter(

              p=>isWolfRole(p.role)

            );

          if(wolves.length){

            const victim=

              wolves[

                Math.floor(

                  Math.random()*wolves.length

                )

              ];

            if(killPlayer(victim)){

              deaths.push(victim);

            }

          }

        }

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    裏切りの襲撃者による襲撃。

  */

  if(

    game.raiderTarget!==null

  ){

    const target=

      getPlayer(game.raiderTarget);

    if(

      target &&

      target.alive

    ){

      /*

        ボディーガード。

      */

      if(

        game.guardTarget===target.id

      ){

        /* 守られているので失敗 */

      }

      /*

        騎士団。

      */

      else if(

        game.knightTarget===target.id

      ){

        /* 守られているので失敗 */

      }

      /*

        罠。

      */

      else if(

        game.trapActive &&

        game.trapTarget===target.id

      ){

        if(

          target.role==="ボディーガード"

        ){

          /*

            ボディーガードには罠が効かない。

          */

          if(

            killPlayer(target) &&

            !deaths.includes(target)

          ){

            deaths.push(target);

          }

        }

        else{

          const attacker=

            living().filter(

              p=>

                p.role==="裏切りの襲撃者"

            );

          if(attacker.length){

            const victim=

              attacker[

                Math.floor(

                  Math.random()*attacker.length

                )

              ];

            if(killPlayer(victim)){

              deaths.push(victim);

            }

          }

        }

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    妖狐を占った場合は

    予言者によってすでに死亡済み。

  */

  const allDeadIds=

    deaths.map(

      p=>p.id

    );

  /*

    恋人の道連れ処理。

  */

  deaths.forEach(

    dead=>{

      const pairs=

        game.loverPairs.filter(

          pair=>

            pair.includes(dead.id)

        );

      pairs.forEach(

        pair=>{

          pair.forEach(

            id=>{

              if(id===dead.id){

                return;

              }

              const lover=

                getPlayer(id);

              if(

                lover &&

                lover.alive

              ){

                lover.alive=false;

                if(

                  !allDeadIds.includes(lover.id)

                ){

                  deaths.push(lover);

                }

              }

            }

          );

        }

      );

    }

  );

  /*

    朝の表示へ。

  */

  morningResult(deaths);

}

  /*

/* =====================================================

   勝利判定

===================================================== */

function checkVictory(){

  const alive=

    living();

  const wolves=

    alive.filter(

      p=>isWolfRole(p.role)

    );

  const humans=

    alive.filter(

      p=>!isWolfRole(p.role)

    );

  /*

    妖狐が生存していて、

    人狼が勝利条件を満たした場合は

    妖狐勝利を優先。

  */

  const fox=

    alive.find(

      p=>p.role==="妖狐"

    );

  /*

    人狼全滅

  */

  if(wolves.length===0){

    if(fox){

      showVictory(

        "🦊 妖狐陣営の勝利！",

        "妖狐が最後まで生き残りました。"

      );

    }

    else{

      showVictory(

        "👥 市民陣営の勝利！",

        "すべての人狼を倒しました。"

      );

    }

    return true;

  }

  /*

    人狼数が市民数以上。

  */

  if(

    wolves.length>=humans.length

  ){

    if(fox){

      showVictory(

        "🦊 妖狐陣営の勝利！",

        "妖狐が生き残ったまま人狼が勝利条件に到達しました。"

      );

    }

    else{

      showVictory(

        "🐺 人狼陣営の勝利！",

        "人狼の数が市民側の人数以上になりました。"

      );

    }

    return true;

  }

  return false;

}

/* =====================================================

function performNightRole(role){

  const actors=

    rolePlayers(role).filter(

      p=>p.alive

    );

  /*

    採用されている役職でも

    生存者がいなければ次へ進む。

  */

  if(!actors.length){

    nightStep();

    return;

/* =====================================================

   死亡処理

===================================================== */

function killPlayer(player){

  if(

    !player ||

    !player.alive

  ){

    return false;

  }

  /*

    タフガイは最初の襲撃では

    その夜に死亡しない。

  */

  if(

    player.role==="タフガイ" &&

    !player.toughHit

  ){

    player.toughHit=true;

    if(

      !game.toughPending.includes(

        player.id

      )

    ){

      game.toughPending.push(

        player.id

      );

    }

    return false;

  }

  player.alive=false;

  return true;

}

/* =====================================================

   タフガイ翌日死亡処理

===================================================== */

function processToughPending(){

  if(

    !game.toughPending ||

    !game.toughPending.length

  ){

    return;

  }

  game.toughPending.forEach(

    id=>{

      const p=

        getPlayer(id);

      if(

        p &&

        p.alive &&

        p.toughHit

      ){

        p.alive=false;

      }

    }

  );

  game.toughPending=[];

}

/* =====================================================

   夜の襲撃処理

===================================================== */

function resolveNightDeaths(){

  /*

    人狼の襲撃先。

    奇術師が使用されていれば

    襲撃先を変更する。

  */

  let wolfTarget=

    game.wolfTarget;

  if(

    game.magicUsed &&

    game.magicTarget!==null

  ){

    wolfTarget=

      game.magicTarget;

  }

  const deaths=[];

  /*

    人狼の襲撃

  */

  if(

    wolfTarget!==null &&

    wolfTarget!==undefined

  ){

    const target=

      getPlayer(wolfTarget);

    if(

      target &&

      target.alive

    ){

      /*

        ボディーガードが守っている。

      */

      if(

        game.guardTarget===target.id

      ){

        /* 守られる */

      }

      /*

        騎士団が守っている。

      */

      else if(

        game.knightTarget===target.id

      ){

        /* 守られる */

      }

      /*

        罠師の罠。

      */

      else if(

        game.trapActive &&

        game.trapTarget===target.id

      ){

        /*

          ボディーガードには罠が効かない。

          それ以外の場合、

          人狼側からランダムに1人死亡。

        */

        if(

          target.role==="ボディーガード"

        ){

          killPlayer(target);

        }

        else{

          const wolves=

            living().filter(

              p=>isWolfRole(p.role)

            );

          if(wolves.length){

            const deadWolf=

              wolves[

                Math.floor(

                  Math.random()*

                  wolves.length

                )

              ];

            if(

              killPlayer(deadWolf)

            ){

              deaths.push(

                deadWolf

              );

            }

          }

        }

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    裏切りの襲撃者による襲撃。

  */

  if(

    game.raiderTarget!==null &&

    game.raiderTarget!==undefined

  ){

    const target=

      getPlayer(game.raiderTarget);

    if(

      target &&

      target.alive

    ){

      if(

        game.guardTarget===target.id ||

        game.knightTarget===target.id

      ){

        /* 守られる */

      }

      else{

        if(

          killPlayer(target)

        ){

          deaths.push(target);

        }

      }

    }

  }

  /*

    重複死亡を整理。

  */

  const uniqueDeaths=[];

  deaths.forEach(

    p=>{

      if(

        !uniqueDeaths.some(

          x=>x.id===p.id

        )

      ){

        uniqueDeaths.push(p);

      }

    }

  );

  return uniqueDeaths;

}

/* =====================================================

   恋人の道連れ

===================================================== */

function resolveLoverDeaths(deaths){

  const result=[

    ...deaths

  ];

  deaths.forEach(

    dead=>{

      const pair=

        game.loverPairs.find(

          pair=>pair.includes(dead.id)

        );

      if(!pair){

        return;

      }

      pair.forEach(

        id=>{

          if(id===dead.id){

            return;

          }

          const lover=

            getPlayer(id);

          if(

            lover &&

            lover.alive

          ){

            lover.alive=false;

            if(

              !result.some(

                p=>p.id===lover.id

              )

            ){

              result.push(lover);

            }

          }

        }

      );

    }

  );

  return result;

}

function checkVictory(){

  const alive=

    );

  const humans=

    alive.filter(

      p=>!isWolfRole(p.role)

  if(wolves.length===0){

    return showVictory(

      "市民陣営の勝利！",

      "人狼が全員いなくなりました。"

    );

  }

  /*

  if(

    wolves.length>=humans.length

  ){

    return showVictory(

      "人狼陣営の勝利！",

      "人狼が生存者を上回りました。"

    );

  }

  return false;

}

function formatTime(seconds){

    seconds%60;

  return String(min).padStart(2,"0")

    +":"

}

/* =====================================================

   アプリ本体

===================================================== */

const app=

  document.getElementById("app");

/* =====================================================

   基本関数

===================================================== */

function escapeHTML(text){

  return String(text).replace(

    /[&<>"']/g,

    function(c){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[c];

    }

  );

}

function speak(text){

  if(

    "speechSynthesis" in window

  ){

    speechSynthesis.cancel();

    const u=

      new SpeechSynthesisUtterance(

        text

      );

    u.lang="ja-JP";

    u.rate=1;

    speechSynthesis.speak(u);

  }

}

function render(html){

  app.innerHTML=html;

}

function living(){

  return game.players.filter(

    p=>p.alive

  );

}

function rolePlayers(role){

  return game.players.filter(

    p=>p.role===role

  );

}

function hasRole(role){

  return rolePlayers(role).length>0;

}

function getPlayer(id){

  return game.players.find(

    p=>p.id===Number(id)

  );

}

function isWolfRole(role){

  return WOLF_ROLES.includes(role);

}

function isNormalWolf(role){

  return NORMAL_WOLF_ROLES.includes(role);

}

function isBetrayer(role){

  return BETRAYER_ROLES.includes(role);

}

/* =====================================================

   占い結果

===================================================== */

function seerResult(player){

  if(

    player.role==="妖狐"

  ){

    return "人間";

  }

  if(

    isWolfRole(player.role)

  ){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(

    player.role==="アンドロイド"

  ){

    return

      androidCurrentAlignment(player)==="wolf"

      ? "人狼"

      : "人間";

  }

  return "人間";

}

/* =====================================================

   霊媒結果

===================================================== */

function mediumResult(player){

  if(

    player.role==="人狼" ||

    player.role==="人狼の子ども" ||

    player.role==="一匹狼" ||

    player.role==="案山子"

  ){

    return "人狼";

  }

  if(

    player.role==="呪われた者" &&

    player.cursedWolf

  ){

    return "人狼";

  }

  if(

    player.role==="アンドロイド"

  ){

    return

      androidCurrentAlignment(player)==="wolf"

      ? "人狼"

      : "人間";

  }

  return "人間";

}

/* =====================================================

   アンドロイド

===================================================== */

function androidCurrentAlignment(android){

  const targetId=

    game.android[android.id];

  if(

    targetId===undefined

  ){

    return "human";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "human";

  }

  if(

    isWolfRole(target.role)

  ){

    return "wolf";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "wolf";

  }

  return "human";

}

function androidRoleText(android){

  const targetId=

    game.android[android.id];

  if(

    targetId===undefined

  ){

    return "まだコピーしていません";

  }

  const target=

    getPlayer(targetId);

  if(!target){

    return "不明";

  }

  if(

    target.role==="呪われた者" &&

    target.cursedWolf

  ){

    return "人狼";

  }

  if(

    isWolfRole(target.role)

  ){

    return "人狼";

  }

  return target.role;

}

/* =====================================================

   役職確認情報

===================================================== */

function wolfDisplayName(player){

  return

    `${escapeHTML(player.name)}（人狼）`;

}

function roleInfoFor(player){

  let info="";

  /* 人狼同士 */

  if(

    isWolfRole(player.role)

  ){

    const wolves=

      game.players.filter(

        x=>

          isWolfRole(x.role) &&

          x.id!==player.id

      );

    if(wolves.length){

      info+=`

      <div class="success">

        <strong>

          🐺 あなたが知っている人狼

        </strong>

        <p>

          ${wolves

            .map(wolfDisplayName)

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 内通者 */

  if(

    player.role==="内通者"

  ){

    const wolves=

      game.players.filter(

        x=>isWolfRole(x.role)

      );

    info+=`

    <div class="success">

      <strong>📨 人狼</strong>

      <p>

        ${

          wolves.length

          ? wolves

              .map(wolfDisplayName)

              .join("・")

          : "なし"

        }

      </p>

    </div>

    `;

  }

  /* 裏切りの共有者 */

  if(

    player.role==="裏切りの共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="裏切りの共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          🤝 裏切りの共有者

        </strong>

        <p>

          ${mates

            .map(

              x=>escapeHTML(x.name)

            )

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 共有者 */

  if(

    player.role==="共有者"

  ){

    const mates=

      game.players.filter(

        x=>

          x.role==="共有者" &&

          x.id!==player.id

      );

    if(mates.length){

      info+=`

      <div class="success">

        <strong>

          🤝 共有者

        </strong>

        <p>

          ${mates

            .map(

              x=>escapeHTML(x.name)

            )

            .join("・")}

        </p>

      </div>

      `;

    }

  }

  /* 恋人 */

  if(

    player.role==="恋人"

  ){

    const pair=

      game.loverPairs.find(

        pair=>pair.includes(player.id)

      );

    if(pair){

      const mate=

        game.players.find(

          x=>

            x.id===

            pair.find(

              id=>id!==player.id

            )

        );

      if(mate){

        info+=`

        <div class="success">

          <strong>

            ❤️ 恋人

          </strong>

          <p>

            ${escapeHTML(mate.name)}

          </p>

        </div>

        `;

      }

    }

  }

  /* 神様 */

  if(

    player.role==="神様"

  ){

    info+=`

    <div class="success">

      <strong>

        ✨ 全員の役職

      </strong>

      <p>

        ${game.players.map(

          x=>

            `${escapeHTML(x.name)}：

            ${escapeHTML(x.role)}`

        ).join("<br>")}

      </p>

    </div>

    `;

  }

  /* 予言者 */

  if(

    player.role==="予言者"

  ){

    info+=`

    <div class="warning">

      🔮 初日の予言：

      <strong>

        ${

          game.firstSeer

          ? "する"

          : "しない"

        }

      </strong>

    </div>

    `;

  }

  return info;

}

/* =====================================================

   役職枚数変更

===================================================== */

function changeRole(role,diff){

  let value=

    game.roleCount[role]||0;

  value+=diff;

  if(value<0){

    value=0;

  }

  if(

    role==="騎士団" &&

    value>3

  ){

    value=3;

  }

  if(

    role==="案山子" &&

    value>3

  ){

    value=3;

  }

  if(

    role==="恋人" &&

    value>2

  ){

    value=2;

  }

  if(

    role==="共有者" &&

    value>2

  ){

    value=2;

  }

  if(

    role==="裏切りの共有者" &&

    value>2

  ){

    value=2;

  }

  game.roleCount[role]=value;

  const index=

    ROLES.indexOf(role);

  const el=

    document.getElementById(

      "count"+index

    );

  if(el){

    el.textContent=value;

  }

}

/* =====================================================

   名前入力

===================================================== */

function nameScreen(){

  const n=

    Number(

      document.getElementById(

        "playerCount"

      ).value

    );

  const saved=

    JSON.parse(

      localStorage.getItem(

        "jinroNames"

      )||"[]"

    );

  game.players=[];

  for(

    let i=0;

    i<n;

    i++

  ){

    game.players.push({

      id:i,

      name:

        saved[i] ||

        `プレイヤー${i+1}`,

      role:"",

      alive:true,

      cursedWolf:false,

      toughHit:false,

      blocked:false,

      androidCopied:false

    });

  }

  game.firstSeer=

    document.getElementById(

      "firstSeer"

    ).value==="yes";

  game.discussionTime=

    Number(

      document.getElementById(

        "discussion"

      ).value

    );

  render(`

  <div class="card">

    <h2>👤 プレイヤー名</h2>

    <p class="small">

      前回の名前がある場合は

      自動で表示されます。

    </p>

    ${game.players.map(

      (p,i)=>`

      <input

        id="playerName${i}"

        value="${escapeHTML(p.name)}"

        placeholder="プレイヤー${i+1}"

        style="

          width:90%;

          margin:6px;

          padding:10px;

        "

      >

    `

    ).join("")}

  </div>

  <button

    class="green"

    onclick="dealRoles()"

  >

    🃏 役職を配布

  </button>

  `);

}

/* =====================================================

   役職配布

===================================================== */

function dealRoles(){

  game.players.forEach(

    (p,i)=>{

      const el=

        document.getElementById(

          "playerName"+i

        );

      const name=

        el

        ? el.value.trim()

        : "";

      p.name=

        name ||

        `プレイヤー${i+1}`;

    }

  );

  localStorage.setItem(

    "jinroNames",

    JSON.stringify(

      game.players.map(

        p=>p.name

      )

    )

  );

  let deck=[];

  Object.entries(

    game.roleCount

  ).forEach(

    ([role,count])=>{

      for(

        let i=0;

        i<count;

        i++

      ){

        deck.push(role);

      }

    }

  );

  if(

    deck.length!==game.players.length

  ){

    alert(

      `役職カードが${deck.length}枚です。\n\n`+

      `プレイヤーは${game.players.length}人です。\n\n`+

      `人数と役職枚数を合わせてください。`

    );

    return;

  }

  if(

    (game.roleCount["恋人"]||0)%2!==0

  ){

    alert(

      "恋人は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["共有者"]||0)!==0 &&

    (game.roleCount["共有者"]||0)!==2

  ){

    alert(

      "共有者は2枚ワンセットです。"

    );

    return;

  }

  if(

    (game.roleCount["裏切りの共有者"]||0)!==0 &&

    (game.roleCount["裏切りの共有者"]||0)!==2

  ){

    alert(

      "裏切りの共有者は2枚ワンセットです。"

    );

    return;

  }

  deck.sort(

    ()=>Math.random()-0.5

  );

  game.players.forEach(

    (p,i)=>{

      p.role=deck[i];

      p.alive=true;

      p.cursedWolf=false;

      p.toughHit=false;

      p.blocked=false;

      p.androidCopied=false;

    }

  );

  preparePairs();

  game.confirmIndex=0;

  game.confirmRevealed=false;

  roleConfirmation();

}

/* =====================================================

   恋人・ペア設定

===================================================== */

function preparePairs(){

  game.lovers=[];

  game.loverPairs=[];

  const lovers=

    game.players.filter(

      p=>p.role==="恋人"

    );

  for(

    let i=0;

    i<lovers.length;

    i+=2

  ){

    if(

      lovers[i+1]

    ){

      const pair=[

        lovers[i].id,

        lovers[i+1].id

      ];

      game.loverPairs.push(pair);

      game.lovers.push(

        ...pair

      );

    }

  }

}

/* =====================================================

   役職確認

===================================================== */

function roleConfirmation(){

  /*

    全員の確認が終わったら

    必ず最初の昼へ。

  */

  if(

    game.confirmIndex>=

    game.players.length

  ){

    game.confirmRevealed=false;

    startFirstDay();

    return;

  }

  const p=

    game.players[

      game.confirmIndex

    ];

  const number=

    game.confirmIndex+1;

  const total=

    game.players.length;

  if(

    !game.confirmRevealed

  ){

    render(`

    <div class="card">

      <div class="progress">

        ${number} / ${total}

      </div>

      <h2>

        ${escapeHTML(p.name)}さん

      </h2>

      <p>

        あなたの役職を

        確認してください。

      </p>

      <button

        class="blue"

        onclick="revealRole()"

      >

        👀 役職を見る

      </button>

    </div>

    `);

    return;

  }

  render(`

  <div class="card private">

    <div class="progress">

      ${number} / ${total}

    </div>

    <h2>

      ${escapeHTML(p.name)}さん

    </h2>

    <div class="big">

      ${escapeHTML(p.role)}

    </div>

    ${roleInfoFor(p)}

    <p class="small">

      この画面は本人だけが

      確認してください。

    </p>

  </div>

  <button

    class="green"

    onclick="finishRoleConfirmation()"

  >

    ✅ 確認しました

  </button>

  `);

}

/* =====================================================

   役職表示

===================================================== */

function revealRole(){

  game.confirmRevealed=true;

  roleConfirmation();

}

/* =====================================================

   役職確認終了

===================================================== */

function finishRoleConfirmation(){

  game.confirmRevealed=false;

  game.confirmIndex++;

  roleConfirmation();

}

/* =====================================================

   初日の昼

===================================================== */

function startFirstDay(){

  game.day=1;

  game.night=0;

  game.firstDay=true;

  game.discussionEnded=false;

  speak(

    "役職の確認が終わりました。みなさん目を覚ましてください。お昼です。議論スタート。"

  );

  setTimeout(

    ()=>{

      startDiscussion(true);

    },

    700

  );

}

/* =====================================================

   最初の画面を表示

===================================================== */


startScreen();

</script>
