<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐺 人狼コンプリートGM</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f4f7;color:#222}.wrap{max-width:720px;margin:auto}.screen{display:none}.active{display:block}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #0001}button,select,input{font:inherit}button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#333;color:#fff;font-weight:bold}button.ok{background:#2e7d32}button.sel{background:#1976d2}button.sub{background:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.info,.result,.notice{padding:12px;border-radius:12px;margin:10px 0}.info{background:#e3f2fd}.notice{background:#fff3cd}.result{background:#eee;font-size:18px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:4px 0}.roleRow{display:flex;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:6px}.roleName{flex:1}.counter{display:flex;align-items:center;gap:4px}.counter button{width:42px;margin:0;padding:8px}.num{width:30px;text-align:center;font-weight:bold}.night{background:#202124;color:#fff;border-radius:18px;padding:20px}.target{display:grid;grid-template-columns:1fr 1fr;gap:8px}.target button{margin:0;background:#444}.roleCard{background:#222;color:white;text-align:center;border-radius:18px;padding:24px;margin:12px 0}.icon{font-size:52px}.title{font-size:27px;font-weight:bold}.vote{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.modal .card{width:100%;max-width:600px;max-height:90vh;overflow:auto}
</style></head><body><div class="wrap">
<div id="setup" class="screen active"><div class="card"><h1>🐺 人狼コンプリートGM</h1><div class="grid"><button onclick="mode('card')">🃏 カードあり</button><button onclick="mode('app')">📱 カードなし</button></div><div id="mode" class="info">方式を選んでください。</div></div><button class="ok" onclick="count()">次へ ▶</button></div>
<div id="count" class="screen"><div class="card"><h2>👥 人数</h2><select id="pc"></select></div><button onclick="names()">次へ ▶</button><button class="sub" onclick="show('setup')">戻る</button></div>
<div id="names" class="screen"><div class="card"><h2>👥 プレイヤー名</h2><div id="namebox"></div></div><button class="ok" onclick="saveNames()">役職設定へ ▶</button></div>
<div id="roles" class="screen"><div class="card"><h2>🎴 役職設定</h2><div class="info">役職は➖➕で枚数を設定。恋人は後で兼用設定します。</div><div id="rolebox"></div><p class="result">合計 <b id="total">0</b> / <span id="need">0</span></p></div><button class="ok" onclick="rolesDone()">役職を確定 ▶</button></div>
<div id="lover" class="screen"><div class="card"><h2>❤️ 恋人設定</h2><div class="info">恋人は他の役職との兼用ができます。</div><div class="grid"><button id="ly" onclick="lover(true)">❤️ 兼用する</button><button id="ln" onclick="lover(false)">しない</button></div><div id="loverbox"></div></div><button class="ok" onclick="setupDone()">次へ ▶</button></div>
<div id="options" class="screen"><div class="card"><h2>⚙️ ゲーム設定</h2><label>昼の議論時間<select id="mins"><option value="0">なし</option><option value="3">3分</option><option value="5" selected>5分</option><option value="7">7分</option><option value="10">10分</option></select></label><p><label><input type="checkbox" id="first" checked> 役職確認時に初日の占いをする</label></p></div><button class="ok" onclick="begin()">🎴 役職確認へ</button></div>
<div id="confirm" class="screen"><div class="card"><h2>🎴 役職確認</h2><div id="confirmBox"></div></div></div>
<div id="night" class="screen"><div class="card"><h2>🌙 夜</h2><div id="nightBox"></div></div></div>
<div id="day" class="screen"><div class="card"><h2>☀️ 昼</h2><div id="dayBox"></div></div></div>
<div id="vote" class="screen"><div class="card"><h2>🗳️ 投票</h2><div id="voteBox"></div></div></div>
<div id="end" class="screen"><div class="card"><h2>🏆 ゲーム終了</h2><div id="endBox"></div><button onclick="location.reload()">もう一度</button></div></div>
</div><div id="modal" class="modal"><div class="card" id="modalBox"></div></div>
<script>
const D=[
["citizen","市民","👤","市民陣営"],["werewolf","人狼","🐺","人狼陣営"],["wolf_child","人狼の子ども","🐺","人狼陣営"],["traitor","裏切り者","😈","人狼陣営"],["shared_traitor","裏切りの共有者","🤝","人狼陣営"],["informant","内通者","📨","人狼陣営"],["attacker_traitor","裏切りの襲撃者","🐺","人狼陣営"],["spy","スパイ","🕵️","人狼陣営"],["seer","予言者","🔮","市民陣営"],["bodyguard","ボディーガード","🛡️","市民陣営"],["medium","霊媒師","👻","市民陣営"],["hunter","ハンター","🏹","市民陣営"],["shared","共有者","🤝","市民陣営"],["dictator","独裁者","👑","市民陣営"],["tough","タフガイ","💪","市民陣営"],["counselor","カウンセラー","💭","市民陣営"],["knight_group","騎士団","⚔️","市民陣営"],["shadow","影武者","🥷","市民陣営"],["king","王様","👑","市民陣営"],["magician","奇術師","🎩","市民陣営"],["fox","妖狐","🦊","妖狐陣営"],["god","神様","✨","単独陣営"],["lone_wolf","一匹狼","🐺","単独陣営"],["android","アンドロイド","🤖","特殊陣営"],["scarecrow","案山子","🪵","特殊陣営"],["cursed","呪われた者","💀","市民→人狼"],["trap","罠師","🪤","市民陣営"]];
const desc={seer:"夜に1人を占う。妖狐は人間と表示され、占われると死亡。",bodyguard:"自分自身は守れず、同じ人を2夜連続で守れない。罠師の罠は効かない。",spy:"人狼を知らず、人狼からも分からない。市民陣営の役職者を選び、その役職を1回だけ妨害する。",counselor:"毎晩1人をカウンセリング。裏切り者系なら市民に改心。人狼を選ぶとカウンセラーが死亡。占い・霊媒では人間。",traitor:"人狼を知らず、人狼からも分からない。",shared_traitor:"2枚セット。互いを知る。人狼は知らない。",informant:"人狼・人狼の子ども・一匹狼を知る。",attacker_traitor:"人狼とは別に夜1人を襲撃する。",wolf_child:"昼に追放されるとその夜の人狼側襲撃が2回。",knight_group:"2～3枚。互いを知り、自分自身も守れる。",magician:"1回だけ人狼の襲撃先を変更。変更先は必ず死亡。",tough:"人狼襲撃ではその夜死なず、翌日の夜に死亡。昼追放なら夜死亡しない。",hunter:"死亡確定時に1人を道連れ。",android:"役職確認時に1人をコピー。コピー対象死亡時に道連れ。",cursed:"人狼系に襲撃されてもその夜は死亡せず、翌夜から人狼。",trap:"1人に罠。人狼が罠対象を襲うと人狼側が死亡。ボディーガードには効かない。",lover:"他役職と兼用可能。恋人同士は互いを知り、片方が死亡するともう片方も死亡。"};
let S={players:[],counts:{},a:[],lover:false,lovers:[],ci:0,night:0,ai:0,ns:{},blocked:{},prevBG:null,prevTrap:null,usedMag:false,first:true,mins:5,lastExec:null,dayDeaths:[],wolfExtra:false,tough:[]};
const $=x=>document.getElementById(x),show=x=>{document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));$(x).classList.add("active")},esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";speechSynthesis.speak(u)}}
function mode(x){S.mode=x;$("mode").textContent=x==="card"?"カードありで進行します。":"カードなしで進行します。"}
function count(){let s="";for(let i=4;i<=28;i++)s+=`<option value="${i}">${i}人</option>`;$("pc").innerHTML=s;show("count")}
function names(){let n=+$("pc").value,old=JSON.parse(localStorage.getItem("jnames")||"[]");$("namebox").innerHTML=Array.from({length:n},(_,i)=>`<input id="n${i}" value="${esc(old[i]||"プレイヤー"+(i+1))}" placeholder="プレイヤー${i+1}">`).join("");show("names")}
function saveNames(){let n=+$("pc").value,v=Array.from({length:n},(_,i)=>$("n"+i).value.trim());if(v.some(x=>!x)||new Set(v).size<n)return alert("全員の名前を入力し、重複をなくしてください。");S.players=v;localStorage.setItem("jnames",JSON.stringify(v));buildRoles();show("roles")}
function buildRoles(){let h="";D.forEach(x=>{let max=x[0]==="shared"||x[0]==="shared_traitor"?2:x[0]==="knight_group"||x[0]==="scarecrow"?3:1;h+=`<div class="roleRow"><div class="roleName">${x[2]} <b>${x[1]}</b><small>${x[3]}</small></div><div class="counter"><button onclick="chg('${x[0]}',-1,${max})">−</button><span class="num" id="c${x[0]}">0</span><button onclick="chg('${x[0]}',1,${max})">＋</button></div></div>`});$("rolebox").innerHTML=h;$("need").textContent=S.players.length}
function chg(id,d,max){S.counts[id]=Math.max(0,Math.min(max,(S.counts[id]||0)+d));$("c"+id).textContent=S.counts[id];$("total").textContent=Object.values(S.counts).reduce((a,b)=>a+b,0)}
function rolesDone(){let t=Object.values(S.counts).reduce((a,b)=>a+b,0);if(t!==S.players.length)return alert(`役職は${S.players.length}枚必要です。現在${t}枚です。`);for(let id of ["shared","shared_traitor"])if(S.counts[id]&&S.counts[id]!==2)return alert("共有者系は2枚セットです。");show("lover");lover(false)}
function lover(v){S.lover=v;$("ly").classList.toggle("sel",v);$("ln").classList.toggle("sel",!v);if(v)$("loverbox").innerHTML=`<p>恋人にする2人を選択：</p><div class="grid">${S.players.map((p,i)=>`<button id="l${i}" onclick="lpick(${i})">${esc(p)}</button>`).join("")}</div>`;else $("loverbox").innerHTML=""}
function lpick(i){let b=$("l"+i),q=[...document.querySelectorAll("#loverbox button.sel")];if(b.classList.contains("sel"))return b.classList.remove("sel");if(q.length>=2)return alert("恋人は2人です。");if((S.counts.scarecrow||0)>0)return alert("案山子は恋人と兼用できません。");b.classList.add("sel")}
function setupDone(){if(S.lover){let b=[...document.querySelectorAll("#loverbox button.sel")];if(b.length!==2)return alert("恋人を2人選んでください。");S.lovers=b.map(x=>S.players[[...document.querySelectorAll("#loverbox button")].indexOf(x)])}else S.lovers=[];show("options")}
function begin(){S.first=$("first").checked;S.mins=+$("mins").value;let deck=[];for(let [id,n] of Object.entries(S.counts))for(let i=0;i<n;i++)deck.push(id);deck.sort(()=>Math.random()-.5);S.a=S.players.map((p,i)=>({player:p,role:deck[i],alive:true,converted:false,tough:false}));S.ci=0;confirm()}
function partner(p){return S.lovers.find(x=>x!==p)}function loverOf(p){return S.lovers.includes(p)}function wolf(a){return ["werewolf","wolf_child","lone_wolf"].includes(a.role)||(a.role==="cursed"&&a.converted)}function traitor(a){return ["traitor","shared_traitor","informant","attacker_traitor"].includes(a.role)}
function rr(id){return D.find(x=>x[0]===id)}
function confirm(){let a=S.a[S.ci],r=rr(a.role);let h=`<h3>${esc(a.player)}さん</h3><div class="notice">他の人は画面を見ないでください。</div><button onclick="reveal()">👁️ 役職を見る</button>`;$("confirmBox").innerHTML=h;show("confirm")}
function reveal(){let a=S.a[S.ci],r=rr(a.role),h=`<h3>${esc(a.player)}さん</h3><div class="roleCard"><div class="icon">${r[2]}</div><div class="title">${r[1]}${loverOf(a.player)?" ❤️":""}</div><div>${r[3]}</div></div><div class="info">${desc[a.role]||"能力を確認してください。"}${loverOf(a.player)?`<br>❤️ 恋人：${esc(partner(a.player))}さん`:""}</div>`;
if(a.role==="god")h+=`<div class="result">${S.a.map(x=>esc(x.player)+"："+rr(x.role)[1]).join("<br>")}</div>`;
if(a.role==="android"&&!S.androidTarget)h+=`<p>コピーする人：</p><div class="target">${S.a.filter(x=>x.player!==a.player).map(x=>`<button onclick="android('${encodeURIComponent(x.player)}')">${esc(x.player)}</button>`).join("")}</div>`;
else if(a.role==="seer"&&S.first)h+=`<div class="notice">🔮 初日の占いはここで行います。</div><div class="target">${S.a.filter(x=>x.player!==a.player&&x.alive).map(x=>`<button onclick="firstseer('${encodeURIComponent(x.player)}')">${esc(x.player)}</button>`).join("")}</div>`;
else h+=`<button class="ok" onclick="nextConfirm()">確認しました ▶</button>`;$("confirmBox").innerHTML=h}
function android(e){S.androidTarget=decodeURIComponent(e);S.androidRole=S.a.find(x=>x.player===S.androidTarget).role;reveal();$("confirmBox").innerHTML+=`<div class="result">🤖 コピーしました。</div><button class="ok" onclick="nextConfirm()">確認しました ▶</button>`}
function firstseer(e){let p=decodeURIComponent(e),a=S.a.find(x=>x.player===p),isw=wolf(a);if(a.role==="fox")a.alive=false;$("confirmBox").innerHTML+=`<div class="result">🔮 占い結果<br><b>${esc(p)}さんは ${isw?"人狼":"人間"} です。</b>${a.role==="fox"?"<br>🦊 妖狐は死亡しました。":""}</div><button class="ok" onclick="nextConfirm()">確認しました ▶</button>`}
function nextConfirm(){S.ci++;if(S.ci<S.a.length)confirm();else startNight()}
const AR=["cursed","spy","android","trap","bg","knight","wolves","attacker","counselor","traitors","magician","seer","medium"];
function alive(){return S.a.filter(x=>x.alive)}function ar(id){return S.a.filter(x=>x.alive&&x.role===id)}
function needed(id){if(id==="cursed")return S.a.some(x=>x.role==="cursed");if(id==="spy")return ar("spy").length&&!S.blocked.spy;if(id==="android")return ar("android").length&&!S.androidTarget;if(id==="trap")return ar("trap").length&&!S.blocked.trap;if(id==="bg")return ar("bodyguard").length&&!S.blocked.bg;if(id==="knight")return ar("knight_group").length&&!S.blocked.knight;if(id==="wolves")return alive().some(wolf)&&!S.blocked.wolves;if(id==="attacker")return ar("attacker_traitor").length&&!S.blocked.attacker;if(id==="counselor")return ar("counselor").length&&!S.blocked.counselor;if(id==="traitors")return ar("counselor").length&&S.a.some(traitor);if(id==="magician")return ar("magician").length&&!S.usedMag&&!S.blocked.magician;if(id==="seer")return ar("seer").length&&!S.blocked.seer;if(id==="medium")return ar("medium").length&&!S.blocked.medium;return false}
function startNight(){S.night++;S.ai=0;S.ns={wolf:null,attacker:null,counselor:null,trap:null,bg:null,knight:null,mag:null,seer:null};show("night");speak("夜になりました。みなさん目を閉じてください。");setTimeout(nextAction,900)}
function nextAction(){if(S.ai>=AR.length)return resolveNight();let id=AR[S.ai++];if(!needed(id))return nextAction();renderAction(id)}
function tgt(arr,type){return `<div class="target">${arr.map(a=>`<button onclick="act('${type}','${encodeURIComponent(a.player)}')">${esc(a.player)}</button>`).join("")}</div>`}
function renderAction(id){let title="",voice="";if(id==="cursed"){title="💀 呪われた者";voice="呪われた者の方、目を覚ましてください。"}if(id==="spy"){title="🕵️ スパイ";voice="スパイの方、目を覚ましてください。"}if(id==="android"){title="🤖 アンドロイド";voice="アンドロイドの方、目を覚ましてください。"}if(id==="trap"){title="🪤 罠師";voice="罠師の方、目を覚ましてください。"}if(id==="bg"){title="🛡️ ボディーガード";voice="ボディーガードの方、目を覚ましてください。"}if(id==="knight"){title="⚔️ 騎士団";voice="騎士団の方、目を覚ましてください。"}if(id==="wolves"){title="🐺 人狼";voice="人狼の方、目を覚ましてください。"}if(id==="attacker"){title="🐺 裏切りの襲撃者";voice="裏切りの襲撃者の方、目を覚ましてください。"}if(id==="counselor"){title="💭 カウンセラー";voice="カウンセラーの方、目を覚ましてください。"}if(id==="traitors"){title="😈 裏切り者系の確認";voice="裏切り者系の方、1人ずつ目を覚ましてください。"}if(id==="magician"){title="🎩 奇術師";voice="奇術師の方、目を覚ましてください。"}if(id==="seer"){title="🔮 予言者";voice="予言者の方、目を覚ましてください。"}if(id==="medium"){title="👻 霊媒師";voice="霊媒師の方、目を覚ましてください。"}speak(voice);let h=`<div class="night"><div class="title">${title}</div>`;
if(id==="cursed")h+=`<p>採用されています。生存していれば確認してください。</p><button onclick="nextAction()">確認しました ▶</button>`;
if(id==="spy"){let z=S.a.filter(a=>a.alive&&a.role!=="citizen"&&["seer","bodyguard","medium","hunter","shared","dictator","tough","counselor","knight_group","shadow","king","magician","cursed","trap"].includes(a.role)&&!S.blocked[a.role]);h+=`<p>市民陣営の役職者を1人選択。妨害は役職ごとに1回だけ。</p>${tgt(z,"spy")}`}
if(id==="android")h+=`<p>コピーする人を選択。</p>${tgt(alive().filter(a=>a.role!=="android"),"android")}`;
if(id==="trap")h+=`<p>前夜と同じ人は選べません。</p>${tgt(alive().filter(a=>a.player!==S.prevTrap),"trap")}`;
if(id==="bg"){let g=ar("bodyguard")[0];h+=`<p>自分自身と前夜と同じ人は守れません。</p>${tgt(alive().filter(a=>a.player!==g.player&&a.player!==S.prevBG),"bg")}`}
if(id==="knight")h+=tgt(alive(),"knight");
if(id==="wolves")h+=`<p>仲間：${alive().filter(wolf).map(a=>esc(a.player)).join("、")}</p>${tgt(alive().filter(a=>!wolf(a)),"wolf")}`;
if(id==="attacker")h+=tgt(alive(),"attacker");
if(id==="counselor")h+=`<p>対象を1人。裏切り者系なら改心、人狼ならカウンセラー死亡。</p>${tgt(alive(),"counselor")}`;
if(id==="traitors"){h+=S.a.filter(traitor).map(a=>`<div class="result">😈 ${esc(a.player)}さん：${S.ns.counselor===a.player?"💭 カウンセリングを受けた":"カウンセリングを受けていない"}</div>`).join("");h+=`<button onclick="nextAction()">全員確認しました ▶</button>`}
if(id==="magician")h+=S.ns.wolf?tgt(alive(),"mag"): `<p>人狼の襲撃先なし。</p><button onclick="nextAction()">スキップ</button>`;
if(id==="seer")h+=tgt(alive(),"seer");
if(id==="medium"){let x=S.lastExec;h+=`<div class="result">${x?esc(x.player)+"さんは "+(wolf(x)?"人狼":"人間")+"です。":"昨日の追放者はいません。"}</div><button onclick="nextAction()">確認しました ▶</button>`}
h+="</div>";$("nightBox").innerHTML=h}
function act(type,e){let p=decodeURIComponent(e),a=S.a.find(x=>x.player===p);if(type==="spy"){S.blocked[a.role]=true;S.blocked.spy=true}
if(type==="android"){S.androidTarget=p;S.androidRole=a.role}
if(type==="trap"){S.ns.trap=p;S.prevTrap=p}
if(type==="bg"){S.ns.bg=p;S.prevBG=p}
if(type==="knight")S.ns.knight=p;
if(type==="wolf")S.ns.wolf=p;
if(type==="attacker")S.ns.attacker=p;
if(type==="counselor")S.ns.counselor=p;
if(type==="mag"){S.ns.mag=p;S.usedMag=true}
if(type==="seer"){S.ns.seer=p;let r=a.role==="fox"?"人間":wolf(a)?"人狼":"人間";$("nightBox").innerHTML=`<div class="night"><div class="title">🔮 占い結果</div><div class="result">${esc(p)}さんは<br><b>${r}</b>です。${a.role==="fox"?"<br>🦊 妖狐は死亡しました。":""}</div><button onclick="nextAction()">確認しました ▶</button></div>`;if(a.role==="fox")a.alive=false;return}nextAction()}
function resolveNight(){let deaths=[],kill=(a,why)=>{if(!a||!a.alive)return;a.alive=false;deaths.push(a.player);a.why=why};
let wolfTarget=S.ns.mag||S.ns.wolf;if(wolfTarget){let a=S.a.find(x=>x.player===wolfTarget);if(a&&a.alive){if(a.role==="cursed"&&!a.converted)a.converted=true;else if(a.role!=="fox"&&a.role!=="bodyguard"&&S.ns.bg!==wolfTarget&&S.ns.knight!==wolfTarget){if(S.ns.trap===wolfTarget){let ws=S.a.filter(x=>x.alive&&wolf(x));if(ws.length)kill(ws[Math.floor(Math.random()*ws.length)],"trap")}else if(a.role==="tough")a.tough=true;else kill(a,"wolf")}}}
if(S.ns.attacker){let a=S.a.find(x=>x.player===S.ns.attacker);if(a&&a.alive){if(S.ns.trap===a.player&&a.role!=="bodyguard"){kill(a,"trap")}else if(a.role!=="fox"&&a.role!=="tough")kill(a,"attacker");else if(a.role==="tough")a.tough=true}}
let c=ar("counselor")[0],t=S.a.find(x=>x.player===S.ns.counselor);if(c&&t){if(traitor(t)){t.role="citizen";t.converted=true}else if(wolf(t))kill(c,"counselor")}
S.a.filter(a=>a.alive&&a.tough).forEach(a=>{a.tough=false;kill(a,"tough")});
if(S.lovers.length===2){let p=S.lovers.find(x=>!S.a.find(a=>a.player===x).alive);if(p){let q=partner(p),b=S.a.find(a=>a.player===q);if(b&&b.alive)kill(b,"lover")}}
S.dayDeaths=[...new Set(deaths)];if(S.dayDeaths.length)speak("朝になりました。みなさん目を覚ましてください。残念ながら犠牲者がいます。お昼です。議論スタート。");else speak("朝になりました。みなさん目を覚ましてください。昨夜は誰も亡くなっていません。お昼です。議論スタート。");if(endCheck())return;day()}
function day(){show("day");$("dayBox").innerHTML=`<div class="result">${S.dayDeaths.length?S.dayDeaths.map(x=>esc(x)+"さんが亡くなってしまいました。").join("<br>"):"昨夜は誰も亡くなっていません。"}<br><br>お昼です。議論スタート。</div><button onclick="voteStart()">🗳️ 投票へ</button>`}
function voteStart(){let v=alive(),i=0,vs=[];function nx(){if(i>=v.length)return voteResult(vs);let a=v[i];$("voteBox").innerHTML=`<h3>${esc(a.player)}さんの投票</h3><p>他の人には見せないでください。</p>${tgt(alive().filter(x=>x.player!==a.player),"vote")}`;window.votePick=p=>{vs.push({voter:a.player,target:p,weight:a.role==="king"?2:1});i++;nx()}}window.votePick=x=>{};window.actOld=act;act=function(type,e){if(type==="vote"){votePick(decodeURIComponent(e));return}actOld(type,e)};nx()}
function voteResult(vs){let c={};vs.forEach(v=>c[v.target]=(c[v.target]||0)+v.weight);$("voteBox").innerHTML=`<h3>📊 投票結果</h3>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="vote"><span>${esc(x[0])}さん</span><b>${x[1]}票</b></div>`).join("")}<button class="ok" onclick='finishVote(${JSON.stringify(c)})'>結果を確定 ▶</button>`}
function finishVote(c){let m=Math.max(...Object.values(c)),w=Object.keys(c).filter(x=>c[x]===m);if(w.length>1){$("voteBox").innerHTML=`<div class="result">同票です。決戦投票を行います。</div><button onclick='runoff(${JSON.stringify(w)})'>決戦投票へ</button>`;return}execute(w[0])}
function runoff(top){let v=alive(),i=0,vs=[];function nx(){if(i>=v.length){let c={};vs.forEach(x=>c[x.target]=(c[x.target]||0)+1);let m=Math.max(...Object.values(c)),w=Object.keys(c).filter(x=>c[x]===m);if(w.length>1){$("voteBox").innerHTML=`<div class="result">決戦投票も同票のため、追放なし。</div><button onclick="startNight()">🌙 夜へ</button>`}else execute(w[0]);return}let a=v[i];$("voteBox").innerHTML=`<h3>決戦投票：${esc(a.player)}さん</h3>${tgt(alive().filter(x=>x.player!==a.player&&top.includes(x.player)),"run")}`}window.act=function(type,e){if(type==="run"){vs.push({target:decodeURIComponent(e)});i++;nx();return}actOld(type,e)};nx()}
function execute(p){let a=S.a.find(x=>x.player===p);if(!a)return startNight();a.alive=false;S.lastExec=a;if(a.role==="wolf_child")S.wolfExtra=true;if(S.lovers.includes(p)){let b=S.a.find(x=>x.player===partner(p));if(b)b.alive=false}if(a.role==="hunter")return hunter(p);if(endCheck())return;$("voteBox").innerHTML=`<div class="result">${esc(p)}さんが追放されました。</div><button onclick="startNight()">🌙 夜へ</button>`}
function hunter(p){let arr=alive();if(!arr.length)return startNight();open(`<h2>🏹 ハンター</h2><p>${esc(p)}さんの道連れ先を選んでください。</p>${tgt(arr,"hunter")}`);window.act=function(type,e){if(type==="hunter"){let a=S.a.find(x=>x.player===decodeURIComponent(e));if(a)a.alive=false;close();if(endCheck())return;startNight();}else actOld(type,e)}}
function open(x){$("modalBox").innerHTML=x;$("modal").classList.add("on")}function close(){$("modal").classList.remove("on")}
function endCheck(){let sc=S.a.filter(a=>a.role==="scarecrow");if(sc.length&&sc.every(a=>!a.alive))return finish("🪵 案山子陣営の勝利！",sc);let f=S.a.filter(a=>a.role==="fox"&&a.alive);let al=alive(),w=al.filter(wolf),o=al.filter(a=>!wolf(a));if(f.length&&(!w.length||w.length>=o.length))return finish("🦊 妖狐の勝利！",f);if(S.lovers.length===2&&S.lovers.every(p=>S.a.find(a=>a.player===p).alive)&&(!w.length||w.length>=o.length))return finish("❤️ 恋人の勝利！",S.lovers.map(p=>S.a.find(a=>a.player===p)));if(!w.length)return finish("👤 市民陣営の勝利！",o);if(w.length>=o.length)return finish("🐺 人狼陣営の勝利！",w);return false}
function finish(t,w){show("end");$("endBox").innerHTML=`<h2>${t}</h2><p>${w.map(x=>esc(x.player||x)).join("、")}</p><hr>${S.a.map(a=>`<div class="vote"><span>${esc(a.player)}</span><span>${rr(a.role)[2]} ${rr(a.role)[1]}${loverOf(a.player)?" ❤️":""}</span></div>`).join("")}`;speak(t);return true}
show("setup");
</script></body></html>
